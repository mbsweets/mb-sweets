<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MB Sweets — ऑर्डर करें | Maa Bhagwati Misthan Bhandar, Nanaura</title>
<meta name="description" content="Maa Bhagwati Misthan Bhandar (MB Sweets), ननौरा, दरभंगा — मिठाई, दूध-दही-पनीर, केक। 6 km तक घर पर डिलीवरी, ₹499+ पर फ्री। WhatsApp पर सीधे ऑर्डर करें।">
<meta name="theme-color" content="#5C1620">
<meta property="og:type" content="website">
<meta property="og:title" content="MB Sweets — घर बैठे ऑर्डर करें">
<meta property="og:description" content="मिठाई · दूध-दही-पनीर · केक — ननौरा, दरभंगा। 6 km तक डिलीवरी, ₹499+ पर फ्री।">
<meta property="og:image" content="https://mbsweets.github.io/mb-sweets/order/img/og.jpg">
<meta property="og:url" content="https://mbsweets.github.io/mb-sweets/order/">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
@font-face{font-family:'Mukta';font-weight:400;font-display:swap;src:url(../fonts/Mukta-400.woff) format('woff')}
@font-face{font-family:'Mukta';font-weight:600;font-display:swap;src:url(../fonts/Mukta-600.woff) format('woff')}
@font-face{font-family:'Mukta';font-weight:700;font-display:swap;src:url(../fonts/Mukta-700.woff) format('woff')}
@font-face{font-family:'Baloo 2';font-weight:700;font-display:swap;src:url(../fonts/Baloo2-700.woff) format('woff')}
:root{
  --paper:#FAF3E7; --card:#FFFFFF; --ink:#2B1712; --muted:#7E6A5B; --line:#E8DCC9;
  --brand:#5C1620; --brand2:#7A2330; --on-brand:#FBEEDD; --gold:#9C6B00; --goldsoft:#F7E7C4;
  --green:#2F6F4E; --greenbg:#E3F1E8; --amber:#8A5A00; --amberbg:#FBEFD5; --red:#A6332E; --redbg:#F6E1DD;
  --wa:#1C9B52; --tile1:#FFF6E4; --tile2:#F3DDB2;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1210; --card:#261915; --ink:#F3E9DD; --muted:#B8A392; --line:#3D2B23;
    --gold:#E7B84A; --goldsoft:#3A2A14; --green:#6BD7A1; --greenbg:#15291F; --amber:#F2BD55; --amberbg:#33260F;
    --red:#FF9189; --redbg:#3B1C1C; --tile1:#3A2A1E; --tile2:#2A1D15;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1210; --card:#261915; --ink:#F3E9DD; --muted:#B8A392; --line:#3D2B23;
  --gold:#E7B84A; --goldsoft:#3A2A14; --green:#6BD7A1; --greenbg:#15291F; --amber:#F2BD55; --amberbg:#33260F;
  --red:#FF9189; --redbg:#3B1C1C; --tile1:#3A2A1E; --tile2:#2A1D15;
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{background:var(--brand);color:var(--on-brand);padding:calc(14px + env(safe-area-inset-top,0px)) 0 16px}
.hero .wrap{display:flex;gap:12px;align-items:center}
.hero img{width:64px;height:64px;border-radius:14px;background:#fff;flex:0 0 auto;object-fit:contain}
.hero h1{font-family:'Baloo 2','Mukta',sans-serif;font-size:1.35rem;line-height:1.1;margin:0}
.hero .tag{font-size:.84rem;opacity:.9;margin-top:2px}
.hero .addr{font-size:.78rem;opacity:.8;margin-top:2px}
.langbtn{margin-left:auto;align-self:flex-start;background:transparent;border:1px solid rgba(251,238,221,.5);color:var(--on-brand);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600;min-height:32px}
.status{display:flex;align-items:center;gap:8px;margin:12px 0 0;padding:8px 12px;border-radius:12px;font-weight:600;font-size:.92rem;background:var(--card);border:1px solid var(--line)}
.status .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.status.open .dot{background:#2FA84F;box-shadow:0 0 0 4px rgba(47,168,79,.18)}
.status.later .dot{background:#E0A21B}
.status.pause .dot{background:#C8372D}
.notice{background:var(--amberbg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.9rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:.8rem;line-height:1.25}
.facts b{display:block;font-size:.9rem;color:var(--ink)}
.facts span{color:var(--muted)}
.instbar{display:flex;align-items:center;gap:10px;margin-top:8px;background:var(--goldsoft);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.instbar.pulse{animation:flash 2.4s ease-out 2}
.instbar img{width:36px;height:36px;border-radius:8px;flex:0 0 auto}
.instbar span{flex:1;font-size:.85rem;line-height:1.3}
.instbar .btn{min-height:40px;padding:0 12px;font-size:.9rem;white-space:nowrap}
.avail{margin:8px 0 0;font-size:.86rem;color:var(--amber);font-weight:600;text-align:center}
.tabs{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-top:12px}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem;min-height:38px;white-space:nowrap}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
section.sec{padding-top:18px}
.sec h2{font-family:'Baloo 2','Mukta',sans-serif;font-size:1.25rem;margin:0;color:var(--brand)}
:root[data-theme="dark"] .sec h2{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec h2{color:var(--gold)}}
.sec .sub{color:var(--muted);font-size:.86rem;margin:2px 0 10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.card.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--gold,#c8961e),0 6px 22px rgba(0,0,0,.18)}100%{box-shadow:0 0 0 0 transparent}}
.card.dim{opacity:.6}
.pic{width:96px;height:96px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:radial-gradient(circle at 50% 40%,var(--tile1),var(--tile2));position:relative}
.pic img,.pic svg{width:100%;height:100%;display:block;object-fit:cover}
.pic .tagimg{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;border-radius:6px;padding:0 5px}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.body h3{margin:0;font-size:1.05rem;line-height:1.2}
.body h3 small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:1px}
.brandtag{display:inline-block;background:var(--goldsoft);color:var(--gold);font-weight:700;font-size:.72rem;border-radius:6px;padding:0 6px;margin-top:3px;align-self:flex-start}
.price{font-weight:700;margin-top:4px}
.price span{color:var(--muted);font-weight:400;font-size:.85rem}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:3px 9px;font-size:.84rem;font-weight:600;min-height:32px;position:relative}
.opt.on{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.opt.off{text-decoration:line-through;opacity:.55}
.opt .q{display:inline-block;margin-left:4px;background:var(--gold);color:#fff;border-radius:8px;padding:0 5px;font-size:.72rem}
.qtyrow{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.addbtn{border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-weight:700;border-radius:10px;padding:0 16px;min-height:40px}
:root[data-theme="dark"] .addbtn{border-color:var(--gold);color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .addbtn{border-color:var(--gold);color:var(--gold)}}
.stepper{display:flex;align-items:center;border:1.5px solid var(--brand);border-radius:10px;overflow:hidden;background:var(--brand);color:var(--on-brand)}
.stepper button{background:transparent;border:0;color:inherit;width:40px;height:40px;font-size:1.25rem;font-weight:700}
.stepper b{min-width:78px;text-align:center;font-size:.9rem;padding:0 2px}
.offtag{color:var(--red);font-weight:700;font-size:.88rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ccard .cpic{aspect-ratio:1/1;position:relative;background:var(--tile2)}
.ccard .cpic img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .cpic .tagimg{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.66rem;border-radius:6px;padding:0 6px}
.ccard .cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.ccard h3{margin:0;font-size:.95rem;line-height:1.2}
.ccard .cq{font-size:.78rem;color:var(--green);font-weight:700}
.ccard button{margin-top:auto}
.smallnote{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.packbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.packtop{display:flex;gap:12px;align-items:center}
.packtop .pic{width:72px;height:72px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.chip{border:1px dashed var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.84rem;min-height:32px}
textarea,input[type=text],input[type=tel],input[type=date]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulkcard{margin-top:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);border-radius:16px;padding:14px}
.bulkcard h3{margin:0 0 2px;font-family:'Baloo 2','Mukta',sans-serif;font-size:1.1rem}
.bulkcard p{margin:0 0 10px;font-size:.88rem;opacity:.9}
.bulkcard .btn{background:var(--on-brand);color:var(--brand);border-color:var(--on-brand)}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.infobox p{margin:4px 0}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.links .btn{min-height:44px;font-size:.9rem}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding:18px 0 110px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 30%);pointer-events:none}
.cartbar button{pointer-events:auto;max-width:528px;margin:0 auto;display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--brand);color:var(--on-brand);border:0;border-radius:14px;min-height:56px;padding:0 16px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-weight:700}
.cartbar small{display:block;font-weight:400;font-size:.78rem;opacity:.9}
.cartbar .go{background:var(--on-brand);color:var(--brand);border-radius:10px;padding:6px 12px}
/* full-screen views */
.view{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.vhead{position:sticky;top:0;z-index:2;background:var(--brand);color:var(--on-brand);padding-top:env(safe-area-inset-top,0px)}
.vhead .wrap{display:flex;align-items:center;gap:8px;min-height:54px}
.vhead h2{margin:0;font-size:1.1rem;font-family:'Baloo 2','Mukta',sans-serif}
.backbtn{background:transparent;border:0;color:inherit;font-weight:700;min-height:44px;padding:0 8px 0 0;font-size:1rem}
.vbody{padding:14px 0 40px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.blk h3{margin:0 0 8px;font-size:1rem}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .ln{flex:1;min-width:0}
.line .ln b{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.line .ln{min-width:0}
.line.isoff .ln b{color:var(--red);text-decoration:line-through}
.line.isoff small{color:var(--red);font-weight:600}
.line .ln small{color:var(--muted)}
.line .la{font-weight:700;white-space:nowrap}
.line .stepper{transform:scale(.9);transform-origin:right center}
.line .stepper b{min-width:64px}
.rm{background:transparent;border:0;color:var(--red);font-weight:700;min-height:36px;padding:0 6px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding-top:8px}
.minbar{margin-top:8px;border-radius:10px;padding:8px 10px;font-size:.88rem;font-weight:600}
.minbar.ok{background:var(--greenbg);color:var(--green)}
.minbar.no{background:var(--amberbg);color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px;text-align:left;min-height:58px}
.seg button b{display:block;font-size:.95rem}
.seg button small{color:var(--muted);font-size:.78rem}
.seg button.on{border-color:var(--brand);background:var(--goldsoft)}
.seg button:disabled{opacity:.5}
label.fl{display:block;margin-top:10px;font-weight:600;font-size:.9rem}
label.fl input,label.fl textarea{margin-top:4px;font-weight:400}
.hint{color:var(--muted);font-size:.82rem;margin:4px 0 0}
.locst{margin-top:8px;border-radius:10px;padding:8px 10px;font-size:.88rem;font-weight:600}
.locst.ok{background:var(--greenbg);color:var(--green)}
.locst.near{background:var(--amberbg);color:var(--amber)}
.locst.far,.locst.err{background:var(--redbg);color:var(--red)}
.geo-credit{font-size:.72rem;color:var(--muted);margin:4px 0 0}.geo-credit a{color:inherit}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.slots button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;min-height:44px;font-weight:600}
.slots button.on{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.slots button:disabled{opacity:.4;text-decoration:line-through}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:4px}
.lnkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;min-height:0}
:root[data-theme="dark"] .lnkbtn{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lnkbtn{color:var(--gold)}}
.agree input{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--brand)}
.err{color:var(--red);font-weight:600;min-height:1em;margin:8px 0}
.paynote{background:var(--goldsoft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:0 0 12px 38px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.lpbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;background:var(--goldsoft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.lpbar .st{font-size:1.5rem;line-height:1}
.lpbar b{display:block;font-size:.95rem}
.lpbar small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.lpbar .go{margin-left:auto;font-weight:700;color:var(--brand);white-space:nowrap}
:root[data-theme="dark"] .lpbar .go{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lpbar .go{color:var(--gold)}}
.lphero{text-align:center;background:var(--goldsoft);border:1.5px solid var(--gold);border-radius:16px;padding:14px 10px 12px;margin-bottom:12px}
.lphero .hello{font-weight:700;font-size:1.05rem}
.lphero .n{font-family:'Baloo 2','Mukta',sans-serif;font-size:3.4rem;line-height:1.05;color:var(--brand);margin-top:4px}
:root[data-theme="dark"] .lphero .n{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lphero .n{color:var(--gold)}}
.lphero .l{color:var(--muted);font-weight:700}
.lphero .hint{margin-top:4px}
.lprw{display:grid;gap:6px}
.lprw div{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:.92rem}
.lprw div b{white-space:nowrap}
.lprw div small{color:var(--muted);text-align:right;font-size:.8rem;line-height:1.3}
.lprw div.ok{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.lprw div.ok small{color:var(--green);font-weight:600}
.lpstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.lpstats b{display:block;font-size:1.1rem}
.lpstats span{font-size:.74rem;color:var(--muted);line-height:1.2;display:block}
.lpwarn{background:var(--redbg);color:var(--red);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.92rem;margin-bottom:12px}
.line .la .g{color:var(--green)}
.line .la .r{color:var(--red);margin-left:6px}
.line .la .m{color:var(--muted)}
.lprules{margin:0;padding-left:18px;font-size:.9rem}
.lprules li{margin:0 0 5px}
.lpphone{display:flex;gap:8px;margin-top:6px}
.lpphone input{flex:1;min-width:0;font-size:1.15rem;letter-spacing:.04em}
.lpphone .btn{flex:0 0 auto}
.lpmini{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.82rem;padding:6px 0;min-height:0;display:block;margin:6px auto 0}
.bigok{text-align:center;padding:8px 0 4px}
.bigok .ic{font-size:2.6rem;line-height:1}
.bigok h3{margin:6px 0 2px;font-size:1.3rem}
.code{display:inline-block;font-family:'Baloo 2','Mukta',sans-serif;background:var(--goldsoft);color:var(--gold);border-radius:8px;padding:0 10px;font-size:1.1rem;letter-spacing:.5px}
.upibox{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.upibox code{flex:1;font-size:1rem;font-weight:700;word-break:break-all;font-family:inherit}
.qrimg{display:block;width:100%;max-width:300px;margin:10px auto 0;border-radius:12px;border:1px solid var(--line);background:#fff}
.amt{font-family:'Baloo 2','Mukta',sans-serif;font-size:2rem;color:var(--brand);text-align:center;line-height:1.1}
:root[data-theme="dark"] .amt{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .amt{color:var(--gold)}}

function load(){
  try{
    var raw=localStorage.getItem(STORE);
    if(raw){
      var d=JSON.parse(raw);
      if(d.lang==='en')st.lang='en';
      if(d.cart&&typeof d.cart==='object')st.cart=d.cart;
      if(Array.isArray(d.custom))st.custom=d.custom.filter(function(c){return c&&typeof c==='object'&&typeof c.text==='string'&&(c.type==='cake'||c.type==='pack');});
      if(d.me&&typeof d.me==='object')Object.keys(st.me).forEach(function(k){if(typeof d.me[k]==='string')st.me[k]=d.me[k];});
      if(typeof d.cakeMsg==='string')st.cakeMsg=d.cakeMsg;
      if(typeof d.note==='string')st.note=d.note;
      if(d.last&&typeof d.last==='object')st.last=d.last;
    }
  }catch(e){}
  // drop items that no longer exist
  Object.keys(st.cart).forEach(function(id){if(!ITEM[id]||!(num(st.cart[id])>0))delete st.cart[id];});
}
function save(){
  try{localStorage.setItem(STORE,JSON.stringify({lang:st.lang,cart:st.cart,custom:st.custom,me:st.me,cakeMsg:st.cakeMsg,note:st.note,last:st.last}));}catch(e){}
}

function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function r2(n){return Math.round(num(n)*100)/100;}
function rupee(n){n=r2(n);return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2});}
function t(k,vars){var v=(T[st.lang]&&T[st.lang][k]!=null)?T[st.lang][k]:T.hi[k];if(v==null)return k;if(vars&&typeof v==='string')Object.keys(vars).forEach(function(x){v=v.split('{'+x+'}').join(vars[x]);});return v;}
function nm(o){return st.lang==='en'?(o.en||o.hi):o.hi;}
function nm2(o){return st.lang==='en'?(o.hi||''):(o.en||'');}
function pad(n){return n<10?'0'+n:''+n;}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function keyToDate(k){var a=String(k).split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
/* the shop runs on India time even if the customer's phone is set to another country */
function nowIST(){var d=new Date();return new Date(d.getTime()+(330+d.getTimezoneOffset())*60000);}
function nowMin(){var d=nowIST();return d.getHours()*60+d.getMinutes();}
function unitTxt(u){return (T[st.lang].u[u])||u;}
function stepOf(u){return u==='किलो'?0.25:(u==='लीटर'?0.5:1);}
function qtyTxt(unit,q,lang){
  var L=lang||st.lang;var U=T[L].u;
  q=Math.round(q*1000)/1000;
  if(unit==='किलो'&&q<1)return Math.round(q*1000)+' '+U['ग्राम'];
  return q+' '+(U[unit]||unit);
}
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2200);}
function phone10(p){
  p=String(p||'').replace(/\D/g,'');
  if(p.length===12&&p.slice(0,2)==='91')p=p.slice(2);
  if(p.length===11&&p.charAt(0)==='0')p=p.slice(1);
  return (p.length===10&&/^[6-9]/.test(p))?p:'';
}
function waUrl(text){return 'https://api.whatsapp.com/send?phone='+S.wa+'&text='+encodeURIComponent(text);}
function haversine(a,b,c,d){
  var R=6371,toR=Math.PI/180;
  var dLat=(c-a)*toR,dLng=(d-b)*toR;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*toR)*Math.cos(c*toR)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function b64url(str){
  var bin='';
  if(window.TextEncoder){var bytes=new TextEncoder().encode(str);for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);}
  else bin=unescape(encodeURIComponent(str));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

/* ---------- time rules ---------- */
function asapOpen(){var m=nowMin();return !C.pause&&m>=S.orderStartHour*60&&m<S.orderEndHour*60;}
function slotOk(dateKey,i){
  var today=dkey(nowIST());
  if(dateKey<today)return false;
  if(dateKey>today)return true;
  var m=nowMin();
  return m<S.orderEndHour*60&&m<=SLOTS[i][1]*60-60;
}
function anySlot(dateKey){for(var i=0;i<SLOTS.length;i++)if(slotOk(dateKey,i))return true;return false;}
function firstDate(){var d=nowIST();var k=dkey(d);if(anySlot(k))return k;d.setDate(d.getDate()+1);return dkey(d);}
function maxDate(){var d=nowIST();d.setDate(d.getDate()+30);return dkey(d);}
function statusInfo(){
  if(C.pause)return {cls:'pause',txt:t('st_pause')};
  if(asapOpen())return {cls:'open',txt:t('st_open')};
  return {cls:'later',txt:nowMin()<S.orderStartHour*60?t('st_early'):t('st_late')};
}

  var N=Math.round(turns*28),d='';
  for(var i=0;i<=N;i++){var a=i/N*turns*2*Math.PI,r=r0+(r1-r0)*i/N;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)*sq).toFixed(1);}
  return d;
}

    optsOf(card).forEach(function(o){
      var q=num(st.cart[o.id]);if(!(q>0))return;

      L.push({id:o.id,card:card,opt:o,item:it,qty:q,amt:r2(q*it.price),off:!!OFF[o.id]});

function changeQty(id,dir){

function lineName(l,lang){

function setActiveTab(k){

  var on=$('.tab.on'),strip=$('.tabs .wrap');

var spyObs=null,spyPause=0;
function setupSpy(){
  if(spyObs){spyObs.disconnect();spyObs=null;}
  if(!('IntersectionObserver' in window))return;
  spyObs=new IntersectionObserver(function(entries){
    if(Date.now()<spyPause)return;
    entries.forEach(function(e){
      if(!e.isIntersecting)return;
      var k=e.target.id.replace('sec-','');
      setActiveTab(k);
    });
  },{rootMargin:'-45% 0px -50% 0px'});
  $all('section.sec').forEach(function(s){spyObs.observe(s);});
}

/* ---------- VIEWS (cart / done / pay / bulk / rules / cake) ---------- */
function route(){
  var h=location.hash||'';
  var m;
  var v='';
  if(h==='#cart')v='cart';
  else if(h==='#done')v='done';
  else if(h==='#bulk')v='bulk';
  else if(h==='#rules')v='rules';
  else if(h==='#install')v='install';
  else if(h==='#points')v='points';
  else if((m=h.match(/^#pay(?:=([0-9.]+))?/)))v='pay';
  else if((m=h.match(/^#cake=([a-z0-9-]+)(?:,(\d+))?/)))v='cake';
  else if((m=h.match(/^#(item|tab)=([a-z0-9-]+)/))){
    // website links: open the menu right at one sweet (#item=rasgulla) or a section (#tab=cake)
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    var jk=m[1],jv=m[2];
    setTimeout(function(){jumpTo(jk,jv);},80);
    setTimeout(function(){if(Date.now()<spyPause)jumpTo(jk,jv,true);},750);
  }
  var box=$('#view');
  if(!v){box.innerHTML='';document.body.classList.remove('noscroll');renderCartBar();refreshPackIfNeeded();return;}
  document.body.classList.add('noscroll');
  if(v==='cart')renderCart();
  else if(v==='done')renderDone();
  else if(v==='bulk')renderBulk();
  else if(v==='rules')renderRules();
  else if(v==='install')renderInstall();
  else if(v==='points')renderPoints();
  else if(v==='pay')renderPay(m&&m[1]?num(m[1]):0);
  else if(v==='cake')renderCake(m[1],m[2]!=null?+m[2]:-1);
  var sc=$('#view .view');if(sc)sc.scrollTop=0;
}
function refreshPackIfNeeded(){
  // cart, custom cakes or packaged list may have changed inside a view
  var grid=$('#sec-cake .grid2');if(grid)grid.innerHTML=CAKES().map(customCardHtml).join('');
  var pb=$('#packbox');if(pb)pb.outerHTML=packHtml();
  MENU().forEach(function(c){var el=document.getElementById('card-'+c.key);if(el)el.outerHTML=cardHtml(c);});
}
function jumpTo(kind,key,again){
  var el=kind==='item'?document.getElementById('card-'+key):document.getElementById('sec-'+key);
  if(!el)return;
  var sec=kind==='tab'?el:el.closest('section.sec');
  var bar=$('.tabs');var off=bar?bar.offsetHeight:56;
  var y=el.getBoundingClientRect().top+window.pageYOffset-off-(kind==='item'?14:-2);
  if(sec)setActiveTab(sec.id.replace('sec-',''));
  spyPause=Date.now()+1300;
  window.scrollTo(0,Math.max(0,y));
  if(kind==='item'&&!again){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},2600);}
}
var navDepth=0;   // views opened from inside this page (so "back" can use browser history)
function go(v){
  if(!v){
    navDepth=0;
    if(location.hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
    route();return;
  }
  navDepth++;
  location.hash=v;
}
function back(){
  if(navDepth>0){navDepth--;history.back();}
  else go('');
}

function getLocation(){
  if(!navigator.geolocation){locState='nosupport';renderCart();return;}
  var seq=++locSeq,answered=false,retried=false;
  locState='wait';renderCart();
  var redraw=function(){if(location.hash==='#cart')renderCart();};
  // some browsers never answer (hidden permission prompt) — do not leave the customer waiting
  var arm=function(ms){clearTimeout(locTimer);locTimer=setTimeout(function(){if(seq!==locSeq||answered)return;locState='stuck';redraw();},ms);};
  arm(15000);
  try{
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(function(s){
        if(seq===locSeq&&!answered&&s&&s.state==='denied'){answered=true;clearTimeout(locTimer);locState='denied';redraw();}
      },function(){});
    }
  }catch(e){}
  var ok=function(p){
    if(seq!==locSeq||answered)return;
    answered=true;clearTimeout(locTimer);
    var c=p.coords;
    if(c.accuracy&&c.accuracy>3000){loc=null;locState='weak';locWeakAcc=c.accuracy;redraw();return;}
    setLoc(c);locState='';lookupAddress(c.latitude,c.longitude);redraw();
    // quietly try for a sharper fix
    if(c.accuracy>150){
      try{navigator.geolocation.getCurrentPosition(function(q){
        if(seq!==locSeq)return;
        if(q.coords.accuracy&&q.coords.accuracy<(loc?loc.acc:1e9)){
          setLoc(q.coords);
          // moved a fair way from where we looked the address up — look again (once)
          if(geoFrom&&haversine(geoFrom.lat,geoFrom.lng,q.coords.latitude,q.coords.longitude)>0.25)lookupAddress(q.coords.latitude,q.coords.longitude);
          redraw();
        }
      },function(){},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}catch(e){}
    }
  };
  var bad=function(err){
    if(seq!==locSeq||answered)return;
    // network location failed or slow — try once more with GPS before giving up
    if(err&&err.code!==1&&!retried){
      retried=true;arm(24000);
      try{navigator.geolocation.getCurrentPosition(ok,bad,{enableHighAccuracy:true,timeout:20000,maximumAge:0});return;}catch(e){}
    }
    answered=true;clearTimeout(locTimer);
    locState=(err&&err.code===1)?'denied':'fail';
    redraw();
  };
  navigator.geolocation.getCurrentPosition(ok,bad,{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}

var geoState='',geoSeq=0,geoAt=0,geoFrom=null,geoAuto={v:'',a:''};

function geoCache(k,v){
  try{
    var c=JSON.parse(localStorage.getItem('mbo-geo')||'{}')||{};
    if(v===undefined)return c[k]||null;
    c[k]=v;var ks=Object.keys(c);while(ks.length>8)delete c[ks.shift()];
    localStorage.setItem('mbo-geo',JSON.stringify(c));
  }catch(e){}

}
function geoParts(a){
  a=a||{};
  var clean=function(x){return String(x||'').replace(/\s+/g,' ').trim().slice(0,80);};
  var vill=clean(a.village||a.hamlet||a.neighbourhood||a.suburb||a.quarter||a.town||a.city_district||a.city||a.municipality);
  var seen={},parts=[];
  if(vill)seen[vill.toLowerCase()]=1;
  [a.road,a.hamlet,a.neighbourhood,a.suburb,a.village,a.town,a.city,a.county,a.state_district].forEach(function(x){
    x=clean(x);if(!x||seen[x.toLowerCase()])return;seen[x.toLowerCase()]=1;parts.push(x);
  });
  var pin=clean(a.postcode).replace(/\s/g,'');
  var addr=parts.join(', ');
  if(/^\d{6}$/.test(pin))addr=(addr?addr+' ':'')+pin;
  return {v:vill,a:addr};

function lookupAddress(lat,lng){
  var api=C.geoApi===undefined?'https://nominatim.openstreetmap.org/reverse':C.geoApi;
  if(!api||!window.fetch||!isFinite(lat)||!isFinite(lng))return;
  var seq=++geoSeq,k=lat.toFixed(4)+','+lng.toFixed(4);
  geoFrom={lat:lat,lng:lng};
  var hit=geoCache(k);
  if(hit){applyGeo(hit,seq);return;}
  geoState='wait';paintGeo();
  var wait=Math.max(0,1100-(Date.now()-geoAt));
  setTimeout(function(){
    if(seq!==geoSeq)return;
    geoAt=Date.now();
    var ctrl=window.AbortController?new AbortController():null;
    var tm=setTimeout(function(){if(ctrl)ctrl.abort();},9000);
    var url=api+(api.indexOf('?')<0?'?':'&')+'format=jsonv2&addressdetails=1&zoom=18&lat='+lat.toFixed(6)+'&lon='+lng.toFixed(6)+'&accept-language='+(st.lang==='en'?'en':'hi,en');
    fetch(url,{signal:ctrl?ctrl.signal:undefined}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(j){
      clearTimeout(tm);

}
function applyGeo(p,seq){

  if(p.v&&(!st.me.village.trim()||st.me.village===geoAuto.v)){st.me.village=p.v;geoAuto.v=p.v;filled=true;}
  if(p.a&&(!st.me.addr.trim()||st.me.addr===geoAuto.a)){st.me.addr=p.a;geoAuto.a=p.a;filled=true;}
  geoState=filled?'ok':'';

  var fv=document.getElementById('f-village'),fa=document.getElementById('f-addr'),lm=document.getElementById('f-landmark');
  if(fv&&fv.value!==st.me.village)fv.value=st.me.village;

    .then(function(r){if(timer)clearTimeout(timer);return r.json();},function(e){if(timer)clearTimeout(timer);throw e;});
}
function finishOrder(o,via){
  var url=waUrl(o.text);
  st.last={code:o.code,via:via,url:url,mode:o.mode,total:o.total,asks:o.asks,p4:o.p4,hasLoc:o.hasLoc,photo:!!o.photo,ts:Date.now()};
  st.cart={};st.custom=[];st.cakeMsg='';st.note='';st.agree=false;
  when={type:'',date:'',slot:-1};
  pendingOrder=null;
  save();
  return url;
}
function sendViaWhatsApp(o){
  var url=finishOrder(o,'wa');
  var w=null;
  try{w=window.open(url,'_blank');}catch(x){w=null;}
  if(w){try{w.opener=null;}catch(x){}location.replace('#done');}
  else{location.replace('#done');setTimeout(function(){location.href=url;},60);}
}
function setSending(on){
  var b=$('#sendBtn');if(b){b.disabled=on;b.textContent=on?t('sending'):(C.orderApi?t('send_app'):t('send'));}
}
function showSendFail(err){
  var box=$('#sendFail');if(!box)return;
  box.innerHTML='<div class="err" style="margin-top:10px">'+(err==='rate'?t('send_fail_rate'):t('send_fail'))+'</div>'+
    '<div class="row"><button class="btn primary" style="flex:1" data-act="send">'+t('retry')+'</button><button class="btn wa" style="flex:1" data-act="send-wa">'+t('send_wa')+'</button></div>';
  box.scrollIntoView({block:'center',behavior:'smooth'});
}
function sendOrder(){
  if(sending)return;
  syncForm();
  var e=validate();
  var box=$('#f-err');
  if(e){
    // time-based problems: redraw first so the screen shows what is possible right now
    if(e===t('e_asap')||e===t('e_slot')||e===t('e_date')){renderCart();box=$('#f-err');}
    if(box){box.textContent=e;box.scrollIntoView({block:'center',behavior:'smooth'});}
    return;
  }
  if(box)box.textContent='';
  var o=buildOrder();
  if(pendingOrder&&pendingOrder.sig===o.sig){var prev=pendingOrder;o=withCode(o,prev.code);o.posted=prev.posted;o.used=prev.used.slice();}
  pendingOrder=o;
  if(!C.orderApi){sendViaWhatsApp(o);return;}
  sending=true;setSending(true);
  var fb=$('#sendFail');if(fb)fb.innerHTML='';
  var attempt=function(left){
    var firstTry=!o.posted;
    o.posted++;
    postOrder(o.payload).then(function(r){
      if(r&&r.ok&&r.dup&&firstTry){
        // this code was already used by another customer this minute — take a fresh one and send again
        if(left>0){withCode(o,orderCode(o.used));o.posted=0;attempt(left-1);return;}
        r={ok:false,error:'busy'};
      }
      sending=false;
      if(r&&r.ok){if(r.code&&r.code!==o.code&&/^W\d{4}-\d{5}$/.test(r.code))withCode(o,r.code);finishOrder(o,'app');location.replace('#done');}
      else{setSending(false);showSendFail(r&&r.error);}
    },function(){sending=false;setSending(false);showSendFail('net');});
  };
  attempt(10);
}
function sendPendingViaWhatsApp(){
  if(!pendingOrder){sendOrder();return;}
  sendViaWhatsApp(pendingOrder);
}

function lpDT(ms){
  if(!ms)return '';
  var d=new Date(num(ms)+(330+new Date().getTimezoneOffset())*60000),h=d.getHours(),mi=d.getMinutes();
  return lpD(dkey(d))+', '+((h%12)||12)+':'+(mi<10?'0':'')+mi+(h<12?' am':' pm');

function lpMask(p){p=String(p||'');return p.length===10?p.slice(0,2)+'xxxxxx'+p.slice(8):p;}

function lpCalcView(d){
  var today=lpToday(),lim=lpAdd(today,30),bal=0,soon=0,soonExp='',newExp=[],gone=0;
  (Array.isArray(d.lots)?d.lots:[]).forEach(function(L){
    var p=num(L&&L[0]),e=String(L&&L[1]||'');if(!(p>0)||!e)return;
    if(e<=today){gone+=p;newExp.push({d:e,x:p});return;}
    bal+=p;if(e<=lim){soon+=p;if(!soonExp||e<soonExp)soonExp=e;}
  });
  bal-=num(d.debt);
  return {bal:Math.max(0,bal),soon:soon,soonLast:soonExp?lpAdd(soonExp,-1):'',expired:num(d.x)+gone,newExp:newExp};
}
function lpRR(d){
  var rr=Array.isArray(d&&d.rr)&&d.rr.length?d.rr:[[10,15,250],[25,40,500],[50,100,1000]];

  var html='<div class="blk"><div class="cakehead"><img src="'+img(cc.img)+'" alt=""><div><h3 style="margin:0">'+esc(nm(cc))+'</h3><p class="hint">'+t('ck_price')+'</p><p class="hint">'+t('sample_note')+'</p></div></div></div>'+
    '<div class="blk"><h3>'+t('ck_weight')+'</h3><div class="slots">'+t('ck_weights').map(function(w,i){return '<button data-act="ckw" data-i="'+i+'" class="'+(ckDraft.w===i?'on':'')+'">'+esc(w)+'</button>';}).join('')+'</div>'+
    (fixedFlavour==null?'<h3 style="margin-top:12px">'+t('ck_flavour')+'</h3><div class="slots">'+t('ck_flavours').map(function(f,i){return '<button data-act="ckf" data-i="'+i+'" class="'+(ckDraft.f===i?'on':'')+'">'+esc(f)+'</button>';}).join('')+'</div>':'')+
    '<label class="fl">'+t('ck_msg')+'<input type="text" id="ck-msg" maxlength="60" placeholder="'+esc(t('cake_msg_ph'))+'" value="'+esc(ckDraft.msg)+'"></label>'+
    '<label class="fl">'+t('ck_note')+'<input type="text" id="ck-note" maxlength="120" value="'+esc(ckDraft.note)+'"></label>'+
    (cc.photo?'<p class="paynote">'+t('ck_photo')+'</p>':'')+
    '<div class="err" id="ck-err"></div>'+
    '<button class="btn primary block" data-act="ckadd">'+(ckDraft.editIdx>=0?t('ck_save'):t('ck_add'))+'</button>'+
    (ckDraft.editIdx>=0?'<button class="btn block" style="margin-top:8px" data-act="ckrm">'+t('ck_remove')+'</button>':'')+
    '</div>';
  viewShell(nm(cc),html);
}
function cakeText(cc,d){
  // always Hindi for the shop, English in brackets when page is English
  var parts=[cc.hi,T.hi.ck_weights[d.w]];
  var fixedFlavour={redvelvet:4,rasmalai:5,pineapple:3,butterscotch:2}[cc.key];
  if(fixedFlavour==null&&d.f>=0)parts.push(T.hi.ck_flavour+': '+T.hi.ck_flavours[d.f]);
  if(d.msg)parts.push('लिखना: "'+d.msg+'"');
  if(d.note)parts.push('डिज़ाइन: '+d.note);
  if(cc.photo)parts.push('फोटो WhatsApp पर भेजेंगे');
  return parts.join(' · ');
}
function saveCake(){
  var d=ckDraft;if(!d)return;
  d.msg=($('#ck-msg')||{}).value||'';d.msg=d.msg.trim();
  d.note=($('#ck-note')||{}).value||'';d.note=d.note.trim();
  if(d.w<0){$('#ck-err').textContent=t('e_weight');return;}
  var cc=CAKES().filter(function(c){return c.key===d.key;})[0];
  var entry={type:'cake',key:d.key,w:d.w,f:d.f,msg:d.msg,note:d.note,text:cakeText(cc,d)};
  if(d.editIdx>=0&&st.custom[d.editIdx])st.custom[d.editIdx]=entry;else st.custom.push(entry);
  save();ckDraft=null;
  toast(t('pack_added'));
  back();
}

/* --- bulk --- */
function renderBulk(){
  var html='<div class="blk"><p class="hint" style="margin-top:0">'+t('bulk_sub')+'</p>'+
    '<h3 style="margin-top:8px">'+t('b_event')+'</h3><div class="slots">'+t('b_events').map(function(e,i){return '<button data-act="bev" data-i="'+i+'" class="'+(bulk.event===i?'on':'')+'">'+esc(e)+'</button>';}).join('')+'</div>'+
    '<label class="fl">'+t('b_date')+'<input type="date" id="b-date" min="'+dkey(nowIST())+'" value="'+esc(bulk.date)+'"></label>'+
    '<label class="fl">'+t('b_place')+'<input type="text" id="b-place" value="'+esc(bulk.place)+'"></label>'+
    '<label class="fl">'+t('b_what')+'<textarea id="b-what" rows="4" placeholder="'+esc(t('b_what_ph'))+'">'+esc(bulk.what)+'</textarea></label>'+
    '<label class="fl">'+t('f_name')+'<input type="text" id="b-name" value="'+esc(st.me.name)+'"></label>'+
    '<label class="fl">'+t('f_phone')+'<input type="tel" id="b-phone" inputmode="numeric" maxlength="18" value="'+esc(st.me.phone)+'"></label>'+
    '<div class="err" id="b-err"></div>'+
    '<button class="btn wa block" data-act="bsend">'+t('b_send')+'</button></div>';
  viewShell(t('bulk_h'),html);
}
function syncBulk(){
  var g=function(id){var el=document.getElementById(id);return el?el.value:null;};var x;
  if((x=g('b-date'))!=null)bulk.date=x;
  if((x=g('b-place'))!=null)bulk.place=x;
  if((x=g('b-what'))!=null)bulk.what=x;
  if((x=g('b-name'))!=null)st.me.name=x;
  if((x=g('b-phone'))!=null)st.me.phone=x;
}
function sendBulk(){
  syncBulk();
  var err=$('#b-err');
  if(!bulk.what.trim()){err.textContent=t('e_bwhat');return;}
  if(bulk.date&&bulk.date<dkey(nowIST())){err.textContent=t('e_bdate');return;}
  if(st.me.name.trim().length<2){err.textContent=t('e_name');return;}
  if(!phone10(st.me.phone)){err.textContent=t('e_phone');return;}
  save();
  var X=T[st.lang];
  var M=[X.msg_bulk,''];
  if(bulk.event>=0)M.push('🎊 '+T.hi.b_events[bulk.event]);
  if(bulk.date)M.push('📅 '+keyToDate(bulk.date).toLocaleDateString('hi-IN',{day:'numeric',month:'short',year:'numeric'}));
  if(bulk.place.trim())M.push('📍 '+bulk.place.trim());
  M.push('');M.push(bulk.what.trim());M.push('');
  M.push('👤 '+st.me.name.trim());M.push('📞 '+phone10(st.me.phone));
  var url=waUrl(M.join('\n'));
  var w=null;try{w=window.open(url,'_blank');}catch(x){}
  if(!w)location.href=url;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');
  switch(a){
    case 'lang':st.lang=st.lang==='en'?'hi':'en';save();renderMenu();route();break;
    case 'tab':
      var tk=el.getAttribute('data-t');
      var sec=document.getElementById('sec-'+tk);
      if(sec){
        var bar=$('.tabs');var off=bar?bar.offsetHeight:56;
        var y=sec.getBoundingClientRect().top+window.pageYOffset-off+2;
        setActiveTab(tk);spyPause=Date.now()+900;
        try{window.scrollTo({top:y,behavior:'smooth'});}catch(x){window.scrollTo(0,y);}
      }
      break;
    case 'opt':sel[el.getAttribute('data-card')]=+el.getAttribute('data-i');refreshCard(el.getAttribute('data-card'));break;
    case 'inc':case 'dec':
      if(C.pause||OFF[id])break;
      changeQty(id,a==='inc'?1:-1);
      var card=MENU().filter(function(c){return optsOf(c).some(function(o){return o.id===id;});})[0];
      if(card)refreshCard(card.key);
      break;
    case 'cinc':case 'cdec':syncForm();if(OFF[id])break;changeQty(id,a==='cinc'?1:-1);renderCart();break;
    case 'coff':syncForm();delete st.cart[id];save();renderCart();break;
    case 'crm':syncForm();st.custom.splice(+el.getAttribute('data-i'),1);save();renderCart();break;
    case 'cake-edit':syncForm();var ce=st.custom[+el.getAttribute('data-i')];if(ce)go('cake='+ce.key+','+el.getAttribute('data-i'));break;
    case 'go':syncForm();if(el.getAttribute('data-v')==='cart')autoPack();go(el.getAttribute('data-v'));break;
    case 'back':syncForm();syncBulk();ckDraft=null;back();break;
    case 'home':renderMenu();if(navDepth>0){var nd=navDepth;navDepth=0;history.go(-nd);}else go('');window.scrollTo(0,0);break;
    case 'packchip':
      var ta=$('#packText');if(ta){var v=ta.value.trim();ta.value=(v?v+', ':'')+el.getAttribute('data-v')+' ';ta.focus();}
      break;
    case 'packadd':
      var txt=($('#packText').value||'').trim();
      if(!txt){$('#packErr').textContent=t('pack_empty');break;}
      var pi=-1;st.custom.forEach(function(c,i){if(c.type==='pack')pi=i;});
      if(pi>=0)st.custom[pi].text=txt;else st.custom.push({type:'pack',text:txt});
      packDraft='';save();$('#packbox').outerHTML=packHtml();renderCartBar();toast(t('pack_added'));
      break;
    case 'packrm':packDraft='';st.custom=st.custom.filter(function(c){return c.type!=='pack';});save();$('#packbox').outerHTML=packHtml();renderCartBar();break;
    case 'cake':ckDraft=null;go('cake='+el.getAttribute('data-key'));break;
    case 'ckw':ckDraft.msg=$('#ck-msg').value;ckDraft.note=$('#ck-note').value;ckDraft.w=+el.getAttribute('data-i');renderCake(ckDraft.key,ckDraft.editIdx);break;
    case 'ckf':ckDraft.msg=$('#ck-msg').value;ckDraft.note=$('#ck-note').value;ckDraft.f=+el.getAttribute('data-i');renderCake(ckDraft.key,ckDraft.editIdx);break;
    case 'ckadd':saveCake();break;
    case 'ckrm':if(ckDraft&&ckDraft.editIdx>=0){st.custom.splice(ckDraft.editIdx,1);save();}ckDraft=null;back();break;
    case 'mode':syncForm();st.me.mode=el.getAttribute('data-v');save();renderCart();break;
    case 'when':
      syncForm();when.type=el.getAttribute('data-v');
      if(when.type==='later'&&!when.date)when.date=firstDate();
      renderCart();break;
    case 'slot':syncForm();when.slot=+el.getAttribute('data-i');renderCart();break;
    case 'loc':syncForm();getLocation();break;
    case 'chrome':syncForm();save();el.setAttribute('href',chromeUrl());break;
    case 'send':sendOrder();break;
    case 'send-wa':syncForm();sendPendingViaWhatsApp();break;
    case 'check-status':checkStatus();break;
    case 'copyupi':copyUpi();break;
    case 'install':doInstall();break;
    case 'bev':syncBulk();bulk.event=+el.getAttribute('data-i');renderBulk();break;
    case 'bsend':sendBulk();break;
    case 'lp-check':lpCheckPhone();break;
    case 'lp-other':lpPhoneRes=null;lpRenderPhone();setTimeout(function(){var f=$('#lp-phone');if(f){f.value='';f.focus();}},40);break;
    case 'lp-forget':lpTokSet('');lpPhoneRes=null;renderPoints();break;
    case 'lp-retry':renderPoints();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='lp-phone'){e.preventDefault();lpCheckPhone();}
});
document.addEventListener('change',function(e){
  var tg=e.target;
  if(tg.id==='f-date'){syncForm();renderCart();}
  else if(tg.id==='f-agree'){st.agree=tg.checked;}
});
function autoPack(){
  var ta=$('#packText');if(!ta||C.pause)return;
  var txt=ta.value.trim();if(!txt)return;
  var p=st.custom.filter(function(c){return c.type==='pack';})[0];
  if(p){if(p.text===txt)return;p.text=txt;}else st.custom.push({type:'pack',text:txt});
  packDraft='';save();
}
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='packText')packDraft=e.target.value;
  if(/^f-/.test(id)){syncForm();save();}
  if(id==='f-agree'){st.agree=e.target.checked;}
});
window.addEventListener('hashchange',function(){if(!location.hash)navDepth=0;route();});
window.addEventListener('pageshow',function(ev){if(ev.persisted){renderMenu();route();}});
setInterval(function(){
  var sb=$('#statusBox');if(!sb)return;
  var si=statusInfo();sb.className='status '+si.cls;sb.lastChild.textContent=si.txt;
},60000);

/* ---------- start ---------- */
load();
takeHandoff();
lpFromLink();
(function(){var q=location.search.match(/[?&]lang=(en|hi)\b/);if(q&&st.lang!==q[1]){st.lang=q[1];save();}})();
renderMenu();
route();
checkInstalled();
appFromLink();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
