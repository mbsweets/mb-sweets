/* रिकॉर्डिंग → 16 kHz mono WAV (base64); आगे-पीछे की चुप्पी हटाकर */
function aiWav(st){
  var cs=st.chunks,a=Math.max(0,st.first-4),b=Math.min(cs.length,st.lastIdx+5),n=0,i,j;
  for(i=a;i<b;i++)n+=cs[i].length;
  var all=new Float32Array(n),o=0;for(i=a;i<b;i++){all.set(cs[i],o);o+=cs[i].length;}
  var sr=st.sr||48000,ratio=sr/16000,m=Math.floor(n/ratio),pcm=new Int16Array(m),pk=0;
  for(i=0;i<n;i++)if(Math.abs(all[i])>pk)pk=Math.abs(all[i]);
  var g=pk>0.0001?Math.min(8,0.9/pk):1;
  for(j=0;j<m;j++){var s0=Math.floor(j*ratio),s1=Math.min(n,Math.floor((j+1)*ratio)),acc=0;for(i=s0;i<s1;i++)acc+=all[i];var v=(s1>s0?acc/(s1-s0):0)*g;pcm[j]=Math.max(-32768,Math.min(32767,Math.round(v*32767)));}
  var buf=new ArrayBuffer(44+m*2),dv=new DataView(buf),ws=function(off,str){for(var k=0;k<str.length;k++)dv.setUint8(off+k,str.charCodeAt(k));};
  ws(0,'RIFF');dv.setUint32(4,36+m*2,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true);dv.setUint32(28,32000,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,m*2,true);
  new Int16Array(buf,44).set(pcm);
  var u8=new Uint8Array(buf),bin='';for(i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return {b64:btoa(bin),sec:m/16000};
}
/* आवाज़ → लिखी बात (सिर्फ़ लिखना, जवाब नहीं) */
function aiTxPrompt(){

}
function aiTranscribe(w){
  var key=aiKey();if(!key){var e0=new Error('key');e0.code='key';return Promise.reject(e0);}
  var parts=[{inline_data:{mime_type:'audio/wav',data:w.b64}},{text:'Transcribe this audio.'}],T0=Date.now();
  return aiModelOrder(key).then(function(models){
    models=models.filter(function(m){return !/gemma|embed|image|tts|live/i.test(m);}).sort(function(a,b){return (/lite/.test(b)?1:0)-(/lite/.test(a)?1:0);});
    if(!models.length)models=['gemini-flash-lite-latest','gemini-flash-latest'];
    var tries=[];
    function attempt(mi,again){
      if(mi>=models.length||mi>=2||Date.now()-T0>30000){var er=new Error('allfail');er.code=tries.length?aiWorst(tries):'timeout';throw er;}
      var m=models[mi];
      var body={systemInstruction:{parts:[{text:aiTxPrompt()}]},contents:[{role:'user',parts:parts}],generationConfig:{temperature:0}};
      return aiHttp('POST','models/'+encodeURIComponent(m)+':generateContent',body,key,20000).then(function(r){
        if(r.ok){var t=aiText(r.j);aiUse(m);return t.replace(/^["“'`]+|["”'`]+$/g,'').trim();}
        var ei=aiErrInfo(r);tries.push({m:m,code:ei.code});
        if(ei.code==='key'){var ek=new Error('key');ek.code='key';throw ek;}
        if(ei.code==='rpm'&&!again&&ei.retry>0&&ei.retry<=10)return aiWait(ei.retry*1000+300).then(function(){return attempt(mi,true);});
        if(ei.code==='server'&&!again)return aiWait(1200).then(function(){return attempt(mi,true);});
        if(ei.code==='quota'||ei.code==='rpm')aiMark(m,ei);
        return attempt(mi+1,false);
      },function(e){if(e.code==='timeout'){tries.push({m:m,code:'timeout'});return attempt(mi+1,false);}throw e;});
    }
    return attempt(0,false);
  });
}

function aiVocab(){

  try{state.items.forEach(function(x){addW(displayName(x));});}catch(e){}

  'उधार उधारी जमा बाकी बिल ऑर्डर एडवांस डिलीवरी हिसाब खर्च गल्ला नकद upi किलो पाव आधा पीस पैकेट लीटर डिब्बा रुपये रुपया कल परसों आज सुबह शाम'.split(' ').forEach(addW);

function aiBestAlt(res){
  if(!res||!res.length)return '';if(res.length<2)return res[0].transcript;
  var V=aiVocab(),best=0,bs=-1;
  for(var k=0;k<res.length;k++){var t=String(res[k].transcript||''),sc=0;
    t.toLowerCase().split(/\s+/).forEach(function(x){if(V[x])sc+=1;else if(/\d/.test(x))sc+=0.5;});
    sc-=k*0.3;if(sc>bs){bs=sc;best=k;}}
  return res[best].transcript;
}
function aiSRStart(auto){
  var SR=aiSR();if(!SR){toast('इस ब्राउज़र में बोलने वाला बटन नहीं चलता — कीबोर्ड के 🎤 से बोलिए');return;}
  var st={kind:'sr',auto:!!auto,base:String(AI.s.text||'').trim(),committed:'',finals:[],interim:'',last:Date.now(),t0:Date.now(),done:false,rec:null,restarts:0,heard:false,fatal:''};
  var wait=aiWaitSec(auto)*1000;
  var show=function(){AI.s.text=[st.base,st.committed,st.finals.join(' '),st.interim].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();var f=$('#ai-in');if(f)f.value=AI.s.text;};
  var mk=function(){
    var r;try{r=new SR();}catch(e){return null;}
    r.lang=aiCfg().lang==='en-IN'?'en-IN':'hi-IN';r.interimResults=true;r.continuous=true;r.maxAlternatives=3;
    r.onresult=function(ev){
      if(st.done||st.rec!==r)return;
      if(!$('#aiw')){aiSRFinish(false);return;}
      var fins=[],it='';   // इस बार का पूरा लिखा दोबारा बनाओ (Android कभी-कभी एक ही बात दोहराता है)
      for(var i=0;i<ev.results.length;i++){var tr=String(aiBestAlt(ev.results[i])||'').trim();if(!tr)continue;
        if(ev.results[i].isFinal){var lf=fins[fins.length-1],a=tr.toLowerCase(),b=lf?lf.toLowerCase():'';
          if(lf&&a.indexOf(b)===0)fins[fins.length-1]=tr;else if(!lf||(b.indexOf(a)!==0))fins.push(tr);}
        else it=(it?it+' ':'')+tr;}
      var nt=fins.join(' ')+'|'+it;if(nt!==st.lastTxt){st.lastTxt=nt;st.last=Date.now();}
      st.finals=fins;st.interim=it;if(fins.length||it)st.heard=true;show();
    };
    r.onerror=function(ev){if(st.rec!==r)return;var er=ev&&ev.error;
      if(er==='not-allowed'||er==='service-not-allowed')st.fatal=st.auto?'जवाब बोलने के लिए 🎤 बोलो दबाइए':'माइक की अनुमति नहीं है — फ़ोन की सेटिंग में Chrome को माइक की अनुमति दीजिए (या कीबोर्ड के 🎤 से बोलिए)';
      else if(er==='network')st.fatal='आवाज़ को लिखने के लिए इंटरनेट चाहिए';
      else if(er==='audio-capture')st.fatal='माइक नहीं मिला';};
    r.onend=function(){
      if(st.rec!==r)return;
      var add=[st.finals.join(' '),st.interim].filter(Boolean).join(' ');if(add)st.committed=(st.committed?st.committed+' ':'')+add;st.finals=[];st.interim='';st.rec=null;
      if(st.done)return;
      if(st.fatal){aiSRFinish(false,st.fatal);return;}
      var now=Date.now();   // Chrome ख़ुद रुक गया (ठहराव) — असली चुप्पी तक फिर सुनो
      if((st.heard&&now-st.last>=wait)||(!st.heard&&now-st.t0>(st.auto?6000:7000))||now-st.t0>30000||st.restarts++>30){aiSRFinish(true);return;}
      var r2=mk();if(!r2){aiSRFinish(true);return;}
      st.rec=r2;try{r2.start();}catch(e){aiSRFinish(true);}
    };
    return r;
  };
  var r=mk();if(!r){toast('माइक शुरू नहीं हुआ — कीबोर्ड के 🎤 से बोलिए');return;}
  AI.s.mic=st;AI.s.listen=true;AI.s.micErr='';st.rec=r;
  st.tick=setInterval(function(){
    if(st.done){clearInterval(st.tick);return;}
    var now=Date.now();
    if((st.heard&&now-st.last>=wait)||(!st.heard&&now-st.t0>(st.auto?6000:7000))||now-st.t0>30000){aiSRFinish(true);return;}
    var el=$('#ai-lvt');if(el)el.textContent=aiListenText(st);
  },200);
  try{r.start();}catch(e){clearInterval(st.tick);AI.s.mic=null;AI.s.listen=false;toast('माइक शुरू नहीं हुआ — फिर से दबाइए');return;}
  aiRender();
}
function aiSRFinish(send,msg){
  var st=AI.s.mic;if(!st||st.kind!=='sr'||st.done)return;
  st.done=true;clearInterval(st.tick);
  var r=st.rec;st.rec=null;
  var add=[st.finals.join(' '),st.interim].filter(Boolean).join(' ');if(add)st.committed=(st.committed?st.committed+' ':'')+add;
  try{if(r){r.onend=null;r.onresult=null;r.onerror=null;if(r.abort)r.abort();else r.stop();}}catch(e){}
  AI.s.mic=null;AI.s.listen=false;
  AI.s.text=[st.base,st.committed].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  if(msg)toast(msg);
  aiRender();var f=$('#ai-in');if(f)f.value=AI.s.text;
  var said=st.committed.trim();
  if(send&&said&&(aiCfg().auto!==false||aiHF())&&$('#aiw'))aiSend();
  else if(send&&!said&&!msg)toast(st.auto?'कुछ सुनाई नहीं दिया':'कुछ सुनाई नहीं दिया — फिर से 🎤 दबाकर बोलिए');
}

/* ---------- 📷 बिल/पर्ची की फोटो (फ़ोन में छोटी करके) ---------- */
function aiPickImg(){if(AI.s.imgs.length>=3){toast('एक बार में 3 फोटो तक');return;}var f=$('#ai-file');if(f){f.value='';f.click();}}
function aiImgFile(file){
  if(!file)return;if(!/^image\//.test(file.type||'image/')){toast('फोटो चुनिए');return;}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    try{
      var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));
      var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      var du=cv.toDataURL('image/jpeg',0.85);
      var ts=Math.min(1,160/Math.max(w,h)),tc=document.createElement('canvas');tc.width=Math.max(1,Math.round(w*ts));tc.height=Math.max(1,Math.round(h*ts));
      tc.getContext('2d').drawImage(img,0,0,tc.width,tc.height);
      AI.s.imgs.push({mime:'image/jpeg',data:du.split(',')[1],thumb:tc.toDataURL('image/jpeg',0.7)});
    }catch(e){toast('फोटो तैयार नहीं हो पाई');}
    URL.revokeObjectURL(url);aiRender();
    if(!aiKey())toast('फोटो पढ़ने के लिए ⚙️ में AI की मुफ़्त चाबी डालिए');
  };
  img.onerror=function(){URL.revokeObjectURL(url);toast('फोटो खुल नहीं पाई');};
  img.src=url;
}

function aiOpen(fromFab){
  AI.s.page='chat';
  openSheet(aiSheetHtml());

  if(fromFab&&aiKey()&&aiCfg().autoMic!==false&&(aiSR()||aiCanRec())&&!AI.s.busy)aiMic();
}
function aiRender(scroll){
  if(!$('#aiw'))return;
  if(AI.painting){setTimeout(function(){aiRender(scroll);},0);return;}
  AI.painting=true;
  try{setSheet(aiSheetHtml());}finally{AI.painting=false;}
  var f=$('#ai-in');if(f&&f.value!==AI.s.text&&document.activeElement!==f)f.value=AI.s.text;
  if(scroll){var s=$('#ov .sheet');if(s)s.scrollTop=s.scrollHeight;}
}
function aiGuard(s,m){
  var bad=false,h=esc(s);
  h=h.replace(/(₹\s?\d[\d,]*(?:\.\d+)?|\d[\d,]*(?:\.\d+)?\s?(?:रुपये|रुपया|रुपए|%))/g,function(x){
    var n=String(+aiDigits(x).replace(/[^\d.]/g,''));
    if((m.nums&&m.nums[n])||(m.unums&&m.unums[n]))return x;
    bad=true;return x+'<sup class="aibad">⚠️</sup>';});
  return {h:h,bad:bad};
}

  return h+'</div>';
}

function aiTest(useOld){
  var inp=$('#ai-key'),key=useOld?aiKey():String(inp&&inp.value||'').replace(/[\s"'<>`]/g,'');
  if(!key){AI.s.test='चाबी ऊपर वाले डिब्बे में चिपकाइए।';aiRender();return;}
  AI.s.testing=true;AI.s.test='जाँच रहा हूँ… (10–20 सेकंड)';aiRender();
  aiListModels(key).then(function(list){
    var ms=list.slice(0,6),i=0;
    var next=function(){
      if(i>=ms.length){var e=new Error('quota');e.code='quota';throw e;}
      var m=ms[i++];
      return aiHttp('POST','models/'+encodeURIComponent(m)+':generateContent',{contents:[{role:'user',parts:[{text:'Reply with exactly: {"ok":true}'}]}],generationConfig:{temperature:0}},key,45000).then(function(r){
        if(r.ok&&aiText(r.j)){aiUse(m);return m;}
        var ei=r.ok?{code:'empty'}:aiErrInfo(r);
        if(ei.code==='key'){var e1=new Error('key');e1.code='key';throw e1;}
        if(ei.code==='region'){var e2=new Error('region');e2.code='region';throw e2;}
        if(!r.ok)aiMark(m,ei);
        return next();
      });
    };
    return next();
  }).then(function(m){
    aiSet({key:key,ok:true,last:m,testedAt:Date.now()});
    AI.s.test='✅ चाबी सही है — AI चल रहा है ('+m+')। अब "← वापस" जाकर 🎤 से बोलिए।';
    if(inp)inp.value='';
  },function(e){
    var c=e&&e.code;
    if(c==='key'){AI.s.test='❌ यह चाबी Google ने नहीं मानी — aistudio से पूरी चाबी फिर से Copy करके चिपकाइए (बीच में स्पेस न हो)।';if(useOld)aiSet({ok:false});}
    else if(c==='net'||c==='timeout'){aiSet({key:key});AI.s.test='📶 इंटरनेट नहीं मिला — चाबी सेव कर दी है, इंटरनेट आने पर "लगी चाबी जाँचो" दबाइए।';}
    else if(c==='quota'){aiSet({key:key,ok:true});AI.s.test='⏳ चाबी सही है, पर अभी सारे मुफ़्त मॉडल का कोटा भरा है — '+aiResetText()+' के बाद चलेगा। चाबी सेव कर दी।';}
    else if(c==='region'){aiSet({key:key});AI.s.test='Google ने इस जगह से AI चलाने से मना किया: '+String(e.msg||'').slice(0,120);}
    else{aiSet({key:key});AI.s.test='जाँच पूरी नहीं हुई ('+String((e&&e.msg)||c||'').slice(0,120)+') — चाबी सेव कर दी, थोड़ी देर में "लगी चाबी जाँचो" दबाइए।';}
  }).then(function(){AI.s.testing=false;aiRender();});
}

function aiBudgetSheet(){

    var sg=bgSuggest(b[0]),cur=bgOf(b[0]);if(sg.sug)anyPrev=true;
    return '<div class="bgr"><label>'+b[1]+' '+esc(b[2])+'<input id="bg-'+b[0]+'" type="number" inputmode="numeric" min="0" step="any" value="'+(cur||'')+'" placeholder="₹ (खाली = कोई हद नहीं)"></label>'+
      (sg.prev?'<small>पिछले महीने: '+rupee(sg.prev)+(sg.sug?' · <button class="lnk" data-act="ai-bg-sug" data-k="'+b[0]+'" data-v="'+sg.sug+'">'+rupee(sg.sug)+' रखो</button>':'')+'</small>':'')+'</div>';
  }).join('');
  openSheet('<div class="sh-head"><h2>💰 महीने का बजट</h2><button class="lnk muted" data-act="close">बंद करो</button></div>'+
    '<p class="hint">हर खर्च के डिब्बे में महीने में ज़्यादा से ज़्यादा कितना जाना चाहिए। खाली छोड़ें = कोई हद नहीं। रिपोर्ट में 80% पर पीला, पार होने पर लाल दिखेगा, और सहायक भी बताएगा।</p>'+
    (anyPrev?'<button class="btn small" data-act="ai-bg-all" style="margin-bottom:6px">पिछले महीने के हिसाब से खाली डिब्बे भरो</button>':'<p class="hint">पिछले महीने का खर्च नहीं भरा था — अंदाज़े से भरिए, अगले महीने ऐप सुझाव देगा।</p>')+
    rows+'<div class="err" id="bg-err"></div>'+
    '<div class="sh-actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="ai-bg-save">Save करो</button></div>');

function aiBudgetSave(){
  var v={},bad='';
  BG_BOXES.concat([['total','','पूरे महीने का कुल खर्च']]).forEach(function(b){
    var el=$('#bg-'+b[0]);if(!el)return;var s=String(el.value||'').trim();if(!s)return;
    var n=num(s);if(!(n>=0)||n>=100000000){if(!bad)bad=b[2]+' का बजट सही लिखिए।';return;}
    if(n>0)v[b[0]]=round2(n);
  });
  if(bad){var er=$('#bg-err');if(er)er.textContent=bad;return;}
  BG().v=v;BG().at=Date.now();save();closeSheet();
  if(ui.view==='hisaab')renderHisaab();
  toast(Object.keys(v).length?'बजट सेव हो गया ✓':'बजट हटा दिया');
}
function bgReportHtml(){
  var s=bgStatus();

  return '<div class="hsstat"><p><b>'+s.mon+' में हर डिब्बे की हद</b> <small style="color:var(--muted)">('+s.dd+' / '+s.dim+' दिन बीते)</small></p><div class="bgbars">'+s.rows.map(function(r){
    var cl=r.pct>=100?'over':(r.pct>=80?'near':'ok');

      '<small>'+(r.left>=0?'बचा '+rupee(r.left):'⚠️ '+rupee(-r.left)+' ज़्यादा हो गया')+(r.proj!=null&&r.proj>r.b&&r.pct<100?' · इसी रफ़्तार से महीने में ~'+rupee(r.proj)+' (हद से ऊपर)':'')+'</small></div>';
  }).join('')+'</div><button class="btn small" data-act="ai-bg-open">बजट बदलो</button></div>';

/* ---------- बटन / टाइपिंग ---------- */
function aiClick(t,act){
  var cid=t.getAttribute('data-c'),c=cid?aiCardById(cid):null,v=t.getAttribute('data-v');
  switch(act){
    case 'ai-open':aiOpen(true);return true;
    case 'ai-mic':aiMic();return true;
    case 'ai-send':aiSend();return true;
    case 'ai-img':aiPickImg();return true;
    case 'ai-imgx':AI.s.imgs.splice(+t.getAttribute('data-i'),1);aiRender();return true;
    case 'ai-ex':AI.s.text=v||'';aiRender();var fx=$('#ai-in');if(fx){fx.value=AI.s.text;fx.focus();}return true;
    case 'ai-clear':if(AI.s.listen)aiMicStop();AI.s.msgs=[];aiRender();return true;
    case 'ai-retry':{
      if(AI.s.busy)return true;
      var rm=AI.s.msgs[+t.getAttribute('data-i')];if(!rm||!rm.retry)return true;
      var rsv=(rm.cards||[]).some(function(x){return x.st==='saved';});
      (rm.cards||[]).forEach(function(x){if(x.st==='open')x.st='replaced';});   // फ़ोन वाला कार्ड हटाकर AI का
      AI.s.text=rm.retry.t;AI.s.imgs=(rm.retry.imgs||[]).slice();rm.retry=null;var rin=$('#ai-in');if(rin)rin.value=AI.s.text;
      var rix=AI.s.msgs.indexOf(rm);
      if(!rsv&&rix>0&&AI.s.msgs[rix-1].r==='u')AI.s.msgs.splice(rix-1,2);   // वही बात दोबारा न दिखे (कुछ सेव हो चुका हो तो रहने दो — AI दोहराएगा नहीं)
      aiSend();return true;}
    case 'ai-set':if(AI.s.listen)aiMicStop();AI.s.page='set';AI.s.test='';if($('#aiw'))aiRender();else openSheet(aiSheetHtml());return true;
    case 'ai-back':AI.s.page='chat';AI.s.test='';aiRender(true);return true;
    case 'ai-test':aiTest(false);return true;
    case 'ai-test-old':aiTest(true);return true;
    case 'ai-delkey':aiSet({key:undefined,ok:undefined,last:undefined,models:undefined,ex:undefined,bad:undefined,plain:undefined});AI.s.test='चाबी हटा दी।';aiRender();return true;
    case 'ai-lang':aiSet({lang:v==='en-IN'?'en-IN':'hi-IN'});aiRender();return true;
    case 'ai-voice':aiSet({voice:v==='ai'?'ai':undefined});AI.s.recFail=false;aiRender();return true;
    case 'ai-wait':aiSet({wait:Math.min(4,Math.max(1,parseFloat(v)||2))});aiRender();return true;
    case 'ai-speak':var mm=AI.s.msgs[+t.getAttribute('data-i')];if(mm)aiSpeakMsg(mm);return true;
    case 'ai-save':if(c&&c.st==='open'){if(aiSaveCard(c))toast('✅ सेव हो गया');aiRender();}return true;
    case 'ai-edit':if(c&&c.st==='open')aiEditCard(c);return true;
    case 'ai-off':if(c){c.st='off';aiRender();}return true;
    case 'ai-reopen':if(c){c.st='open';c.err='';aiRender();}return true;
    case 'ai-go':if(c)aiGoCard(c);return true;
    case 'ai-pp':if(c&&c.pp){c.pp.pick=v||'';c.pp.open=false;c.to='';if(v==='new'&&!c.pp.nn)c.pp.nn=c.pp.srch||c.pp.q;c.err='';aiRender();}return true;
    case 'ai-pp-chg':if(c&&c.pp){c.pp.open=true;aiRender();}return true;
    case 'ai-pp-close':if(c&&c.pp){c.pp.open=false;aiRender();}return true;
    case 'ai-mode':if(c){c.mode=c.mode===v?'':v;aiRender();}return true;
    case 'ai-jto':if(c){c.to=v;c.err='';aiRender();}return true;
    case 'ai-rmline':if(c&&c.lines){c.lines.splice(+t.getAttribute('data-l'),1);aiRender();}return true;
    case 'ai-kbill':openKBillSheet('kentry',v,true);return true;
    case 'ai-obill':openBillSheet('order',v);return true;
    case 'ai-goparty':closeSheet();if(findParty(v)){ui.view='party';ui.partyId=v;}renderRoute();window.scrollTo(0,0);return true;
    case 'ai-gocust':closeSheet();if(findCustomer(v)){ui.cameFrom='home';ui.view='customer';ui.customerId=v;}renderRoute();window.scrollTo(0,0);return true;
    case 'ai-gohs':closeSheet();ui.hsDraft=hsDraftFor(v||todayStr());HX().d=v||todayStr();HX().tab='aaj';['maal','pay','kharch','ghar','cash','bana'].forEach(function(g){HX().open[g]=true;});ui.view='hisaab';renderRoute();window.scrollTo(0,0);return true;
    case 'ai-form':
      closeSheet();
      if(v==='u'||v==='j')openKEntry(v,null);
      else if(v==='o')openOrderForm(null);
      else{ui.hsDraft=hsDraftFor(todayStr());ui.view='hisaab';renderRoute();window.scrollTo(0,0);}
      return true;
    case 'ai-bg-open':aiBudgetSheet();return true;
    case 'ai-bg-sug':var bi=$('#bg-'+t.getAttribute('data-k'));if(bi)bi.value=v;return true;
    case 'ai-bg-all':BG_BOXES.concat([['total']]).forEach(function(b){var el=$('#bg-'+b[0]),sg=bgSuggest(b[0]);if(el&&!el.value&&sg.sug)el.value=sg.sug;});return true;
    case 'ai-bg-save':aiBudgetSave();return true;
  }
  return false;
}
function aiLater(){clearTimeout(AI.lt);AI.lt=setTimeout(function(){aiRender();},0);}
function aiInput(t,isChange){
  if(t.id==='ai-in'){AI.s.text=t.value;return true;}
  if(t.id==='ai-key')return true;
  if(isChange&&t.id==='ai-file'){aiImgFile(t.files&&t.files[0]);return true;}
  if(isChange&&(t.id==='ai-o-automic'||t.id==='ai-o-auto'||t.id==='ai-o-speak'||t.id==='ai-o-hf')){var o={};o[t.id==='ai-o-automic'?'autoMic':(t.id==='ai-o-auto'?'auto':(t.id==='ai-o-hf'?'hf':'speak'))]=!!t.checked;aiSet(o);return true;}
  var f=t.getAttribute&&t.getAttribute('data-aif');if(!f)return false;
  var c=aiCardById(t.getAttribute('data-c'));if(!c)return true;
  var v=t.value;
  if(f==='srch'){
    c.pp.srch=v;var q=v.trim()||c.pp.q;
    c.pp.list=aiPMatch(q,'',null).map(function(r){return {ref:aiPRef(r.x),s:r.s};});
    if(v.trim())c.pp.nn=v.trim();
    aiRender();return true;
  }
  if(f==='nn'){c.pp.nn=v;return true;}
  if(f==='np'){c.pp.np=v;return true;}
  if(f==='note'){c.note=v;return true;}
  if(f==='phone'){c.np=v;return true;}
  if(f==='amount'){c.amount=v;if(isChange)aiLater();return true;}
  if(f==='adv'){c.adv=v;if(isChange)aiLater();return true;}
  if(f==='paid'){c.paid=v;if(isChange)aiLater();return true;}
  if(f==='when'){var w=aiWhen(v);c.wd=w.d;if(w.t)c.wt=w.t;c.wtSaid=true;if(isChange)aiLater();return true;}
  if(f==='rate'||f==='qty'){var l=c.lines&&c.lines[+t.getAttribute('data-l')];if(l)l[f]=v===''?'':num(v);if(isChange)aiLater();return true;}
  return true;
}
