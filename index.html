    var hh=230;ctx.fillStyle=BI.maroon;ctx.fillRect(0,0,W,hh);

    biFont(ctx,700,52,true);biText(ctx,biFit(ctx,LP.name,W-tx-P),tx,104,'left',BI.cream);
    biFont(ctx,400,29);biText(ctx,biFit(ctx,'माँ भगवती मिष्ठान भंडार · ननौरा, दरभंगा',W-tx-P),tx,152,'left',BI.cream);
    biFont(ctx,400,26);biText(ctx,'फ़ोन: '+(state.shop.phone||''),tx,192,'left',BI.cream);
    var y=hh+40;
    // सदस्य
    biRound(ctx,P,y,W-2*P,118,18,BI.paper,BI.line);
    biFont(ctx,600,24);biText(ctx,'सदस्य',P+26,y+38,'left',BI.muted);
    biFont(ctx,400,28);var phW=ctx.measureText(m.phone).width+30;biText(ctx,m.phone,W-P-26,y+86,'right',BI.ink);
    biFont(ctx,700,38);biText(ctx,biFit(ctx,m.name,W-2*P-52-phW),P+26,y+88,'left',BI.ink);
    y+=150;
    // पॉइंट
    biRound(ctx,P,y,W-2*P,200,24,BI.cream,BI.gold);
    biFont(ctx,700,120,true);biText(ctx,String(s.bal),W/2,y+132,'center',BI.maroon);
    biFont(ctx,600,32);biText(ctx,'मिठास पॉइंट · '+lpDate(todayStr()),W/2,y+180,'center',BI.muted);
    y+=232;
    // इनाम
    biFont(ctx,700,30);biText(ctx,'इनाम (एक बिल पर एक)',P,y+30,'left',BI.ink);y+=50;
    LP.rewards.forEach(function(rw){
      var ok=s.bal>=rw.pts;
      biRound(ctx,P,y,W-2*P,84,14,ok?BI.greenbg:'#F7F2EA',null);
      biFont(ctx,700,32);biText(ctx,rw.pts+' पॉइंट = '+rupee(rw.off)+' छूट',P+24,y+52,'left',ok?BI.green:BI.ink);
      biFont(ctx,600,25);biText(ctx,(ok?'✓ अभी ले सकते हैं':(rw.pts-s.bal)+' पॉइंट और')+' · '+rupee(rw.min)+'+ बिल',W-P-24,y+52,'right',ok?BI.green:BI.muted);
      y+=96;
    });
    if(s.soon){
      biRound(ctx,P,y+6,W-2*P,70,14,BI.redbg,null);
      biFont(ctx,700,28);biText(ctx,'⏳ '+s.soon+' पॉइंट '+lpDate(s.soonLast)+' तक इस्तेमाल कर लें',P+24,y+52,'left',BI.red);
      y+=90;
    }
    // जोड़
    y+=14;
    var cols=[['कुल मिले',String(s.earned)],['इस्तेमाल',String(s.used)],['ख़त्म',String(s.expired)],['छूट मिली',rupee(s.saved)]];
    var cw=(W-2*P)/4;
    cols.forEach(function(c,i){
      var cx=P+cw*i+cw/2;
      biFont(ctx,700,36,true);biText(ctx,c[1],cx,y+40,'center',BI.maroon);
      biFont(ctx,400,24);biText(ctx,c[0],cx,y+76,'center',BI.muted);
    });
    y+=110;
    // हिसाब
    if(hist.length){
      ctx.fillStyle=BI.line;ctx.fillRect(P,y,W-2*P,2);y+=12;
      biFont(ctx,700,28);biText(ctx,'हाल का हिसाब',P,y+34,'left',BI.ink);y+=52;

          biText(ctx,got?'+'+got:'0',gx,y+30,'right',got?BI.green:BI.muted);

    y+=40;ctx.fillStyle=BI.maroon;ctx.fillRect(0,y,W,16);y+=16;
    var out=document.createElement('canvas');out.width=W;out.height=Math.min(Math.ceil(y),H);
    out.getContext('2d').drawImage(cv,0,0);
    return new Promise(function(res,rej){out.toBlob(function(bl){if(bl)res(bl);else rej(new Error('blob'));},'image/png');});
  });
}

/* ---------- WhatsApp messages ---------- */
function waLink(phone,text){
  var p=phoneNorm(phone);if(!p)return '';
  return 'https://api.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(text);
}
function appendTerms(L){
  var terms=(state.shop.terms||'').trim();
  if(!terms)return;
  L.push('-------------------');
  L.push('नियम व शर्तें:');
  terms.split('\n').forEach(function(line){
    line=line.trim();
    if(line)L.push('- '+line);
  });
}
function billLineItems(L, o){
  var baseDayKey=dayKey(o.date);
  o.items.forEach(function(it,idx){
    var amt=num(it.qty)*num(it.rate);
    L.push((idx+1)+'. '+displayName(it)+' '+(it.delivered?('✅'+(it.deliveredAt?' ('+fmtDshort(it.deliveredAt)+')':'')):'⏳'));
    L.push('    '+fmtQty(it.qty)+' '+it.unit+' x '+rupee(it.rate)+' = '+rupee(amt));
    if(!it.delivered&&it.date&&it.date!==baseDayKey){
      L.push('    Delivery: '+fmtDshort(it.date));
    }
    if(idx<o.items.length-1)L.push('');
  });
}
function billMessage(o){
  var c=findCustomer(o.customerId);
  var L=[];
  L.push('*'+state.shop.name+'*');
  L.push(state.shop.addr);
  L.push('Ph: '+state.shop.phone);
  L.push('===================');
  L.push('BILL');
  L.push('Bill No: '+o.no);
  L.push('Delivery: '+fmtDT(o.date));
  L.push('Customer: '+(c?c.name:'-'));
  L.push('-------------------');
  billLineItems(L, o);
  L.push('');
  L.push('✅ = दिया गया    ⏳ = बाकी');
  L.push('-------------------');
  L.push('Total Bill: '+rupee(orderTotal(o)));
  L.push('Jama (Advance/Paid): '+rupee(orderPaid(o)));
  o.payments.forEach(function(p){L.push('    '+fmtDshort(p.date)+': '+rupee(p.amount)+(p.note?' ('+p.note+')':''));});
  L.push('Baaki (Due): '+rupee(orderDue(o)));
  if(orderPaid(o)>orderTotal(o)+0.001)L.push('Extra Jama: '+rupee(orderPaid(o)-orderTotal(o)));
  appendTerms(L);
  L.push('===================');
  L.push('Dhanyawad');
  L.push(state.shop.owner);
  orderPromo(L);
  return L.join('\n');
}
function summaryMessage(c){
  var os=customerOrders(c.id).filter(function(o){return !o.cancelled;}).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var L=[];
  L.push('*'+state.shop.name+'*');
  L.push(state.shop.addr);
  L.push('Ph: '+state.shop.phone);
  L.push('===================');
  L.push('Poora Hisaab: '+c.name);
  L.push('✅ = दिया गया    ⏳ = बाकी');
  L.push('');
  var totBill=0,totPaid=0;
  os.forEach(function(o){
    var ot=orderTotal(o),op=orderPaid(o),od=orderDue(o);
    totBill+=ot;totPaid+=op;
    L.push('-------------------');
    L.push('Delivery: '+fmtDT(o.date)+' (Order #'+o.no+', '+STAMP[orderStatus(o)]+')');
    L.push('');
    billLineItems(L, o);
    L.push('');
    L.push('Order Total: '+rupee(ot)+'  |  Jama: '+rupee(op)+'  |  Baaki: '+rupee(od));
    L.push('');
  });
  L.push('===================');
  L.push('Grand Total Bill: '+rupee(totBill));
  L.push('Grand Total Jama: '+rupee(totPaid));
  L.push('Grand Total Baaki: '+rupee(Math.max(0,totBill-totPaid)));
  appendTerms(L);
  L.push('===================');
  L.push('Dhanyawad');
  L.push(state.shop.owner);
  orderPromo(L);
  return L.join('\n');
}

var BI={W:1080,P:56,QX:650,RX:830,maroon:'#5C1620',cream:'#FBEEDD',paper:'#FAF3E7',line:'#E6D9C6',ink:'#2B1712',muted:'#7A6556',gold:'#9C6B00',green:'#2F6F4E',red:'#A6332E',redbg:'#F6E1DD',greenbg:'#E3F1E8'};
var BI_BODY="Mukta,'Noto Sans Devanagari','Nirmala UI',sans-serif";
var BI_HEAD="'Baloo 2',Mukta,'Noto Sans Devanagari','Nirmala UI',sans-serif";
function biFont(ctx,w,px,head){ctx.font=w+' '+px+'px '+(head?BI_HEAD:BI_BODY);}
function biText(ctx,s,x,y,align,color){ctx.textAlign=align||'left';ctx.fillStyle=color||BI.ink;ctx.fillText(String(s),x,y);}
function biLoadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src=src;});}
function biFontsReady(){
  try{
    if(!document.fonts||!document.fonts.load)return Promise.resolve();
    return Promise.all([
      document.fonts.load("400 30px Mukta","अ"),document.fonts.load("600 30px Mukta","अ"),
      document.fonts.load("700 30px Mukta","अ"),document.fonts.load("700 40px 'Baloo 2'","अ")
    ]).then(function(){},function(){});
  }catch(e){return Promise.resolve();}
}
function biFit(ctx,text,maxW){
  // एक लाइन में न आए तो आख़िर में "…"
  text=String(text==null?'':text);
  if(ctx.measureText(text).width<=maxW)return text;
  var a=Array.from(text);
  while(a.length>1&&ctx.measureText(a.join('')+'…').width>maxW)a.pop();
  return a.join('')+'…';
}
function biWrap(ctx,text,maxW){
  var words=[],lines=[],cur='';
  // बिना स्पेस वाला बहुत लंबा शब्द भी टुकड़ों में टूटे, बाहर न निकले
  String(text==null?'':text).split(' ').forEach(function(w){
    if(!w||ctx.measureText(w).width<=maxW){words.push(w);return;}
    var part='';Array.from(w).forEach(function(ch){if(part&&ctx.measureText(part+ch).width>maxW){words.push(part);part='';}part+=ch;});
    if(part)words.push(part);
  });
  words.forEach(function(w){
    if(!w)return;
    var t=cur?cur+' '+w:w;
    if(!cur||ctx.measureText(t).width<=maxW)cur=t;else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}
function biRound(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function biHeader(ctx,logo){
  var W=BI.W,P=BI.P,tx=logo?P+178:P,tw=W-tx-P;
  biFont(ctx,700,50,true);var nameL=biWrap(ctx,state.shop.name,tw);
  biFont(ctx,400,29);var addrL=biWrap(ctx,state.shop.addr,tw);
  var blockH=nameL.length*58+addrL.length*40+40;
  var H=Math.max(logo?240:0,blockH+70);
  ctx.fillStyle=BI.maroon;ctx.fillRect(0,0,W,H);
  if(logo){var ls=156;ctx.drawImage(logo,P,Math.round((H-ls)/2),ls,ls);}
  var y=Math.round((H-blockH)/2)+46;
  biFont(ctx,700,50,true);
  nameL.forEach(function(l,i){biText(ctx,l,tx,y,'left',BI.cream);y+=58;});
  y-=14;
  biFont(ctx,400,29);
  addrL.forEach(function(l){biText(ctx,l,tx,y,'left',BI.cream);y+=40;});
  if(state.shop.phone)biText(ctx,'फ़ोन: '+state.shop.phone,tx,y,'left',BI.cream);
  return H;
}
function biTitle(ctx,y,title,rTop,rBottom){
  var W=BI.W,P=BI.P;

  biFont(ctx,700,30);biText(ctx,rTop,W-P,y+32,'right',BI.ink);

}
function biCustomer(ctx,y,c,extra){
  var W=BI.W,P=BI.P,h=extra?156:118;

function biTableHead(ctx,y){

}
function biIconDone(ctx,x,y,s){
  biRound(ctx,x,y,s,s,Math.round(s*0.22),'#2FA84F',null);
  ctx.save();ctx.strokeStyle='#FFFFFF';ctx.lineWidth=Math.max(3,s*0.14);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x+s*0.24,y+s*0.53);ctx.lineTo(x+s*0.43,y+s*0.71);ctx.lineTo(x+s*0.77,y+s*0.31);ctx.stroke();
  ctx.restore();
}
function biIconPending(ctx,x,y,s){
  ctx.save();
  var frame='#7A5A1E',sand='#E0A21B';
  ctx.fillStyle=frame;
  biRound(ctx,x+s*0.10,y+s*0.02,s*0.80,s*0.13,s*0.05,frame,null);
  biRound(ctx,x+s*0.10,y+s*0.85,s*0.80,s*0.13,s*0.05,frame,null);
  ctx.beginPath();
  ctx.moveTo(x+s*0.20,y+s*0.15);ctx.lineTo(x+s*0.80,y+s*0.15);ctx.lineTo(x+s*0.56,y+s*0.50);
  ctx.lineTo(x+s*0.80,y+s*0.85);ctx.lineTo(x+s*0.20,y+s*0.85);ctx.lineTo(x+s*0.44,y+s*0.50);ctx.closePath();
  ctx.fillStyle='#FFF4DC';ctx.fill();
  ctx.strokeStyle=frame;ctx.lineWidth=Math.max(2,s*0.07);ctx.lineJoin='round';ctx.stroke();
  ctx.fillStyle=sand;
  ctx.beginPath();ctx.moveTo(x+s*0.32,y+s*0.25);ctx.lineTo(x+s*0.68,y+s*0.25);ctx.lineTo(x+s*0.50,y+s*0.45);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(x+s*0.50,y+s*0.60);ctx.lineTo(x+s*0.71,y+s*0.80);ctx.lineTo(x+s*0.29,y+s*0.80);ctx.closePath();ctx.fill();
  ctx.fillRect(x+s*0.485,y+s*0.45,s*0.03,s*0.17);
  ctx.restore();
}
function biItemRow(ctx,y,o,it,idx){
  var W=BI.W,P=BI.P,IS=34,NX=P+IS+14,nameW=BI.QX-176-NX;
  biFont(ctx,600,32);var nl=biWrap(ctx,(idx+1)+'. '+displayName(it),nameW);

function biCarry(ctx,y,list){

function biTotals(ctx,y,tot,paid,payments){

function renderBillImage(kind,ref){
  return Promise.all([biFontsReady(),biLoadImg('logo-header.png'),biLoadImg('order-qr.png')]).then(function(r){
    var logo=r[1],qr=r[2];
    var o=kind==='order'?ref:null,c=kind==='order'?findCustomer(o.customerId):ref;
    var orders=kind==='order'?[o]:customerOrders(c.id).filter(function(x){return !x.cancelled;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var mc=document.createElement('canvas').getContext('2d'),nameW=BI.QX-176-(BI.P+34+14);
    biFont(mc,600,32);
    var oh=function(x){var h=190+x.items.length*170+x.payments.length*40;x.items.forEach(function(it,i){h+=Math.max(0,biWrap(mc,(i+1)+'. '+displayName(it),nameW).length-1)*42+36;});return h;};
    var est=function(list,carry){return Math.ceil(1840+(carry?130:0)+String(state.shop.terms||'').length*2+list.reduce(function(s,x){return s+oh(x);},0));};
    // लंबे हिसाब में: बाकी वाले ऑर्डर पूरे दिखें, बाकी सब एक "पहले के ऑर्डर" लाइन में (फोटो 15000px से ऊँची नहीं बनती)
    var shown=orders,older=[];
    if(kind!=='order'&&est(orders)>14000){
      shown=orders.filter(function(x){return orderDue(x)>0;});
      while(shown.length>1&&est(shown,true)>14000)shown=shown.slice(1);
      older=orders.filter(function(x){return shown.indexOf(x)<0;});
    }
    var H=Math.min(15000,est(shown,older.length>0));
    var cv=document.createElement('canvas');cv.width=BI.W;cv.height=H;
    var ctx=cv.getContext('2d');ctx.textBaseline='alphabetic';
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,BI.W,H);
    var y=biHeader(ctx,logo)+34;
    if(kind==='order'){
      y=biTitle(ctx,y,'बिल','बिल नं. '+o.no,'तारीख: '+fmtDonly(new Date()));
      y=biCustomer(ctx,y,c,'डिलीवरी: '+fmtDT(o.date));
      y=biTableHead(ctx,y);
      o.items.forEach(function(it,i){y=biItemRow(ctx,y,o,it,i);});
      y=biTotals(ctx,y,orderTotal(o),orderPaid(o),o.payments);
    }else{
      y=biTitle(ctx,y,'पूरा हिसाब',orders.length+' ऑर्डर','तारीख: '+fmtDonly(new Date()));
      y=biCustomer(ctx,y,c,null);
      y=biTableHead(ctx,y);
      var gt=0,gp=0;
      orders.forEach(function(ox){gt+=orderTotal(ox);gp+=orderPaid(ox);});
      if(older.length)y=biCarry(ctx,y,older);
      shown.forEach(function(ox){
        y=biOrderBar(ctx,y,ox);
        ox.items.forEach(function(it,i){y=biItemRow(ctx,y,ox,it,i);});
        y=biOrderSub(ctx,y,ox);
      });
      y=biTotals(ctx,y,gt,gp,null);
    }
    y=biTerms(ctx,y);
    y=biFooter(ctx,y,qr);
    var out=document.createElement('canvas');out.width=BI.W;out.height=Math.min(Math.ceil(y),H);
    out.getContext('2d').drawImage(cv,0,0);
    return new Promise(function(res,rej){out.toBlob(function(b){if(b)res(b);else rej(new Error('blob'));},'image/png');});
  });
}

/* ---------- Calendar reminders (.ics) — works offline, no server needed ---------- */
function icsDate(dt){
  return dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+'T'+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+pad(dt.getUTCSeconds())+'Z';
}
function icsEscape(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function orderIcs(o){
  var c=findCustomer(o.customerId);
  var start=new Date(o.date);
  if(isNaN(start))start=new Date();
  var end=new Date(start.getTime()+30*60000);
  var itemsTxt=o.items.map(function(it){return displayName(it)+' x'+fmtQty(it.qty)+' '+it.unit;}).join(', ');
  var summary='Order #'+o.no+' - '+(c?c.name:'Customer');
  var desc=itemsTxt+' | Baaki: '+rupee(orderDue(o));
  var uidv='mbmb-order-'+o.id+'@mbmb-billing';
  var L=[];
  L.push('BEGIN:VCALENDAR');
  L.push('VERSION:2.0');
  L.push('PRODID:-//MBMB Billing//HI');
  L.push('BEGIN:VEVENT');
  L.push('UID:'+uidv);
  L.push('DTSTAMP:'+icsDate(new Date()));
  L.push('DTSTART:'+icsDate(start));
  L.push('DTEND:'+icsDate(end));
  L.push('SUMMARY:'+icsEscape(summary));
  L.push('DESCRIPTION:'+icsEscape(desc));
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('DESCRIPTION:Reminder');
  L.push('TRIGGER:-P2D');
  L.push('END:VALARM');
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('DESCRIPTION:Reminder');
  L.push('TRIGGER:-P1D');
  L.push('END:VALARM');
  L.push('END:VEVENT');
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadIcs(o){
  var ics=orderIcs(o);
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='order-'+o.no+'-reminder.ics';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

/* ---------- In-app reminder notification (best-effort, jab app khule tab hi) ---------- */
function checkDueReminders(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var todayK=todayStr();
    var lastKey='mbmb-lastremind';
    if(localStorage.getItem(lastKey)===todayK)return;
    var live=state.orders.filter(function(o){return !o.cancelled;});
    var tmrK=(function(){var d=new Date();d.setDate(d.getDate()+1);return dayKey(d);})();
    var dayAfterK=(function(){var d=new Date();d.setDate(d.getDate()+2);return dayKey(d);})();
    var tmrItems=dayItemSummary(live,tmrK);
    var dayAfterItems=dayItemSummary(live,dayAfterK);
    if(!tmrItems.length&&!dayAfterItems.length){localStorage.setItem(lastKey,todayK);return;}
    var parts=[];
    if(tmrItems.length)parts.push('Kal: '+tmrItems.slice(0,4).map(function(i){return i.name+' '+fmtQty(i.qty)+' '+i.unit;}).join(', '));
    if(dayAfterItems.length)parts.push('Parso: '+dayAfterItems.slice(0,4).map(function(i){return i.name+' '+fmtQty(i.qty)+' '+i.unit;}).join(', '));
    showLocalNotif('MB Sweets \u2013 aane wala order',parts.join(' | ')).then(function(){localStorage.setItem(lastKey,todayK);},function(){});
  }catch(e){}
}
/* Android Chrome में new Notification() नहीं चलता — service worker से दिखाओ */
function showLocalNotif(title,body){
  var opts={body:body,icon:'icon-192.png',badge:'badge-96.png',tag:'mb-due'};
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistration){
    return navigator.serviceWorker.getRegistration().then(function(r){
      if(r&&r.showNotification)return r.showNotification(title,opts);
      new Notification(title,opts);
    });
  }
  return new Promise(function(res){new Notification(title,opts);res();});
}

      renderRoute();window.scrollTo(0,0);break;

      else if(fa==='udhar')openKEntry('u',ui.view==='party'?ui.partyId:null);
      else if(fa==='lbuy')openLBuy(ui.view==='lmember'?ui.memberId:null);
      else openOrderForm(ui.view==='customer'?ui.customerId:null);
      break;
    case 'open-customer':if($('#ov'))closeSheet();ui.cameFrom=(ui.view==='orders')?'orders':(ui.view==='dues'?'dues':'home');ui.view='customer';ui.customerId=id;renderRoute();window.scrollTo(0,0);break;

      var savedC=saveCustomerFrom(id||null);
      if(savedC){closeSheet();renderRoute();toast('ग्राहक save हो गया');}
      break;
    case 'del-customer':openDeleteCustomerConfirm(id);break;
    case 'confirm-del-customer':
      state.orders=state.orders.filter(function(o){return o.customerId!==id;});
      state.customers=state.customers.filter(function(c){return c.id!==id;});
      save();closeSheet();ui.view='home';ui.customerId=null;renderRoute();toast('ग्राहक डिलीट हो गया');
      break;
    case 'close':closeSheet();break;
    case 'on-sync':onlineSync(true);break;

    case 'on-reject':openRejectSheet(t.getAttribute('data-code'));break;

      $all('#rj-chips button').forEach(function(b,i){b.classList.toggle('on',i===ui.rejectReason);});
      break;

        var rjTxt=($('#rj-text').value||'').trim()||REJECT_REASONS[ui.rejectReason||0];
        closeSheet();
        openWa(rjo.phone,rejectMessage(rjo,rjTxt));
        queueStatus(rjc,'rejected',{note:rjTxt});
      }
      break;

      var outo=findOnline(t.getAttribute('data-code'));
      if(outo){openWa(outo.phone,outMessage(outo,billingOrderFor(outo.code)));queueStatus(outo.code,'out');}
      break;
    case 'on-deliver':deliverOnline(t.getAttribute('data-code'));break;
    case 'on-review':
      var rvo=findOnline(t.getAttribute('data-code'));
      if(rvo)openWa(rvo.phone,reviewMessage(rvo));

    case 'k-new':openKEntry(t.getAttribute('data-type')==='j'?'j':'u',id||null);break;
    case 'k-open':ui.view='party';ui.partyId=id;renderRoute();window.scrollTo(0,0);break;
    case 'k-party-new':openPartyForm();break;
    case 'k-party-edit':openPartyForm(id);break;
    case 'k-party-save':
      var kps=savePartyForm(id||null);
      if(kps){closeSheet();if(!id){ui.view='party';ui.partyId=kps.id;}renderRoute();toast('खाता save हो गया');}
      break;
    case 'k-party-del':openPartyDelete(id);break;
    case 'k-party-del-yes':
      KH();state.khata.entries=state.khata.entries.filter(function(x){return x.partyId!==id;});
      state.khata.parties=state.khata.parties.filter(function(x){return x.id!==id;});
      save();closeSheet();ui.view='khata';ui.partyId=null;renderRoute();toast('खाता डिलीट हो गया');
      break;
    case 'k-entry':openKEntryActions(id);break;
    case 'k-edit':openKEntry(null,null,id);break;
    case 'k-del':openKEntryDelete(id);break;
    case 'k-del-yes':
      KH();state.khata.entries=state.khata.entries.filter(function(x){return x.id!==id;});
      save();closeSheet();renderRoute();toast('एंट्री हट गई');
      break;
    case 'k-all':ui.kAll=(ui.kAll===id)?null:id;renderRoute();break;
    case 'ke-save':saveKEntry();break;
    case 'ke-change':
      if(ui.kDraft){ui.kDraft.partyId=null;ui.kDraft.search='';renderKEntrySheet();setTimeout(function(){var f=$('#ke-search');if(f)f.focus();},40);}
      break;
    case 'ke-pick':
      if(ui.kDraft){ui.kDraft.partyId=id;ui.kDraft.newOpen=false;renderKEntrySheet();setTimeout(function(){var f=$('#ke-amt');if(f)f.focus();},40);}
      break;
    case 'ke-new':
      if(ui.kDraft){ui.kDraft.newOpen=true;ui.kDraft.newName=(ui.kDraft.search||'').trim();ui.kDraft.newPhone='';renderKEntrySheet();setTimeout(function(){var f=$('#ke-nc-phone');if(f)f.focus();},60);}
      break;
    case 'ke-new-cancel':if(ui.kDraft){ui.kDraft.newOpen=false;renderKEntrySheet();}break;
    case 'ke-new-ok':
      var knName=$('#ke-nc-name').value.trim(),knPhone=$('#ke-nc-phone').value.trim();
      if(!knName){$('#ke-nc-err').textContent='नाम लिखो।';break;}
      var knDup=partyByPhone(knPhone,null);
      if(knDup){$('#ke-nc-err').innerHTML='यह नंबर पहले से "'+esc(knDup.name)+'" के खाते में है। <button class="lnk" data-act="ke-pick" data-id="'+knDup.id+'">उन्हीं को चुनो</button>';break;}
      var knProb=partyPhoneProblem(knPhone,null);
      if(knProb){$('#ke-nc-err').textContent=knProb;break;}
      var knP={id:uid(),name:knName,phone:knPhone,createdAt:Date.now(),remindedAt:0};
      KH().parties.push(knP);save();
      ui.kDraft.partyId=knP.id;ui.kDraft.newOpen=false;renderKEntrySheet();toast('नया खाता बन गया');
      setTimeout(function(){var f=$('#ke-amt');if(f)f.focus();},60);
      break;
    case 'ke-chip':
      if(ui.kDraft){
        var kcv=t.getAttribute('data-v'),kci=$('#ke-note');
        ui.kDraft.note=(ui.kDraft.note===kcv)?'':kcv;if(kci)kci.value=ui.kDraft.note;
        $all('[data-act=ke-chip]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===ui.kDraft.note);});
      }
      break;
    case 'k-wa-go':
      var kgp=findParty(t.getAttribute('data-pid'));
      if(t.getAttribute('data-kind')==='remind'&&kgp){kgp.remindedAt=Date.now();save();}
      setTimeout(function(){if($('#ov'))closeSheet();renderRoute();},400);
      break;
    case 'k-wa-need-phone':openKPhoneSheet(t.getAttribute('data-kind'),t.getAttribute('data-ref'),t.getAttribute('data-pid'));break;
    case 'k-wa-phone-go':
      var kpKind=t.getAttribute('data-kind'),kpRef=t.getAttribute('data-ref'),kpP=findParty(t.getAttribute('data-pid'));
      var kpRaw=$('#kp-phone').value.trim();
      var kpProb=kpRaw?partyPhoneProblem(kpRaw,kpP?kpP.id:null):'मोबाइल नंबर लिखो।';
      if(!kpP||kpProb||!phoneNorm(kpRaw)){e.preventDefault();$('#kp-err').textContent=kpProb||'सही मोबाइल नंबर लिखो (10 अंकों का)।';break;}
      kpP.phone=kpRaw;
      if(kpKind==='remind')kpP.remindedAt=Date.now();
      save();
      t.setAttribute('href',waLink(kpRaw,kMsg(kpKind,kpRef)));
      setTimeout(function(){closeSheet();renderRoute();toast('नंबर जुड़ गया, WhatsApp खुल रहा है');},80);
      break;

    case 'edit-item':openItemForm(id);break;
    case 'test-milk':testMilkReminder();break;
    case 'push-on':enablePush();break;
    case 'push-test':testPush();break;
    case 'push-off':disablePush();break;
    case 'push-help':openPushHelp('denied');break;
    case 'save-item':
      var iname=$('#i-name').value.trim(),iprice=Math.max(0,num($('#i-price').value));
      if(!iname){$('#i-err').textContent='नाम लिखो।';break;}
      if(state.items.some(function(x){return x.id!==id&&x.name.toLowerCase()===iname.toLowerCase();})){$('#i-err').textContent='इस नाम का आइटम पहले से लिस्ट में है।';break;}
      var existI=id?findItem(id):null;
      var milkIn=$('#i-milk'),milkV=(milkIn&&$('#i-cat').value==='mithai')?milkIn.value.trim():null;
      if(existI){existI.name=iname;existI.cat=$('#i-cat').value;existI.unit=$('#i-unit').value.trim()||'किलो';existI.price=iprice;}
      else{existI={id:uid(),name:iname,cat:$('#i-cat').value,unit:$('#i-unit').value.trim()||'किलो',price:iprice};state.items.push(existI);}
      if(milkV!==null){var mOld=itemMilk(existI),mNew=milkV===''?null:Math.max(0,num(milkV));if(mNew!==mOld)existI.milk=mNew;}
      save();closeSheet();renderRoute();toast('आइटम save हो गया');
      break;
    case 'del-item':openDeleteItemConfirm(id);break;
    case 'confirm-del-item':
      state.items=state.items.filter(function(i){return i.id!==id;});
      save();closeSheet();renderRoute();toast('आइटम हट गया');
      break;

    case 'install-app':
      if(window.deferredInstallPrompt){
        window.deferredInstallPrompt.prompt();
        window.deferredInstallPrompt.userChoice.then(function(){window.deferredInstallPrompt=null;});
      }else{
        openInstallHelpSheet();
      }
      break;
    case 'enable-notif':
      if('Notification' in window){
        Notification.requestPermission().then(function(perm){
          if(perm==='granted'){
            localStorage.removeItem('mbmb-lastremind');
            checkDueReminders();
            toast('notification chaalu ho gaya');
          }else{
            toast('notification ki anumati nahi mili');
          }
          renderRoute();
        });
      }else{
        toast('Is browser me notification support nahi hai');
      }
      break;
    case 'save-shopinfo':
      var sn=$('#s-name').value.trim();
      if(!sn){$('#s-err').textContent='दुकान का नाम लिखो।';break;}
      state.shop={name:sn,addr:$('#s-addr').value.trim(),phone:$('#s-phone').value.trim(),owner:$('#s-owner').value.trim(),terms:$('#s-terms').value.trim()};
      save();renderShell();toast('जानकारी save हो गई');
      break;
    case 'copy-backup':
      var ta=$('#b-text');ta.value=JSON.stringify(state);ta.focus();ta.select();
      var done=function(){
        toast('Copy हो गया');
        localStorage.setItem('mbmb-lastbackup',String(Date.now()));
        renderBanner();
        var lb=$('#last-backup-txt');if(lb)lb.textContent=backupStatusText();
      };
      var fb=function(){var ok=false;try{ok=document.execCommand('copy');}catch(err){}if(ok)done();else toast('Text select हो गया, अब खुद copy करो');};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done,fb);else fb();
      break;
    case 'restore-backup':
      try{
        var rd=JSON.parse($('#b-text').value.trim());
        if(!rd||!Array.isArray(rd.orders)||!Array.isArray(rd.customers)||!Array.isArray(rd.items))throw new Error('bad');
        ui.pendingRestore=rd;
        openSheet('<div class="sh-head"><h2>Restore करें?</h2></div>'+
          '<p class="hint">इस backup में <b>'+rd.customers.length+' ग्राहक</b> और <b>'+rd.orders.length+' ऑर्डर</b> हैं।</p>'+
          '<p class="hint">अभी ऐप में '+state.customers.length+' ग्राहक और '+state.orders.length+' ऑर्डर हैं — ये सब backup वाले data से बदल जाएंगे।</p>'+
          ((rd.khata&&Array.isArray(rd.khata.parties))?'<p class="hint">📒 उधारी खाता: backup में '+rd.khata.parties.length+' खाते — अभी वाले '+KH().parties.length+' खातों की जगह ये आ जाएंगे।</p>':'<p class="hint">📒 इस backup में उधारी खाता नहीं है — अभी वाला उधारी खाता ('+KH().parties.length+' खाते) वैसा ही रहेगा।</p>')+
          '<div class="sh-actions"><button class="btn" data-act="close">नहीं</button><button class="btn warn" data-act="confirm-restore">हां, Restore करो</button></div>');
      }catch(err){$('#b-err').textContent='यह backup text सही नहीं लग रहा।';}
      break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(ui.orderDraft&&syncDraftField(t))return;
  if(ui.kDraft&&syncKField(t))return;
  if(t.id==='ke-search'&&ui.kDraft){ui.kDraft.search=t.value;renderKEntrySheet();var f5=$('#ke-search');if(f5&&document.activeElement!==f5){f5.focus();f5.setSelectionRange(f5.value.length,f5.value.length);}return;}
  if(t.id==='lp-search'){ui.lpSearch=t.value;renderLoyal();return;}
  if(ui.lDraft){
    var lmap={'lp-sw':'sw','lp-pk':'pk','lp-ot':'ot','lp-n-name':'nName','lp-n-phone':'nPhone'};
    if(lmap[t.id]){ui.lDraft[lmap[t.id]]=t.value;if(t.id==='lp-sw'||t.id==='lp-pk'||t.id==='lp-ot'){ui.lDraft.bigOk=false;lpRefreshCalc();}return;}
    if(t.id==='lp-q'){ui.lDraft.q=t.value;renderLSheet();return;}
    if(t.id==='lp-otp-in'){lpOtpInput(t);return;}
  }
  if(t.id==='k-search'){ui.kSearch=t.value;renderKhata();var f6=$('#k-search');if(f6&&document.activeElement!==f6){f6.focus();f6.setSelectionRange(f6.value.length,f6.value.length);}return;}
  if(t.id==='ordersSearch'){ui.ordersSearch=t.value;renderOrders();var f4=$('#ordersSearch');if(f4&&document.activeElement!==f4){f4.focus();f4.setSelectionRange(f4.value.length,f4.value.length);}return;}
  if(t.id==='search'){ui.search=t.value;renderHome();var f=$('#search');if(f&&document.activeElement!==f){f.focus();f.setSelectionRange(f.value.length,f.value.length);}return;}
  if(t.id==='itemSearch'){ui.itemsSearch=t.value;renderItems();var f2=$('#itemSearch');if(f2&&document.activeElement!==f2){f2.focus();f2.setSelectionRange(f2.value.length,f2.value.length);}return;}
  if(t.id==='of-custsearch'){ui.orderDraft.custSearch=t.value;renderOrderSheet();var f3=$('#of-custsearch');if(f3&&document.activeElement!==f3){f3.focus();f3.setSelectionRange(f3.value.length,f3.value.length);}return;}
  if(t.getAttribute&&t.getAttribute('data-act')==='of-qty'){
    var l1=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
    if(l1){l1.qty=t.value;updateOrderTotalDisplay();
      var row=t.closest('.lrow');if(row){var la=row.querySelector('.lamt');if(la)la.textContent=rupee(num(l1.qty)*num(l1.rate));}
    }
    return;
  }
  if(t.getAttribute&&t.getAttribute('data-act')==='of-rate'){
    var l2=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
    if(l2){l2.rate=t.value;updateOrderTotalDisplay();
      var row2=t.closest('.lrow');if(row2){var la2=row2.querySelector('.lamt');if(la2)la2.textContent=rupee(num(l2.qty)*num(l2.rate));}
    }
    return;
  }
  if(t.getAttribute&&t.getAttribute('data-act')==='of-linedate'){
    var l3=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
    if(l3){l3.date=t.value||'';}
    return;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(ui.kDraft&&syncKField(t))return;
  if(ui.orderDraft){
    if(syncDraftField(t))return;
    if(t.getAttribute&&t.getAttribute('data-act')==='of-linedate'){
      var lc=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
      if(lc)lc.date=t.value||'';
      return;
    }
  }
  if(t.id==='i-cat'){var mw=$('#i-milkwrap');if(mw)mw.classList.toggle('hide',t.value!=='mithai');return;}
  if(t.id==='b-file'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){var ta2=$('#b-text');if(ta2){ta2.value=String(fr.result||'');toast('फ़ाइल लोड हो गई — अब "Restore karo" दबाओ');}};
    fr.onerror=function(){toast('फ़ाइल नहीं पढ़ पाए');};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#ov'))softClose();
});

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  window.deferredInstallPrompt=e;
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

load();
/* आधी रात के बाद या ऐप दोबारा खोलने पर "आज/कल" अपने-आप सही हो */
var shownDay=todayStr();
function dayCheck(){if(todayStr()!==shownDay){shownDay=todayStr();if(!$('#ov'))renderRoute();}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')dayCheck();});
setInterval(dayCheck,60000);
window.addEventListener('storage',function(e){
  if(e.key!==KEY||e.newValue==null)return;
  // ऐप दूसरी जगह (Chrome टैब / इंस्टॉल ऐप) भी खुला है और वहाँ कुछ सेव हुआ — यहाँ भी वही ले लो, ताकि यहाँ से पुराना डेटा उसके ऊपर न लिखा जाए
  load();
  try{renderShell();renderRoute();}catch(x){}
  toast('दूसरी जगह खुले ऐप का बदलाव यहाँ भी आ गया ✓');
});
/* इंस्टाग्राम/WhatsApp वाले ब्राउज़र से कोई ग्राहक गलती से बिलिंग ऐप पर आ गया (और इस फ़ोन में दुकान का कोई डेटा नहीं) → सीधे ऑर्डर मेन्यू */
(function(){
  var ua=navigator.userAgent||'';
  var inApp=/FBAN|FBAV|Instagram|WhatsApp|; wv\)/i.test(ua);
  var empty=!state.customers.length&&!state.orders.length&&!(state.khata&&state.khata.parties&&state.khata.parties.length)&&!(state.loyal&&state.loyal.m&&state.loyal.m.length)&&!onlineCfg();
  if(inApp&&empty&&!/[?&]billing\b/.test(location.search)&&!/^#(o=|online)/.test(location.hash)){
    try{location.replace('order/');}catch(e){location.href='order/';}
  }
})();
var catUpdated=applyCatalog();
var udMoved=migrateUdharOrders();
renderShell();
renderRoute();
checkDueReminders();
requestPersist();
if(catUpdated)toast('दुकान की आइटम लिस्ट/दाम अपडेट हो गए ✓');
if(udMoved)toast('उधार अब अलग "📒 उधारी" टैब में है ✓');
startOnline();
if(ui.lpTokNew){ui.lpTokNew=false;save();}
lpSyncSoon(3000);
window.addEventListener('online',function(){lpSyncSoon(2000);});
checkWebImport();
window.addEventListener('hashchange',checkWebImport);
})();
</script>
