<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maa Bhagwati Misthan Bhandar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C1620">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MB Sweets">
<style>
@font-face{font-family:'Mukta';src:url('fonts/Mukta-400.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:'Mukta';src:url('fonts/Mukta-600.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:'Mukta';src:url('fonts/Mukta-700.woff') format('woff');font-weight:700 800;font-display:swap}
@font-face{font-family:'Baloo 2';src:url('fonts/Baloo2-700.woff') format('woff');font-weight:600 800;font-display:swap}
:root{
  --paper:#FAF3E7; --card:#FFFFFF; --ink:#2B1712; --muted:#8A7566; --line:#E6D9C6;
  --brandband:#5C1620; --on-brand:#FBEEDD; --brand-ink:#5C1620; --warn-bg:#A6332E;
  --gold:#9C6B00; --green:#2F6F4E; --amber:#A9720A; --red:#A6332E; --red-bg:#F6E1DD;
  --milk:#1F5F8F; --milk-bg:#EEF6FC; --milk-line:#CFE3F2;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1210; --card:#251813; --ink:#F3E9DD; --muted:#B39C89; --line:#3B2A22;
    --gold:#E0B23D; --green:#5CD39A; --amber:#F2B84B; --red:#FF8A8A; --red-bg:#3B1C1C;
    --milk:#8CC8F0; --milk-bg:#16222B; --milk-line:#2A4254;
    --brand-ink:#E9A9B0; --warn-bg:#B3261E;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1210; --card:#251813; --ink:#F3E9DD; --muted:#B39C89; --line:#3B2A22;
  --gold:#E0B23D; --green:#5CD39A; --amber:#F2B84B; --red:#FF8A8A; --red-bg:#3B1C1C;
    --milk:#8CC8F0; --milk-bg:#16222B; --milk-line:#2A4254;
  --brand-ink:#E9A9B0; --warn-bg:#B3261E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brandband);outline-offset:2px}
h1,h2,h3{font-family:'Baloo 2','Mukta',system-ui,sans-serif;margin:0}

.letterhead{background:var(--brandband);color:var(--on-brand);padding:16px 16px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.letterhead h1{font-size:1.4rem;line-height:1.2}
.letterhead p{margin:2px 0 0;font-size:.82rem;opacity:.88}
.lh-row{display:flex;align-items:center;gap:12px}
.lh-logo{width:54px;height:54px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.lh-text{min-width:0}

.app{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}

.band{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.band>div{padding:12px 6px;text-align:center;border-left:1px solid var(--line)}
.band>div:first-child{border-left:0}
.band b{display:block;font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.band>div{min-width:0}
.band span{display:block;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:2px}
.band .tom b{color:var(--gold)}
.band .due b{color:var(--red)}

.banner{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}
.banner.btn-banner{display:block;width:100%;text-align:left;border:0;font-family:inherit;font-weight:600}

.duecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.duemain{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:0;min-height:auto}
.duemain .nm{font-weight:700}
.duemain .sub{color:var(--red);font-size:.8rem;margin-top:2px}
.dueacts{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.dueacts .dueamt{font-weight:700;color:var(--red);font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.05rem}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff!important}
  #printArea{display:block!important;position:static;width:100%;padding:16px;color:#000;background:#fff}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:6px}
}

.sumcard{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sumhead{font-weight:700;color:var(--gold);margin-bottom:6px;font-size:.95rem}
.sumrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.sumrow:first-of-type{border-top:0}
.sumnm{font-weight:700;flex:1;min-width:110px;overflow-wrap:anywhere}
.sumqty{font-weight:700;color:var(--brand-ink);white-space:nowrap}
.sumdetail{width:100%;color:var(--muted);font-size:.78rem}
.hide{display:none!important}
.milkcard{border-color:var(--milk);background:linear-gradient(180deg,var(--milk-bg),var(--card) 60px)}
.milkcard .sumhead{color:var(--milk)}
.mkhead{font-weight:700;margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.mkl{background:var(--milk);color:var(--card);border-radius:999px;padding:1px 9px;font-size:.85rem;white-space:nowrap}
.mkrow{padding:3px 0 3px 10px;border-left:3px solid var(--milk-line);margin:1px 0;font-size:.92rem}
.mkrow.mksum{font-weight:700;color:var(--milk);border-left-color:var(--milk)}
.mknote{color:var(--muted);font-size:.8rem;margin-top:6px}
.mktag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;white-space:nowrap}
.mktotal{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:700;color:var(--milk);font-size:1.02rem}
.mktotal span{font-weight:400;color:var(--muted);font-size:.8rem}

.sechead{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.sechead h2{font-size:1.05rem}
.sechead .cnt{color:var(--muted);font-size:.85rem}

.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini.tomorrow{border-color:var(--gold);border-width:1.5px}
.mini .l{min-width:0}
.mini .nm,.mini .sub,.crow .nm,.crow .ph{display:block}
.crow .l{min-width:0}
#b-text{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.mini .nm{font-weight:700;overflow-wrap:anywhere}
.mini .sub{color:var(--muted);font-size:.82rem;margin-top:1px}
.mini .r{text-align:right;flex:0 0 auto}
.mini .r b{display:block;color:var(--red);font-size:.95rem}
.mini .r span{display:block;color:var(--muted);font-size:.75rem}

#search,#itemSearch,#ordersSearch,#k-search{width:100%;color:var(--ink);padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-top:2px}
#ordersSearch{margin:2px 0 10px}

.addrow{display:flex;justify-content:flex-end;margin:10px 0 6px}
.lnk{background:none;border:0;color:var(--brand-ink);font-weight:700;min-height:40px;padding:0 4px;border-radius:8px}

.lnk.danger{color:var(--red)}
.lnk.muted{color:var(--muted);font-weight:500}

.crow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.crow .nm{font-weight:700}
.crow .ph{color:var(--muted);font-size:.82rem;margin-top:1px}
.crow .due{color:var(--red);font-weight:700;font-size:.92rem;white-space:nowrap}
.crow .clear{color:var(--green);font-size:.82rem;white-space:nowrap}

.empty{text-align:center;color:var(--muted);padding:32px 12px}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* customer profile */
.backbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0;min-height:40px}
.cphead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:4px}
.cphead h2{font-size:1.35rem}
.cphead .ph a{color:var(--brand-ink);text-decoration:none;font-weight:600}
.cphead .addr{color:var(--muted);font-size:.88rem;margin-top:2px}
.cpacts{display:flex;gap:8px;margin-top:6px}

.actbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;color:var(--ink)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.btn.warn{background:var(--warn-bg);border-color:var(--warn-bg);color:#fff}
.btn.small{min-height:40px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.45}

.grouphead{margin:18px 0 8px;font-size:1rem;color:var(--muted);font-weight:700}

.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.order.cancelled{opacity:.58}
.otop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.otop .obadge{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-weight:700;font-size:.85rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 8px;flex:0 0 auto}
.odate{font-weight:700;margin-top:2px}
.stamp{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-weight:700;font-size:.9rem;padding:1px 10px;border:2px solid currentColor;border-radius:6px;transform:rotate(-3deg);white-space:nowrap;flex:0 0 auto}
.st-pending{color:var(--amber)} .st-partial{color:var(--gold)} .st-delivered{color:var(--green)} .st-cancelled{color:var(--muted);text-decoration:line-through}

.checklist{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line)}
.checklist li{display:flex;align-items:center;gap:10px;padding:5px 0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.citem{flex:1;overflow-wrap:anywhere}
.camt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.checklist li.ro{opacity:.7}
.checklist li button{background:none;border:0;text-align:left;display:flex;align-items:center;gap:10px;width:100%;padding:0;min-height:32px}

.paylog{margin-top:8px;font-size:.85rem;color:var(--muted)}
.paylog div{padding:1px 0}

.money{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:baseline;flex-wrap:wrap}
.money div{display:flex;flex-direction:column}
.money span{font-size:.76rem;color:var(--muted)}
.money b{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.05rem}
.money .due b{color:var(--red)}
.money .paidall{margin-left:auto;color:var(--green);font-weight:700;font-size:.9rem}

.oacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:9px 4px 8px;color:var(--muted);font-size:.74rem;font-weight:600}
.navbtn .ic{font-size:1.25rem;line-height:1}
.navbtn.on{color:var(--brand-ink)}

.fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 14px);z-index:6;background:var(--brandband);color:var(--on-brand);border:0;border-radius:999px;padding:0 20px;min-height:50px;font-weight:700;font-size:.98rem;box-shadow:0 6px 16px rgba(60,10,15,.35)}

.overlay{position:fixed;inset:0;z-index:10;background:rgba(20,10,8,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:calc(100% - 20px);overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out;overscroll-behavior:contain}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.sh-head h2{font-size:1.2rem}
.sh-actions{display:flex;gap:10px;margin-top:14px}
.sh-actions .btn{flex:1}
.fl{display:block;margin-top:12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
.err{color:var(--red);font-size:.88rem;margin-top:10px;min-height:1px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0}

/* order-form specific */
.custchip{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.custchip b{overflow-wrap:anywhere}
.custchip span{color:var(--muted);font-size:.82rem;display:block}
.suglist{margin-top:6px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.sugrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;min-height:40px}
.sugrow:last-child{border-bottom:0}
.sugrow small{display:block;color:var(--muted)}
.sugrow.newc{color:var(--brand-ink);font-weight:700}

.cattabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.cattab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 13px;min-height:36px;font-weight:600;font-size:.88rem}
.cattab.on{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 11px;font-size:.88rem;min-height:38px}
.chip small{display:block;color:var(--muted);font-size:.74rem}
.chip.empty{color:var(--muted);font-style:normal}

.lines{margin-top:10px}
.lrow{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.lrow .ltop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lrow .lname{font-weight:700;overflow-wrap:anywhere}
.lrow .lx{background:none;border:0;color:var(--red);font-size:1.25rem;line-height:1;min-height:32px;padding:0 4px}
.lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.lgrid label{display:block;font-size:.72rem;color:var(--muted)}
.lgrid input{width:100%;margin-top:2px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:16px}
.lamt{font-size:.78rem;color:var(--muted);margin-top:4px;text-align:right}
.ldaterow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.ldaterow label{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.ldaterow input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px;color:var(--ink)}
.ldaterow .lnk{font-size:.78rem;padding:0;min-height:auto}
.navbtn{position:relative}
.navbtn .bd{position:absolute;top:4px;left:50%;margin-left:8px;min-width:18px;height:18px;border-radius:9px;background:#D93025;color:#fff;font-size:.68rem;line-height:18px;padding:0 5px;font-weight:700}
.banner.online{background:var(--brandband);color:var(--on-brand)}
.oncard .when{font-size:1.05rem;font-weight:700;color:var(--brand-ink)}
:root[data-theme="dark"] .oncard .when{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .oncard .when{color:var(--gold)}}
.oncard.st-new{border:2px solid var(--gold)}
.onitems{list-style:none;padding:0;margin:8px 0}
.onitems li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.onitems li b{white-space:nowrap}
.onitems li.ask{color:var(--amber)}
.oncust{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;line-height:1.5}
.oncust a{font-weight:700}
.onmeta{color:var(--muted);font-size:.84rem}
.st-new{color:var(--red)} .st-accepted{color:var(--gold)} .st-out{color:var(--amber)} .st-rejected{color:var(--muted);text-decoration:line-through}
.onsum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.onsum>div{padding:10px 6px;text-align:center;border-left:1px solid var(--line)}
.onsum>div:first-child{border-left:0}
.onsum b{display:block;font-size:1.15rem}
.onsum span{display:block;color:var(--muted);font-size:.72rem}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips2 button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;color:var(--ink)}
.chips2 button.on{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.webwarn{background:var(--red-bg);color:var(--ink);border:1px solid var(--red);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:.9rem}
.webbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.5}
.weblist{list-style:none;padding:0;margin:8px 0}
.weblist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.weblist li b{white-space:nowrap}
.dtag{background:var(--paper);border:1px solid var(--gold);border-radius:6px;padding:0 6px;font-size:.7rem;color:var(--gold);margin-left:6px;white-space:nowrap;display:inline-block}
.dtag.dgiven{color:var(--green);border-color:var(--green)}
.mini.overdue{border-color:var(--red);border-width:1.5px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.payrow .lnk{min-height:30px;font-size:.8rem;padding:0 4px}
.homeinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.homeinfo .coll{font-size:.9rem;color:var(--muted)}
.homeinfo .coll b{color:var(--green)}
.quickrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.quickrow .btn{width:100%}
.banner.remind{background:var(--brandband);color:var(--on-brand)}
.crow.kparty{width:100%;text-align:left;border:1px solid var(--line)}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px 4px;margin:0 0 6px}
.lgr{display:flex;width:100%;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border:0;border-bottom:1px dashed var(--line);background:none;color:var(--ink);text-align:left;font:inherit;min-height:auto}

<script src="catalog.js"></script>
<script>
(function(){
'use strict';
var KEY='mbmb-billing-v1';

var CATS=[['mithai','मिठाई'],['dairy','डेयरी (दूध-दही-पनीर)'],['namkeen','नमकीन'],['cold','कोल्ड ड्रिंक्स'],['cake','केक'],['packaged','पैकेज्ड फूड / बिस्किट / मिक्सचर']];
var UNIT_OPTS=['किलो','पीस','लीटर','पैकेट','पैक','प्लेट','ग्राम','डिब्बा'];
var STAMP={pending:'पेंडिंग',partial:'आंशिक',delivered:'डिलीवर',cancelled:'कैंसल'};

var DEFAULT_SHOP={name:'Maa Bhagwati Misthan Bhandar',addr:'Nanaura, Darbhanga, Bihar - 846005',phone:'8002010218',owner:'Pankaj Gupta',terms:'सामान ले जाने से पहले पूरा पेमेंट करना होगा।'};
var DEFAULT_ITEMS=[
 ['i1','रसगुल्ला (किलो)','mithai','किलो',300],
 ['i2','रसगुल्ला (पीस)','mithai','पीस',15],
 ['i3','बालूशाही (किलो)','mithai','किलो',300],
 ['i4','बालूशाही (पीस)','mithai','पीस',12],
 ['i5','गुलाब जामुन (किलो)','mithai','किलो',350],
 ['i6','गुलाब जामुन (पीस)','mithai','पीस',15],
 ['i7','चमचम (किलो)','mithai','किलो',320],
 ['i8','चमचम (पीस)','mithai','पीस',15],
 ['i9','पेड़ा','mithai','किलो',500],
 ['i10','मिल्क केक','mithai','किलो',300],
 ['i11','लड्डू','mithai','किलो',180],
 ['i12','जलेबी','mithai','किलो',140],
 ['i13','बूंदी','mithai','किलो',140],
 ['i14','दूध (फुल क्रीम)','dairy','लीटर',65],
 ['i15','दूध (टी.एम. हाफ क्रीम)','dairy','लीटर',60],
 ['i16','पनीर पैकेट (200 ग्राम)','dairy','पैकेट',95],
 ['i17','खुला पनीर','dairy','किलो',320],
 ['i18','दही (2 किलो पैक)','dairy','पैक',250],
 ['i19','दही (5 किलो पैक)','dairy','पैक',550],
 ['i20','दही (15 किलो पैक)','dairy','पैक',1500],
 ['i21','नमकीन','namkeen','किलो',200]
].map(function(r){return {id:r[0],name:r[1],cat:r[2],unit:r[3],price:r[4]};});
var CATALOG=(window.MB_CATALOG&&Array.isArray(window.MB_CATALOG.items))?window.MB_CATALOG:null;
if(CATALOG)DEFAULT_ITEMS=CATALOG.items.map(function(r){return {id:r[0],name:r[1],cat:r[2],unit:r[3],price:r[4]};});
var WEB_SLOTS=[[8,11,'सुबह 8–11'],[11,14,'दोपहर 11–2'],[14,17,'दोपहर 2–5'],[17,20,'शाम 5–8']];

var state={shop:Object.assign({},DEFAULT_SHOP),items:[],customers:[],orders:[],nextOrderNo:1,catalogApplied:0,khata:{parties:[],entries:[]}};
var ui={view:'home',customerId:null,search:'',storageOk:true,editId:null,orderDraft:null,itemsSearch:'',confirm:null,ordersFilter:'all',cameFrom:'home',ordersSearch:'',pendingRestore:null,webImport:null};

/* ---------- storage ---------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      state.shop=Object.assign({},DEFAULT_SHOP,d.shop||{});
      var objs=function(a){return Array.isArray(a)?a.filter(function(x){return x&&typeof x==='object';}):[];};
      state.items=Array.isArray(d.items)?objs(d.items):DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
      state.customers=objs(d.customers);
      state.orders=objs(d.orders);
      state.catalogApplied=num(d.catalogApplied)||0;
      state.khata=(d.khata&&typeof d.khata==='object')?d.khata:{parties:[],entries:[]};
      if(Array.isArray(state.khata.parties))state.khata.parties=objs(state.khata.parties);
      if(Array.isArray(state.khata.entries))state.khata.entries=objs(state.khata.entries);
      state.loyal=(d.loyal&&typeof d.loyal==='object')?d.loyal:{m:[],b:[]};
      state.loyal.m=objs(state.loyal.m);state.loyal.b=objs(state.loyal.b);
      normalizeState();
      var mx=0;state.orders.forEach(function(o){if(o.no>mx)mx=o.no;});
      state.nextOrderNo=Math.max(d.nextOrderNo||1,mx+1);
    }else{
      state.items=DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
      state.catalogApplied=CATALOG?CATALOG.version:0;
      save();
    }
  }catch(e){
    ui.loadFailed=true;
    /* पुराना डेटा पढ़ा नहीं गया — उसकी एक कॉपी अलग key पर (हर बार नई नहीं, एक ही) */
    try{
      var rawBad=localStorage.getItem(KEY),have=false;
      if(rawBad){
        for(var ki=0;ki<localStorage.length;ki++){var kk=localStorage.key(ki);if(kk&&kk.indexOf(KEY+'-corrupt-')===0&&localStorage.getItem(kk)===rawBad){have=true;break;}}
        if(!have)localStorage.setItem(KEY+'-corrupt-'+Date.now(),rawBad);
      }
    }catch(e2){}
    state.items=DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
    state.catalogApplied=CATALOG?CATALOG.version:0;
  }
}
function save(){
  ORD_IDX=null;LP_BIDX=null;
  planSyncSoon();
  if(typeof lpSyncSoon==='function')lpSyncSoon();
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){ui.storageOk=false;try{renderBanner();}catch(e2){}}
}
function normalizeState(){
  state.orders.forEach(function(o){
    if(!Array.isArray(o.items))o.items=[];
    if(!Array.isArray(o.payments))o.payments=[];
    o.items=o.items.filter(function(x){return x&&typeof x==='object';});
    o.payments=o.payments.filter(function(x){return x&&typeof x==='object';});
    o.payments.forEach(function(p){if(!p.id)p.id=uid();});
    o.items.forEach(function(it){if(!it.lid)it.lid=uid();});
  });
  KH();LY();LP_BIDX=null;
  LY().m.forEach(function(m){if(!m.tk){m.tk=lpTok();ui.lpTokNew=true;}});
}

/* दुकान की साझा लिस्ट (catalog.js) से नए दाम/आइटम — सिर्फ वही जो पिछली बार के बाद बदले */
function applyCatalog(){
  if(!CATALOG)return 0;
  var applied=num(state.catalogApplied)||1;
  if(CATALOG.version<=applied){state.catalogApplied=applied;return 0;}
  var n=0;
  CATALOG.items.forEach(function(r){
    if(num(r[5])<=applied)return;
    var it=findItem(r[0]);
    if(it){it.name=r[1];it.cat=r[2];it.unit=r[3];it.price=r[4];}
    else state.items.push({id:r[0],name:r[1],cat:r[2],unit:r[3],price:r[4]});
    n++;
  });
  state.catalogApplied=CATALOG.version;
  save();
  return n;
}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function rupee(n){n=num(n);return (n<0?'-':'')+'\u20B9'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayKey(v){var x=new Date(v);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fmtDT(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function fmtDonly(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDshort(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtQty(n){return String(Math.round(num(n)*1000)/1000);}
function round2(n){return Math.round(num(n)*100)/100;}
function keyToDate(k){var a=String(k).split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function dayDiff(fromKey,toKey){return Math.round((keyToDate(toKey)-keyToDate(fromKey))/86400000);}
function findCustomerByPhone(phone,exceptId){
  var p=phoneNorm(phone);if(!p)return null;
  for(var i=0;i<state.customers.length;i++){var c=state.customers[i];if(c.id!==exceptId&&phoneNorm(c.phone)===p)return c;}
  return null;
}
function phoneValid(ph){return /^91[6-9]\d{9}$/.test(phoneNorm(ph));}
function phoneProblem(ph,exceptId){
  if(!ph)return '';
  if(ph.replace(/\D/g,'').length<10)return 'मोबाइल नंबर पूरा 10 अंकों का लिखो।';
  if(!phoneValid(ph))return 'यह मोबाइल नंबर सही नहीं लगता — 10 अंक, 6/7/8/9 से शुरू।';
  var dup=findCustomerByPhone(ph,exceptId);
  if(dup)return 'यह नंबर पहले से "'+dup.name+'" के नाम से सेव है।';
  return '';
}
function catLabel(c){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===c)return CATS[i][1];return c;}
function phoneNorm(p){
  p=String(p||'').replace(/\D/g,'');
  if(!p)return '';
  if(p.length===11&&p.charAt(0)==='0')p=p.slice(1);
  if(p.length===10)p='91'+p;
  return p;
}
var toastTimer;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}
function findCustomer(id){for(var i=0;i<state.customers.length;i++)if(state.customers[i].id===id)return state.customers[i];return null;}
function findOrder(id){for(var i=0;i<state.orders.length;i++)if(state.orders[i].id===id)return state.orders[i];return null;}
function findItem(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}
/* ग्राहक → उसके ऑर्डर: एक बार में सबका हिसाब (बहुत डेटा होने पर भी होम जल्दी खुले)।
   ये सूची सिर्फ़ उसी पल के लिए है — save() या अगली घड़ी में अपने-आप फिर से बनती है। */
var ORD_IDX=null;
function customerOrders(cid){
  if(!ORD_IDX||ORD_IDX.ref!==state.orders||ORD_IDX.n!==state.orders.length){
    var m={};state.orders.forEach(function(o){(m[o.customerId]||(m[o.customerId]=[])).push(o);});
    ORD_IDX={ref:state.orders,n:state.orders.length,m:m};
    setTimeout(function(){ORD_IDX=null;},0);
  }
  return (ORD_IDX.m[cid]||[]).slice();
}
function lineAmt(i){return round2(num(i.qty)*num(i.rate));}
function orderTotal(o){return round2(o.items.reduce(function(s,i){return s+lineAmt(i);},0));}
function orderPaid(o){return o.payments.reduce(function(s,p){return s+num(p.amount);},0);}
function orderDue(o){return round2(Math.max(0,orderTotal(o)-orderPaid(o)));}
function orderStatus(o){
  if(o.cancelled)return 'cancelled';
  var total=o.items.length,done=o.items.filter(function(i){return i.delivered;}).length;
  if(total===0||done===0)return 'pending';
  if(done<total)return 'partial';
  return 'delivered';
}
function displayName(it){
  var n=String((it&&it.name)||''),u=String((it&&it.unit)||'').trim();
  var i=n.lastIndexOf('(');
  if(u&&i>0&&n.charAt(n.length-1)===')'){
    var inner=n.slice(i+1,-1).trim();
    if(inner===u)return n.slice(0,i).trim();
  }
  return n;
}
function itemDateKey(o,it){return it.date||dayKey(o.date);}
function namesList(items,max){
  var names=items.map(function(it){return displayName(it)+' ×'+fmtQty(it.qty);});
  if(names.length>max)return names.slice(0,max).join(', ')+' +'+(names.length-max)+' और';
  return names.join(', ');
}
function customerTotals(cid){
  var t=0,p=0,cnt=0;
  customerOrders(cid).forEach(function(o){if(!o.cancelled){t+=orderTotal(o);p+=orderPaid(o);cnt++;}});
  return {billed:t,paid:p,due:round2(Math.max(0,t-p)),extra:round2(Math.max(0,p-t)),count:cnt};
}
function allDue(){var t=0;state.customers.forEach(function(c){t+=customerTotals(c.id).due;});return t;}
function customerOldestDueDate(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled&&orderDue(o)>0;});
  if(!os.length)return null;
  var min=os[0].date;
  os.forEach(function(o){if(new Date(o.date)<new Date(min))min=o.date;});
  return min;
}
function renderDues(){
  var rows=state.customers.map(function(c){
    var t=customerTotals(c.id);
    if(t.due<=0)return null;
    var oldest=customerOldestDueDate(c.id);
    var days=oldest?dayDiff(dayKey(oldest),todayStr()):0;
    return {c:c,due:t.due,days:days};
  }).filter(function(x){return x;}).sort(function(a,b){return b.days-a.days;});

  var html='<button class="backbtn" data-act="nav" data-v="home">\u2190 होम</button>'+
    '<div class="sechead"><h2>सबसे पुराना बाकी</h2><span class="cnt">'+rows.length+' ग्राहक</span></div>'+
    (rows.length?'<p class="hint">कुल बाकी: <b style="color:var(--red)">'+rupee(allDue())+'</b> — सबसे पुराना सबसे ऊपर है।</p>':'');
  if(!rows.length){
    html+='<div class="empty"><b>सब कुछ क्लियर है!</b>किसी भी ग्राहक का बाकी नहीं है।</div>';
  }else{
    html+=rows.map(function(r){
      var subTxt=r.days>0?(r.days+' दिन से बाकी'):(r.days===0?'आज की डिलीवरी का बाकी':('आने वाला ऑर्डर — डिलीवरी '+(-r.days)+' दिन बाद'));
      return '<div class="duecard">'+
        '<button class="duemain" data-act="open-customer" data-id="'+r.c.id+'">'+
          '<span class="nm">'+esc(r.c.name)+'</span>'+
          '<span class="sub">'+subTxt+'</span>'+
        '</button>'+
        '<div class="dueacts">'+
          '<span class="dueamt">'+rupee(r.due)+'</span>'+
          '<button class="btn small" data-act="customer-payment" data-id="'+r.c.id+'">पेमेंट लो</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  $('#main').innerHTML=html;
}

function storageUsedPct(){
  // इस फ़ोन में इस साइट की पूरी जगह (बिलिंग + पुरानी कॉपियाँ + मेन्यू) — Chrome लगभग 50 लाख अक्षर देता है
  try{var n=0;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i)||'';n+=k.length+(localStorage.getItem(k)||'').length;}return Math.round(n/5000000*1000)/10;}catch(e){return 0;}
}
function corruptKeys(){var a=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i)||'';if(k.indexOf(KEY+'-corrupt-')===0)a.push(k);}}catch(e){}return a.sort();}
function requestPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persisted().then(function(p){
        if(p){ui.persisted=true;return;}
        return navigator.storage.persist().then(function(g){ui.persisted=!!g;});
      }).catch(function(){});
    }
  }catch(e){}
}

}

function dueGroups(live,dateKey){
  var out=[];
  live.forEach(function(o){
    var due=o.items.filter(function(it){return !it.delivered&&itemDateKey(o,it)===dateKey;});
    if(due.length)out.push({order:o,items:due});
  });
  out.sort(function(a,b){return new Date(a.order.date)-new Date(b.order.date);});
  return out;
}
function dayItemSummary(live,dateKey){
  var map={};
  live.forEach(function(o){
    o.items.forEach(function(it){
      if(it.delivered)return;
      if(itemDateKey(o,it)!==dateKey)return;
      var k=it.name+'|'+it.unit;
      if(!map[k])map[k]={name:displayName(it),unit:it.unit,qty:0,custs:{}};
      map[k].qty+=num(it.qty);
      var c=findCustomer(o.customerId);
      var cname=c?c.name:'?';
      map[k].custs[cname]=(map[k].custs[cname]||0)+num(it.qty);
    });
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  arr.sort(function(a,b){return b.qty-a.qty;});
  return arr;
}
function daySummaryBlock(live,dateKey,label){
  var items=dayItemSummary(live,dateKey);
  if(!items.length)return '';
  var rows=items.map(function(it){
    var custNames=Object.keys(it.custs);
    var detail=custNames.map(function(cn){return cn+' ×'+fmtQty(it.custs[cn]);}).join(', ');
    return '<div class="sumrow"><span class="sumnm">'+esc(displayName(it))+'</span><span class="sumqty">'+fmtQty(it.qty)+' '+esc(it.unit)+'</span>'+
      '<span class="sumdetail">'+esc(detail)+'</span></div>';
  }).join('');
  return '<div class="sumcard"><div class="sumhead">'+esc(label)+' \u2013 कुल सामान तैयार करो</div>'+rows+'</div>';
}
/* ---------- 🥛 दूध-दही ऑर्डर का हिसाब ----------
   मिठाई: डिलीवरी से 2 दिन पहले 3 बजे तक दूध ऑर्डर (25 की मिठाई → 24 को बनेगी → 23 को ऑर्डर)
   दही / बिकने वाला दूध / पनीर: डिलीवरी से 1 दिन पहले 3 बजे तक
   1 यूनिट मिठाई में कितना दूध — catalog.js का milk, या आइटम खोलकर बदला हुआ (item.milk) */
var CAT_MILK=(CATALOG&&CATALOG.milk)||{};
var HI_MONTHS=['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
var HI_DAYS=['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
function hiDate(k){var d=keyToDate(k);return d.getDate()+' '+HI_MONTHS[d.getMonth()]+' ('+HI_DAYS[d.getDay()]+')';}
function addDaysKey(n){var d=new Date();d.setDate(d.getDate()+n);return dayKey(d);}
function r1(n){return Math.round(num(n)*10)/10;}
function hasOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
function itemByName(name){for(var i=0;i<state.items.length;i++)if(state.items[i].name===name)return state.items[i];return null;}
function catalogRowByName(name){if(!CATALOG)return null;for(var i=0;i<CATALOG.items.length;i++)if(CATALOG.items[i][1]===name)return CATALOG.items[i];return null;}
/* लीटर प्रति यूनिट; null = सिर्फ गिनती (दूध हिसाब में नहीं जुड़ता) */
function itemMilk(si){
  if(!si)return null;
  if(hasOwn(si,'milk'))return (si.milk===null||si.milk===undefined||si.milk==='')?null:num(si.milk);
  return hasOwn(CAT_MILK,si.id)?num(CAT_MILK[si.id]):null;
}
function lineMeta(g){
  var si=g.iid?findItem(g.iid):null;
  if(!si)si=itemByName(g.name);
  if(si)return {cat:si.cat,milk:itemMilk(si)};
  var r=null;
  if(g.iid&&CATALOG){for(var i=0;i<CATALOG.items.length;i++)if(CATALOG.items[i][0]===g.iid){r=CATALOG.items[i];break;}}
  if(!r)r=catalogRowByName(g.name);
  if(r)return {cat:r[2],milk:hasOwn(CAT_MILK,r[0])?num(CAT_MILK[r[0]]):null};
  /* नाम बदल गया (जैसे दही की कंपनी जुड़ी) — फिर भी दूध-दही के हिसाब से बाहर न जाए */
  if(/दही|dahi|curd|पनीर|paneer/i.test(g.name)||(/दूध|milk/i.test(g.name)&&isLitreUnit(g.unit)))return {cat:'dairy',milk:null};
  return {cat:'',milk:null};
}
function isKgUnit(u){return /^(किलो|kg)$/i.test(String(u||'').trim());}
function isLitreUnit(u){return /^(लीटर|litre|liter|ltr|l)$/i.test(String(u||'').trim());}
/* दही का एक पैक कितने किलो — नाम से पढ़ो: "दही (400 ग्राम)" → 0.4, "दही (2 किलो पैक)" → 2 */
function packKg(name,unit){
  if(isKgUnit(unit))return 1;
  var m=String(name||'').match(/(\d+(?:\.\d+)?)\s*(किलो|ग्राम|kg|gm|g)/i);
  if(!m)return null;
  var n=parseFloat(m[1]);
  return /^(किलो|kg)$/i.test(m[2])?n:n/1000;
}
/* उस दिन की बाकी (डिलीवर नहीं हुई) लाइनें, नाम+यूनिट से जोड़कर */
function dayLines(live,dateKey){
  var map={},keys=[];
  live.forEach(function(o){
    o.items.forEach(function(it){
      if(it.delivered||itemDateKey(o,it)!==dateKey)return;
      var k=it.name+'|'+it.unit;
      if(!map[k]){map[k]={name:it.name,unit:it.unit,qty:0,iid:it.iid||''};keys.push(k);}
      map[k].qty+=num(it.qty);
    });
  });
  return keys.map(function(k){return map[k];}).filter(function(g){return g.qty>0;});
}
/* पैकेट सामान, कोल्ड ड्रिंक, नमकीन वगैरह — मिठाई के दूध वाले हिसाब में नहीं गिनने */
var NOT_SWEET=/पैकेट सामान|MRP|cola|pepsi|sprite|thums|fanta|maaza|frooti|bisleri|kinley|पानी|water|chips|kurkure|biscuit|बिस्किट|नमकीन|namkeen|भुजिया|bhujia|cold ?drink|कोल्ड|चॉकलेट|chocolate|मोमबत्ती|candle|गुब्बारे|balloon/i;
/* मिठाई का दूध — {l: कुल लीटर, lines, none: बिना दूध वाली, unk: सिर्फ गिनती (जैसे रसमलाई — दूध नहीं जोड़ते)} */
function sweetsMilk(live,dateKey){
  var res={l:0,lines:[],none:[],unk:[]},rows=[];
  dayLines(live,dateKey).forEach(function(g){
    var m=lineMeta(g),nm=displayName(g),q=fmtQty(g.qty)+' '+g.unit;
    if(m.cat==='mithai'){
      if(m.milk===null)res.unk.push(nm+' '+q);
      else if(m.milk>0){var L=g.qty*m.milk;res.l+=L;rows.push({t:nm+' '+q+' → '+r1(L)+' L',L:L});}
      else res.none.push(nm+' '+q);
    }else if(!m.cat&&!/केक|cake/i.test(g.name)&&!NOT_SWEET.test(g.name)){
      res.unk.push(nm+' '+q);
    }
  });
  rows.sort(function(a,b){return b.L-a.L;});
  res.lines=rows.map(function(x){return x.t;});
  res.l=r1(res.l);
  return (res.lines.length||res.unk.length||res.none.length)?res:null;
}
/* दही / बिकने वाला दूध / पनीर — {l: दूध लीटर, kg: कुल दही, lines} */
function dairyDay(live,dateKey){
  var dahi=[],milk=[],other=[],kg=0,l=0,dahiUnknown=false;
  dayLines(live,dateKey).forEach(function(g){
    var m=lineMeta(g);
    if(m.cat!=='dairy')return;
    var nm=displayName(g);
    if(/दही|dahi|curd/i.test(g.name)){
      var pk=packKg(g.name,g.unit);
      if(isKgUnit(g.unit)){kg+=g.qty;dahi.push(nm+' '+fmtQty(g.qty)+' किलो');}
      else if(pk){kg+=pk*g.qty;dahi.push(nm+' ×'+fmtQty(g.qty)+' '+g.unit+' = '+fmtQty(pk*g.qty)+' किलो');}
      else{dahiUnknown=true;dahi.push(nm+' '+fmtQty(g.qty)+' '+g.unit);}
    }else if(/दूध|milk/i.test(g.name)&&isLitreUnit(g.unit)){
      l+=g.qty;milk.push(nm+' '+fmtQty(g.qty)+' लीटर');
    }else{
      other.push(nm+' '+fmtQty(g.qty)+' '+g.unit);
    }
  });
  var lines=dahi.slice();
  if(dahi.length>1||dahiUnknown)lines.push('कुल दही: '+fmtQty(kg)+' किलो'+(dahiUnknown?' + ऊपर वाले':''));
  lines=lines.concat(milk);
  if(milk.length>1)lines.push('कुल दूध (बिक्री): '+r1(l)+' लीटर');
  lines=lines.concat(other);
  if(!lines.length)return null;
  return {l:r1(l),kg:Math.round(kg*1000)/1000,lines:lines};
}
/* आने वाले 31 दिन — बिलिंग ऐप से रजिस्टर पर जाता है, वहीं से रोज़ दोपहर फ़ोन पर घंटी */
function buildPlanDays(){
  var live=state.orders.filter(function(o){return !o.cancelled;});
  var from=todayStr(),until=addDaysKey(31),keys={};
  live.forEach(function(o){o.items.forEach(function(it){
    if(it.delivered)return;var k=itemDateKey(o,it);if(k>=from&&k<=until)keys[k]=1;
  });});
  var days={};
  Object.keys(keys).sort().forEach(function(k){
    var s=sweetsMilk(live,k),d=dairyDay(live,k);
    if(s||d){days[k]={};if(s)days[k].s=s;if(d)days[k].d=d;}
  });
  return days;
}
function milkCard(live){
  var sK=addDaysKey(2),dK=addDaysKey(1);
  var s=sweetsMilk(live,sK),d=dairyDay(live,dK);
  if(!s&&!d)return '';
  function row(t){return '<div class="mkrow'+(/^कुल /.test(t)?' mksum':'')+'">'+esc(t)+'</div>';}
  var h='<div class="sumcard milkcard"><div class="sumhead">🥛 आज का दूध-दही ऑर्डर (3 बजे तक)</div>';
  if(s){
    h+='<div class="mkhead">🍬 मिठाई — परसों '+esc(hiDate(sK))+' की डिलीवरी'+(s.l?'<span class="mkl">'+s.l+' लीटर दूध</span>':'')+'</div>'+
      s.lines.map(row).join('')+
      s.unk.map(function(t){return '<div class="mkrow">'+esc(t)+' <span class="mktag">सिर्फ गिनती</span></div>';}).join('');
    if(s.none.length)h+='<div class="mknote">बिना दूध: '+esc(s.none.join(', '))+'</div>';
  }
  if(d){
    h+='<div class="mkhead">🥛 दही-दूध — कल '+esc(hiDate(dK))+' की डिलीवरी</div>'+d.lines.map(row).join('');
  }
  if(s&&s.l&&d&&d.l)h+='<div class="mktotal">कुल दूध: '+r1(s.l+d.l)+' लीटर <span>(मिठाई '+s.l+' + बिक्री '+d.l+')</span></div>';
  var ps=lsGet(PLAN_SENT,{})||{};

/* हिसाब बदले तो रजिस्टर पर भेजो (सिर्फ बदलने पर, या 12 घंटे में एक बार ताकि "कब भेजा" ताज़ा रहे) */
var PLAN_SENT='mbmb-plan-sent',planTimer=null,planBusy=false;
function planSyncSoon(){clearTimeout(planTimer);planTimer=setTimeout(function(){planSync();},4000);}
function hashStr(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0)+'-'+s.length;}
function planSync(force){
  var cfg=onlineCfg();
  if(!cfg||planBusy)return Promise.resolve(null);
  var days=buildPlanDays(),h=hashStr(JSON.stringify(days)),last=lsGet(PLAN_SENT,{})||{},now=Date.now();
  if(!force){
    if(last.old&&now-last.old<6*3600000)return Promise.resolve(null);   // रजिस्टर का कोड पुराना — 6 घंटे बाद फिर देखो
    if(last.h===h&&now-(last.t||0)<12*3600000)return Promise.resolve(null);
  }
  planBusy=true;
  return fetch(cfg.u,{method:'POST',body:JSON.stringify({action:'plan',key:cfg.k,plan:{v:1,at:now,days:days}}),redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(r){
      planBusy=false;
      if(r&&r.ok)lsSet(PLAN_SENT,{h:h,t:now});
      else if(r&&r.error==='action')lsSet(PLAN_SENT,{old:now});
      return r;
    },function(){planBusy=false;return null;});
}
function testMilkReminder(){
  var cfg=onlineCfg();
  if(!cfg){toast('पहले ऑनलाइन सेटअप करें');return;}
  toast('हिसाब भेज रहे हैं…');
  planSync(true).then(function(r){
    if(!r){toast('इंटरनेट नहीं मिला — दोबारा दबाओ');return null;}
    if(!r.ok){
      toast(r.error==='action'?'रजिस्टर का कोड पुराना है — कंप्यूटर पर चरण 7 करें':'नहीं भेज पाए ('+(r.error||'?')+')');
      if(ui.view==='backup'&&!$('#ov'))renderBackup();
      return null;
    }
    return fetch(cfg.u+'?action=testplan&key='+encodeURIComponent(cfg.k),{redirect:'follow'}).then(function(x){return x.json();}).then(function(t){
      toast(t&&t.ok?'भेज दिया ✓ — फ़ोन पर घंटी देखो':'नहीं भेज पाए ('+(((t&&t.detail)||[]).join(', ')||(t&&t.error)||'?')+')');
      if(ui.view==='backup'&&!$('#ov'))renderBackup();
    });
  }).catch(function(){toast('इंटरनेट नहीं मिला — दोबारा दबाओ');});
}

/* ---------- 📱 फ़ोन का Back बटन ----------
   ऐप एक ही पेज है, इसलिए Android का Back सीधे ऐप बंद कर देता था।
   अब: Back = खुली शीट बंद → पिछली स्क्रीन → होम → "एक बार और दबाओ" → ऐप बंद।
   ब्राउज़र history में सिर्फ एक "जाल" एंट्री रहती है; असली पिछली स्क्रीनें NAV.stack में। */
var NAV={stack:[],cur:null,restoring:false,trap:false,exitArm:0,exitTimer:null,y:0};
var NAV_TABS=['online','orders','khata','loyal','items','backup'];
function navKey(x){return x.v+'|'+(x.c||'')+'|'+(x.p||'')+'|'+(x.m||'');}
function navTrack(){
  var now={v:ui.view,c:ui.customerId||null,p:ui.partyId||null,m:ui.memberId||null,cf:ui.cameFrom,y:0};
  if(!NAV.cur){NAV.cur=now;return;}
  if(navKey(now)===navKey(NAV.cur)){NAV.cur.cf=now.cf;return;}
  if(!NAV.restoring){
    NAV.cur.y=NAV.y;
    if(now.v==='home'){
      NAV.stack=[];                                       // होम = सबसे नीचे; यहाँ से Back = बाहर निकलना
    }else if(NAV_TABS.indexOf(now.v)>-1){
      var home=(NAV.cur.v==='home')?NAV.cur:(NAV.stack[0]&&NAV.stack[0].v==='home'?NAV.stack[0]:{v:'home'});
      NAV.stack=[home];                                   // नीचे वाले टैब से Back = होम
    }else{
      var top=NAV.stack[NAV.stack.length-1];
      if(top&&navKey(top)===navKey(now))NAV.stack.pop();  // ऐप का "← वापस" बटन = पीछे जाना
      else{NAV.stack.push(NAV.cur);if(NAV.stack.length>40)NAV.stack.shift();}
    }
  }
  NAV.cur=now;
}
function navGo(x){
  NAV.restoring=true;
  ui.view=x.v;ui.customerId=x.c||null;ui.partyId=x.p||null;ui.memberId=x.m||null;if(x.cf)ui.cameFrom=x.cf;
  try{renderRoute();}finally{NAV.restoring=false;}
  window.scrollTo(0,x.y||0);
}
function navBack(){
  if($('#ov')){softClose();return true;}
  var prev=NAV.stack.pop();
  if(prev){navGo(prev);return true;}
  if(ui.view!=='home'){navGo({v:'home'});return true;}
  return false;
}
// पेज दोबारा लोड हुआ और हम पहले से "जाल" वाली एंट्री पर हैं — दूसरा जाल न बनाओ, वरना पहला Back बेकार जाता
try{if(history.state&&history.state.mbTrap)NAV.trap=true;}catch(e){}
function navArmTrap(){
  if(NAV.trap)return;
  try{history.pushState({mbTrap:1},'');NAV.trap=true;}catch(e){}
}
window.addEventListener('scroll',function(){NAV.y=window.scrollY||0;},{passive:true});
['pointerdown','keydown','touchstart'].forEach(function(ev){
  window.addEventListener(ev,function(){navArmTrap();},{capture:true,passive:true});
});
window.addEventListener('popstate',function(e){
  if(location.hash)return;                       // #online / #o= लिंक — उन्हें hashchange संभालता है
  if(e.state&&e.state.mbTrap){NAV.trap=true;return;}  // आगे (forward) आए — कुछ नहीं करना
  NAV.trap=false;
  clearTimeout(NAV.exitTimer);
  if(navBack()){navArmTrap();return;}
  // होम पर, पीछे कुछ नहीं — एक बार पूछो; 2.5 सेकंड में दोबारा Back = ऐप बंद
  NAV.exitArm=Date.now();
  toast('ऐप बंद करना है तो एक बार और Back दबाओ');
  NAV.exitTimer=setTimeout(navArmTrap,2500);
});

  document.body.classList.add('noscroll');

/* लिखते समय टाइप वाले बॉक्स को नहीं बदलते — फ़ोन का कीबोर्ड (Gboard/हिंदी) अधूरा शब्द दोबारा न लिख दे।
   बाकी सब नया बनता है, सिर्फ़ वो बॉक्स (और उसके डिब्बे) अपनी जगह रहते हैं। */
function paint(el,html){
  if(!el)return;
  var a=document.activeElement;
  if(!a||!a.id||!/^(INPUT|TEXTAREA)$/.test(a.tagName)||!el.contains(a)||!window.CSS||!CSS.escape){el.innerHTML=html;return;}
  var tmp=document.createElement(el.tagName);tmp.innerHTML=html;
  if(!tmp.querySelector('#'+CSS.escape(a.id))){el.innerHTML=html;return;}
  morphKeep(el,tmp,a);
}
function morphKeep(live,fresh,keep){
  var sel='#'+CSS.escape(keep.id),lk=null,fk=null,n;
  for(n=live.firstChild;n;n=n.nextSibling)if(n===keep||(n.nodeType===1&&n.contains(keep))){lk=n;break;}
  for(n=fresh.firstChild;n;n=n.nextSibling)if(n.nodeType===1&&(n.id===keep.id||n.querySelector(sel))){fk=n;break;}
  if(!lk||!fk||lk.tagName!==fk.tagName){live.innerHTML=fresh.innerHTML;return;}
  while(live.firstChild!==lk)live.removeChild(live.firstChild);
  while(lk.nextSibling)live.removeChild(lk.nextSibling);
  while(fresh.firstChild!==fk)live.insertBefore(fresh.firstChild,lk);
  while(fk.nextSibling)live.appendChild(fk.nextSibling);
  if(lk===keep){
    for(var i=0;i<fk.attributes.length;i++){var an=fk.attributes[i].name;if(an!=='value')keep.setAttribute(an,fk.attributes[i].value);}
    return;
  }
  for(var j=lk.attributes.length-1;j>=0;j--){if(!fk.hasAttribute(lk.attributes[j].name))lk.removeAttribute(lk.attributes[j].name);}
  for(var k=0;k<fk.attributes.length;k++)lk.setAttribute(fk.attributes[k].name,fk.attributes[k].value);
  morphKeep(lk,fk,keep);
}

/* ---------- वेबसाइट (मेन्यू) से आया ऑर्डर ---------- */
function b64urlDecode(s){
  s=String(s).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  var bin=atob(s);
  if(window.TextDecoder){
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  return decodeURIComponent(escape(bin));
}
function clip(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n):s;}
function parseWebOrder(raw){
  try{
    var p=JSON.parse(b64urlDecode(raw));
    if(!p||typeof p!=='object'||!Array.isArray(p.i))return null;
    return {
      c:clip(p.c,20),n:clip(p.n,60),p:clip(p.p,15),m:p.m==='p'?'p':'d',
      g:clip(p.g,80),a:clip(p.a,200),k:clip(p.k,120),
      l:(Array.isArray(p.l)&&p.l.length===2&&isFinite(p.l[0])&&isFinite(p.l[1]))?[+p.l[0],+p.l[1]]:null,
      dk:isFinite(p.dk)?+p.dk:null,
      w:(p.w==='asap'||/^\d{4}-\d{2}-\d{2}$/.test(String(p.w)))?String(p.w):'asap',
      s:(isFinite(p.s)&&p.s>=0&&p.s<WEB_SLOTS.length)?+p.s:-1,
      i:p.i.filter(function(r){return Array.isArray(r)&&r.length>=2&&num(r[1])>0;}).slice(0,60).map(function(r){return [clip(r[0],12),num(r[1])];}),
      x:Array.isArray(p.x)?p.x.filter(function(r){return Array.isArray(r)&&r.length>=2;}).slice(0,20).map(function(r){return [r[0]==='cake'?'cake':'pack',clip(r[1],300)];}):[],
      cm:clip(p.cm,120),t:clip(p.t,300),ts:num(p.ts)
    };
  }catch(e){return null;}
}
function webItemInfo(id){
  var it=findItem(id);
  if(it)return {name:it.name,unit:it.unit,price:num(it.price)};
  if(CATALOG){for(var i=0;i<CATALOG.items.length;i++){var r=CATALOG.items[i];if(r[0]===id)return {name:r[1],unit:r[3],price:num(r[4])};}}
  return null;
}
function webWhenText(p){
  if(p.w==='asap')return p.m==='p'?'जल्दी (30 मिनट में तैयार)':'जल्दी (30–60 मिनट)';
  return fmtDshort(keyToDate(p.w))+(p.s>=0?', '+WEB_SLOTS[p.s][2]:'');
}
function webDateValue(p){
  if(p.w==='asap'){
    var d=new Date(Date.now()+60*60000);
    var m=d.getMinutes();d.setMinutes(Math.ceil(m/15)*15,0,0);
    return dayKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  var h=p.s>=0?WEB_SLOTS[p.s][0]:10;
  return p.w+'T'+pad(h)+':00';
}
function webMapsLink(p){return p.l?('https://maps.google.com/?q='+p.l[0].toFixed(5)+','+p.l[1].toFixed(5)):'';}
function webNotes(p){
  var N=['🌐 ऑनलाइन ऑर्डर '+p.c+' · '+(p.m==='p'?'🏪 दुकान से लेंगे':'🚚 घर पर डिलीवरी')+' · ⏰ '+webWhenText(p)];
  if(p.m==='d'){
    if(p.g)N.push('गाँव/मोहल्ला: '+p.g);
    if(p.a)N.push('पता: '+p.a);
    if(p.k)N.push('पहचान: '+p.k);
    if(p.l)N.push('📍 '+webMapsLink(p)+(p.dk!=null?' (~'+p.dk+' km)':''));
    else N.push('📍 लोकेशन नहीं दी — दूरी जांचनी है');
  }
  if(p.cm)N.push('केक पर लिखना: "'+p.cm+'"');
  if(p.t)N.push('ग्राहक का नोट: '+p.t);
  return N.join('\n');
}
function webLines(p){
  var L=[];
  p.i.forEach(function(r){
    var info=webItemInfo(r[0]);
    // आइटम लिस्ट में नहीं मिला (हटाया गया/नया) — छोड़ो मत, ₹0 पर दिखाओ ताकि Rate भरा जाए
    if(!info){L.push({lid:uid(),iid:'',name:'अज्ञात आइटम ('+r[0]+')',unit:'',rate:0,qty:r[1],delivered:false,date:''});return;}
    L.push({lid:uid(),iid:r[0],name:info.name,unit:info.unit,rate:info.price,qty:r[1],delivered:false,date:''});
  });
  p.x.forEach(function(r){
    L.push({lid:uid(),name:(r[0]==='cake'?'कस्टम केक: ':'पैकेट सामान (MRP): ')+r[1],unit:r[0]==='cake'?'पीस':'पैक',rate:0,qty:1,delivered:false,date:''});
  });
  return L;
}

var ONLINE_CFG='mbmb-online',ONLINE_CACHE='mbmb-online-cache',ONLINE_QUEUE='mbmb-online-queue',ONLINE_SEEN='mbmb-online-seen';
var online={cfg:null,orders:[],lastSync:0,syncing:false,error:'',showDone:false};
var ON_LABEL={'new':'नया','accepted':'स्वीकार','out':'रास्ते में','delivered':'डिलीवर','rejected':'मना'};
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function onlineCfg(){var c=lsGet(ONLINE_CFG,null);return (c&&c.u&&c.k)?c:null;}
function loadOnlineCache(){var c=lsGet(ONLINE_CACHE,null);if(c&&Array.isArray(c.orders)){online.orders=c.orders;online.lastSync=c.t||0;}}
function saveOnlineCache(){lsSet(ONLINE_CACHE,{orders:online.orders,t:online.lastSync});}
function onlineNewCount(){return online.orders.filter(function(o){return o.status==='new';}).length;}
function findOnline(code){for(var i=0;i<online.orders.length;i++)if(online.orders[i].code===code)return online.orders[i];return null;}
/* नेट अटक जाए तो 25 सेकंड बाद छोड़ दो — "ताज़ा करो" हमेशा चलता रहे */
function fetchT(url,opt){

var flushing=null,flushAgain=false;
/* send queued status changes one at a time, oldest first; never two senders at once */
function flushQueue(){
  if(!online.cfg)return Promise.resolve();
  if(flushing){flushAgain=true;return flushing;}
  flushing=(function next(){
    var q=lsGet(ONLINE_QUEUE,[]);
    if(!q.length)return Promise.resolve();
    var u=q[0];
    return onlinePost({action:'update',key:online.cfg.k,code:u.code,status:u.status,note:u.note,total:u.total}).then(function(r){
      if(r&&(r.ok||r.error==='notfound'||r.error==='status')){
        lsSet(ONLINE_QUEUE,lsGet(ONLINE_QUEUE,[]).filter(function(x){return x.qid!==u.qid;}));
        return next();
      }
    },function(){});
  })().then(function(){
    flushing=null;
    if(flushAgain){flushAgain=false;return flushQueue();}
  },function(){flushing=null;});
  return flushing;
}

  var q=lsGet(ONLINE_QUEUE,[]);
  q.push({qid:uid(),code:code,status:status,note:extra.note,total:extra.total});
  lsSet(ONLINE_QUEUE,q);
  saveOnlineCache();

  if(online.cfg)flushQueue();

      if(!r||!r.ok)throw {msg:'रजिस्टर ने फ़ोन नहीं जोड़ा ('+((r&&r.error)||'?')+')'};

}
/* Chrome से घंटी का पता लो (पुराना किसी और चाबी का हो तो नया) */
function pushSubscribe(vapid){
  return navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(old){
      if(old){
        var k=old.options&&old.options.applicationServerKey?bufToB64u(old.options.applicationServerKey):'';
        if(k===vapid)return old;
        return old.unsubscribe().then(function(){return null;},function(){return null;});
      }
      return null;
    }).then(function(sub){
      return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(vapid)});
    });
  });
}

function disablePush(){

function orderExtra(o){return round2(Math.max(0,orderPaid(o)-orderTotal(o)));}
function canAdjustExtra(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled;});
  return os.some(function(o){return orderExtra(o)>0;})&&os.some(function(o){return orderDue(o)>0;});
}
function adjustExtra(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var moved=0,today=todayStr();
  os.forEach(function(src){
    var ex=orderExtra(src);
    os.forEach(function(dst){
      if(ex<=0.001||dst===src)return;
      var need=orderDue(dst);if(need<=0)return;
      var take=round2(Math.min(ex,need));
      src.payments.push({id:uid(),amount:-take,date:today,note:'#'+dst.no+' में adjust'});
      dst.payments.push({id:uid(),amount:take,date:today,note:'#'+src.no+' से adjust'});
      ex=round2(ex-take);moved=round2(moved+take);
    });
  });
  return moved;
}

/* ---------- 📒 उधारी खाता — ऑर्डर वाले हिसाब से बिल्कुल अलग ----------
   state.khata = {parties:[{id,name,phone,createdAt,remindedAt}], entries:[{id,partyId,type:'u'|'j',amount,note,date:'YYYY-MM-DD',createdAt}]}
   u = उधार दिया, j = जमा मिला। बाकी = कुल उधार − कुल जमा।
   ऑर्डर वाले ग्राहक/बाकी इसमें नहीं आते, और उधारी ऑर्डर वाले बाकी में नहीं जुड़ती।
   मैसेज: ऐप तैयार करता है, WhatsApp खुलता है, मालिक सिर्फ Send दबाता है (1 टैप, मुफ़्त)। */
var REMIND_DAYS=15;
var UD_CHIPS=['दूध','दही','मिठाई','पनीर','केक','नमकीन'];
function KH(){
  if(!state.khata||typeof state.khata!=='object')state.khata={parties:[],entries:[]};
  if(!Array.isArray(state.khata.parties))state.khata.parties=[];
  if(!Array.isArray(state.khata.entries))state.khata.entries=[];
  return state.khata;
}
function findParty(id){var ps=KH().parties;for(var i=0;i<ps.length;i++)if(ps[i].id===id)return ps[i];return null;}
function findKEntry(id){var es=KH().entries;for(var i=0;i<es.length;i++)if(es[i].id===id)return es[i];return null;}
function partyByPhone(ph,exceptId){
  var n=phoneNorm(ph);if(!n)return null;
  var ps=KH().parties;
  for(var i=0;i<ps.length;i++)if(ps[i].id!==exceptId&&phoneNorm(ps[i].phone)===n)return ps[i];
  return null;
}
function partyPhoneProblem(ph,exceptId){
  if(!ph)return '';
  if(ph.replace(/\D/g,'').length<10)return 'मोबाइल नंबर पूरा 10 अंकों का लिखो।';
  if(!phoneValid(ph))return 'यह मोबाइल नंबर सही नहीं लगता — 10 अंक, 6/7/8/9 से शुरू।';
  var dup=partyByPhone(ph,exceptId);
  if(dup)return 'यह नंबर उधारी खाते में पहले से "'+dup.name+'" के नाम से है।';
  return '';
}
function partyEntries(pid){
  return KH().entries.filter(function(e){return e.partyId===pid;}).sort(function(a,b){
    return a.date<b.date?-1:(a.date>b.date?1:(num(a.createdAt)-num(b.createdAt)));
  });
}
function partyTotals(pid){
  var u=0,j=0;
  KH().entries.forEach(function(e){if(e.partyId!==pid)return;if(e.type==='u')u+=num(e.amount);else j+=num(e.amount);});
  u=round2(u);j=round2(j);
  return {u:u,j:j,bal:round2(u-j)};
}
/* सबसे पुराना जो उधार अभी चुकता नहीं हुआ (जमा पहले सबसे पुराने उधार में जाता है) */
function partyOldestDueKey(pid){
  var es=partyEntries(pid),jama=0;
  es.forEach(function(e){if(e.type==='j')jama+=num(e.amount);});
  jama=round2(jama);
  for(var i=0;i<es.length;i++){
    var e=es[i];if(e.type!=='u')continue;
    var a=num(e.amount);
    if(jama>=a-0.001){jama=round2(jama-a);continue;}
    return e.date;
  }
  return null;
}
function partyDueDays(pid){var k=partyOldestDueKey(pid);return k?dayDiff(k,todayStr()):null;}
function daysSinceTs(ts){return Math.floor((Date.now()-num(ts))/86400000);}
function partyNeedsReminder(p){
  if(partyTotals(p.id).bal<=0)return false;
  var d=partyDueDays(p.id);
  if(d===null||d<REMIND_DAYS)return false;
  if(p.remindedAt&&dayDiff(dayKey(p.remindedAt),todayStr())<REMIND_DAYS)return false;
  return true;
}
function khataRemindList(){return KH().parties.filter(partyNeedsReminder);}
function khataTotalDue(){var t=0;KH().parties.forEach(function(p){var b=partyTotals(p.id).bal;if(b>0)t+=b;});return round2(t);}
function khataToday(type){var t=todayStr(),s=0;KH().entries.forEach(function(e){if(e.type===type&&e.date===t)s+=num(e.amount);});return round2(s);}
function hiShort(k){var d=keyToDate(k);return d.getDate()+' '+HI_MONTHS[d.getMonth()];}
function remindedText(p){
  if(!p.remindedAt)return '';
  var d=dayDiff(dayKey(p.remindedAt),todayStr());
  return d<=0?'आज याद दिलाया':(d===1?'कल याद दिलाया':d+' दिन पहले याद दिलाया');
}
function entryLabel(e){return (e.type==='u'?'उधार':'जमा')+(e.note?' — '+e.note:'');}

/* --- पुराने वर्ज़न में उधार ऑर्डर बनकर गया था (kind:'udhar') — उसे उधारी खाते में ले आओ --- */
function migrateUdharOrders(){
  var uds=state.orders.filter(function(o){return o.kind==='udhar';});
  if(!uds.length)return 0;
  var k=KH(),udCust={};
  uds.forEach(function(o){
    udCust[o.customerId]=1;
    if(o.cancelled)return;
    if(k.entries.some(function(x){var sx=String(x.src||'');return sx===o.id||sx.indexOf(o.id+':')===0;}))return; // पहले ही आ चुका — दोबारा नहीं
    var c=findCustomer(o.customerId);
    var p=(c&&c.phone)?partyByPhone(c.phone,null):null;
    if(!p&&c){for(var i=0;i<k.parties.length;i++)if(k.parties[i].name===c.name&&!k.parties[i].phone&&!c.phone){p=k.parties[i];break;}}
    if(!p){p={id:uid(),name:c?c.name:'ग्राहक',phone:c?(c.phone||''):'',createdAt:Date.now(),remindedAt:(c&&c.remindedAt)||0};k.parties.push(p);}
    var amt=round2(o.items.reduce(function(s,i){return s+num(i.qty)*num(i.rate);},0));
    if(amt>0)k.entries.push({id:uid(),src:o.id,partyId:p.id,type:'u',amount:amt,note:o.udNote||'',date:dayKey(o.date),createdAt:o.createdAt||Date.now()});
    o.payments.forEach(function(pay){
      var pa=round2(num(pay.amount));if(!pa)return;
      k.entries.push({id:uid(),src:o.id+':'+(pay.id||''),partyId:p.id,type:pa>0?'j':'u',amount:Math.abs(pa),note:(pay.note&&pay.note!=='एक साथ जमा')?pay.note:'',date:pay.date||dayKey(o.date),createdAt:Date.now()});
    });
  });
  state.orders=state.orders.filter(function(o){return o.kind!=='udhar';});
  state.customers=state.customers.filter(function(c){return !(udCust[c.id]&&customerOrders(c.id).length===0);});
  save();
  return uds.length;
}

function payLine(L,due){

function signOff(L){L.push('');L.push('धन्यवाद — '+state.shop.owner+(state.shop.phone?' ('+state.shop.phone+')':''));}
function balLine(L,bal){
  if(bal>0)L.push('कुल बकाया: *'+rupee(bal)+'*');
  else if(bal<0)L.push('आपका '+rupee(-bal)+' एडवांस जमा है ✅');
  else L.push('आपका पूरा हिसाब साफ़ है ✅');

function kUdharMessage(e){

  balLine(L,bal);
  if(bal>0){L.push('');payLine(L,bal);}

function kJamaMessage(e){
  var p=findParty(e.partyId),bal=partyTotals(p.id).bal,L=[];
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');

  else balLine(L,bal);
  signOff(L);
  return L.join('\n');
}
function kRemindMessage(p){
  var bal=partyTotals(p.id).bal,od=partyOldestDueKey(p.id),L=[];
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');
  L.push('आपका *'+rupee(bal)+'* बकाया है'+(od&&od<todayStr()?' ('+hiShort(od)+' से)':'')+'। सुविधा से जमा कर दीजिए।');
  L.push('');
  payLine(L,bal);
  L.push('पूरा हिसाब चाहिए तो इसी चैट में बता दीजिए।');

}
function kHisaabMessage(p){
  var es=partyEntries(p.id),t=partyTotals(p.id),L=[];
  var MAX=40,skip=Math.max(0,es.length-MAX),before=0;
  for(var i=0;i<skip;i++)before+=es[i].type==='u'?num(es[i].amount):-num(es[i].amount);
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');
  L.push('आपका उधारी हिसाब:');
  L.push('-------------------');
  if(skip)L.push('पिछला बकाया ('+skip+' पुरानी एंट्री): '+rupee(round2(before)));
  es.slice(skip).forEach(function(e){
    L.push(hiShort(e.date)+' — '+(e.type==='u'?'उधार ':'जमा ')+rupee(e.amount)+(e.note?' ('+e.note+')':''));
  });
  L.push('-------------------');
  L.push('कुल उधार: '+rupee(t.u)+'  |  कुल जमा: '+rupee(t.j));
  if(t.bal>0)L.push('*बाकी: '+rupee(t.bal)+'*');else balLine(L,t.bal);
  if(t.bal>0){L.push('');payLine(L,t.bal);}
  signOff(L);
  return L.join('\n');
}
function kMsg(kind,ref){
  if(kind==='udhar'||kind==='jama'){var e=findKEntry(ref);if(!e||!findParty(e.partyId))return '';return kind==='udhar'?kUdharMessage(e):kJamaMessage(e);}

}

function saveKEntry(){
  var d=ui.kDraft,err=$('#ke-err');if(!d)return;
  if(!d.partyId){err.textContent='किसका खाता है — नाम चुनो या नया बनाओ।';return;}
  var amt=round2(num($('#ke-amt').value));
  if(!(amt>0)){err.textContent='रकम लिखो।';return;}
  if(amt>1000000){err.textContent='रकम बहुत बड़ी है — एक बार जाँच लो।';return;}
  var note=$('#ke-note').value.trim().slice(0,60);
  var dk=$('#ke-date').value||todayStr();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dk)){err.textContent='सही तारीख चुनो।';return;}
  if(dk>todayStr()){err.textContent='आगे की तारीख नहीं लिख सकते।';return;}
  if(d.editId){
    var e=findKEntry(d.editId);if(!e){closeSheet();return;}
    e.amount=amt;e.note=note;e.date=dk;
    save();closeSheet();renderRoute();toast((e.type==='u'?'उधार':'जमा')+' बदल गया');
    return;
  }
  var ne={id:uid(),partyId:d.partyId,type:d.type,amount:amt,note:note,date:dk,createdAt:Date.now()};
  KH().entries.push(ne);

  ui.view='party';ui.partyId=d.partyId;

/* ================== ⭐ माँ भगवती मिठास पॉइंट्स (लॉयल्टी) ==================
   नियम मालिक ने तय किए (6 अक्टूबर 2026) — बिना पूछे न बदलें:
   • मिठाई + केक: हर पूरे ₹50 पर 1 पॉइंट · पैकेट सामान: हर पूरे ₹100 पर 1 पॉइंट · दूध/दही/पनीर/थोक: 0
   • पहली ख़रीद (मिठाई/केक/पैकेट ₹100+) पर 5 बोनस, एक बार · एक बिल पर ज़्यादा से ज़्यादा 50 पॉइंट (बोनस अलग)
   • इनाम: 10 = ₹15 (बिल ₹250+) · 25 = ₹40 (₹500+) · 50 = ₹100 (₹1,000+) — न्यूनतम बिल में सिर्फ़ मिठाई/केक/पैकेट
   • एक बिल पर एक इनाम · नकद नहीं · इसी बिल से पहले के पॉइंट · पुराने पहले कटें (FIFO) · हर पॉइंट 365 दिन
   • पॉइंट उस रकम पर जो ग्राहक ने दी (छूट घटाकर) · पॉइंट सिर्फ़ मालिक इस फ़ोन से चढ़ाते हैं
   डेटा: state.loyal = {m:[सदस्य], b:[बिल]} — बिल कभी मिटता नहीं; ग़लती पर "रद्द" (v) लगता है।
   सदस्य: {id,name,phone,c:जुड़ने का समय,ok:सहमति का समय,wa:WhatsApp की सहमति,rm:आख़िरी याद}
   बिल: {id,m,t,s:मिठाई+केक ₹,k:पैकेट ₹,o:बिना पॉइंट वाला ₹,r:कटे पॉइंट,f:छूट ₹,p:मिले पॉइंट,bo:बोनस,v:{t,w}} */
var LP={name:'माँ भगवती मिठास पॉइंट्स',swPer:50,pkPer:100,bonus:5,bonusMin:100,cap:50,days:365,warnDays:30,remindDays:15,bigBill:2500,
  rewards:[{pts:10,off:15,min:250},{pts:25,off:40,min:500},{pts:50,off:100,min:1000}]};
var LP_WHY=['ग़लत रकम लिखी गई','ग़लत ग्राहक पर चढ़ गया','ग्राहक ने सामान लौटाया','ऑर्डर कैंसल हुआ'];
function LY(){
  var l=state.loyal;
  if(!l||typeof l!=='object')l=state.loyal={m:[],b:[]};
  if(!Array.isArray(l.m))l.m=[];
  if(!Array.isArray(l.b))l.b=[];
  return l;
}
function findMember(id){var a=LY().m;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function findLBill(id){var a=LY().b;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function memberByPhone(ph,exceptId){
  var n=phoneNorm(ph);if(!n)return null;
  var a=LY().m;for(var i=0;i<a.length;i++)if(a[i].id!==exceptId&&phoneNorm(a[i].phone)===n)return a[i];
  return null;
}
var LP_BIDX=null;   // सदस्य → उसके बिल (हर save पर नया बनता है)
function memberBills(mid){
  if(!LP_BIDX){
    LP_BIDX={};
    LY().b.forEach(function(x){(LP_BIDX[x.m]=LP_BIDX[x.m]||[]).push(x);});
    Object.keys(LP_BIDX).forEach(function(k){LP_BIDX[k].sort(function(a,b){return a.t-b.t;});});
  }
  return (LP_BIDX[mid]||[]).slice();
}
function lpAddDays(k,n){var d=keyToDate(k);d.setDate(d.getDate()+n);return dayKey(d);}
function lpDate(k){var d=keyToDate(k);return d.getDate()+' '+HI_MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function lpBillAmt(b){return round2(num(b.s)+num(b.k)+num(b.o));}

/* सदस्य का पूरा हिसाब: हर बिल के पॉइंट की एक "थैली" (365 दिन), इनाम सबसे पुरानी थैली से कटे,
   मियाद पूरी होते ही बचे पॉइंट ख़त्म। रद्द बिल गिनती में नहीं। */
function lpState(mid,skipBill){
  var today=todayStr(),lots=[],debt=0,ev=[],earned=0,used=0,expired=0,rewards=0,saved=0,bonusGiven=false;
  var expireUpTo=function(d){
    lots.forEach(function(L){if(L.left>0&&L.exp<=d){ev.push({k:'x',d:L.exp,pts:L.left});expired+=L.left;L.left=0;}});
  };
  memberBills(mid).forEach(function(b){
    if(b.v||b.id===skipBill)return;
    var d=dayKey(b.t);
    expireUpTo(d);
    if(num(b.r)>0){
      var need=num(b.r);
      for(var i=0;i<lots.length&&need>0;i++){var take=Math.min(lots[i].left,need);lots[i].left-=take;need-=take;}
      if(need>0)debt+=need;
      used+=num(b.r);rewards++;saved+=num(b.f);
    }
    var got=num(b.p)+num(b.bo);
    if(num(b.bo)>0)bonusGiven=true;
    earned+=got;
    var pay=Math.min(debt,got);debt-=pay;
    lots.push({d:d,exp:lpAddDays(d,LP.days),left:got-pay});
  });
  expireUpTo(today);
  var bal=lots.reduce(function(s,L){return s+L.left;},0)-debt;
  var soonTo=lpAddDays(today,LP.warnDays),soon=0,soonExp='';
  lots.forEach(function(L){if(L.left>0&&L.exp<=soonTo){soon+=L.left;if(!soonExp||L.exp<soonExp)soonExp=L.exp;}});
  return {bal:bal,lots:lots,earned:earned,used:used,expired:expired,rewards:rewards,saved:round2(saved),bonusGiven:bonusGiven,
    soon:soon,soonLast:soonExp?lpAddDays(soonExp,-1):'',ev:ev};
}
/* इस बिल के पॉइंट — छूट दोनों हिस्सों में बराबर अनुपात से घटती है */
function lpCalc(sw,pk,ri,bonusOk){
  sw=Math.max(0,round2(num(sw)));pk=Math.max(0,round2(num(pk)));
  var elig=round2(sw+pk),r=(ri>=0&&LP.rewards[ri])?LP.rewards[ri]:null,off=r?Math.min(r.off,elig):0;
  var psw=elig>0?sw-off*sw/elig:0,ppk=elig>0?pk-off*pk/elig:0;
  var raw=Math.floor(psw/LP.swPer+1e-9)+Math.floor(ppk/LP.pkPer+1e-9);
  return {sw:sw,pk:pk,elig:elig,r:r,off:off,pts:Math.min(raw,LP.cap),capped:raw>LP.cap,bo:(bonusOk&&elig>=LP.bonusMin)?LP.bonus:0};
}
function lpRewardOk(i,bal,elig){var r=LP.rewards[i];if(bal<r.pts)return 'pts';if(elig<r.min)return 'min';return 'ok';}
function lpRewardLines(bal){
  var best=null,next=null,a=[];
  LP.rewards.forEach(function(r){if(bal>=r.pts)best=r;else if(!next)next=r;});
  if(best)a.push('🎁 अभी '+best.pts+' पॉइंट से '+rupee(best.off)+' की छूट ले सकते हैं ('+rupee(best.min)+'+ के बिल पर)');
  if(next)a.push((best?'या ':'')+'बस '+(next.pts-bal)+' पॉइंट और — फिर '+rupee(next.off)+' की छूट!');
  return a;
}
function lpSoonIn(mid,days){
  var s=lpState(mid),lim=lpAddDays(todayStr(),days),n=0,first='';
  s.lots.forEach(function(L){if(L.left>0&&L.exp<=lim){n+=L.left;if(!first||L.exp<first)first=L.exp;}});
  return {n:n,last:first?lpAddDays(first,-1):'',bal:s.bal};
}
function lpRemindList(){
  return LY().m.filter(function(m){
    if(!m.wa||!m.phone)return false;
    if(m.rm&&dayDiff(dayKey(m.rm),todayStr())<10)return false;
    return lpSoonIn(m.id,LP.remindDays).n>0;
  });
}
function lpDash(){
  var mon=todayStr().slice(0,7),d={members:LY().m.length,newM:0,active:0,soon:0,rw:0,rwOff:0,sales:0,bills:0};
  LY().m.forEach(function(m){if(dayKey(m.c).slice(0,7)===mon)d.newM++;var s=lpState(m.id);if(s.bal>0)d.active+=s.bal;d.soon+=s.soon;});
  LY().b.forEach(function(b){
    if(b.v||dayKey(b.t).slice(0,7)!==mon)return;
    d.bills++;d.sales+=num(b.s)+num(b.k);
    if(num(b.r)>0){d.rw++;d.rwOff+=num(b.f);}
  });
  d.sales=round2(d.sales);d.rwOff=round2(d.rwOff);
  return d;
}

  L.push('','हर ₹50 की मिठाई/केक पर 1 पॉइंट · हर ₹100 के पैकेट सामान पर 1 · दूध-दही-पनीर पर नहीं · पॉइंट 1 साल चलते हैं',LP_SIGN);

/* --- 📲 ग्राहक का अपना पेज (रजिस्टर पर सार) --- */
function lpTok(){
  var a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=new Uint8Array(22),s='',i;
  try{crypto.getRandomValues(r);}catch(e){for(i=0;i<r.length;i++)r[i]=Math.floor(Math.random()*256);}
  for(i=0;i<r.length;i++)s+=a.charAt(r[i]%a.length);
  return s;
}
var LP_SENT='mbmb-lp-sent',lpSyncTimer=null,lpSyncBusy=false;
function lpLinkOk(){var x=lsGet(LP_SENT,{})||{};return !!(onlineCfg()&&x.v5&&!x.old);}
function lpLink(m){return orderPageUrl()+'?lp='+encodeURIComponent(m.tk||'');}
function lpLinkLines(m,L){if(m&&m.tk&&lpLinkOk())L.push('','📲 अपने पॉइंट और पूरा हिसाब कभी भी देखें:',lpLink(m));}
/* ग्राहक के पेज के लिए सदस्य का सार — असली हिसाब यहीं रहता है, वहाँ सिर्फ़ दिखाने के लिए कॉपी */
function lpSummary(m){
  var s=lpState(m.id),h=[],left=0;
  memberBills(m.id).forEach(function(b){
    if(b.v)return;
    var x={d:dayKey(b.t),a:lpBillAmt(b),g:num(b.p)+num(b.bo)};
    if(num(b.bo)>0)x.bo=num(b.bo);
    if(num(b.r)>0){x.r=num(b.r);x.f=num(b.f);}
    h.push(x);
  });
  s.ev.forEach(function(x){h.push({d:x.d,x:x.pts});});
  h.sort(function(a,b){return a.d<b.d?1:(a.d>b.d?-1:0);});
  var lots=s.lots.filter(function(L){return L.left>0;}).map(function(L){left+=L.left;return [L.left,L.exp];});
  return {v:1,n:m.name,c:dayKey(m.c),lots:lots,debt:Math.max(0,left-s.bal),e:s.earned,u:s.used,x:s.expired,sv:s.saved,rw:s.rewards,h:h.slice(0,30),
    rr:LP.rewards.map(function(r){return [r.pts,r.off,r.min];})};
}
function lpSyncSoon(ms){clearTimeout(lpSyncTimer);lpSyncTimer=setTimeout(function(){lpSync();},ms==null?5000:ms);}
function lpSync(){
  var cfg=onlineCfg();
  if(!cfg||lpSyncBusy)return Promise.resolve(null);
  var sent=lsGet(LP_SENT,{})||{},now=Date.now(),map=sent.m||{},list=[],seen={};
  if(sent.old&&now-sent.old<6*3600000)return Promise.resolve(null);   // रजिस्टर का कोड पुराना — 6 घंटे बाद फिर देखो
  LY().m.forEach(function(m){
    if(!m.tk||!phoneValid(m.phone))return;
    seen[m.id]=1;
    var ph=phoneNorm(m.phone).slice(-10),d=lpSummary(m),h=hashStr(ph+'|'+m.tk+'|'+JSON.stringify(d));
    if(map[m.id]!==h)list.push({id:m.id,p:ph,t:m.tk,d:d,h:h});
  });
  Object.keys(map).forEach(function(id){if(!seen[id])list.push({id:id,del:1});});
  lpSyncBusy=true;
  var done=function(r){lpSyncBusy=false;return r;};
  if(!list.length){
    if(sent.v5&&!sent.old)return Promise.resolve(done({ok:true,none:true}));
    // अभी तक पता नहीं कि रजिस्टर नया है या पुराना — पूछ लो
    return fetch(cfg.u+'?action=ping',{redirect:'follow'}).then(function(r){return r.json();}).then(function(r){
      var s2=lsGet(LP_SENT,{})||{};
      if(r&&r.ok&&r.v>=5){s2.v5=true;delete s2.old;}else if(r&&r.ok){s2.old=now;}
      lsSet(LP_SENT,s2);lpSyncShow();return done(r);
    },function(){return done(null);});
  }
  var batch=list.slice(0,40);
  var body={action:'lpsync',key:cfg.k,list:batch.map(function(x){return x.del?{id:x.id,del:1}:{id:x.id,p:x.p,t:x.t,d:Object.assign({at:now},x.d)};})};
  return fetch(cfg.u,{method:'POST',body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(r){
      var s2=lsGet(LP_SENT,{})||{};s2.m=s2.m||{};
      if(r&&r.ok){
        var ok={};(r.done||[]).forEach(function(id){ok[id]=1;});
        batch.forEach(function(x){if(!ok[x.id])return;if(x.del)delete s2.m[x.id];else s2.m[x.id]=x.h;});
        s2.v5=true;delete s2.old;s2.t=now;lsSet(LP_SENT,s2);
        if(list.length>batch.length&&(r.done||[]).length)lpSyncSoon(1500);   // बाकी सदस्य अगली बार में

var LP_OTP_MIN=15;
function lpOtpNew(mid){
  var r=new Uint16Array(1);try{crypto.getRandomValues(r);}catch(e){r[0]=Math.floor(Math.random()*65536);}
  return {c:String(1000+(r[0]%9000)),t:Date.now(),n:0,m:mid,sent:false};
}
function lpOtpMsg(m,code,r){
  return ['🪔 *'+LP.name+'*','नमस्ते '+m.name+' जी 🙏','',
    'आपका इनाम कोड: *'+code+'*',(r?'('+r.pts+' पॉइंट = '+rupee(r.off)+' की छूट)':''),'',
    'यह कोड दुकान के काउंटर पर बताएँ। '+LP_OTP_MIN+' मिनट तक चलेगा।',
    'आप अभी दुकान पर नहीं हैं तो यह कोड किसी को न बताएँ।',LP_SIGN].join('\n');
}
function lpOtpVerified(d,m){return !!(d&&m&&d.vf&&d.vfm===m.id);}
function lpRenderOtp(){
  var d=ui.lDraft,box=$('#lp-otp');if(!d||!box)return;
  var m=d.mid?findMember(d.mid):null,want=!!(m&&d.ri>=0);
  d._otpShown=want;
  if(!want){box.innerHTML='';return;}
  if(lpOtpVerified(d,m)){
    box.innerHTML=d.vf==='c'?'<div class="lpotp ok">✅ ग्राहक का कोड सही — इनाम लगेगा</div>':
      '<div class="lpotp skip"><span>⚠️ बिना कोड — हिसाब में "बिना कोड" लिखा जाएगा</span><button class="lnk" data-act="lp-otp-undo">बदलो</button></div>';
    return;
  }
  if(!d.otp||d.otp.m!==m.id||d.otp.n>=3||Date.now()-d.otp.t>LP_OTP_MIN*60000)d.otp=lpOtpNew(m.id);
  var href=waLink(m.phone,lpOtpMsg(m,d.otp.c,LP.rewards[d.ri]));
  box.innerHTML='<div class="lpotp"><b>🔐 इनाम से पहले ग्राहक की पहचान</b>'+
    '<p class="hint">ग्राहक के WhatsApp पर 4 अंकों का कोड भेजो — ग्राहक जो कोड बताए, नीचे डालो।</p>'+
    '<a class="btn small'+(d.otp.sent?'':' primary')+'" href="'+esc(href)+'" target="_blank" rel="noopener" data-act="lp-otp-send">📲 '+(d.otp.sent?'कोड फिर से भेजो':'कोड भेजो (WhatsApp)')+'</a>'+
    (d.otp.sent?'<label class="fl">ग्राहक से कोड पूछकर डालो<input id="lp-otp-in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····" value="'+esc(d.otpIn||'')+'"></label>':'')+
    '<div class="err" id="lp-otp-err">'+esc(d.otpErr||'')+'</div>'+
    '<button class="lnk" data-act="lp-otp-skip">ग्राहक के पास फ़ोन नहीं / मैं पहचानता हूँ — बिना कोड</button></div>';
}
function lpOtpInput(t){
  var d=ui.lDraft,m=d&&d.mid?findMember(d.mid):null;if(!d||!m||!d.otp)return;
  var v=String(t.value||'').replace(/\D/g,'').slice(0,4);
  if(v!==t.value)t.value=v;
  d.otpIn=v;
  if(v.length<4)return;
  if(Date.now()-d.otp.t>LP_OTP_MIN*60000){
    d.otp=null;d.otpIn='';d.otpErr='कोड की मियाद ('+LP_OTP_MIN+' मिनट) पूरी — नया कोड भेजो।';lpRenderOtp();return;
  }
  if(v===d.otp.c){d.vf='c';d.vfm=m.id;d.otpIn='';d.otpErr='';lpRenderOtp();toast('✅ कोड सही');var e=$('#lp-err');if(e)e.textContent='';return;}
  d.otp.n++;d.otpIn='';
  if(d.otp.n>=3){d.otp=null;d.otpErr='3 बार ग़लत कोड — नया कोड भेजो।';}
  else d.otpErr='ग़लत कोड — '+(3-d.otp.n)+' मौके बचे। ग्राहक से दोबारा पूछो।';
  lpRenderOtp();
  setTimeout(function(){var f=$('#lp-otp-in');if(f)f.focus();},30);
}

}
function lpRefreshCalc(){
  var d=ui.lDraft;if(!d)return;
  var m=d.mid?findMember(d.mid):null,s=m?lpState(m.id):{bal:0,bonusGiven:true};
  var base=lpCalc(d.sw,d.pk,-1,false);
  if(d.ri>=0&&lpRewardOk(d.ri,s.bal,base.elig)!=='ok')d.ri=-1;
  if(d._otpShown!==!!(m&&d.ri>=0))lpRenderOtp();
  var c=lpCalc(d.sw,d.pk,d.ri,m&&!s.bonusGiven),ot=Math.max(0,round2(num(d.ot))),bill=round2(c.elig+ot),pay=round2(bill-c.off);
  var rw=$('#lp-rw'),sum=$('#lp-sum');
  if(rw){
    if(!m||s.bal<LP.rewards[0].pts){rw.innerHTML=m?'<p class="hint">इनाम: '+LP.rewards[0].pts+' पॉइंट होने पर (अभी '+s.bal+')</p>':'';}
    else rw.innerHTML='<label class="fl">इनाम (एक बिल पर एक) — अभी '+s.bal+' पॉइंट</label><div class="lprwpick">'+
      '<button type="button" class="'+(d.ri<0?'on':'')+'" data-act="lp-rw" data-i="-1">कोई नहीं</button>'+
      LP.rewards.map(function(r,i){
        var st=lpRewardOk(i,s.bal,base.elig);
        return '<button type="button" class="'+(d.ri===i?'on':'')+'" data-act="lp-rw" data-i="'+i+'"'+(st==='ok'?'':' disabled')+'><b>'+r.pts+' = '+rupee(r.off)+'</b><small>'+
          (st==='ok'?'लगा सकते हैं':(st==='pts'?'पॉइंट कम':'बिल '+rupee(r.min)+'+ चाहिए'))+'</small></button>';
      }).join('')+'</div>';
  }
  if(sum){
    if(!(bill>0)){sum.innerHTML='';return;}
    sum.innerHTML='<div class="udsum lpsum3"><div><span>कुल बिल</span><b>'+rupee(bill)+'</b></div>'+
      '<div><span>छूट</span><b style="color:var(--green)">'+(c.off?'− '+rupee(c.off):'—')+'</b></div>'+
      '<div class="due"><span>ग्राहक देगा</span><b>'+rupee(pay)+'</b></div></div>'+
      (m?'<p class="lpgain">⭐ मिलेंगे <b>+'+(c.pts+c.bo)+' पॉइंट</b>'+(c.bo?' (इसमें '+c.bo+' जुड़ने का बोनस)':'')+
        ' · बाद में कुल <b>'+(s.bal-(c.r?c.r.pts:0)+c.pts+c.bo)+'</b>'+(c.capped?'<br><small>एक बिल पर ज़्यादा से ज़्यादा '+LP.cap+' पॉइंट</small>':'')+'</p>':'');
  }
}
function lpSaveBuy(){
  var d=ui.lDraft,err=$('#lp-err');if(!d)return;
  var m=d.mid?findMember(d.mid):null;
  if(!m){err.textContent='किसकी ख़रीद है — सदस्य चुनो या नया बनाओ।';return;}
  var s=lpState(m.id),c=lpCalc(d.sw,d.pk,d.ri,!s.bonusGiven),ot=Math.max(0,round2(num(d.ot)));
  if(!(c.elig+ot>0)){err.textContent='रकम लिखो।';return;}
  if(c.elig+ot>500000){err.textContent='रकम बहुत बड़ी है — एक बार जाँच लो।';return;}
  if(d.ri>=0&&lpRewardOk(d.ri,s.bal,c.elig)!=='ok'){err.textContent='यह इनाम इस बिल पर नहीं लग सकता।';return;}
  if(d.ri>=0&&!lpOtpVerified(d,m)){
    err.textContent='इनाम के लिए पहले ग्राहक का कोड डालो — या "बिना कोड" चुनो।';
    var ob=$('#lp-otp');if(ob)ob.scrollIntoView({block:'center'});
    return;
  }
  if(c.elig>LP.bigBill&&!d.bigOk){d.bigOk=true;err.textContent=rupee(c.elig)+' का बड़ा बिल है — रकम सही है? सही है तो फिर से "Save करो" दबाओ।';return;}
  var b={id:uid(),m:m.id,t:Date.now(),s:c.sw,k:c.pk,o:ot,r:c.r?c.r.pts:0,f:c.off,p:c.pts,bo:c.bo};
  if(b.r)b.vf=d.vf;
  LY().b.push(b);
  save();closeSheet();
  lpSyncSoon(800);
  ui.view='lmember';ui.memberId=m.id;
  renderRoute();window.scrollTo(0,0);
  lpDone(b);
}

function lpCardImage(mid){
  var m=findMember(mid);if(!m)return Promise.reject(new Error('member'));
  return Promise.all([biFontsReady(),biLoadImg('logo-header.png')]).then(function(r){
    var logo=r[1],s=lpState(m.id),W=BI.W,P=BI.P;
    var hist=[];
    memberBills(m.id).forEach(function(b){if(!b.v)hist.push({t:b.t,b:b});});
    s.ev.forEach(function(x){hist.push({t:keyToDate(x.d).getTime()+1,x:x});});
    hist.sort(function(a,b){return b.t-a.t;});hist=hist.slice(0,8);
    var H=1500+hist.length*58+(s.soon?90:0);
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;
    var ctx=cv.getContext('2d');ctx.textBaseline='alphabetic';
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
