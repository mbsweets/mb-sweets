      det+='<div class="row"><span>💵 कैश बिक्री<small>रात गिना '+rupee(num(e.gc))+' − सुबह '+rupee(num(e.go))+(go2?' + गल्ले से गया '+rupee(go2):'')+(num(e.gin)?' − डाला '+rupee(num(e.gin)):'')+(kc?' − उधारी का नकद जमा '+rupee(kc):'')+'</small></span><b>'+rupee(r.c)+'</b></div>'+
        '<div class="row"><span>📱 UPI बिक्री<small>Paytm का जोड़ '+rupee(num(e.upi))+(ku2?' − उधारी का UPI जमा '+rupee(ku2):'')+'</small></span><b>'+rupee(r.u)+'</b></div>';
    }else if(r.has){
      det+='<div class="row"><span>💵 कैश बिक्री<small>पुराना तरीका ('+hsDm(GL().d0)+' से पहले): गल्ले में बढ़ा '+rupee(num(e.cash))+' + गल्ले से खर्च/निकाला</small></span><b>'+rupee(r.c)+'</b></div>'+
        '<div class="row"><span>📱 UPI बिक्री</span><b>'+rupee(r.u)+'</b></div>';
    }else det+='<p class="hint" style="margin:8px 0 0">'+(isT?'रात को UPI का जोड़ और गल्ला गिनकर लिखिए — बिक्री अपने-आप निकलेगी।':'इस दिन का गल्ला नहीं गिना गया।')+'</p>';
    if(r.ku)det+='<div class="row info"><span>📒 उधार पर दिया<small>पैसा बाद में आएगा — बिक्री में नहीं जुड़ा</small></span><b>'+rupee(r.ku)+'</b></div>';
    det+='<div class="btns">'+(r.gm?'<button class="btn small'+(r.has?'':' primary')+'" data-act="hx-slclose" data-d="'+r.d+'">'+(r.has?'✏️ गिनती / UPI बदलो':'🌙 दिन बंद करो')+'</button>':'')+
      '<button class="btn small" data-act="hx-goday" data-d="'+r.d+'">📅 उस दिन का पूरा हिसाब</button></div>';
    return row+'<div class="sldet">'+det+'</div>';
  }).join('')+'</div>'+
  '<p class="hint" style="margin:8px 2px 0">कुल बिक्री = कैश + UPI · ⭐ = महीने का सबसे अच्छा दिन · हफ़्ता/साल/पिछले साल से तुलना → <button class="lnk" data-act="hx-tab" data-v="rep">📊 रिपोर्ट</button></p>';
  return html;

/* ---------- 📊 रिपोर्ट टैब ---------- */
var RP_P=[['week','हफ़्ता'],['month','महीना'],['year','साल'],['custom','तारीख़ से–तक']];
function rpYearShift(k,n){var y=+k.slice(0,4)+n,md=k.slice(5);if(md==='02-29')md='02-28';return y+'-'+md;}
function rpPeriod(){
  var r=HX().rp,t=todayStr(),ref=r.ref||t,from,to,label;
  if(r.p==='month'){var ym=ref.slice(0,7);from=ym+'-01';to=moEnd(ym);label=moName(ym);}
  else if(r.p==='year'){var y=ref.slice(0,4);from=y+'-01-01';to=y+'-12-31';label='साल '+y;}
  else if(r.p==='custom'){from=r.from||hsKeyAdd(t,-29);to=r.to||t;if(from>to){var z=from;from=to;to=z;}label=hsDm(from)+' – '+hsDm(to)+' '+to.slice(0,4);}
  else{var dt=new Date(ref+'T12:00:00'),wd=(dt.getDay()+6)%7;from=hsKeyAdd(ref,-wd);to=hsKeyAdd(from,6);label=hsDm(from)+' – '+hsDm(to);}
  var upto=to<t?to:t,n=Math.max(0,dayDiff(from,upto)),len=dayDiff(from,to)+1;
  var pf=r.p==='month'?moAdd(from.slice(0,7),-1)+'-01':(r.p==='year'?(+from.slice(0,4)-1)+'-01-01':hsKeyAdd(from,-len));
  return {p:r.p,from:from,to:to,upto:upto,label:label,cur:to>=t,future:from>t,
    prev:[pf,hsKeyAdd(pf,n)],ly:[rpYearShift(from,-1),rpYearShift(upto,-1)]};
}
function rpFixed(from,to,ex){
  var days=dayDiff(from,to)+1,L=[];
  FIXED().forEach(function(f){
    if(!(num(f.v)>0))return;
    var rec=0,kw=String(f.k||f.n||'').replace(/\s*\(.*$/,'').trim();
    if(kw)Object.keys(ex.oth).forEach(function(n){if(n.indexOf(kw)>-1)rec+=ex.oth[n];});
    var est=Math.round(num(f.v)*days/30.4);
    L.push({n:f.n,month:num(f.v),est:est,rec:round2(rec),add:round2(Math.max(0,est-rec))});
  });
  return L;
}
function rpChart(from,upto){
  var n=dayDiff(from,upto)+1,cols=[];
  if(n<=0)return '';
  var td=todayStr();
  if(n<=62){for(var i=0;i<n;i++){var k=hsKeyAdd(from,i),e=hsGet(k);cols.push({l:n<=8?HS_WD[new Date(k+'T12:00:00').getDay()].slice(0,2):(+k.slice(8,10)),s:hsHas(e)?hsTot(e):0,x:hsExp(e),miss:!hsHas(e)&&k<=td,fut:k>td,k:k>td?'':k});}}
  else{var m=from.slice(0,7);while(m<=upto.slice(0,7)){var a=m+'-01'<from?from:m+'-01',b=moEnd(m)>upto?upto:moEnd(m);cols.push({l:HS_MON[+m.slice(5,7)-1].slice(0,3),s:hsRange(a,b).sum,x:hsExpRange(a,b).tot,miss:false,m:m});m=moAdd(m,1);}}
  var mx=Math.max.apply(null,cols.map(function(c){return Math.max(c.s,c.x);}).concat([1]));
  return '<div class="rpchart'+(cols.length>16?' dense':'')+'">'+cols.map(function(c){
    return '<button class="c'+(c.miss?' miss':'')+(c.fut?' fut':'')+'"'+(c.k?' data-act="hx-goday" data-d="'+c.k+'"':'')+' title="'+esc(String(c.l))+': बिक्री '+rupee(c.s)+' · खर्च '+rupee(c.x)+'"><span class="bars"><i style="height:'+(c.s?Math.max(2,Math.round(c.s/mx*100)):0)+'%"></i><u style="height:'+(c.x?Math.max(2,Math.round(c.x/mx*100)):0)+'%"></u></span><span class="l">'+c.l+'</span></button>';}).join('')+'</div>'+
    '<p class="rplegend"><i></i>बिक्री <u></u>खर्च'+(cols.length<=62&&cols[0]&&cols[0].k?' · डंडा दबाकर वो दिन खोलें':'')+'</p>';
}
function rpDelta(a,b){if(!(b>0))return '';var p=Math.round((a-b)/b*100);return '<em class="'+(p>=0?'up':'dn')+'">'+(p>=0?'▲ ':'▼ ')+Math.abs(p)+'%</em>';}
function rpHtml(){

  ]));
  /* खर्च */

/* किसी भी समय का पूरा हिसाब (महीना, हफ़्ता, साल, तारीख़ से–तक) */
function rpData(from,end){
  var t=todayStr(),to=end<t?end:t,d0=GL().d0;
  var E=DLY().filter(function(e){return e.d>=from&&e.d<=to;});
  var r={from:from,to:to,end:end,cur:to===t&&end>=t,days:0,cash:0,upi:0,miss:[],kU:0,kJc:0,kJu:0};
  E.forEach(function(e){if(hsHas(e)){r.days++;r.cash+=hsCashSale(e);r.upi+=hsUpiSale(e);}});
  r.cash=round2(r.cash);r.upi=round2(r.upi);r.sale=round2(r.cash+r.upi);
  var first=null;DLY().forEach(function(e){if(hsHas(e)&&(!first||e.d<first))first=e.d;});
  if(first&&to>=from&&dayDiff(from,to)<400)for(var dk=(first>from?first:from);dk<=to;dk=hsKeyAdd(dk,1)){if(dk!==t&&!hsHas(hsGet(dk)))r.miss.push(dk);}
  KH().entries.forEach(function(e){if(e.date<from||e.date>to)return;if(e.type==='u')r.kU+=num(e.amount);else if(kjMode(e)==='u')r.kJu+=num(e.amount);else r.kJc+=num(e.amount);});
  r.kU=round2(r.kU);r.kJc=round2(r.kJc);r.kJu=round2(r.kJu);
  var pb={},kb=0;KH().entries.forEach(function(e){if(e.date>to)return;pb[e.partyId]=(pb[e.partyId]||0)+(e.type==='u'?1:-1)*num(e.amount);});
  Object.keys(pb).forEach(function(k){if(pb[k]>0.001)kb+=pb[k];});r.kBal=round2(kb);
  r.ex=hsExpRange(from,to);
  r.sup=SUP().map(function(s){var mo=supMonthOf(s.id,from,to),b=supBal(s.id,to);return {id:s.id,n:s.n,m:mo.m,pd:mo.pd,bal:b.bal,since:b.since};}).filter(function(z){return z.m||z.pd||Math.abs(z.bal)>0.001;});
  r.supDue=round2(r.sup.reduce(function(s,z){return s+Math.max(0,z.bal);},0));
  r.home=0;r.homeBy={};E.forEach(function(e){glList(e.hm).forEach(function(h){r.home+=num(h.v);var k=h.n||'घर के लिए';r.homeBy[k]=round2((r.homeBy[k]||0)+num(h.v));});});r.home=round2(r.home);
  var ps=d0>from?d0:from;r.pFrom=ps;
  if(ps<=to){var sR=hsRange(ps,to);r.pSale=sR.sum;r.pDays=sR.days;r.pEx=hsExpRange(ps,to).tot;r.profit=round2(sR.sum-r.pEx);}
  var G=E.filter(function(e){return e.gm&&hsHas(e);});
  if(G.length){
    var g={open:num(G[0].go),od:G[0].d,close:num(G[G.length-1].gc),cd:G[G.length-1].d,cash:0,kjc:0,gin:0,exg:0,spg:0,hm:0,out:0,jumps:[],gap:[]};
    G.forEach(function(e,i){g.cash+=hsCashSale(e);g.kjc+=kjOn(e.d,'c');g.gin+=num(e.gin);g.exg+=hsExpG(e);g.spg+=glSpG(e);g.hm+=glHome(e);g.out+=num(e.out);
      if(i>0){var pv=G[i-1];if(round2(num(e.go))!==round2(num(pv.gc)))g.jumps.push({d:e.d,go:num(e.go),pd:pv.d,pc:num(pv.gc)});}});
    ['cash','kjc','gin','exg','spg','hm','out'].forEach(function(k){g[k]=round2(g[k]);});
    g.exp=round2(g.open+g.cash+g.kjc+g.gin-g.exg-g.spg-g.hm-g.out);g.diff=round2(g.close-g.exp);
    for(var d2=(d0>from?d0:from);d2<=to;d2=hsKeyAdd(d2,1)){if(d2!==t&&!hsHas(hsGet(d2)))g.gap.push(d2);}
    r.g=g;
  }
  r.made=hsMadeRange(from,to);
  return r;
}

/* मोटी रिपोर्ट — रविवार रात / 1 तारीख़ की घंटी और होम कार्ड के लिए */

/* ---------- 🔧 उधारी में बने सप्लायर के खाते (सहायक की पुरानी गलती) ---------- */
function supKhataSuspects(){
  var ign=Array.isArray(state.supIgnore)?state.supIgnore:[];
  return KH().parties.filter(function(p){return ign.indexOf(p.id)<0;}).map(function(p){
    var best=null,bs=0;
    SUP().forEach(function(s){var base=String(s.n).split(/[(·]/)[0].trim(),sc=Math.max(aiNameScore(p.name,s.n),aiNameScore(p.name,base));
      if(base.split(/\s+/).some(function(w){return w.length>=3&&String(p.name).indexOf(w)>-1;}))sc=Math.max(sc,0.9);
      if(sc>bs){bs=sc;best=s;}});
    if(bs<0.85)return null;
    var es=KH().entries.filter(function(e){return e.partyId===p.id;});
    return es.length?{p:p,s:best,es:es}:null;
  }).filter(Boolean);
}

/* ---------- 🧮 कैलकुलेटर (दबाने पर ही दिखता है) ---------- */
var CALC={t:'',x:''};
function calcIsOpen(){var r=document.getElementById('calcRoot');return !!(r&&r.innerHTML);}
function calcOpen(tid){
  var el=tid?document.getElementById(tid):null;CALC.t=el?tid:'';
  CALC.x=el&&String(el.value).trim()?String(el.value).replace(/[^\d.+\-*/×÷]/g,'').replace(/\*/g,'×').replace(/\//g,'÷'):'';
  var r=document.getElementById('calcRoot');if(!r){r=document.createElement('div');r.id='calcRoot';document.body.appendChild(r);}
  calcPaint();
}
function calcClose(){var r=document.getElementById('calcRoot');if(r)r.innerHTML='';}
function calcEval(s){
  s=String(s||'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[+\-*/.]+$/,'');if(!s)return '';
  if(!/^[\d.+\-*/]+$/.test(s))return NaN;
  var tk=s.match(/\d*\.?\d+|[+\-*/]/g)||[],out=[],ops=[],pr={'+':1,'-':1,'*':2,'/':2},neg=false;
  var ap=function(){var o=ops.pop(),b=out.pop(),a=out.pop();if(a==null||b==null)throw 0;out.push(o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:(b===0?NaN:a/b));};
  try{
    for(var i=0;i<tk.length;i++){var x=tk[i];
      if(/[+\-*/]/.test(x)){if((i===0||/[+\-*/]/.test(tk[i-1]))&&x==='-'){neg=true;continue;}while(ops.length&&pr[ops[ops.length-1]]>=pr[x])ap();ops.push(x);}
      else{out.push(neg?-parseFloat(x):parseFloat(x));neg=false;}}
    while(ops.length)ap();
  }catch(e){return NaN;}
  var v=out.length===1?out[0]:NaN;return isFinite(v)?Math.round(v*100)/100:NaN;
}
function calcPaint(){
  var r=document.getElementById('calcRoot');if(!r)return;
  var v=calcEval(CALC.x),vs=v===''?'':(isNaN(v)?'—':rupee(v));
  var K=[['C','fn'],['⌫','fn'],['÷','op'],['×','op'],['7'],['8'],['9'],['−','op'],['4'],['5'],['6'],['+','op'],['1'],['2'],['3'],['=','eq'],['0'],['00'],['.']];
  r.innerHTML='<div class="calcbg" data-act="calc-x"></div><div class="calc" role="dialog" aria-label="कैलकुलेटर">'+
    '<div class="cdisp"><div class="cx">'+(esc(CALC.x)||'<span>0</span>')+'</div><div class="cv">'+(vs?'= '+vs:'&nbsp;')+'</div></div>'+
    '<div class="ckeys">'+K.map(function(k){return '<button type="button" class="'+(k[1]||'')+'" data-act="calc-k" data-k="'+k[0]+'">'+k[0]+'</button>';}).join('')+'</div>'+
    '<div class="cact"><button type="button" class="btn" data-act="calc-x">बंद करो</button>'+(CALC.t?'<button type="button" class="btn primary" data-act="calc-ok"'+(v===''||isNaN(v)||v<0?' disabled':'')+'>✓ '+(v!==''&&!isNaN(v)?rupee(v)+' ':'')+'डालो</button>':'')+'</div></div>';
}
function calcKey(k){
  var x=CALC.x;
  if(k==='C')x='';else if(k==='⌫')x=x.slice(0,-1);
  else if(k==='='){var v=calcEval(x);if(v!==''&&!isNaN(v))x=String(v);}
  else{var op={'÷':'÷','×':'×','−':'-','+':'+'}[k];
    if(op){if(!x&&op!=='-')return;if(/[+\-×÷]$/.test(x))x=x.slice(0,-1);x+=op;}
    else if(k==='.'){var last=x.split(/[+\-×÷]/).pop();if(last.indexOf('.')>-1)return;x+=(last?'':'0')+'.';}
    else x+=k;}
  if(x.length>40)return;CALC.x=x;calcPaint();
}
function calcOk(){
  var v=calcEval(CALC.x),el=CALC.t?document.getElementById(CALC.t):null;
  if(el&&v!==''&&!isNaN(v)&&v>=0){el.value=String(v);try{el.dispatchEvent(new Event('input',{bubbles:true}));}catch(e){}}
  calcClose();if(el)el.focus();
}

  if((a=t.getAttribute('data-glsma'))!=null){if(x.sm&&x.sm[+a])x.sm[+a].a=t.value;hsRefreshTotals();return true;}
  if((a=t.getAttribute('data-glsmn'))!=null){if(x.sm&&x.sm[+a])x.sm[+a].nt=t.value;return true;}
  if((a=t.getAttribute('data-glspa'))!=null){if(x.sp&&x.sp[+a])x.sp[+a].a=t.value;hsRefreshTotals();return true;}
  if((a=t.getAttribute('data-glspn'))!=null){if(x.sp&&x.sp[+a])x.sp[+a].nt=t.value;return true;}
  if((a=t.getAttribute('data-glhma'))!=null){if(x.hm&&x.hm[+a])x.hm[+a].a=t.value;hsRefreshTotals();return true;}
  if((a=t.getAttribute('data-glhmn'))!=null){if(x.hm&&x.hm[+a])x.hm[+a].n=t.value;return true;}
  return false;
}

function p10(p){return String(p||'').replace(/\D/g,'').slice(-10);}
function cpnRand(n){var a=new Uint32Array(1);try{crypto.getRandomValues(a);}catch(e){a[0]=Math.floor(Math.random()*4294967295);}return a[0]%n;}
function cpnPickAmt(){
  var tot=CPN.vals.reduce(function(s,v){return s+v[1];},0),r=cpnRand(tot);
  for(var i=0;i<CPN.vals.length;i++){if(r<CPN.vals[i][1])return CPN.vals[i][0];r-=CPN.vals[i][1];}
  return CPN.vals[0][0];
}
function cpnByCode(code){code=String(code||'').toUpperCase();return CPNS().filter(function(c){return c.code===code;})[0]||null;}
function cpnNewCode(){
  var abc='ABCDEFGHJKMNPQRSTUVWXYZ23456789',s;
  do{s='';for(var i=0;i<6;i++)s+=abc.charAt(cpnRand(abc.length));}while(cpnByCode(s));
  return s;
}
function cpnUsedBy(code){return state.orders.filter(function(o){return !o.cancelled&&o.cpn&&o.cpn.code===code;})[0]||null;}
function cpnLive(c){return !!c&&!c.x&&c.exp>=todayStr()&&!cpnUsedBy(c.code);}
function cpnForPhone(phone){
  var p=p10(phone);if(p.length<10)return null;
  return CPNS().filter(function(c){return c.ph===p&&cpnLive(c);}).sort(function(a,b){return a.exp<b.exp?-1:(a.exp>b.exp?1:0);})[0]||null;
}
function cpnTagCode(text){var m=/\uD83C\uDF81\s*(?:कूपन|coupon)\s*([A-Za-z0-9]{6})/i.exec(String(text||''));return m?m[1].toUpperCase():'';}
/* नए ऑनलाइन ऑर्डर पर कौन-सा कूपन लगेगा: नोट में लिखा कोड (उसी नंबर का) या उस नंबर का सबसे पहले ख़त्म होने वाला चालू कूपन */
function cpnForOnline(o){
  var tag=cpnTagCode(o.note),c=tag?cpnByCode(tag):null;
  if(c&&cpnLive(c)&&c.ph===p10(o.phone))return c;
  return cpnForPhone(o.phone);
}
/* नोट में कोड है पर लग नहीं सकता — वजह */
function cpnTagProblem(o){
  var tag=cpnTagCode(o.note);if(!tag)return '';
  var c=cpnByCode(tag),bo=billingOrderFor(o.code);
  if(bo&&bo.cpn&&bo.cpn.code===tag)return '';
  if(!c)return 'यह कोड हमारे रिकॉर्ड में नहीं है';
  var u=cpnUsedBy(tag);if(u&&(!bo||u.id!==bo.id))return 'यह पहले ऑर्डर #'+u.no+' में इस्तेमाल हो चुका है';
  if(c.exp<todayStr())return 'इसकी तारीख़ ('+fmtDshort(keyToDate(c.exp))+') निकल गई';
  if(c.ph!==p10(o.phone))return 'यह दूसरे नंबर ('+c.ph.slice(0,2)+'xxxxxx'+c.ph.slice(8)+') का कूपन है';
  return '';
}
function cpnChk(code,amt,exp){var s='mb|'+code+'|'+amt+'|'+exp,h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%1679616;return h.toString(36).toUpperCase();}
function cpnLink(c){var e=String(c.exp).replace(/-/g,'');return orderPageUrl()+'?sc='+c.code+'-'+c.amt+'-'+e+'-'+cpnChk(c.code,c.amt,e);}
function cpnMsgLines(c){
  return ['','🎁 आपके लिए एक *स्क्रैच कार्ड* — खुरचकर देखिए आपको कितनी छूट मिली:',cpnLink(c),

}
function cpnResendMessage(o,c){return ['नमस्ते '+o.name+' जी 🙏'].concat(cpnMsgLines(c)).concat(['','— '+state.shop.name]).join('\n');}
function cpnOfOrder(code){return CPNS().filter(function(c){return c.src===code;})[0]||null;}
/* डिलीवर होने पर: ₹1000+ वाले ऑनलाइन ऑर्डर का कूपन (एक ऑर्डर पर एक ही बार) */
function cpnIssue(o){
  var ex=cpnOfOrder(o.code);if(ex)return ex;
  var bo=billingOrderFor(o.code),gross=bo?orderGross(bo):(num(o.confirmedTotal)||num(o.total));
  if(!(gross>=CPN.min))return null;
  var c={id:uid(),code:cpnNewCode(),amt:cpnPickAmt(),ph:p10(o.phone),name:String(o.name||''),src:o.code,bill:bo?bo.no:'',d:todayStr(),exp:addDaysKey(CPN.days)};
  CPNS().push(c);save();
  return c;
}
function cpnApply(bo,c){
  if(!bo||!c||!cpnLive(c))return false;
  bo.cpn={code:c.code,amt:Math.min(num(c.amt),orderGross(bo))};
  return true;
}
function cpnStats(){
  var used=0,off=0,live=0;
  CPNS().forEach(function(c){var u=cpnUsedBy(c.code);if(u){used++;off+=num(u.cpn.amt);}else if(cpnLive(c))live++;});
  return {n:CPNS().length,used:used,off:round2(off),live:live};
}

/* ---------- 🔔 इस फ़ोन पर घंटी (रजिस्टर → Chrome push → यही ऐप) ---------- */
var PUSH_LS='mbmb-push';
function pushSupported(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);}
function pushOn(){var p=lsGet(PUSH_LS,null);return !!(p&&p.e)&&('Notification' in window)&&Notification.permission==='granted';}
function b64uToU8(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function bufToB64u(buf){if(!buf)return '';var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
/* service worker को रजिस्टर का पता/चाबी चाहिए (खाली घंटी आए तो संदेश पढ़ने के लिए) */
function saveSwCfg(){
  var c=onlineCfg();
  if(!c||!('caches' in window))return Promise.resolve();
  var v=(lsGet(PUSH_LS,{})||{}).v||'';
  return caches.open('mbmb-cfg').then(function(cache){
    return cache.put('cfg',new Response(JSON.stringify({u:c.u,k:c.k,v:v}),{headers:{'Content-Type':'application/json'}}));
  }).catch(function(){});
}
function pushPost(cfg,sub,vapid){
  return fetch(cfg.u,{method:'POST',redirect:'follow',body:JSON.stringify({action:'pushsub',key:cfg.k,sub:sub.toJSON(),name:'billing'})})
    .then(function(r){return r.json();}).then(function(r){
      if(!r||!r.ok)throw {msg:'रजिस्टर ने फ़ोन नहीं जोड़ा ('+((r&&r.error)||'?')+')'};
      lsSet(PUSH_LS,{e:sub.endpoint,v:vapid,t:Date.now()});
      return saveSwCfg();
    });
}
/* Chrome से घंटी का पता लो (पुराना किसी और चाबी का हो तो नया) */
function pushSubscribe(vapid){
  return navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(old){
      if(old){
        var k=old.options&&old.options.applicationServerKey?bufToB64u(old.options.applicationServerKey):'';
        if(k===vapid)return old;
        return old.unsubscribe().then(function(){return null;},function(){return null;});
      }
      return null;
    }).then(function(sub){
      return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(vapid)});
    });
  });
}
function enablePush(){
  var cfg=onlineCfg();
  if(!cfg){toast('पहले ऑनलाइन सेटअप करें (नीचे ⚙️)');return;}
  if(!pushSupported()){openPushHelp('support');return;}
  toast('घंटी चालू कर रहे हैं…');
  var vapid='';
  fetch(cfg.u+'?action=ping',{redirect:'follow'}).then(function(r){return r.json();}).then(function(r){
    if(!r||!r.vapid)throw {msg:'रजिस्टर का कोड पुराना है — कंप्यूटर पर ⚙️ सेटअप का चरण 7 करें'};
    vapid=r.vapid;
    return Notification.requestPermission();
  }).then(function(perm){
    if(perm!=='granted')throw {perm:true};
    return pushSubscribe(vapid);
  }).then(function(sub){
    return pushPost(cfg,sub,vapid);
  }).then(function(){
    toast('🔔 घंटी चालू ✓ — अब "टेस्ट" दबाकर देखो');
    if(ui.view==='backup'&&!$('#ov'))renderBackup();
  }).catch(function(e){
    if(e&&e.perm){openPushHelp('denied');return;}
    toast((e&&e.msg)||('घंटी चालू नहीं हो पाई: '+String((e&&e.message)||e||'?').slice(0,60)));
  });
}
function testPush(){

}
function disablePush(){
  var cfg=onlineCfg(),p=lsGet(PUSH_LS,null);
  lsSet(PUSH_LS,null);
  var done=function(){toast('इस फ़ोन की घंटी बंद');if(ui.view==='backup'&&!$('#ov'))renderBackup();};
  if(!pushSupported()){done();return;}
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription();}).then(function(sub){
    var ep=(sub&&sub.endpoint)||(p&&p.e)||'';
    var jobs=[];
    if(sub)jobs.push(sub.unsubscribe().catch(function(){}));
    if(cfg&&ep)jobs.push(fetch(cfg.u,{method:'POST',redirect:'follow',body:JSON.stringify({action:'pushunsub',key:cfg.k,endpoint:ep})}).catch(function(){}));
    return Promise.all(jobs);
  }).then(done,done);
}
/* ऐप खुलते ही: घंटी का पता बदला हो तो रजिस्टर को नया भेजो (हफ़्ते में एक बार वैसे भी) */
function pushCheck(){
  saveSwCfg();
  var cfg=onlineCfg(),p=lsGet(PUSH_LS,null);
  if(!cfg||!p||!p.e||!pushSupported()||Notification.permission!=='granted')return;
  pushSubscribe(p.v).then(function(sub){
    if(sub.endpoint!==p.e||Date.now()-(p.t||0)>7*86400000)return pushPost(cfg,sub,p.v);
  }).catch(function(){});
}

function orderExtra(o){return round2(Math.max(0,orderPaid(o)-orderTotal(o)));}
function canAdjustExtra(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled;});
  return os.some(function(o){return orderExtra(o)>0;})&&os.some(function(o){return orderDue(o)>0;});
}
function adjustExtra(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var moved=0,today=todayStr();
  os.forEach(function(src){
    var ex=orderExtra(src);
    os.forEach(function(dst){
      if(ex<=0.001||dst===src)return;
      var need=orderDue(dst);if(need<=0)return;
      var take=round2(Math.min(ex,need));
      src.payments.push({id:uid(),amount:-take,date:today,note:'#'+dst.no+' में adjust'});
      dst.payments.push({id:uid(),amount:take,date:today,note:'#'+src.no+' से adjust'});
      ex=round2(ex-take);moved=round2(moved+take);
    });
  });
  return moved;
}
function openLumpPayment(cid){
  var c=findCustomer(cid);
  var el=customerOrders(cid).filter(function(o){return !o.cancelled&&orderDue(o)>0;});
  var tot=round2(el.reduce(function(s,o){return s+orderDue(o);},0));
  openSheet('<div class="sh-head"><h2>एक साथ जमा</h2><button class="lnk muted" data-act="close">बंद करो</button></div>'+
    '<p class="hint">'+esc(c.name)+' के '+el.length+' ऑर्डर पर कुल '+rupee(tot)+' बाकी है। जितना पैसा मिला वो सबसे पुराने ऑर्डर से शुरू करके अपने आप बँट जाएगा।</p>'+
    '<label class="fl">कितना पैसा मिला ₹<input id="lp-amt" type="number" inputmode="decimal" step="any" min="0" value="'+tot+'"></label>'+
    '<label class="fl">तारीख<input id="lp-date" type="date" value="'+todayStr()+'"></label>'+
    '<label class="fl">नोट (वैकल्पिक)<input id="lp-note" type="text"></label>'+
    '<div class="err" id="lp-err"></div>'+
    '<div class="sh-actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-lump" data-id="'+cid+'">Save करो</button></div>');
  setTimeout(function(){var f=$('#lp-amt');if(f){f.focus();f.select();}},60);
}

  openPaymentForm(o.customerId,orderId);

/* ---------- 📒 उधारी खाता — ऑर्डर वाले हिसाब से बिल्कुल अलग ----------
   state.khata = {parties:[{id,name,phone,createdAt,remindedAt}], entries:[{id,partyId,type:'u'|'j',amount,note,date:'YYYY-MM-DD',createdAt,items?}]}
   items (सिर्फ़ उधार में, चाहें तो) = [{iid,name,unit,rate,qty}] — बिलिंग ऐप जैसा सामान; तब amount = सामान का जोड़।
   u = उधार दिया, j = जमा मिला। बाकी = कुल उधार − कुल जमा।
   ऑर्डर वाले ग्राहक/बाकी इसमें नहीं आते, और उधारी ऑर्डर वाले बाकी में नहीं जुड़ती।
   मैसेज: ऐप तैयार करता है, WhatsApp खुलता है, मालिक सिर्फ Send दबाता है (1 टैप, मुफ़्त)। */
var REMIND_DAYS=15;
var UD_CHIPS=['दूध','दही','मिठाई','पनीर','केक','नमकीन'];
function KH(){
  if(!state.khata||typeof state.khata!=='object')state.khata={parties:[],entries:[]};
  if(!Array.isArray(state.khata.parties))state.khata.parties=[];
  if(!Array.isArray(state.khata.entries))state.khata.entries=[];
  return state.khata;
}
function findParty(id){var ps=KH().parties;for(var i=0;i<ps.length;i++)if(ps[i].id===id)return ps[i];return null;}
function findKEntry(id){var es=KH().entries;for(var i=0;i<es.length;i++)if(es[i].id===id)return es[i];return null;}
function partyByPhone(ph,exceptId){
  var n=phoneNorm(ph);if(!n)return null;
  var ps=KH().parties;
  for(var i=0;i<ps.length;i++)if(ps[i].id!==exceptId&&phoneNorm(ps[i].phone)===n)return ps[i];
  return null;
}
function partyPhoneProblem(ph,exceptId){
  if(!ph)return '';
  if(ph.replace(/\D/g,'').length<10)return 'मोबाइल नंबर पूरा 10 अंकों का लिखो।';
  if(!phoneValid(ph))return 'यह मोबाइल नंबर सही नहीं लगता — 10 अंक, 6/7/8/9 से शुरू।';
  var dup=partyByPhone(ph,exceptId);
  if(dup)return 'यह नंबर उधारी खाते में पहले से "'+dup.name+'" के नाम से है।';
  return '';
}
function partyEntries(pid){
  return KH().entries.filter(function(e){return e.partyId===pid;}).sort(function(a,b){
    return a.date<b.date?-1:(a.date>b.date?1:(num(a.createdAt)-num(b.createdAt)));
  });
}
function partyTotals(pid){
  var u=0,j=0;
  KH().entries.forEach(function(e){if(e.partyId!==pid)return;if(e.type==='u')u+=num(e.amount);else j+=num(e.amount);});
  u=round2(u);j=round2(j);
  return {u:u,j:j,bal:round2(u-j)};
}
/* सबसे पुराना जो उधार अभी चुकता नहीं हुआ (जमा पहले सबसे पुराने उधार में जाता है) */
function partyOldestDueKey(pid){
  var es=partyEntries(pid),jama=0;
  es.forEach(function(e){if(e.type==='j')jama+=num(e.amount);});
  jama=round2(jama);
  for(var i=0;i<es.length;i++){
    var e=es[i];if(e.type!=='u')continue;
    var a=num(e.amount);
    if(jama>=a-0.001){jama=round2(jama-a);continue;}
    return e.date;
  }
  return null;
}
function partyDueDays(pid){var k=partyOldestDueKey(pid);return k?dayDiff(k,todayStr()):null;}
function daysSinceTs(ts){return Math.floor((Date.now()-num(ts))/86400000);}
function partyNeedsReminder(p){
  if(partyTotals(p.id).bal<=0)return false;
  var d=partyDueDays(p.id);
  if(d===null||d<REMIND_DAYS)return false;
  if(p.remindedAt&&dayDiff(dayKey(p.remindedAt),todayStr())<REMIND_DAYS)return false;
  return true;
}
function khataRemindList(){return KH().parties.filter(partyNeedsReminder);}
function khataTotalDue(){var t=0;KH().parties.forEach(function(p){var b=partyTotals(p.id).bal;if(b>0)t+=b;});return round2(t);}
function khataToday(type){var t=todayStr(),s=0;KH().entries.forEach(function(e){if(e.type===type&&e.date===t)s+=num(e.amount);});return round2(s);}
function hiShort(k){var d=keyToDate(k);return d.getDate()+' '+HI_MONTHS[d.getMonth()];}
function remindedText(p){
  if(!p.remindedAt)return '';
  var d=dayDiff(dayKey(p.remindedAt),todayStr());
  return d<=0?'आज याद दिलाया':(d===1?'कल याद दिलाया':d+' दिन पहले याद दिलाया');
}
function entryLabel(e){
  if(e.type==='j'&&(e.m==='u'||e.m==='c')){var mt=e.m==='u'?'UPI':'नकद';return 'जमा · '+mt+(e.note&&!/^(upi|नकद|cash)$/i.test(String(e.note).trim())?' — '+e.note:'');}
  return (e.type==='u'?'उधार':'जमा')+(e.note?' — '+e.note:'');
}
/* उधार में सामान (1 नवंबर 2026, मालिक: "बिलिंग ऐप जैसा… ग्राहक ने क्या लिया") — पुरानी एंट्री बिना सामान के वैसी ही चलती हैं */
function kItems(e){return (e&&Array.isArray(e.items))?e.items.filter(function(i){return i&&typeof i==='object'&&num(i.qty)>0;}):[];}
function kItemTxt(i){return displayName(i)+' '+fmtQty(i.qty)+' '+i.unit;}
function kItemsShort(e,max){var its=kItems(e);if(!its.length)return '';var m=max||its.length,t=its.slice(0,m).map(kItemTxt).join(', ');return its.length>m?t+' +'+(its.length-m)+' और':t;}
function kItemLines(L,e,pre){kItems(e).forEach(function(i,n){L.push((pre||'')+(n+1)+'. '+displayName(i)+' — '+fmtQty(i.qty)+' '+i.unit+' × '+rupee(i.rate)+' = '+rupee(lineAmt(i)));});}
function kLinesTotal(d){return round2((d.lines||[]).reduce(function(t,l){return t+lineAmt(l);},0));}

/* --- पुराने वर्ज़न में उधार ऑर्डर बनकर गया था (kind:'udhar') — उसे उधारी खाते में ले आओ --- */
function migrateUdharOrders(){
  var uds=state.orders.filter(function(o){return o.kind==='udhar';});
  if(!uds.length)return 0;
  var k=KH(),udCust={};
  uds.forEach(function(o){
    udCust[o.customerId]=1;
    if(o.cancelled)return;
    if(k.entries.some(function(x){var sx=String(x.src||'');return sx===o.id||sx.indexOf(o.id+':')===0;}))return; // पहले ही आ चुका — दोबारा नहीं
    var c=findCustomer(o.customerId);
    var p=(c&&c.phone)?partyByPhone(c.phone,null):null;
    if(!p&&c){for(var i=0;i<k.parties.length;i++)if(k.parties[i].name===c.name&&!k.parties[i].phone&&!c.phone){p=k.parties[i];break;}}
    if(!p){p={id:uid(),name:c?c.name:'ग्राहक',phone:c?(c.phone||''):'',createdAt:Date.now(),remindedAt:(c&&c.remindedAt)||0};k.parties.push(p);}
    var amt=round2(o.items.reduce(function(s,i){return s+num(i.qty)*num(i.rate);},0));
    if(amt>0)k.entries.push({id:uid(),src:o.id,partyId:p.id,type:'u',amount:amt,note:o.udNote||'',date:dayKey(o.date),createdAt:o.createdAt||Date.now()});
    o.payments.forEach(function(pay){
      var pa=round2(num(pay.amount));if(!pa)return;
      k.entries.push({id:uid(),src:o.id+':'+(pay.id||''),partyId:p.id,type:pa>0?'j':'u',amount:Math.abs(pa),note:(pay.note&&pay.note!=='एक साथ जमा')?pay.note:'',date:pay.date||dayKey(o.date),createdAt:Date.now()});
    });
  });
  state.orders=state.orders.filter(function(o){return o.kind!=='udhar';});
  state.customers=state.customers.filter(function(c){return !(udCust[c.id]&&customerOrders(c.id).length===0);});
  save();
  return uds.length;
}

/* --- मैसेज --- */
function payLine(L,due){
  if(due>0){
    L.push('QR से पेमेंट (रकम अपने-आप भरी आएगी): '+orderPageUrl()+'#pay='+round2(due));
    L.push('पेमेंट के बाद स्क्रीनशॉट इसी चैट में भेज दीजिए।');
  }
}
function signOff(L){L.push('');L.push('धन्यवाद — '+state.shop.owner+(state.shop.phone?' ('+state.shop.phone+')':''));}
function balLine(L,bal){
  if(bal>0)L.push('कुल बकाया: *'+rupee(bal)+'*');
  else if(bal<0)L.push('आपका '+rupee(-bal)+' एडवांस जमा है ✅');
  else L.push('आपका पूरा हिसाब साफ़ है ✅');
}
function kUdharMessage(e){
  var p=findParty(e.partyId),bal=partyTotals(p.id).bal,L=[];
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');
  var its=kItems(e);
  L.push((e.date===todayStr()?'आज ':hiShort(e.date)+' को ')+rupee(e.amount)+' का उधार आपके खाते में लिखा गया'+(e.note?' ('+e.note+')':'')+(its.length?':':'।'));
  if(its.length){kItemLines(L,e,'');L.push('');}
  balLine(L,bal);
  if(bal>0){L.push('');payLine(L,bal);}
  signOff(L);
  return L.join('\n');
}
function kJamaMessage(e){
  var p=findParty(e.partyId),bal=partyTotals(p.id).bal,L=[];
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');
  L.push(rupee(e.amount)+' जमा हो गए'+(e.date!==todayStr()?' ('+hiShort(e.date)+')':'')+' — धन्यवाद!');
  if(bal>0){L.push('अब बाकी: *'+rupee(bal)+'*');L.push('');payLine(L,bal);}
  else balLine(L,bal);
  signOff(L);
  return L.join('\n');
}
function kRemindMessage(p){
  var bal=partyTotals(p.id).bal,od=partyOldestDueKey(p.id),L=[];
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');
  L.push('आपका *'+rupee(bal)+'* बकाया है'+(od&&od<todayStr()?' ('+hiShort(od)+' से)':'')+'। सुविधा से जमा कर दीजिए।');
  L.push('');
  payLine(L,bal);
  L.push('पूरा हिसाब चाहिए तो इसी चैट में बता दीजिए।');
  signOff(L);
  return L.join('\n');
}
function kHisaabMessage(p){
  var es=partyEntries(p.id),t=partyTotals(p.id),L=[];
  var MAX=40,skip=Math.max(0,es.length-MAX),before=0;
  for(var i=0;i<skip;i++)before+=es[i].type==='u'?num(es[i].amount):-num(es[i].amount);
  L.push('*'+state.shop.name+'*');
  L.push('नमस्ते '+p.name+' जी 🙏');
  L.push('आपका उधारी हिसाब:');
  L.push('-------------------');
  if(skip)L.push('पिछला बकाया ('+skip+' पुरानी एंट्री): '+rupee(round2(before)));
  var shownE=es.slice(skip),budget=25,det={};
  for(var j=shownE.length-1;j>=0;j--){var ni=kItems(shownE[j]).length;if(ni&&ni<=budget){det[shownE[j].id]=1;budget-=ni;}}
  shownE.forEach(function(e){
    var ex=e.note||(kItems(e).length&&!det[e.id]?kItemsShort(e,2):'');
    L.push(hiShort(e.date)+' — '+(e.type==='u'?'उधार ':'जमा ')+rupee(e.amount)+(ex?' ('+ex+')':''));
    if(det[e.id])kItemLines(L,e,'    ');
  });
  L.push('-------------------');
  L.push('कुल उधार: '+rupee(t.u)+'  |  कुल जमा: '+rupee(t.j));
  if(t.bal>0)L.push('*बाकी: '+rupee(t.bal)+'*');else balLine(L,t.bal);
  if(t.bal>0){L.push('');payLine(L,t.bal);}
  signOff(L);
  return L.join('\n');
}
function kMsg(kind,ref){
  if(kind==='udhar'||kind==='jama'){var e=findKEntry(ref);if(!e||!findParty(e.partyId))return '';return kind==='udhar'?kUdharMessage(e):kJamaMessage(e);}
  var p=findParty(ref);if(!p)return '';
  return kind==='hisaab'?kHisaabMessage(p):kRemindMessage(p);
}

/* --- उधारी टैब --- */
function renderKhata(){
  var q=(ui.kSearch||'').trim().toLowerCase();
  var rows=KH().parties.map(function(p){
    var t=partyTotals(p.id);
    return {p:p,bal:t.bal,need:partyNeedsReminder(p),days:partyDueDays(p.id),last:partyEntries(p.id).slice(-1)[0]};
  });
  var needN=rows.filter(function(r){return r.need;}).length;
  var dueN=rows.filter(function(r){return r.bal>0;}).length;
  var list=rows.filter(function(r){return !q||r.p.name.toLowerCase().indexOf(q)>-1||String(r.p.phone||'').replace(/\s/g,'').indexOf(q.replace(/\s/g,''))>-1;})
    .sort(function(a,b){
      return (b.need-a.need)||((b.bal>0)-(a.bal>0))||((b.days||0)-(a.days||0))||((b.last?b.last.createdAt:0)-(a.last?a.last.createdAt:0));

  var html='<div class="sechead" style="margin-top:4px"><h2>📒 उधारी खाता</h2><span class="cnt">'+KH().parties.length+' खाते</span></div>'+

      '<div class="due"><b>'+rupee(khataTotalDue())+'</b><span>कुल बकाया'+(dueN?' ('+dueN+')':'')+'</span></div>'+
      '<div><b style="color:var(--red)">'+rupee(khataToday('u'))+'</b><span>आज उधार</span></div>'+
      '<div><b style="color:var(--green)">'+rupee(khataToday('j'))+'</b><span>आज जमा</span></div></div>'+
    (needN?'<div class="banner remind">🔔 '+(needN===1?'1 व्यक्ति':needN+' लोगों')+' का बकाया '+REMIND_DAYS+' दिन से पुराना है — नीचे "🔔" वाले नाम खोलकर "💬 याद दिलाओ" दबाओ।</div>':'')+
    '<div class="quickrow"><button class="btn primary" data-act="k-new" data-type="u">📒 उधार लिखो</button><button class="btn" data-act="k-new" data-type="j">💰 जमा लिखो</button></div>'+
    (KH().parties.length?'<input id="k-search" class="udsearch" type="search" placeholder="नाम या फोन से खोजो" autocomplete="off" value="'+esc(ui.kSearch||'')+'">':'')+
    '<div class="addrow"><button class="lnk" data-act="k-party-new">+ नया खाता</button></div>';
  if(!KH().parties.length){
    html+='<div class="empty"><b>अभी उधारी खाते में कोई नहीं</b>"📒 उधार लिखो" दबाओ — नाम, रकम लिखो, बस।</div>';
  }else if(!list.length){
    html+='<div class="empty"><b>कुछ नहीं मिला</b>नाम या फोन नंबर से दोबारा खोजो।</div>';
  }else{

function saveKEntry(){
  var d=ui.kDraft,err=$('#ke-err');if(!d)return;
  if(!d.partyId){err.textContent='किसका खाता है — नाम चुनो या नया बनाओ।';return;}
  var items=(d.type==='u')?d.lines.filter(function(l){return num(l.qty)>0;}).map(function(l){return {iid:l.iid||'',name:l.name,unit:l.unit,rate:Math.max(0,num(l.rate)),qty:num(l.qty)};}):[];
  if(d.type==='u'&&d.lines.length&&!items.length){err.textContent='सामान की मात्रा लिखो (या × दबाकर हटा दो)।';return;}
  var amtEl=$('#ke-amt');
  var amt=items.length?round2(items.reduce(function(t,i){return t+lineAmt(i);},0)):round2(num(amtEl?amtEl.value:d.amount));
  if(items.length&&!(amt>0)){err.textContent='सामान का रेट भरो — टोटल ₹0 है।';return;}
  if(!(amt>0)){err.textContent='रकम लिखो — या ऊपर से सामान चुनो।';return;}
  if(amt>1000000){err.textContent='रकम बहुत बड़ी है — एक बार जाँच लो।';return;}
  var note=$('#ke-note').value.trim().slice(0,60);
  var dk=$('#ke-date').value||todayStr();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dk)){err.textContent='सही तारीख चुनो।';return;}
  if(dk>todayStr()){err.textContent='आगे की तारीख नहीं लिख सकते।';return;}
  if(d.editId){
    var e=findKEntry(d.editId);if(!e){closeSheet();return;}
    e.amount=amt;e.note=note;e.date=dk;if(e.type==='j')e.m=d.mode==='u'?'u':'c';
    if(items.length)e.items=items;else delete e.items;
    save();closeSheet();renderRoute();toast((e.type==='u'?'उधार':'जमा')+' बदल गया');
    return;
  }
  var ne={id:uid(),partyId:d.partyId,type:d.type,amount:amt,note:note,date:dk,createdAt:Date.now()};
  if(d.type==='j')ne.m=d.mode==='u'?'u':'c';
  if(items.length)ne.items=items;
  KH().entries.push(ne);
  save();closeSheet();
  ui.view='party';ui.partyId=d.partyId;
  renderRoute();window.scrollTo(0,0);
  openKDone(ne);
}

/* ================== ⭐ माँ भगवती मिठास पॉइंट्स (लॉयल्टी) ==================
   नियम मालिक ने तय किए (6 अक्टूबर 2026) — बिना पूछे न बदलें:
   • मिठाई + केक: हर पूरे ₹50 पर 1 पॉइंट · पैकेट सामान: हर पूरे ₹100 पर 1 पॉइंट · दूध/दही/पनीर/थोक: 0
   • पहली ख़रीद (मिठाई/केक/पैकेट ₹100+) पर 5 बोनस, एक बार · एक बिल पर ज़्यादा से ज़्यादा 50 पॉइंट (बोनस अलग)
   • इनाम: 10 = ₹15 (बिल ₹250+) · 25 = ₹40 (₹500+) · 50 = ₹100 (₹1,000+) — न्यूनतम बिल में सिर्फ़ मिठाई/केक/पैकेट
   • एक बिल पर एक इनाम · नकद नहीं · इसी बिल से पहले के पॉइंट · पुराने पहले कटें (FIFO) · हर पॉइंट 365 दिन
   • पॉइंट उस रकम पर जो ग्राहक ने दी (छूट घटाकर) · पॉइंट सिर्फ़ मालिक इस फ़ोन से चढ़ाते हैं
   डेटा: state.loyal = {m:[सदस्य], b:[बिल]} — बिल कभी मिटता नहीं; ग़लती पर "रद्द" (v) लगता है।
   सदस्य: {id,name,phone,c:जुड़ने का समय,ok:सहमति का समय,wa:WhatsApp की सहमति,rm:आख़िरी याद}
   बिल: {id,m,t,s:मिठाई+केक ₹,k:पैकेट ₹,o:बिना पॉइंट वाला ₹,r:कटे पॉइंट,f:छूट ₹,p:मिले पॉइंट,bo:बोनस,v:{t,w}} */
var LP={name:'माँ भगवती मिठास पॉइंट्स',swPer:50,pkPer:100,bonus:5,bonusMin:100,cap:50,days:365,warnDays:30,remindDays:15,bigBill:2500,
  rewards:[{pts:10,off:15,min:250},{pts:25,off:40,min:500},{pts:50,off:100,min:1000}]};
var LP_WHY=['ग़लत रकम लिखी गई','ग़लत ग्राहक पर चढ़ गया','ग्राहक ने सामान लौटाया','ऑर्डर कैंसल हुआ'];
function LY(){
  var l=state.loyal;
  if(!l||typeof l!=='object')l=state.loyal={m:[],b:[]};
  if(!Array.isArray(l.m))l.m=[];
  if(!Array.isArray(l.b))l.b=[];
  return l;
}
function findMember(id){var a=LY().m;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function findLBill(id){var a=LY().b;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function memberByPhone(ph,exceptId){
  var n=phoneNorm(ph);if(!n)return null;
  var a=LY().m;for(var i=0;i<a.length;i++)if(a[i].id!==exceptId&&phoneNorm(a[i].phone)===n)return a[i];
  return null;
}
var LP_BIDX=null;   // सदस्य → उसके बिल (हर save पर नया बनता है)
function memberBills(mid){
  if(!LP_BIDX){
    LP_BIDX={};
    LY().b.forEach(function(x){(LP_BIDX[x.m]=LP_BIDX[x.m]||[]).push(x);});
    Object.keys(LP_BIDX).forEach(function(k){LP_BIDX[k].sort(function(a,b){return a.t-b.t;});});
  }
  return (LP_BIDX[mid]||[]).slice();
}
function lpAddDays(k,n){var d=keyToDate(k);d.setDate(d.getDate()+n);return dayKey(d);}
function lpDate(k){var d=keyToDate(k);return d.getDate()+' '+HI_MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function lpBillAmt(b){return round2(num(b.s)+num(b.k)+num(b.o));}

/* सदस्य का पूरा हिसाब: हर बिल के पॉइंट की एक "थैली" (365 दिन), इनाम सबसे पुरानी थैली से कटे,
   मियाद पूरी होते ही बचे पॉइंट ख़त्म। रद्द बिल गिनती में नहीं। */
function lpState(mid,skipBill){
  var today=todayStr(),lots=[],debt=0,ev=[],earned=0,used=0,expired=0,rewards=0,saved=0,bonusGiven=false;
  var expireUpTo=function(d){
    lots.forEach(function(L){if(L.left>0&&L.exp<=d){ev.push({k:'x',d:L.exp,pts:L.left});expired+=L.left;L.left=0;}});
  };
  memberBills(mid).forEach(function(b){
    if(b.v||b.id===skipBill)return;
    var d=dayKey(b.t);
    expireUpTo(d);
    if(num(b.r)>0){
      var need=num(b.r);
      for(var i=0;i<lots.length&&need>0;i++){var take=Math.min(lots[i].left,need);lots[i].left-=take;need-=take;}
      if(need>0)debt+=need;
      used+=num(b.r);rewards++;saved+=num(b.f);
    }
    var got=num(b.p)+num(b.bo);
    if(num(b.bo)>0)bonusGiven=true;
    earned+=got;
    var pay=Math.min(debt,got);debt-=pay;
    lots.push({d:d,exp:lpAddDays(d,LP.days),left:got-pay});
  });
  expireUpTo(today);
  var bal=lots.reduce(function(s,L){return s+L.left;},0)-debt;
  var soonTo=lpAddDays(today,LP.warnDays),soon=0,soonExp='';
  lots.forEach(function(L){if(L.left>0&&L.exp<=soonTo){soon+=L.left;if(!soonExp||L.exp<soonExp)soonExp=L.exp;}});
  return {bal:bal,lots:lots,earned:earned,used:used,expired:expired,rewards:rewards,saved:round2(saved),bonusGiven:bonusGiven,
    soon:soon,soonLast:soonExp?lpAddDays(soonExp,-1):'',ev:ev};
}
/* इस बिल के पॉइंट — छूट दोनों हिस्सों में बराबर अनुपात से घटती है */
function lpCalc(sw,pk,ri,bonusOk){
  sw=Math.max(0,round2(num(sw)));pk=Math.max(0,round2(num(pk)));
  var elig=round2(sw+pk),r=(ri>=0&&LP.rewards[ri])?LP.rewards[ri]:null,off=r?Math.min(r.off,elig):0;
  var psw=elig>0?sw-off*sw/elig:0,ppk=elig>0?pk-off*pk/elig:0;
  var raw=Math.floor(psw/LP.swPer+1e-9)+Math.floor(ppk/LP.pkPer+1e-9);
  return {sw:sw,pk:pk,elig:elig,r:r,off:off,pts:Math.min(raw,LP.cap),capped:raw>LP.cap,bo:(bonusOk&&elig>=LP.bonusMin)?LP.bonus:0};
}
function lpRewardOk(i,bal,elig){var r=LP.rewards[i];if(bal<r.pts)return 'pts';if(elig<r.min)return 'min';return 'ok';}
function lpRewardLines(bal){
  var best=null,next=null,a=[];
  LP.rewards.forEach(function(r){if(bal>=r.pts)best=r;else if(!next)next=r;});
  if(best)a.push('🎁 अभी '+best.pts+' पॉइंट से '+rupee(best.off)+' की छूट ले सकते हैं ('+rupee(best.min)+'+ के बिल पर)');
  if(next)a.push((best?'या ':'')+'बस '+(next.pts-bal)+' पॉइंट और — फिर '+rupee(next.off)+' की छूट!');
  return a;
}
function lpSoonIn(mid,days){
  var s=lpState(mid),lim=lpAddDays(todayStr(),days),n=0,first='';
  s.lots.forEach(function(L){if(L.left>0&&L.exp<=lim){n+=L.left;if(!first||L.exp<first)first=L.exp;}});
  return {n:n,last:first?lpAddDays(first,-1):'',bal:s.bal};
}
function lpRemindList(){
  return LY().m.filter(function(m){
    if(!m.wa||!m.phone)return false;
    if(m.rm&&dayDiff(dayKey(m.rm),todayStr())<10)return false;
    return lpSoonIn(m.id,LP.remindDays).n>0;
  });
}
function lpDash(){
  var mon=todayStr().slice(0,7),d={members:LY().m.length,newM:0,active:0,soon:0,rw:0,rwOff:0,sales:0,bills:0};
  LY().m.forEach(function(m){if(dayKey(m.c).slice(0,7)===mon)d.newM++;var s=lpState(m.id);if(s.bal>0)d.active+=s.bal;d.soon+=s.soon;});
  LY().b.forEach(function(b){
    if(b.v||dayKey(b.t).slice(0,7)!==mon)return;
    d.bills++;d.sales+=num(b.s)+num(b.k);
    if(num(b.r)>0){d.rw++;d.rwOff+=num(b.f);}
  });
  d.sales=round2(d.sales);d.rwOff=round2(d.rwOff);
  return d;
}

function lpCardMsg(m){

  var last=memberBills(m.id).filter(function(b){return !b.v;}).slice(-5).reverse();
  if(last.length){L.push('','आख़िरी ख़रीद:');last.forEach(function(b){L.push('• '+lpDate(dayKey(b.t))+' — '+rupee(lpBillAmt(b))+' → +'+(num(b.p)+num(b.bo))+(num(b.r)>0?' / −'+b.r+' (₹'+b.f+' छूट)':''));});}
  lpLinkLines(m,L);
  L.push('','हर ₹50 की मिठाई/केक पर 1 पॉइंट · हर ₹100 के पैकेट सामान पर 1 · दूध-दही-पनीर पर नहीं · पॉइंट 1 साल चलते हैं',LP_SIGN);
  return L.join('\n');

function lpWaBtn(m,text,label,cls,kind){

}

/* --- 📲 ग्राहक का अपना पेज (रजिस्टर पर सार) --- */
function lpTok(){
  var a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=new Uint8Array(22),s='',i;
  try{crypto.getRandomValues(r);}catch(e){for(i=0;i<r.length;i++)r[i]=Math.floor(Math.random()*256);}
  for(i=0;i<r.length;i++)s+=a.charAt(r[i]%a.length);
  return s;
}
var LP_SENT='mbmb-lp-sent',lpSyncTimer=null,lpSyncBusy=false,lpSyncFails=0;
function lpLinkOk(){var x=lsGet(LP_SENT,{})||{};return !!(onlineCfg()&&x.v5&&!x.old);}
function lpLink(m){return orderPageUrl()+'?lp='+encodeURIComponent(m.tk||'');}
function lpLinkLines(m,L){if(m&&m.tk&&lpLinkOk())L.push('','📲 अपने पॉइंट और पूरा हिसाब कभी भी देखें:',lpLink(m));}
/* ग्राहक के पेज के लिए सदस्य का सार — असली हिसाब यहीं रहता है, वहाँ सिर्फ़ दिखाने के लिए कॉपी */
function lpSummary(m){
  var s=lpState(m.id),h=[],left=0;
  memberBills(m.id).forEach(function(b){
    if(b.v)return;
    var x={d:dayKey(b.t),a:lpBillAmt(b),g:num(b.p)+num(b.bo)};
    if(num(b.bo)>0)x.bo=num(b.bo);
    if(num(b.r)>0){x.r=num(b.r);x.f=num(b.f);}
    h.push(x);
  });
  s.ev.forEach(function(x){h.push({d:x.d,x:x.pts});});
  h.sort(function(a,b){return a.d<b.d?1:(a.d>b.d?-1:0);});
  var lots=s.lots.filter(function(L){return L.left>0;}).map(function(L){left+=L.left;return [L.left,L.exp];});
  return {v:1,n:m.name,c:dayKey(m.c),lots:lots,debt:Math.max(0,left-s.bal),e:s.earned,u:s.used,x:s.expired,sv:s.saved,rw:s.rewards,h:h.slice(0,30),
    rr:LP.rewards.map(function(r){return [r.pts,r.off,r.min];})};
}
function lpSyncSoon(ms){clearTimeout(lpSyncTimer);lpSyncTimer=setTimeout(function(){lpSync();},ms==null?5000:ms);}
function lpSync(){
  var cfg=onlineCfg();
  if(!cfg||lpSyncBusy)return Promise.resolve(null);
  var sent=lsGet(LP_SENT,{})||{},now=Date.now(),map=sent.m||{},list=[],seen={};
  if(sent.old&&now-sent.old<6*3600000)return Promise.resolve(null);   // रजिस्टर का कोड पुराना — 6 घंटे बाद फिर देखो
  LY().m.forEach(function(m){
    if(!m.tk||!phoneValid(m.phone))return;
    seen[m.id]=1;
    var ph=phoneNorm(m.phone).slice(-10),d=lpSummary(m),h=hashStr(ph+'|'+m.tk+'|'+JSON.stringify(d));
    if(map[m.id]!==h)list.push({id:m.id,p:ph,t:m.tk,d:d,h:h});
  });
  Object.keys(map).forEach(function(id){if(!seen[id])list.push({id:id,del:1});});
  lpSyncBusy=true;
  var done=function(r){lpSyncBusy=false;return r;};
  if(!list.length){
    if(sent.v5&&!sent.old)return Promise.resolve(done({ok:true,none:true}));
    // अभी तक पता नहीं कि रजिस्टर नया है या पुराना — पूछ लो
    return fetch(cfg.u+'?action=ping',{redirect:'follow'}).then(function(r){return r.json();}).then(function(r){
      var s2=lsGet(LP_SENT,{})||{};
      if(r&&r.ok&&r.v>=5){s2.v5=true;delete s2.old;}else if(r&&r.ok){s2.old=now;}
      lsSet(LP_SENT,s2);lpSyncShow();return done(r);
    },function(){return done(null);});
  }
  var batch=list.slice(0,40);
  var body={action:'lpsync',key:cfg.k,list:batch.map(function(x){return x.del?{id:x.id,del:1}:{id:x.id,p:x.p,t:x.t,d:Object.assign({at:now},x.d)};})};
  return fetch(cfg.u,{method:'POST',body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(r){
      var s2=lsGet(LP_SENT,{})||{};s2.m=s2.m||{};
      if(r&&r.ok){
        var ok={};(r.done||[]).forEach(function(id){ok[id]=1;});
        batch.forEach(function(x){if(!ok[x.id])return;if(x.del)delete s2.m[x.id];else s2.m[x.id]=x.h;});
        s2.v5=true;delete s2.old;s2.t=now;lsSet(LP_SENT,s2);lpSyncFails=0;
        if(list.length>batch.length&&(r.done||[]).length)lpSyncSoon(1500);   // बाकी सदस्य अगली बार में
      }else if(r&&r.error==='action'){s2.old=now;lsSet(LP_SENT,s2);}
      else if(!(r&&r.error==='key'))lpSyncRetry();
      lpSyncShow();
      return done(r);

var LP_OTP_MIN=15;
function lpOtpNew(mid){
  var r=new Uint16Array(1);try{crypto.getRandomValues(r);}catch(e){r[0]=Math.floor(Math.random()*65536);}
  return {c:String(1000+(r[0]%9000)),t:Date.now(),n:0,m:mid,sent:false};
}
function lpOtpMsg(m,code,r){
  return ['🪔 *'+LP.name+'*','नमस्ते '+m.name+' जी 🙏','',
    'आपका इनाम कोड: *'+code+'*',(r?'('+r.pts+' पॉइंट = '+rupee(r.off)+' की छूट)':''),'',
    'यह कोड दुकान के काउंटर पर बताएँ। '+LP_OTP_MIN+' मिनट तक चलेगा।',
    'आप अभी दुकान पर नहीं हैं तो यह कोड किसी को न बताएँ।',LP_SIGN].join('\n');
}
function lpOtpVerified(d,m){return !!(d&&m&&d.vf&&d.vfm===m.id);}
function lpRenderOtp(){
  var d=ui.lDraft,box=$('#lp-otp');if(!d||!box)return;
  var m=d.mid?findMember(d.mid):null,want=!!(m&&d.ri>=0);
  d._otpShown=want;
  if(!want){box.innerHTML='';return;}
  if(lpOtpVerified(d,m)){
    box.innerHTML=d.vf==='c'?'<div class="lpotp ok">✅ ग्राहक का कोड सही — इनाम लगेगा</div>':
      '<div class="lpotp skip"><span>⚠️ बिना कोड — हिसाब में "बिना कोड" लिखा जाएगा</span><button class="lnk" data-act="lp-otp-undo">बदलो</button></div>';
    return;
  }
  if(!d.otp||d.otp.m!==m.id||d.otp.n>=3||Date.now()-d.otp.t>LP_OTP_MIN*60000)d.otp=lpOtpNew(m.id);
  var href=waLink(m.phone,lpOtpMsg(m,d.otp.c,LP.rewards[d.ri]));
  box.innerHTML='<div class="lpotp"><b>🔐 इनाम से पहले ग्राहक की पहचान</b>'+
    '<p class="hint">ग्राहक के WhatsApp पर 4 अंकों का कोड भेजो — ग्राहक जो कोड बताए, नीचे डालो।</p>'+
    '<a class="btn small'+(d.otp.sent?'':' primary')+'" href="'+esc(href)+'" target="_blank" rel="noopener" data-act="lp-otp-send">📲 '+(d.otp.sent?'कोड फिर से भेजो':'कोड भेजो (WhatsApp)')+'</a>'+
    (d.otp.sent?'<label class="fl">ग्राहक से कोड पूछकर डालो<input id="lp-otp-in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····" value="'+esc(d.otpIn||'')+'"></label>':'')+
    '<div class="err" id="lp-otp-err">'+esc(d.otpErr||'')+'</div>'+
    '<button class="lnk" data-act="lp-otp-skip">ग्राहक के पास फ़ोन नहीं / मैं पहचानता हूँ — बिना कोड</button></div>';
}
function lpOtpInput(t){
  var d=ui.lDraft,m=d&&d.mid?findMember(d.mid):null;if(!d||!m||!d.otp)return;
  var v=String(t.value||'').replace(/\D/g,'').slice(0,4);
  if(v!==t.value)t.value=v;
  d.otpIn=v;
  if(v.length<4)return;
  if(Date.now()-d.otp.t>LP_OTP_MIN*60000){
    d.otp=null;d.otpIn='';d.otpErr='कोड की मियाद ('+LP_OTP_MIN+' मिनट) पूरी — नया कोड भेजो।';lpRenderOtp();return;
  }
  if(v===d.otp.c){d.vf='c';d.vfm=m.id;d.otpIn='';d.otpErr='';lpRenderOtp();toast('✅ कोड सही');var e=$('#lp-err');if(e)e.textContent='';return;}
  d.otp.n++;d.otpIn='';
  if(d.otp.n>=3){d.otp=null;d.otpErr='3 बार ग़लत कोड — नया कोड भेजो।';}
  else d.otpErr='ग़लत कोड — '+(3-d.otp.n)+' मौके बचे। ग्राहक से दोबारा पूछो।';
  lpRenderOtp();
  setTimeout(function(){var f=$('#lp-otp-in');if(f)f.focus();},30);
}

function lpRefreshCalc(){
  var d=ui.lDraft;if(!d)return;
  var m=d.mid?findMember(d.mid):null,s=m?lpState(m.id):{bal:0,bonusGiven:true};
  var base=lpCalc(d.sw,d.pk,-1,false);
  if(d.ri>=0&&lpRewardOk(d.ri,s.bal,base.elig)!=='ok')d.ri=-1;
  if(d._otpShown!==!!(m&&d.ri>=0))lpRenderOtp();
  var c=lpCalc(d.sw,d.pk,d.ri,m&&!s.bonusGiven),ot=Math.max(0,round2(num(d.ot))),bill=round2(c.elig+ot),pay=round2(bill-c.off);
  var rw=$('#lp-rw'),sum=$('#lp-sum');
  if(rw){
    if(!m||s.bal<LP.rewards[0].pts){rw.innerHTML=m?'<p class="hint">इनाम: '+LP.rewards[0].pts+' पॉइंट होने पर (अभी '+s.bal+')</p>':'';}
    else rw.innerHTML='<label class="fl">इनाम (एक बिल पर एक) — अभी '+s.bal+' पॉइंट</label><div class="lprwpick">'+
      '<button type="button" class="'+(d.ri<0?'on':'')+'" data-act="lp-rw" data-i="-1">कोई नहीं</button>'+
      LP.rewards.map(function(r,i){
        var st=lpRewardOk(i,s.bal,base.elig);
        return '<button type="button" class="'+(d.ri===i?'on':'')+'" data-act="lp-rw" data-i="'+i+'"'+(st==='ok'?'':' disabled')+'><b>'+r.pts+' = '+rupee(r.off)+'</b><small>'+
          (st==='ok'?'लगा सकते हैं':(st==='pts'?'पॉइंट कम':'बिल '+rupee(r.min)+'+ चाहिए'))+'</small></button>';
      }).join('')+'</div>';
  }
  if(sum){
    if(!(bill>0)){sum.innerHTML='';return;}
    sum.innerHTML='<div class="udsum lpsum3"><div><span>कुल बिल</span><b>'+rupee(bill)+'</b></div>'+
      '<div><span>छूट</span><b style="color:var(--green)">'+(c.off?'− '+rupee(c.off):'—')+'</b></div>'+
      '<div class="due"><span>ग्राहक देगा</span><b>'+rupee(pay)+'</b></div></div>'+
      (m?'<p class="lpgain">⭐ मिलेंगे <b>+'+(c.pts+c.bo)+' पॉइंट</b>'+(c.bo?' (इसमें '+c.bo+' जुड़ने का बोनस)':'')+
        ' · बाद में कुल <b>'+(s.bal-(c.r?c.r.pts:0)+c.pts+c.bo)+'</b>'+(c.capped?'<br><small>एक बिल पर ज़्यादा से ज़्यादा '+LP.cap+' पॉइंट</small>':'')+'</p>':'');
  }
}
function lpSaveBuy(){
  var d=ui.lDraft,err=$('#lp-err');if(!d)return;
  var m=d.mid?findMember(d.mid):null;
  if(!m){err.textContent='किसकी ख़रीद है — सदस्य चुनो या नया बनाओ।';return;}
  var s=lpState(m.id),c=lpCalc(d.sw,d.pk,d.ri,!s.bonusGiven),ot=Math.max(0,round2(num(d.ot)));
  if(!(c.elig+ot>0)){err.textContent='रकम लिखो।';return;}
  if(c.elig+ot>500000){err.textContent='रकम बहुत बड़ी है — एक बार जाँच लो।';return;}
  if(d.ri>=0&&lpRewardOk(d.ri,s.bal,c.elig)!=='ok'){err.textContent='यह इनाम इस बिल पर नहीं लग सकता।';return;}
  if(d.ri>=0&&!lpOtpVerified(d,m)){
    err.textContent='इनाम के लिए पहले ग्राहक का कोड डालो — या "बिना कोड" चुनो।';
    var ob=$('#lp-otp');if(ob)ob.scrollIntoView({block:'center'});
    return;
  }
  if(c.elig>LP.bigBill&&!d.bigOk){d.bigOk=true;err.textContent=rupee(c.elig)+' का बड़ा बिल है — रकम सही है? सही है तो फिर से "Save करो" दबाओ।';return;}
  var b={id:uid(),m:m.id,t:Date.now(),s:c.sw,k:c.pk,o:ot,r:c.r?c.r.pts:0,f:c.off,p:c.pts,bo:c.bo};
  if(b.r)b.vf=d.vf;
  LY().b.push(b);
  save();closeSheet();
  lpSyncSoon(800);
  ui.view='lmember';ui.memberId=m.id;
  renderRoute();window.scrollTo(0,0);
  lpDone(b);
}

function lpCardImage(mid){

    var logo=r[1],s=lpState(m.id),W=BI.W,P=BI.P;

    biFont(ctx,400,28);var phW=ctx.measureText(m.phone).width+30;biText(ctx,m.phone,W-P-26,y+86,'right',BI.ink);
    biFont(ctx,700,38);biText(ctx,biFit(ctx,m.name,W-2*P-52-phW),P+26,y+88,'left',BI.ink);

    biFont(ctx,600,32);biText(ctx,'मिठास पॉइंट · '+lpDate(todayStr()),W/2,y+180,'center',BI.muted);
    y+=232;
    // इनाम
    biFont(ctx,700,30);biText(ctx,'इनाम (एक बिल पर एक)',P,y+30,'left',BI.ink);y+=50;
    LP.rewards.forEach(function(rw){
      var ok=s.bal>=rw.pts;
      biRound(ctx,P,y,W-2*P,84,14,ok?BI.greenbg:'#F7F2EA',null);
      biFont(ctx,700,32);biText(ctx,rw.pts+' पॉइंट = '+rupee(rw.off)+' छूट',P+24,y+52,'left',ok?BI.green:BI.ink);
      biFont(ctx,600,25);biText(ctx,(ok?'✓ अभी ले सकते हैं':(rw.pts-s.bal)+' पॉइंट और')+' · '+rupee(rw.min)+'+ बिल',W-P-24,y+52,'right',ok?BI.green:BI.muted);
      y+=96;
    });
    if(s.soon){
      biRound(ctx,P,y+6,W-2*P,70,14,BI.redbg,null);
      biFont(ctx,700,28);biText(ctx,'⏳ '+s.soon+' पॉइंट '+lpDate(s.soonLast)+' तक इस्तेमाल कर लें',P+24,y+52,'left',BI.red);
      y+=90;

    });
    y+=110;
    // हिसाब
    if(hist.length){

    y+=40;ctx.fillStyle=BI.maroon;ctx.fillRect(0,y,W,16);y+=16;
    var out=document.createElement('canvas');out.width=W;out.height=Math.min(Math.ceil(y),H);
    out.getContext('2d').drawImage(cv,0,0);
    return new Promise(function(res,rej){out.toBlob(function(bl){if(bl)res(bl);else rej(new Error('blob'));},'image/png');});
  });

   SMS दुकान के फ़ोन के प्लान से जाता है। हिंदी SMS में एक SMS = 70 अक्षर, इसलिए मैसेज छोटे रखे हैं (बिल की फोटो SMS से नहीं जाती)। ---------- */

function smsLink(phone,text){
  var p=phoneNorm(phone);if(p.length<12)return '';

}

function smsK(kind,ref){
  var e=null,p=null;
  if(kind==='udhar'||kind==='jama'){e=findKEntry(ref);if(!e)return '';p=findParty(e.partyId);}else p=findParty(ref);
  if(!p)return '';
  var bal=round2(partyTotals(p.id).bal),L=[SMS_SHOP,'नमस्ते '+p.name+' जी,'];
  var balTxt=bal>0?('कुल बाकी '+rupee(bal)):(bal<0?(rupee(-bal)+' एडवांस जमा है'):'आपका हिसाब साफ़ है');
  if(kind==='udhar'){var sit=kItemsShort(e,3);L.push((e.date===todayStr()?'आज ':hiShort(e.date)+' को ')+rupee(e.amount)+' का उधार'+(sit?' ('+sit+')':'')+' लिखा गया। '+balTxt+'।');}
  else if(kind==='jama')L.push(rupee(e.amount)+' जमा हो गए। '+(bal>0?'अब बाकी '+rupee(bal):balTxt)+'।');
  else if(kind==='remind'){var od=partyOldestDueKey(p.id);L.push('आपका '+rupee(bal)+' बकाया है'+(od&&od<todayStr()?' ('+hiShort(od)+' से)':'')+'। सुविधा से जमा कर दीजिए।');}
  else L.push(balTxt+'। पूरा हिसाब दुकान पर या इसी नंबर पर पूछ लीजिए।');
  if(bal>0)L.push('पेमेंट: '+orderPageUrl()+'#pay='+bal);
  smsSign(L);
  return L.join('\n');
}

  var terms=(state.shop.terms||'').trim();

  L.push('-------------------');

    line=line.trim();

function billLineItems(L, o){

    if(!it.delivered&&it.date&&it.date!==baseDayKey){

  });

/* ---------- Photo bill (image for WhatsApp) ---------- */
var BI={W:1080,P:56,QX:650,RX:830,maroon:'#5C1620',cream:'#FBEEDD',paper:'#FAF3E7',line:'#E6D9C6',ink:'#2B1712',muted:'#7A6556',gold:'#9C6B00',green:'#2F6F4E',red:'#A6332E',redbg:'#F6E1DD',greenbg:'#E3F1E8'};
var BI_BODY="Mukta,'Noto Sans Devanagari','Nirmala UI',sans-serif";
var BI_HEAD="'Baloo 2',Mukta,'Noto Sans Devanagari','Nirmala UI',sans-serif";
function biFont(ctx,w,px,head){ctx.font=w+' '+px+'px '+(head?BI_HEAD:BI_BODY);}
function biText(ctx,s,x,y,align,color){ctx.textAlign=align||'left';ctx.fillStyle=color||BI.ink;ctx.fillText(String(s),x,y);}
function biLoadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src=src;});}
function biFontsReady(){
  try{
    if(!document.fonts||!document.fonts.load)return Promise.resolve();
    return Promise.all([
      document.fonts.load("400 30px Mukta","अ"),document.fonts.load("600 30px Mukta","अ"),
      document.fonts.load("700 30px Mukta","अ"),document.fonts.load("700 40px 'Baloo 2'","अ")
    ]).then(function(){},function(){});
  }catch(e){return Promise.resolve();}
}
function biFit(ctx,text,maxW){
  // एक लाइन में न आए तो आख़िर में "…"
  text=String(text==null?'':text);
  if(ctx.measureText(text).width<=maxW)return text;
  var a=Array.from(text);
  while(a.length>1&&ctx.measureText(a.join('')+'…').width>maxW)a.pop();
  return a.join('')+'…';
}
function biWrap(ctx,text,maxW){
  var words=[],lines=[],cur='';
  // बिना स्पेस वाला बहुत लंबा शब्द भी टुकड़ों में टूटे, बाहर न निकले
  String(text==null?'':text).split(' ').forEach(function(w){
    if(!w||ctx.measureText(w).width<=maxW){words.push(w);return;}
    var part='';Array.from(w).forEach(function(ch){if(part&&ctx.measureText(part+ch).width>maxW){words.push(part);part='';}part+=ch;});
    if(part)words.push(part);
  });
  words.forEach(function(w){
    if(!w)return;
    var t=cur?cur+' '+w:w;
    if(!cur||ctx.measureText(t).width<=maxW)cur=t;else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}
function biRound(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function biHeader(ctx,logo){
  var W=BI.W,P=BI.P,tx=logo?P+178:P,tw=W-tx-P;
  biFont(ctx,700,50,true);var nameL=biWrap(ctx,state.shop.name,tw);
  biFont(ctx,400,29);var addrL=biWrap(ctx,state.shop.addr,tw);
  var blockH=nameL.length*58+addrL.length*40+40+(FSSAI?38:0);
  var H=Math.max(logo?240:0,blockH+70);
  ctx.fillStyle=BI.maroon;ctx.fillRect(0,0,W,H);
  if(logo){var ls=156;ctx.drawImage(logo,P,Math.round((H-ls)/2),ls,ls);}
  var y=Math.round((H-blockH)/2)+46;
  biFont(ctx,700,50,true);
  nameL.forEach(function(l,i){biText(ctx,l,tx,y,'left',BI.cream);y+=58;});
  y-=14;
  biFont(ctx,400,29);
  addrL.forEach(function(l){biText(ctx,l,tx,y,'left',BI.cream);y+=40;});
  if(shopPhones()){biText(ctx,'फ़ोन: '+shopPhones(),tx,y,'left',BI.cream);y+=38;}
  if(FSSAI){biFont(ctx,400,26);biText(ctx,'FSSAI पंजीकरण सं.: '+FSSAI,tx,y,'left',BI.cream);}
  return H;
}
function biTitle(ctx,y,title,rTop,rBottom){
  var W=BI.W,P=BI.P;
  biFont(ctx,700,48,true);biText(ctx,title,P,y+50,'left',BI.maroon);
  biFont(ctx,700,30);biText(ctx,rTop,W-P,y+32,'right',BI.ink);

}
function biCustomer(ctx,y,c,extra){
  var W=BI.W,P=BI.P,h=extra?156:118;

  if(extra){biFont(ctx,600,28);biText(ctx,extra,P+26,y+132,'left',BI.maroon);}
  return y+h+30;

function biTableHead(ctx,y){
  var W=BI.W,P=BI.P;
  biFont(ctx,700,26);
  biText(ctx,'सामान',P,y+30,'left',BI.maroon);
  biText(ctx,'मात्रा',BI.QX,y+30,'right',BI.maroon);

  return y+49;
}
function biIconDone(ctx,x,y,s){
  biRound(ctx,x,y,s,s,Math.round(s*0.22),'#2FA84F',null);
  ctx.save();ctx.strokeStyle='#FFFFFF';ctx.lineWidth=Math.max(3,s*0.14);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x+s*0.24,y+s*0.53);ctx.lineTo(x+s*0.43,y+s*0.71);ctx.lineTo(x+s*0.77,y+s*0.31);ctx.stroke();
  ctx.restore();
}
function biIconPending(ctx,x,y,s){
  ctx.save();
  var frame='#7A5A1E',sand='#E0A21B';

/* ---------- Calendar reminders (.ics) — works offline, no server needed ---------- */
function icsDate(dt){
  return dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+'T'+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+pad(dt.getUTCSeconds())+'Z';
}
function icsEscape(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function orderIcs(o){
  var c=findCustomer(o.customerId);
  var start=new Date(o.date);
  if(isNaN(start))start=new Date();
  var end=new Date(start.getTime()+30*60000);
  var itemsTxt=o.items.map(function(it){return displayName(it)+' x'+fmtQty(it.qty)+' '+it.unit;}).join(', ');
  var summary='Order #'+o.no+' - '+(c?c.name:'Customer');
  var desc=itemsTxt+' | Baaki: '+rupee(orderDue(o));
  var uidv='mbmb-order-'+o.id+'@mbmb-billing';
  var L=[];
  L.push('BEGIN:VCALENDAR');
  L.push('VERSION:2.0');
  L.push('PRODID:-//MBMB Billing//HI');
  L.push('BEGIN:VEVENT');
  L.push('UID:'+uidv);
  L.push('DTSTAMP:'+icsDate(new Date()));
  L.push('DTSTART:'+icsDate(start));
  L.push('DTEND:'+icsDate(end));
  L.push('SUMMARY:'+icsEscape(summary));
  L.push('DESCRIPTION:'+icsEscape(desc));
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('DESCRIPTION:Reminder');
  L.push('TRIGGER:-P2D');
  L.push('END:VALARM');
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('DESCRIPTION:Reminder');
  L.push('TRIGGER:-P1D');
  L.push('END:VALARM');
  L.push('END:VEVENT');
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadIcs(o){
  var ics=orderIcs(o);
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='order-'+o.no+'-reminder.ics';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

/* ---------- In-app reminder notification (best-effort, jab app khule tab hi) ---------- */
/* ऐप की अपनी "आने वाले ऑर्डर" घंटी — दोपहर 12 बजे के बाद ऐप खुलने/सामने आने पर, दिन में एक बार।
   कल/परसों कुछ न हो तो दिन बंद नहीं करते (बाद में जुड़ा ऑर्डर भी याद आए — मालिक, 18 अक्टूबर 2026)।
   रजिस्टर संस्करण 6 + घंटी चालू हो तो 2 बजे वाली घंटी यही बताती है, तब यह चुप रहती है। */
function checkDueReminders(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(new Date().getHours()<12)return;
    if(ackedToday())return;
    if(onlineCfg()&&pushOn()&&num((lsGet(PLAN_SENT,{})||{}).v)>=6)return;
    var todayK=todayStr(),lastKey='mbmb-lastremind';
    if(localStorage.getItem(lastKey)===todayK)return;
    var live=state.orders.filter(function(o){return !o.cancelled;}),lines=[];
    [[addDaysKey(1),'कल'],[addDaysKey(2),'परसों']].forEach(function(x){
      planOrders(live,x[0],null).forEach(function(e){lines.push('• '+x[1]+(e.t?' '+e.t:'')+': '+e.i+' — '+e.n+(e.p?' ('+e.p+')':''));});
    });
    if(!lines.length)return;
    var body=lines.slice(0,6).join('\n')+(lines.length>6?'\n+ '+(lines.length-6)+' और — ऐप में देखें':'');
    showLocalNotif('📋 आने वाले ऑर्डर ('+lines.length+')',body,'./#ack='+todayK).then(function(){localStorage.setItem(lastKey,todayK);},function(){});
  }catch(e){}
}
/* Android Chrome में new Notification() नहीं चलता — service worker से दिखाओ */
function showLocalNotif(title,body,url){
  var opts={body:body,icon:'icon-192.png',badge:'badge-96.png',tag:'mb-due',requireInteraction:true,data:{url:url||'./'}};
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistration){
    return navigator.serviceWorker.getRegistration().then(function(r){
      if(r&&r.showNotification)return r.showNotification(title,opts);
      new Notification(title,opts);
    });
  }
  return new Promise(function(res){new Notification(title,opts);res();});
}

var AI_DV={'क':'k','ख':'k','ग':'g','घ':'g','ङ':'n','च':'c','छ':'c','ज':'j','झ':'j','ञ':'n','ट':'t','ठ':'t','ड':'d','ढ':'d','ण':'n',

function aiLatKey(s){

function aiTokKey(w){

function aiLev(a,b){

function aiNameScore(q,name){

/* ---------- आइटम की खोज ---------- */
function aiItemMatch(name,unit,id){
  var it=id?findItem(id):null;

  if(it&&nm){   // AI ने id दी — नाम भी मिलता हो तो ठीक; बिल्कुल अलग हो तो नाम से खोजो
    var s0=aiNameScore(nm,displayName(it));
    if(s0<0.5){var alt=aiItemByName(nm,unit);if(alt&&alt.s>=0.75)it=alt.it;}
  }
  if(!it&&nm){var r=aiItemByName(nm,unit);if(r&&r.s>=0.7)it=r.it;}
  if(it&&unit){   // इकाई के हिसाब से किलो/पीस वाला आइटम
    var u=aiUnit(unit);
    if(u&&u!==it.unit&&!(u==='ग्राम'&&it.unit==='किलो')){
      var base=displayName(it),v=state.items.filter(function(x){return x!==it&&displayName(x)===base&&x.unit===u;})[0];
      if(v)it=v;
    }
  }
  return it||null;
}
function aiItemByName(nm,unit){
  var u=aiUnit(unit),best=null;
  state.items.forEach(function(it){
    var s=Math.max(aiNameScore(nm,displayName(it)),aiNameScore(nm,it.name),
      aiNameScore(String(nm).replace(/\s+/g,''),displayName(it).replace(/\s+/g,'')));   // गुलाबजामुन = गुलाब जामुन, चम चम = चमचम
    if(u&&it.unit===u)s+=0.02;
    if(!best||s>best.s)best={it:it,s:s};
  });
  return best;
}
function aiUnit(u){
  u=String(u||'').trim().toLowerCase();if(!u)return '';
  if(/^(kg|kilo|किलो|केजी|किग्रा|kilogram)/.test(u))return 'किलो';
  if(/^(g|gm|gram|grams|ग्राम)$/.test(u))return 'ग्राम';
  if(/^(pc|pcs|piece|pieces|peace|पीस|नग|piece)/.test(u))return 'पीस';
  if(/^(l|ltr|litre|liter|लीटर)/.test(u))return 'लीटर';
  if(/^(packet|pkt|पैकेट)/.test(u))return 'पैकेट';
  if(/^(pack|पैक)/.test(u))return 'पैक';
  if(/^(plate|प्लेट)/.test(u))return 'प्लेट';
  if(/^(box|dibba|डिब्बा)/.test(u))return 'डिब्बा';
  return String(u);
}

    if(/ErrorInfo/.test(tp)&&/API_KEY_INVALID|API_KEY_EXPIRED|API_KEY_SERVICE_BLOCKED/.test(String(d.reason||'')))keyBad=true;});
  if(keyBad||/API key not valid|API_KEY_INVALID|API key expired|API key was reported as leaked/i.test(msg))return {code:'key',msg:msg};
  if(r.status===403&&/(API key|referer|referrer|has not been used|is disabled|blocked)/i.test(msg))return {code:'key',msg:msg};
  if(r.status===429){var z=/limit:\s*0\b/.test(msg);return {code:(perDay||z||/per day|daily/i.test(msg))?'quota':'rpm',zero:z,msg:msg,retry:retry};}
  if(r.status===400&&/location|region|country|not supported for your/i.test(msg)&&/user location|location is not supported/i.test(msg))return {code:'region',msg:msg};
  if(r.status===404||(r.status===400&&/not found|is not supported for|not supported by|unsupported model|does not support/i.test(msg)&&!/mime|json|instruction/i.test(msg)))return {code:'model',msg:msg};

/* एक सवाल → मॉडल एक-एक करके (कोटा ख़त्म/मॉडल बंद हो तो अगला) */
function aiGen(sys,parts,key){
  var T0=Date.now(),LIM=AI.LIM||40000,hasImg=parts.some(function(p){return p&&(p.inlineData||p.inline_data);});
  return aiModelOrder(key).then(function(models){
    if(!hasImg)models=models.slice().sort(function(a,b){return (/flash-lite/.test(b)?1:0)-(/flash-lite/.test(a)?1:0);});   // सिर्फ़ बात: तेज़ मॉडल पहले
    var tries=[];
    function attempt(mi,plain,again){
      var left=LIM-(Date.now()-T0);
      if(mi>=models.length||mi>=6||left<3000){var er=new Error('allfail');er.code=left<3000?'timeout':aiWorst(tries);er.tries=tries;throw er;}
      var m=models[mi],pl=aiCfg().plain||{},usePlain=plain||/gemma/i.test(m)||!!pl[m];
      var body=usePlain?
        {contents:[{role:'user',parts:[{text:sys+'\n\nReply with ONLY the JSON object.\n\n'}].concat(parts)}],generationConfig:{temperature:0.2}}:
        {systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:parts}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}};
      aiStatus('सोच रहा हूँ…'+(mi?' (दूसरा मॉडल '+(mi+1)+')':''));
      return aiHttp('POST','models/'+encodeURIComponent(m)+':generateContent',body,key,Math.min(hasImg?60000:25000,left)).then(function(r){
        if(r.ok){
          var txt=aiText(r.j);
          if(!txt){var fr=r.j&&r.j.candidates&&r.j.candidates[0]&&r.j.candidates[0].finishReason;tries.push({m:m,code:(r.j&&r.j.promptFeedback&&r.j.promptFeedback.blockReason)?'blocked':'empty',fr:fr});return attempt(mi+1,false);}
          aiUse(m);
          if(usePlain&&plain&&!/gemma/i.test(m)){pl[m]=1;aiSet({plain:pl});}
          return {text:txt,model:m};
        }
        var ei=aiErrInfo(r);tries.push({m:m,code:ei.code,msg:ei.msg});
        if(ei.code==='key'){var ek=new Error('key');ek.code='key';ek.msg=ei.msg;throw ek;}
        if(ei.code==='region'){var eg=new Error('region');eg.code='region';eg.msg=ei.msg;throw eg;}
        if(ei.code==='format'&&!usePlain)return attempt(mi,true);
        if(ei.code==='rpm'&&!again&&ei.retry>0&&ei.retry<=Math.min(20,(left-4000)/1000)){aiStatus('एक मिनट की हद — '+Math.ceil(ei.retry)+' सेकंड रुककर फिर…');return aiWait(ei.retry*1000+400).then(function(){return attempt(mi,plain,true);});}
        if(ei.code==='server'&&!again)return aiWait(1500).then(function(){return attempt(mi,plain,true);});
        aiMark(m,ei);
        return attempt(mi+1,false);
      },function(e){
        if(e.code==='timeout'){tries.push({m:m,code:'timeout'});return attempt(mi+1,false);}
        throw e;
      });
    }
    return attempt(0,false);
  });
}
function aiWorst(tries){
  var cs=tries.map(function(x){return x.code;});
  if(cs.length&&cs.every(function(c){return c==='quota'||c==='rpm';}))return 'quota';
  if(cs.indexOf('timeout')>-1&&cs.every(function(c){return c==='timeout'||c==='quota'||c==='rpm';}))return 'timeout';
  return cs.indexOf('quota')>-1?'quota':'fail';
}

  return null;
}

    (Array.isArray(a.sup)?a.sup:[]).forEach(function(m){

      x.sm.push(hxMeta(AIM,{s:sp0?sp0.id:'',n:nm,b:sp0?sp0.b:(hsBox(m.box)?m.box:'other'),a:String(v),pm:pm,nt:String(m.note||'').trim().slice(0,40)}));

    (Array.isArray(a.suppay)?a.suppay:[]).forEach(function(p0){

      if(!(bb>0.001))w.push(sp1.n+' का कोई बाकी नहीं दिख रहा — फिर भी "दिया" लिखा जाएगा (एडवांस)');});
    (Array.isArray(a.home)?a.home:[]).forEach(function(h){
      if(!h)return;var v=aiAmt(h.amount);if(!(v>0))return;var nm=String(h.note||h.name||'घर के लिए').trim().slice(0,30)||'घर के लिए';

  }else if((Array.isArray(a.sup)&&a.sup.length)||(Array.isArray(a.suppay)&&a.suppay.length)||(Array.isArray(a.home)&&a.home.length)||a.galla!=null){

function aiWarn(c){
  var w=[],px=aiPX(c),t=todayStr();
  if(c.lines)c.lines.forEach(function(l){(l.w||[]).forEach(function(m){w.push(displayName(l)+': '+m);});});
  if(c.t==='udhar'||c.t==='jama'){
    var amt=c.t==='udhar'?aiUdAmt(c):num(c.amount),ty=c.t==='udhar'?'u':'j';
    if(px&&px.party&&amt>0){var du=KH().entries.filter(function(e){return e.partyId===px.party.id&&e.type===ty&&e.date===c.date&&Math.abs(num(e.amount)-amt)<0.01;});
      if(du.length)w.push((c.date===t?'आज':hsDm(c.date)+' को')+' '+px.name+' का '+rupee(amt)+' का '+(ty==='u'?'उधार':'जमा')+' पहले से लिखा है — दोबारा तो नहीं?');}
    if(c.t==='udhar'&&c.lines&&c.lines.length&&c.said&&Math.abs(num(c.said)-aiLinesTotal(c.lines))>0.5)w.push('आपने '+rupee(c.said)+' बोला, सामान का जोड़ '+rupee(aiLinesTotal(c.lines))+' है — सेव सामान के जोड़ से होगा');
    if(c.date<t)w.push('तारीख़: '+hsDm(c.date)+' (आज नहीं)');
  }
  if(c.t==='order'&&!c.now){
    if(c.wd&&c.wd<t)w.push('डिलीवरी की तारीख़ बीत चुकी है — जाँच लें');
    if(!c.wtSaid)w.push('समय नहीं बोला — '+c.wt+' रखा है, नीचे बदल सकते हैं');
    if(px&&px.cust&&c.wd){var same=customerOrders(px.cust.id).filter(function(o){return !o.cancelled&&dayKey(o.date)===c.wd;});if(same.length)w.push('इसी दिन '+px.name+' का ऑर्डर #'+same.map(function(o){return o.no;}).join(', #')+' पहले से है');}
  }
  if(c.pp&&c.pp.pick==='new'&&c.pp.list.length){var b=aiPByRef(c.pp.list[0].ref);if(b&&c.pp.list[0].s>=0.6)w.push('मिलता-जुलता नाम पहले से है: '+b.name+' — वही हों तो ऊपर से चुनिए');}
  return w;
}

function aiJamaTo(c,px){
  if(c.to)return c.to;
  var o=aiJamaOpts(px),pos=o.filter(function(z){return z.b>0.001;});
  if(pos.length===1)return pos[0].k;

function aiSaveJama(c){

  if(to==='k')return aiSaveK(c,'j');
  var amt=round2(num(c.amount));if(!(amt>0))return {err:'रकम लिखिए।'};

  var tot=round2(el.reduce(function(s,o){return s+orderDue(o);},0));

  return {cid:px.cust.id,msg:rupee(amt)+' जमा हो गया — '+px.cust.name+(n>1?' ('+n+' ऑर्डर में बँटा)':'')+' · अब बिल बाकी '+rupee(customerTotals(px.cust.id).due)};

function aiCardById(id){for(var i=0;i<AI.s.msgs.length;i++){var cs=AI.s.msgs[i].cards||[];for(var j=0;j<cs.length;j++)if(cs[j].id===id)return cs[j];}return null;}
function aiStatus(t){AI.s.status=t;var el=$('#ai-busy');if(el)el.textContent=t;}
function aiSend(){
  if(AI.s.busy)return;
  var inp=$('#ai-in');if(inp)AI.s.text=inp.value;
  var text=String(AI.s.text||'').trim().slice(0,2000),imgs=AI.s.imgs.slice(0,3);
  if(!text&&!imgs.length){toast('कुछ बोलिए, लिखिए या फोटो डालिए');return;}
  if(AI.s.listen){if(AI.s.mic&&AI.s.mic.kind==='ai'){aiMicStop(true);return;}aiMicStop(false);}
  if(AI.s.tx)return;
  if(aiHF()&&!imgs.length&&aiHFReply(text))return;   // बिना-हाथ मोड में ही
  AI.s.msgs.push({r:'u',t:text,thumbs:imgs.map(function(i){return i.thumb;}),imgN:imgs.length});
  AI.s.text='';AI.s.imgs=[];AI.s.busy=true;AI.s.status='सोच रहा हूँ…';aiRender(true);
  var tk0=Date.now(),tick=setInterval(function(){if(!AI.s.busy){clearInterval(tick);return;}var el=$('#ai-busy');if(el)el.textContent=String(AI.s.status||'सोच रहा हूँ…').replace(/\s*\(\d+ सेकंड\)$/,'')+' ('+Math.round((Date.now()-tk0)/1000)+' सेकंड)';},1000);
  var fx;try{fx=aiFacts(text);}catch(e){fx={fb:aiFB(),people:[],all:[],base:0};}
  var key=aiKey();
  var done=function(o,note,rt){AI.s.busy=false;AI.s.status='';aiHandle(o,fx,note,text);
    /* AI न चला — बात/फोटो खोए नहीं: एक बटन से वही दोबारा AI को */
    if(rt){var lm=AI.s.msgs[AI.s.msgs.length-1];if(lm&&lm.r==='a'){lm.retry={t:text,imgs:imgs};aiRender(true);}}};

var AI_NUMW={'एक':1,'दो':2,'तीन':3,'चार':4,'पाँच':5,'पांच':5,'छह':6,'छः':6,'सात':7,'आठ':8,'नौ':9,'दस':10,'ग्यारह':11,'बारह':12,'पंद्रह':15,'बीस':20,'पच्चीस':25,'तीस':30,'चालीस':40,'पचास':50,'साठ':60,'सत्तर':70,'अस्सी':80,'नब्बे':90,'डेढ़':1.5,'ढाई':2.5,'सवा':1.25,
  'ek':1,'do':2,'teen':3,'char':4,'paanch':5,'panch':5,'das':10,'bees':20,'pachas':50,'dedh':1.5,'dhai':2.5};
function aiLocalAmt(s){
  s=aiDigits(s).replace(/₹/g,' ').replace(/(\d),(?=\d)/g,'$1');
  var toks=s.split(/[\s,]+/),best=0,cur=null,tot=0,run=false,afterM=false;
  var flush=function(){var v=round2(tot+(cur||0));if(v>0&&!best)best=v;tot=0;cur=null;run=false;afterM=false;};
  for(var i=0;i<toks.length;i++){
    var w=toks[i].replace(/[^\u0900-\u097Fa-zA-Z0-9.]/g,''),lw=w.toLowerCase();
    var mk=lw.match(/^(\d+(?:\.\d+)?)(k|हज़ार|हजार)?$/);
    if(mk){var n=parseFloat(mk[1])*(mk[2]?1000:1);
      if(run&&afterM){cur=(cur||0)+n;afterM=false;}          // "2 हज़ार 500" = 2500, "5 सौ 50" = 550
      else{if(run)flush();cur=n;run=true;}
      continue;}
    var wv=AI_NUMW[w]!=null?AI_NUMW[w]:AI_NUMW[lw];
    if(wv!=null){cur=(cur||0)+wv;run=true;afterM=false;continue;}
    if(/^(सौ|sau)$/.test(lw)&&run){cur=(cur||1)*100;afterM=true;continue;}
    if(/^(हज़ार|हजार|hazar|hajar|hazaar)$/.test(lw)&&run){tot+=(cur||1)*1000;cur=0;afterM=true;continue;}
    if(/^(रुपये|रुपया|रुपए|rupay|rupaye|rupees|rs|का|की|के)$/.test(lw))continue;
    if(run)flush();
  }
  if(run)flush();
  return round2(best);
}

function aiSpeakText(t){

function aiSpeakMsg(m){

function aiHFReply(text){
  var c=aiHFCard();if(!c)return false;
  var t=String(text||'').toLowerCase().replace(/[।,.!?"'“”]/g,' ').replace(/\s+/g,' ').trim();
  if(!t||t.split(' ').length>5)return false;   // लंबी बात = बदलाव → AI

  if(nd.k==='pick'){
    var pp=c.pp,list=pp.list,idx=-1;
    AI_HF_ORD.forEach(function(re,i){if(idx<0&&re.test(t)&&list[i])idx=i;});
    if(idx<0&&/^(नया|नई|नये|new|naya|नया बनाओ|नया ग्राहक|नया वाला)$/i.test(t)&&(c.t==='udhar'||c.t==='order'||c.t==='jama')){pp.pick='new';if(!pp.nn)pp.nn=pp.q;pp.open=false;ok=true;}
    if(idx<0&&!ok){
      var sc=list.map(function(r){var x=aiPByRef(r.ref);return {r:r,s:x?aiNameScore(t,x.name):0};}).sort(function(a,b){return b.s-a.s;});
      if(sc.length&&sc[0].s>=0.75&&(!sc[1]||sc[0].s-sc[1].s>=0.1))idx=list.indexOf(sc[0].r);
    }
    if(idx>-1){pp.pick=list[idx].ref;pp.open=false;c.to='';ok=true;}
    if(!ok)return false;
    c.err='';
  }else if(nd.k==='jto'){
    if(/उधार|उधारी|खाता|खाते|udhar|udhari|khata/i.test(t))c.to='k';
    else if(/बिल|ऑर्डर|आर्डर|bill|order/i.test(t))c.to='b';
    else return false;
    c.err='';ok=true;
  }else if(AI_HF_NO.test(t)){
    c.st='off';ok=true;say='ठीक है, रहने दिया।';
  }else if(AI_HF_YES.test(t)){
    if(nd.k==='go'){var gb=document.querySelector('[data-act="ai-go"][data-c="'+c.id+'"]');if(gb){AI.s.msgs.push({r:'u',t:text});gb.click();return true;}return false;}
    if(nd.k!=='save')return false;
    ok=true;
    if(aiSaveCard(c)){toast('✅ सेव हो गया');say='सेव हो गया।';}
    else{say=(c.err||'सेव नहीं हुआ')+'।';next=false;}
  }else return false;
  AI.s.msgs.push({r:'u',t:text});AI.s.text='';var fi=$('#ai-in');if(fi)fi.value='';
  aiRender(true);
  var c2=aiHFCard(),q='';
  if(!next){aiSay(say+' '+aiHFNeed(c).q,function(){aiMic(true);});return true;}
  if(c2){var n2=aiHFNeed(c2);q=n2.q;aiSay((say?say+' ':'')+q,n2.k==='tap'?null:function(){aiMic(true);});}
  else aiSay(say||'ठीक है।',null);
  return true;
}

/* --- 1) अपना रिकॉर्डर + AI से लिखवाना --- */
function aiRecStart(auto){
  var st={kind:'ai',auto:!!auto,chunks:[],hist:[],sr:0,started:false,lastVoice:0,t0:Date.now(),first:-1,lastIdx:-1,hot:0,done:false};
  AI.s.mic=st;AI.s.listen=true;AI.s.micErr='';

  aiRender();

    if(st.done||AI.s.mic!==st){stream.getTracks().forEach(function(t){t.stop();});return;}
    var AC=window.AudioContext||window.webkitAudioContext,ctx=st.ctx||new AC();st.ctx=ctx;st.stream=stream;st.sr=ctx.sampleRate;
    try{if(ctx.state==='suspended')ctx.resume();}catch(e){}

      var s2=0;for(var i=0;i<c.length;i+=2)s2+=c[i]*c[i];var rms=Math.sqrt(s2/(c.length/2)),now=Date.now();
      st.hist.push(rms);if(st.hist.length>60)st.hist.shift();
      var so=st.hist.slice().sort(function(a,b){return a-b;}),floor=so[Math.floor(so.length*0.15)]||rms,thr=Math.max(0.008,floor*2.2);
      st.es=st.es==null?rms:st.es*0.6+rms*0.4;                 // थोड़ा smooth
      st.pk=Math.max((st.pk||0)*0.997,st.es);                  // अब तक की सबसे तेज़ आवाज़ (धीरे-धीरे घटती)
      var von=st.es>thr&&st.es>st.pk*0.22;                     // दुकान का शोर/दूर की बातें = बोलने से बहुत धीमी → चुप माना
      if(st.chunks.length>2&&von){st.hot++;if(st.hot>=2){if(!st.started){st.started=true;st.first=st.chunks.length-3;}st.lastVoice=now;st.lastIdx=st.chunks.length-1;}}
      else{st.hot=0;}
      var bar=$('#ai-lv');if(bar)bar.style.width=Math.round(Math.min(1,rms/(thr*2.5))*100)+'%';
      if(st.started&&now-st.lastVoice>wait){aiRecFinish('sil');return;}
      if(!st.started&&now-st.t0>(auto?6000:7000)){aiRecFinish('none');return;}
      if(now-st.t0>30000){aiRecFinish('max');return;}
      var el=$('#ai-lvt');if(el)el.textContent=aiListenText(st);
    };
    src.connect(pr);pr.connect(ctx.destination);
  },function(e){
    if(AI.s.mic!==st)return;
    st.done=true;AI.s.mic=null;AI.s.listen=false;try{if(st.ctx)st.ctx.close();}catch(e2){}
    var nm=e&&e.name;
    if(nm==='NotAllowedError'||nm==='SecurityError')toast(auto?'जवाब बोलने के लिए 🎤 बोलो दबाइए':'माइक की अनुमति नहीं है — फ़ोन की सेटिंग में Chrome को माइक की अनुमति दीजिए');
    else if(aiSR()){AI.s.recFail=true;aiSRStart(auto);return;}

function aiRecFinish(why){
  var st=AI.s.mic;if(!st||st.kind!=='ai'||st.done)return;

  try{if(st.pr)st.pr.onaudioprocess=null;if(st.src)st.src.disconnect();if(st.pr)st.pr.disconnect();}catch(e){}
  try{if(st.stream)st.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  try{if(st.ctx)st.ctx.close();}catch(e){}
  if(why==='cancel'){aiRender();return;}
  if(!st.started){aiRender();toast(st.auto?'कुछ सुनाई नहीं दिया':'कुछ सुनाई नहीं दिया — फिर से 🎤 दबाकर बोलिए');return;}
  var wav=aiWav(st);
  AI.s.tx=true;aiRender();
  aiTranscribe(wav).then(function(txt){
    AI.s.tx=false;
    txt=String(txt||'').replace(/\s+/g,' ').trim();
    if(!txt||/^(\(?\s*(no speech|silence|empty|कुछ नहीं)\s*\)?)$/i.test(txt)){aiRender();toast('बात समझ नहीं आई — फिर से बोलिए');return;}
    var base=String(AI.s.text||'').trim();AI.s.text=(base?base+' ':'')+txt;
    aiRender();var f=$('#ai-in');if(f)f.value=AI.s.text;
    if((aiCfg().auto!==false||aiHF())&&$('#aiw'))aiSend();
  },function(e){
    AI.s.tx=false;aiRender();
    if(e&&e.code==='key'){toast(aiErrText(e));return;}
    AI.s.recFail=true;
    toast((e&&e.code==='quota'?'आज AI का कोटा पूरा — ':(e&&e.code==='net'?'इंटरनेट नहीं मिला — ':'AI से आवाज़ नहीं लिखी गई — '))+(aiSR()?'अब Chrome वाले तरीके से सुन रहा हूँ, फिर से बोलिए':'कीबोर्ड के 🎤 से बोलिए'));
    if(aiSR()&&$('#aiw'))setTimeout(function(){if(!AI.s.listen&&$('#aiw'))aiSRStart(st.auto);},600);
