<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maa Bhagwati Misthan Bhandar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C1620">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MB Sweets">
<style>
@font-face{font-family:'Mukta';src:url('fonts/Mukta-400.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:'Mukta';src:url('fonts/Mukta-600.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:'Mukta';src:url('fonts/Mukta-700.woff') format('woff');font-weight:700 800;font-display:swap}
@font-face{font-family:'Baloo 2';src:url('fonts/Baloo2-700.woff') format('woff');font-weight:600 800;font-display:swap}
:root{
  --paper:#FAF3E7; --card:#FFFFFF; --ink:#2B1712; --muted:#8A7566; --line:#E6D9C6;
  --brandband:#5C1620; --on-brand:#FBEEDD;
  --gold:#9C6B00; --green:#2F6F4E; --amber:#A9720A; --red:#A6332E; --red-bg:#F6E1DD;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1210; --card:#251813; --ink:#F3E9DD; --muted:#B39C89; --line:#3B2A22;
    --gold:#E0B23D; --green:#5CD39A; --amber:#F2B84B; --red:#FF8A8A; --red-bg:#3B1C1C;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1210; --card:#251813; --ink:#F3E9DD; --muted:#B39C89; --line:#3B2A22;
  --gold:#E0B23D; --green:#5CD39A; --amber:#F2B84B; --red:#FF8A8A; --red-bg:#3B1C1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brandband);outline-offset:2px}
h1,h2,h3{font-family:'Baloo 2','Mukta',system-ui,sans-serif;margin:0}

.letterhead{background:var(--brandband);color:var(--on-brand);padding:16px 16px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.letterhead h1{font-size:1.4rem;line-height:1.2}
.letterhead p{margin:2px 0 0;font-size:.82rem;opacity:.88}
.lh-row{display:flex;align-items:center;gap:12px}
.lh-logo{width:54px;height:54px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.lh-text{min-width:0}

.app{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}

.band{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.band>div{padding:12px 6px;text-align:center;border-left:1px solid var(--line)}
.band>div:first-child{border-left:0}
.band b{display:block;font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.15rem;line-height:1.2}
.band span{display:block;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:2px}
.band .tom b{color:var(--gold)}
.band .due b{color:var(--red)}

.banner{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}
.banner.btn-banner{display:block;width:100%;text-align:left;border:0;font-family:inherit;font-weight:600}

.duecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.duemain{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:0;min-height:auto}
.duemain .nm{font-weight:700}
.duemain .sub{color:var(--red);font-size:.8rem;margin-top:2px}
.dueacts{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.dueacts .dueamt{font-weight:700;color:var(--red);font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.05rem}

#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:16px;color:#000;background:#fff}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:6px}
}

.sumcard{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sumhead{font-weight:700;color:var(--gold);margin-bottom:6px;font-size:.95rem}
.sumrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.sumrow:first-of-type{border-top:0}
.sumnm{font-weight:700;flex:1;min-width:110px}
.sumqty{font-weight:700;color:var(--brandband);white-space:nowrap}
.sumdetail{width:100%;color:var(--muted);font-size:.78rem}

.sechead{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.sechead h2{font-size:1.05rem}
.sechead .cnt{color:var(--muted);font-size:.85rem}

.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini.tomorrow{border-color:var(--gold);border-width:1.5px}
.mini .l{min-width:0}
.mini .nm,.mini .sub,.crow .nm,.crow .ph{display:block}
.crow .l{min-width:0}
#b-text{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.mini .nm{font-weight:700;overflow-wrap:anywhere}
.mini .sub{color:var(--muted);font-size:.82rem;margin-top:1px}
.mini .r{text-align:right;flex:0 0 auto}
.mini .r b{display:block;color:var(--red);font-size:.95rem}
.mini .r span{display:block;color:var(--muted);font-size:.75rem}

#search,#itemSearch,#ordersSearch{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-top:2px}
#ordersSearch{margin:2px 0 10px}

.addrow{display:flex;justify-content:flex-end;margin:10px 0 6px}
.lnk{background:none;border:0;color:var(--brandband);font-weight:700;min-height:40px;padding:0 4px;border-radius:8px}
:root[data-theme="dark"] .lnk, @media (prefers-color-scheme:dark){.lnk{color:#E9A9B0}}
.lnk.danger{color:var(--red)}
.lnk.muted{color:var(--muted);font-weight:500}

.crow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.crow .nm{font-weight:700}
.crow .ph{color:var(--muted);font-size:.82rem;margin-top:1px}
.crow .due{color:var(--red);font-weight:700;font-size:.92rem;white-space:nowrap}
.crow .clear{color:var(--green);font-size:.82rem;white-space:nowrap}

.empty{text-align:center;color:var(--muted);padding:32px 12px}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* customer profile */
.backbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0;min-height:40px}
.cphead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:4px}
.cphead h2{font-size:1.35rem}
.cphead .ph a{color:var(--brandband);text-decoration:none;font-weight:600}
.cphead .addr{color:var(--muted);font-size:.88rem;margin-top:2px}
.cpacts{display:flex;gap:8px;margin-top:6px}

.actbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;color:var(--ink)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{min-height:40px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.45}

.grouphead{margin:18px 0 8px;font-size:1rem;color:var(--muted);font-weight:700}

.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.order.cancelled{opacity:.58}
.otop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.otop .obadge{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-weight:700;font-size:.85rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 8px;flex:0 0 auto}
.odate{font-weight:700;margin-top:2px}
.stamp{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-weight:700;font-size:.9rem;padding:1px 10px;border:2px solid currentColor;border-radius:6px;transform:rotate(-3deg);white-space:nowrap;flex:0 0 auto}
.st-pending{color:var(--amber)} .st-partial{color:var(--gold)} .st-delivered{color:var(--green)} .st-cancelled{color:var(--muted);text-decoration:line-through}

.checklist{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line)}
.checklist li{display:flex;align-items:center;gap:10px;padding:5px 0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.citem{flex:1;overflow-wrap:anywhere}
.camt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.checklist li.ro{opacity:.7}
.checklist li button{background:none;border:0;text-align:left;display:flex;align-items:center;gap:10px;width:100%;padding:0;min-height:32px}

.paylog{margin-top:8px;font-size:.85rem;color:var(--muted)}
.paylog div{padding:1px 0}

.money{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:baseline;flex-wrap:wrap}
.money div{display:flex;flex-direction:column}
.money span{font-size:.76rem;color:var(--muted)}
.money b{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.05rem}
.money .due b{color:var(--red)}
.money .paidall{margin-left:auto;color:var(--green);font-weight:700;font-size:.9rem}

.oacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:9px 4px 8px;color:var(--muted);font-size:.74rem;font-weight:600}
.navbtn .ic{font-size:1.25rem;line-height:1}
.navbtn.on{color:var(--brandband)}

.fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 14px);z-index:6;background:var(--brandband);color:var(--on-brand);border:0;border-radius:999px;padding:0 20px;min-height:50px;font-weight:700;font-size:.98rem;box-shadow:0 6px 16px rgba(60,10,15,.35)}

.overlay{position:fixed;inset:0;z-index:10;background:rgba(20,10,8,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:calc(100% - 20px);overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out;overscroll-behavior:contain}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.sh-head h2{font-size:1.2rem}
.sh-actions{display:flex;gap:10px;margin-top:14px}
.sh-actions .btn{flex:1}
.fl{display:block;margin-top:12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
.err{color:var(--red);font-size:.88rem;margin-top:10px;min-height:1px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0}

/* order-form specific */
.custchip{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.custchip b{overflow-wrap:anywhere}
.custchip span{color:var(--muted);font-size:.82rem;display:block}
.suglist{margin-top:6px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.sugrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;min-height:40px}
.sugrow:last-child{border-bottom:0}
.sugrow small{display:block;color:var(--muted)}
.sugrow.newc{color:var(--brandband);font-weight:700}

.cattabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.cattab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 13px;min-height:36px;font-weight:600;font-size:.88rem}
.cattab.on{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 11px;font-size:.88rem;min-height:38px}
.chip small{display:block;color:var(--muted);font-size:.74rem}
.chip.empty{color:var(--muted);font-style:normal}

.lines{margin-top:10px}
.lrow{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.lrow .ltop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lrow .lname{font-weight:700;overflow-wrap:anywhere}
.lrow .lx{background:none;border:0;color:var(--red);font-size:1.25rem;line-height:1;min-height:32px;padding:0 4px}
.lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.lgrid label{display:block;font-size:.72rem;color:var(--muted)}
.lgrid input{width:100%;margin-top:2px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:16px}
.lamt{font-size:.78rem;color:var(--muted);margin-top:4px;text-align:right}
.ldaterow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.ldaterow label{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.ldaterow input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px;color:var(--ink)}
.ldaterow .lnk{font-size:.78rem;padding:0;min-height:auto}
.dtag{background:var(--paper);border:1px solid var(--gold);border-radius:6px;padding:0 6px;font-size:.7rem;color:var(--gold);margin-left:6px;white-space:nowrap;display:inline-block}
.dtag.dgiven{color:var(--green);border-color:var(--green)}
.mini.overdue{border-color:var(--red);border-width:1.5px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.payrow .lnk{min-height:30px;font-size:.8rem;padding:0 4px}
.homeinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.homeinfo .coll{font-size:.9rem;color:var(--muted)}
.homeinfo .coll b{color:var(--green)}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

.customitem{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px}
.customitem .g2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.customitem label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);margin-top:8px}

.ftotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--paper)}
.ftotal b{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.25rem;color:var(--brandband)}

/* items tab */
.itemrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.itemrow .nm{font-weight:700}
.itemrow .un{color:var(--muted);font-size:.82rem}
.itemrow .pr{font-weight:700;color:var(--gold);white-space:nowrap}
.catsec{margin-top:16px}
.catsec h3{font-size:.95rem;color:var(--muted);margin-bottom:7px}

.installbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.installbox p{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:500;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.billprev{max-height:52vh;overflow:auto;margin:6px 0 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:80px}
.billprev img{width:100%;display:block}
.billprev .hint{padding:24px 12px;text-align:center}
.billacts{display:flex;flex-direction:column;gap:8px}
.billacts .btn{width:100%}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<header class="letterhead">

</header>

</div>
<nav class="navbar" id="navbar"></nav>

<div id="sheetRoot"></div>

<div id="printArea"></div>

<script>
(function(){

var KEY='mbmb-billing-v1';

var CATS=[['mithai','मिठाई'],['dairy','डेयरी (दूध-दही-पनीर)'],['namkeen','नमकीन'],['cold','कोल्ड ड्रिंक्स'],['cake','केक'],['packaged','पैकेज्ड फूड / बिस्किट / मिक्सचर']];

var DEFAULT_SHOP={name:'Maa Bhagwati Misthan Bhandar',addr:'Nanaura, Darbhanga, Bihar - 846005',phone:'8002010218',owner:'Pankaj Gupta',terms:'सामान ले जाने से पहले पूरा पेमेंट करना होगा।'};
var DEFAULT_ITEMS=[
 ['i1','रसगुल्ला (किलो)','mithai','किलो',300],

 ['i5','गुलाब जामुन (किलो)','mithai','किलो',350],
 ['i6','गुलाब जामुन (पीस)','mithai','पीस',15],
 ['i7','चमचम (किलो)','mithai','किलो',320],
 ['i8','चमचम (पीस)','mithai','पीस',15],
 ['i9','पेड़ा','mithai','किलो',500],
 ['i10','मिल्क केक','mithai','किलो',300],
 ['i11','लड्डू','mithai','किलो',180],

var state={shop:Object.assign({},DEFAULT_SHOP),items:[],customers:[],orders:[],nextOrderNo:1};
var ui={view:'home',customerId:null,search:'',storageOk:true,editId:null,orderDraft:null,itemsSearch:'',confirm:null,ordersFilter:'all',cameFrom:'home',ordersSearch:'',pendingRestore:null};

/* ---------- storage ---------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      state.shop=Object.assign({},DEFAULT_SHOP,d.shop||{});
      state.items=Array.isArray(d.items)?d.items:DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
      state.customers=Array.isArray(d.customers)?d.customers:[];
      state.orders=Array.isArray(d.orders)?d.orders:[];
      normalizeState();
      var mx=0;state.orders.forEach(function(o){if(o.no>mx)mx=o.no;});
      state.nextOrderNo=Math.max(d.nextOrderNo||1,mx+1);
    }else{
      state.items=DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
      save();
    }
  }catch(e){
    ui.storageOk=false;
    /* purana data kharab padha gaya to use alag key par bacha lo, taaki overwrite na ho */
    try{var rawBad=localStorage.getItem(KEY);if(rawBad)localStorage.setItem(KEY+'-corrupt-'+Date.now(),rawBad);}catch(e2){}
    state.items=DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
  }
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){ui.storageOk=false;try{renderBanner();}catch(e2){}}
}
function normalizeState(){
  state.orders.forEach(function(o){
    if(!Array.isArray(o.items))o.items=[];
    if(!Array.isArray(o.payments))o.payments=[];
    o.payments.forEach(function(p){if(!p.id)p.id=uid();});
    o.items.forEach(function(it){if(!it.lid)it.lid=uid();});
  });
}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function rupee(n){n=num(n);return (n<0?'-':'')+'\u20B9'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayKey(v){var x=new Date(v);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fmtDT(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function fmtDonly(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDshort(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtQty(n){return String(Math.round(num(n)*1000)/1000);}
function round2(n){return Math.round(num(n)*100)/100;}
function keyToDate(k){var a=String(k).split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function dayDiff(fromKey,toKey){return Math.round((keyToDate(toKey)-keyToDate(fromKey))/86400000);}
function findCustomerByPhone(phone,exceptId){
  var p=phoneNorm(phone);if(!p)return null;
  for(var i=0;i<state.customers.length;i++){var c=state.customers[i];if(c.id!==exceptId&&phoneNorm(c.phone)===p)return c;}
  return null;
}
function phoneProblem(ph,exceptId){
  if(!ph)return '';
  if(ph.replace(/\D/g,'').length<10)return 'मोबाइल नंबर पूरा 10 अंकों का लिखो।';
  var dup=findCustomerByPhone(ph,exceptId);
  if(dup)return 'यह नंबर पहले से "'+dup.name+'" के नाम से सेव है।';
  return '';
}
function catLabel(c){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===c)return CATS[i][1];return c;}
function phoneNorm(p){
  p=String(p||'').replace(/\D/g,'');
  if(!p)return '';
  if(p.length===11&&p.charAt(0)==='0')p=p.slice(1);
  if(p.length===10)p='91'+p;
  return p;
}
var toastTimer;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}
function findCustomer(id){for(var i=0;i<state.customers.length;i++)if(state.customers[i].id===id)return state.customers[i];return null;}
function findOrder(id){for(var i=0;i<state.orders.length;i++)if(state.orders[i].id===id)return state.orders[i];return null;}
function findItem(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}
function customerOrders(cid){return state.orders.filter(function(o){return o.customerId===cid;});}
function orderTotal(o){return o.items.reduce(function(s,i){return s+num(i.qty)*num(i.rate);},0);}
function orderPaid(o){return o.payments.reduce(function(s,p){return s+num(p.amount);},0);}
function orderDue(o){return round2(Math.max(0,orderTotal(o)-orderPaid(o)));}
function orderStatus(o){
  if(o.cancelled)return 'cancelled';
  var total=o.items.length,done=o.items.filter(function(i){return i.delivered;}).length;
  if(total===0||done===0)return 'pending';
  if(done<total)return 'partial';
  return 'delivered';
}
function displayName(it){
  var n=String((it&&it.name)||''),u=String((it&&it.unit)||'').trim();
  var i=n.lastIndexOf('(');
  if(u&&i>0&&n.charAt(n.length-1)===')'){
    var inner=n.slice(i+1,-1).trim();
    if(inner===u)return n.slice(0,i).trim();
  }
  return n;
}
function itemDateKey(o,it){return it.date||dayKey(o.date);}
function namesList(items,max){
  var names=items.map(function(it){return displayName(it)+' ×'+fmtQty(it.qty);});
  if(names.length>max)return names.slice(0,max).join(', ')+' +'+(names.length-max)+' और';
  return names.join(', ');
}
function customerTotals(cid){
  var t=0,p=0,cnt=0;
  customerOrders(cid).forEach(function(o){if(!o.cancelled){t+=orderTotal(o);p+=orderPaid(o);cnt++;}});
  return {billed:t,paid:p,due:round2(Math.max(0,t-p)),extra:round2(Math.max(0,p-t)),count:cnt};
}
function allDue(){var t=0;state.customers.forEach(function(c){t+=customerTotals(c.id).due;});return t;}
function customerOldestDueDate(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled&&orderDue(o)>0;});
  if(!os.length)return null;
  var min=os[0].date;
  os.forEach(function(o){if(new Date(o.date)<new Date(min))min=o.date;});
  return min;
}
function renderDues(){
  var rows=state.customers.map(function(c){
    var t=customerTotals(c.id);
    if(t.due<=0)return null;
    var oldest=customerOldestDueDate(c.id);
    var days=oldest?dayDiff(dayKey(oldest),todayStr()):0;
    return {c:c,due:t.due,days:days};
  }).filter(function(x){return x;}).sort(function(a,b){return b.days-a.days;});

  var html='<button class="backbtn" data-act="nav" data-v="home">\u2190 होम</button>'+
    '<div class="sechead"><h2>सबसे पुराना बाकी</h2><span class="cnt">'+rows.length+' ग्राहक</span></div>'+
    (rows.length?'<p class="hint">कुल बाकी: <b style="color:var(--red)">'+rupee(allDue())+'</b> — सबसे पुराना सबसे ऊपर है।</p>':'');
  if(!rows.length){
    html+='<div class="empty"><b>सब कुछ क्लियर है!</b>किसी भी ग्राहक का बाकी नहीं है।</div>';
  }else{
    html+=rows.map(function(r){
      var subTxt=r.days>0?(r.days+' दिन से बाकी'):(r.days===0?'आज की डिलीवरी का बाकी':('आने वाला ऑर्डर — डिलीवरी '+(-r.days)+' दिन बाद'));
      return '<div class="duecard">'+
        '<button class="duemain" data-act="open-customer" data-id="'+r.c.id+'">'+
          '<span class="nm">'+esc(r.c.name)+'</span>'+
          '<span class="sub">'+subTxt+'</span>'+
        '</button>'+
        '<div class="dueacts">'+
          '<span class="dueamt">'+rupee(r.due)+'</span>'+
          '<button class="btn small" data-act="customer-payment" data-id="'+r.c.id+'">पेमेंट लो</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  $('#main').innerHTML=html;
}

    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persisted().then(function(p){
        if(p){ui.persisted=true;return;}
        return navigator.storage.persist().then(function(g){ui.persisted=!!g;});
      }).catch(function(){});

}

/* ---------- HOME ---------- */
function dueGroups(live,dateKey){
  var out=[];
  live.forEach(function(o){
    var due=o.items.filter(function(it){return !it.delivered&&itemDateKey(o,it)===dateKey;});
    if(due.length)out.push({order:o,items:due});
  });
  out.sort(function(a,b){return new Date(a.order.date)-new Date(b.order.date);});
  return out;
}
function dayItemSummary(live,dateKey){
  var map={};
  live.forEach(function(o){
    o.items.forEach(function(it){
      if(it.delivered)return;
      if(itemDateKey(o,it)!==dateKey)return;
      var k=it.name+'|'+it.unit;
      if(!map[k])map[k]={name:displayName(it),unit:it.unit,qty:0,custs:{}};
      map[k].qty+=num(it.qty);
      var c=findCustomer(o.customerId);
      var cname=c?c.name:'?';
      map[k].custs[cname]=(map[k].custs[cname]||0)+num(it.qty);
    });
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  arr.sort(function(a,b){return b.qty-a.qty;});
  return arr;
}
function daySummaryBlock(live,dateKey,label){
  var items=dayItemSummary(live,dateKey);
  if(!items.length)return '';
  var rows=items.map(function(it){
    var custNames=Object.keys(it.custs);
    var detail=custNames.map(function(cn){return cn+' ×'+fmtQty(it.custs[cn]);}).join(', ');
    return '<div class="sumrow"><span class="sumnm">'+esc(displayName(it))+'</span><span class="sumqty">'+fmtQty(it.qty)+' '+esc(it.unit)+'</span>'+
      '<span class="sumdetail">'+esc(detail)+'</span></div>';
  }).join('');
  return '<div class="sumcard"><div class="sumhead">'+esc(label)+' \u2013 कुल सामान तैयार करो</div>'+rows+'</div>';
}
function renderHome(){
  var today=todayStr();
  var tmr=(function(){var d=new Date();d.setDate(d.getDate()+1);return dayKey(d);})();
  var dayAfter=(function(){var d=new Date();d.setDate(d.getDate()+2);return dayKey(d);})();
  var live=state.orders.filter(function(o){return !o.cancelled;});
  var tmrGroups=dueGroups(live,tmr);
  var todGroups=dueGroups(live,today);
  var dayAfterGroups=dueGroups(live,dayAfter);
  var overdueGroups=[];
  live.forEach(function(o){
    var od=o.items.filter(function(it){return !it.delivered&&itemDateKey(o,it)<today;});
    if(od.length)overdueGroups.push({order:o,items:od});
  });
  overdueGroups.sort(function(a,b){return new Date(a.order.date)-new Date(b.order.date);});
  var todayColl=0;
  state.orders.forEach(function(o){o.payments.forEach(function(p){if(p.date===today)todayColl+=num(p.amount);});});
  var band='<div class="band">'+
    '<div><b>'+todGroups.length+'</b><span>आज डिलीवरी</span></div>'+
    '<div class="tom"><b>'+tmrGroups.length+'</b><span>कल डिलीवरी</span></div>'+
    '<div class="due"><b>'+rupee(allDue())+'</b><span>कुल बाकी</span></div></div>';

  var dueCustCount=state.customers.filter(function(c){return customerTotals(c.id).due>0;}).length;
  var duesLink=(state.orders.length||dueCustCount)?'<div class="homeinfo"><span class="coll">आज जमा हुआ: <b>'+rupee(todayColl)+'</b></span>'+(dueCustCount?'<button class="lnk" data-act="view-dues">📋 सबसे पुराना बाकी ('+dueCustCount+')</button>':'')+'</div>':'';

  var sections='';
  if(overdueGroups.length){
    sections+='<div class="sechead"><h2 style="color:var(--red)">⚠️ छूटी डिलीवरी</h2><span class="cnt">'+overdueGroups.length+'</span></div>'+
      '<p class="hint" style="margin-top:-4px">इनकी तारीख निकल गई पर टिक नहीं लगा। दे दिया हो तो ग्राहक खोलकर टिक लगा दो।</p>'+
      overdueGroups.map(function(g){return miniCard(g.order,g.items,'overdue');}).join('');
  }
  sections+=daySummaryBlock(live,dayAfter,'परसों');
  if(dayAfterGroups.length){
    sections+='<div class="sechead"><h2>परसों डिलीवरी है</h2><span class="cnt">'+dayAfterGroups.length+'</span></div>'+dayAfterGroups.map(function(g){return miniCard(g.order,g.items,'');}).join('');
  }
  sections+=daySummaryBlock(live,tmr,'कल');
  if(tmrGroups.length){
    sections+='<div class="sechead"><h2>\uD83D\uDD14 कल डिलीवरी है</h2><span class="cnt">'+tmrGroups.length+'</span></div>'+tmrGroups.map(function(g){return miniCard(g.order,g.items,'tomorrow');}).join('');
  }
  sections+=daySummaryBlock(live,today,'आज');
  if(todGroups.length){
    sections+='<div class="sechead"><h2>आज डिलीवरी है</h2><span class="cnt">'+todGroups.length+'</span></div>'+todGroups.map(function(g){return miniCard(g.order,g.items,'today');}).join('');
  }

  var q=ui.search.trim().toLowerCase();
  var custs=state.customers.filter(function(c){
    if(!q)return true;
    return c.name.toLowerCase().indexOf(q)>-1||String(c.phone||'').indexOf(q)>-1;
  }).slice().sort(function(a,b){
    function last(c){var os=customerOrders(c.id);var m=c.createdAt||0;os.forEach(function(o){if(o.createdAt>m)m=o.createdAt;});return m;}
    return last(b)-last(a);
  });

  var list;
  if(!state.customers.length){
    list='<div class="empty"><b>Abhi koi customer nahi hai</b>Neeche "+ नया ऑर्डर" dabao, customer ka naam likho aur pehla order banao.</div>';
  }else if(!custs.length){
    list='<div class="empty"><b>Kuch nahi mila</b>Naam ya phone number se dobara search karo.</div>';
  }else{
    list=custs.map(function(c){
      var t=customerTotals(c.id);
      return '<button class="crow" data-act="open-customer" data-id="'+c.id+'" style="width:100%;text-align:left;border:1px solid var(--line)">'+
        '<span class="l"><span class="nm">'+esc(c.name)+'</span><span class="ph">'+esc(c.phone||'फ़ोन नहीं')+'</span></span>'+
        (t.due>0?'<span class="due">'+rupee(t.due)+'<br><span style="font-weight:400;font-size:.72rem">बाकी</span></span>':'<span class="clear">\u2713 क्लियर</span>')+
        '</button>';
    }).join('');
  }

  $('#main').innerHTML=band+duesLink+sections+
    '<div class="sechead" style="margin-top:20px"><h2>ग्राहक खोजो</h2></div>'+
    '<input id="search" type="search" placeholder="नाम या फोन नंबर" autocomplete="off" value="'+esc(ui.search)+'">'+
    '<div class="addrow"><button class="lnk" data-act="add-customer">+ नया ग्राहक</button></div>'+
    list;
}
function miniCard(o,dueItems,tag){
  var c=findCustomer(o.customerId);
  var due=orderDue(o);
  var showItems=dueItems||o.items;
  var subTxt=dueItems?namesList(showItems,3):(o.items.length+' item');
  return '<button class="mini'+(tag==='tomorrow'?' tomorrow':(tag==='overdue'?' overdue':''))+'" data-act="open-customer" data-id="'+o.customerId+'" style="width:100%;border:1px solid var(--line);text-align:left">'+
    '<span class="l"><span class="nm">'+esc(c?c.name:'?')+'</span><span class="sub">#'+o.no+' \u00b7 '+fmtDT(o.date)+' \u00b7 '+esc(subTxt)+'</span></span>'+
    (due>0?'<span class="r"><b>'+rupee(due)+'</b><span>बाकी</span></span>':'')+
    '</button>';
}

/* ---------- ORDERS OVERVIEW ---------- */
function renderOrders(){
  var filter=ui.ordersFilter||'all';
  var all=state.orders.slice();
  var totalAll=all.length;
  var pendingCount=all.filter(function(o){var s=orderStatus(o);return s==='pending'||s==='partial';}).length;
  var doneCount=all.filter(function(o){return orderStatus(o)==='delivered';}).length;

  var band='<div class="band">'+
    '<div><b>'+totalAll+'</b><span>कुल ऑर्डर</span></div>'+
    '<div class="tom"><b>'+pendingCount+'</b><span>पेंडिंग</span></div>'+
    '<div><b style="color:var(--green)">'+doneCount+'</b><span>पूरा हुआ</span></div></div>';

  var filters=[['all','सभी'],['pending','पेंडिंग'],['delivered','पूरा हुआ'],['cancelled','कैंसल']];
  var tabsHtml='<div class="cattabs" style="margin-top:0">'+filters.map(function(f){
    return '<button class="cattab'+(filter===f[0]?' on':'')+'" data-act="orders-filter" data-f="'+f[0]+'">'+f[1]+'</button>';
  }).join('')+'</div>';

  var oqRaw=(ui.ordersSearch||'').trim().toLowerCase();
  var byNo=oqRaw.charAt(0)==='#';
  var oq=oqRaw.replace(/^#/,'').trim();
  var list=all.filter(function(o){
    if(oq){
      var oc=findCustomer(o.customerId);
      var hit=byNo?String(o.no)===oq:(String(o.no)===oq||(oc&&(oc.name.toLowerCase().indexOf(oq)>-1||String(oc.phone||'').replace(/\s/g,'').indexOf(oq.replace(/\s/g,''))>-1)));
      if(!hit)return false;
    }
    var s=orderStatus(o);
    if(filter==='pending')return s==='pending'||s==='partial';
    if(filter==='delivered')return s==='delivered';
    if(filter==='cancelled')return s==='cancelled';
    return true;
  });
  if(filter==='delivered'||filter==='cancelled'){
    list.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  }else{
    list.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  }

  var rows;
  if(!list.length){
    rows='<div class="empty"><b>यहाँ कोई ऑर्डर नहीं</b>दूसरा फ़िल्टर चुन कर देखो।</div>';
  }else{
    rows=list.map(orderOverviewRow).join('');
  }

  $('#main').innerHTML='<div class="sechead"><h2>सारे ऑर्डर</h2></div>'+band+
    '<input id="ordersSearch" type="search" placeholder="नाम, फोन या ऑर्डर नंबर से खोजो" autocomplete="off" value="'+esc(ui.ordersSearch||'')+'">'+tabsHtml+'<div style="margin-top:12px">'+rows+'</div>';
}
function orderOverviewRow(o){
  var c=findCustomer(o.customerId);

  var due=orderDue(o);

    '<span class="l"><span class="nm">'+esc(c?c.name:'?')+'</span><span class="sub">#'+o.no+' \u00b7 '+fmtDT(o.date)+' \u00b7 '+o.items.length+' item</span></span>'+

/* ---------- CUSTOMER PROFILE ---------- */
function renderCustomer(){
  var c=findCustomer(ui.customerId);
  if(!c){ui.view='home';return renderRoute();}
  var t=customerTotals(c.id);
  var os=customerOrders(c.id).slice();
  var todayKey=todayStr();
  function isUp(o){
    if(dayKey(o.date)>=todayKey)return true;
    if(o.cancelled)return false;
    return o.items.some(function(it){return !it.delivered&&it.date&&it.date>=todayKey;});
  }
  var upcoming=os.filter(isUp).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var past=os.filter(function(o){return !isUp(o);}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  var backLabel=ui.cameFrom==='orders'?'ऑर्डर्स':(ui.cameFrom==='dues'?'बाकी लिस्ट':'होम');
  var backTarget=ui.cameFrom==='dues'?'dues':ui.cameFrom;
  var html='<button class="backbtn" data-act="nav" data-v="'+backTarget+'">\u2190 '+backLabel+'</button>'+
    '<div class="cphead"><div><h2>'+esc(c.name)+'</h2>'+
    (c.phone?'<div class="ph"><a href="tel:+'+phoneNorm(c.phone)+'">'+esc(c.phone)+'</a></div>':'')+
    (c.address?'<div class="addr">'+esc(c.address)+'</div>':'')+
    '</div></div>'+
    '<div class="cpacts"><button class="lnk" data-act="edit-customer" data-id="'+c.id+'">बदलो</button><button class="lnk danger" data-act="del-customer" data-id="'+c.id+'">डिलीट</button></div>'+
    '<div class="band" style="grid-template-columns:repeat(4,1fr);margin-top:12px">'+
    '<div><b>'+t.count+'</b><span>ऑर्डर</span></div>'+
    '<div><b>'+rupee(t.billed)+'</b><span>कुल बिल</span></div>'+
    '<div><b>'+rupee(t.paid)+'</b><span>जमा</span></div>'+
    '<div class="due"><b>'+rupee(t.due)+'</b><span>बाकी</span></div></div>'+
    (canAdjustExtra(c.id)?'<div class="banner" style="background:transparent;border:1px dashed var(--green);color:var(--green)">किसी ऑर्डर पर ज़्यादा पैसा जमा है और दूसरे पर बाकी है. <button class="btn small" style="margin-top:6px" data-act="adjust-extra" data-id="'+c.id+'">ज़्यादा जमा को बाकी में जोड़ दो</button></div>':'')+
    (t.extra>0?'<p class="hint" style="color:var(--green);font-weight:600;margin-top:-6px">'+rupee(t.extra)+' ज़्यादा जमा है — वापस करो या अगले ऑर्डर में जोड़ दो।</p>':'')+
    '<div class="actbar">'+
    '<button class="btn primary small" data-act="new-order-for" data-id="'+c.id+'">+ नया ऑर्डर</button>'+
    (t.due>0?'<button class="btn small" data-act="customer-payment" data-id="'+c.id+'">पेमेंट लो</button>':'')+
    (os.filter(function(o){return !o.cancelled;}).length?summaryButton(c):'')+
    '</div>';

  if(!os.length){
    html+='<div class="empty"><b>अभी कोई ऑर्डर नहीं</b>"+ नया ऑर्डर" दबाओ।</div>';
  }else{
    if(upcoming.length){html+='<div class="grouphead">आने वाले ऑर्डर</div>'+upcoming.map(orderCardFull).join('');}
    if(past.length){html+='<div class="grouphead">पुराने ऑर्डर</div>'+past.map(orderCardFull).join('');}
  }
  $('#main').innerHTML=html;
}
function orderCardFull(o){
  var st=orderStatus(o);
  var tot=orderTotal(o),paid=orderPaid(o),due=orderDue(o);
  var cancelled=o.cancelled;
  var baseDayKey=dayKey(o.date);
  var items=o.items.map(function(it){
    var amt=num(it.qty)*num(it.rate);
    var dtag=(!it.delivered&&it.date&&it.date!==baseDayKey)?(' <span class="dtag">'+fmtDshort(it.date)+'</span>'):'';
    if(cancelled){
      return '<li class="ro"><span class="chk">\u00b7</span><span class="citem">'+esc(displayName(it))+' \u00d7'+it.qty+dtag+'</span><span class="camt">'+rupee(amt)+'</span></li>';
    }
    return '<li><button data-act="toggle-item" data-order="'+o.id+'" data-line="'+it.lid+'"><span class="chk'+(it.delivered?' on':'')+'">\u2713</span><span class="citem">'+esc(displayName(it))+' ×'+fmtQty(it.qty)+' '+esc(it.unit)+dtag+(it.delivered&&it.deliveredAt?' <span class="dtag dgiven">दिया '+fmtDshort(it.deliveredAt)+'</span>':'')+'</span><span class="camt">'+rupee(amt)+'</span></button></li>';
  }).join('');
  var pays='';
  if(o.payments.length){
    pays='<div class="paylog"><div style="font-weight:600">जमा का हिसाब:</div>'+o.payments.map(function(p){
      return '<div class="payrow"><span>'+fmtDonly(p.date)+': '+rupee(p.amount)+(p.note?' ('+esc(p.note)+')':'')+'</span>'+
        (cancelled?'':'<button class="lnk danger" data-act="del-payment" data-order="'+o.id+'" data-pay="'+p.id+'">हटाओ</button>')+'</div>';
    }).join('')+'</div>';
  }
  var acts='';
  if(!cancelled){
    acts='<div class="oacts">'+
      (due>0?'<button class="btn small" data-act="order-payment" data-id="'+o.id+'">पेमेंट लो</button>':'')+
      billButton(o)+
      '<button class="lnk" data-act="remind-order" data-id="'+o.id+'">\uD83D\uDD14 रिमाइंडर</button>'+
      '<button class="lnk" data-act="print-order" data-id="'+o.id+'">\uD83D\uDDA8\uFE0F प्रिंट</button>'+
      '<button class="lnk" data-act="edit-order" data-id="'+o.id+'">एडिट</button>'+
      '<button class="lnk danger" data-act="cancel-order" data-id="'+o.id+'">कैंसल</button>'+
      '</div>';
  }
  return '<article class="order'+(cancelled?' cancelled':'')+'">'+
    '<div class="otop"><div><div class="odate">'+fmtDT(o.date)+'</div></div>'+
    '<span class="obadge">#'+o.no+'</span>'+
    '<span class="stamp st-'+st+'">'+STAMP[st]+'</span></div>'+
    (o.notes?'<div class="hint">'+esc(o.notes)+'</div>':'')+
    '<ul class="checklist">'+items+'</ul>'+
    pays+
    '<div class="money"><div><span>टोटल</span><b>'+rupee(tot)+'</b></div><div><span>जमा</span><b>'+rupee(paid)+'</b></div>'+
    (due>0?'<div class="due"><span>बाकी</span><b>'+rupee(due)+'</b></div>':(paid>tot+0.001?'<div class="paidall">'+rupee(paid-tot)+' ज़्यादा जमा</div>':'<div class="paidall">पूरा जमा</div>'))+'</div>'+
    acts+'</article>';
}

function saveCustomerFrom(id){
  var name=$('#c-name').value.trim();
  if(!name){$('#c-err').textContent='नाम लिखो।';return null;}
  var phErr=phoneProblem($('#c-phone').value.trim(),id||null);
  if(phErr){$('#c-err').textContent=phErr;return null;}
  var c=id?findCustomer(id):null;
  if(c){c.name=name;c.phone=$('#c-phone').value.trim();c.address=$('#c-addr').value.trim();}
  else{
    c={id:uid(),name:name,phone:$('#c-phone').value.trim(),address:$('#c-addr').value.trim(),createdAt:Date.now()};
    state.customers.push(c);
  }
  save();
  return c;

function syncDraftField(t){

function saveOrderFromDraft(){
  var d=ui.orderDraft;
  var err=$('#of-err');
  if(!d.customerId){err.textContent='ग्राहक चुनो या नया जोड़ो।';return;}
  var dateVal=$('#of-date').value;
  if(!dateVal){err.textContent='डिलीवरी की date/time चुनो।';return;}
  var items=d.lines.filter(function(l){return num(l.qty)>0;}).map(function(l){return {lid:l.lid,name:l.name,unit:l.unit,rate:Math.max(0,num(l.rate)),qty:num(l.qty),delivered:!!l.delivered,deliveredAt:l.delivered?(l.deliveredAt||''):'',date:l.date||''};});
  if(!items.length){err.textContent='कम से कम एक item जोड़ो।';return;}
  var notes=$('#of-notes').value.trim();
  if(ui.editId){
    var o=findOrder(ui.editId);
    o.customerId=d.customerId;o.date=dateVal;o.items=items;o.notes=notes;
    save();closeSheet();toast('ऑर्डर #'+o.no+' अपडेट हो गया');
  }else{
    var totNew=round2(items.reduce(function(s,i){return s+i.qty*i.rate;},0));
    var advIn=Math.max(0,num($('#of-advance').value));
    var adv=Math.min(totNew,advIn);
    var o2={id:uid(),no:state.nextOrderNo++,customerId:d.customerId,date:dateVal,items:items,payments:adv>0?[{id:uid(),amount:adv,date:todayStr(),note:'Advance'}]:[],cancelled:false,notes:notes,createdAt:Date.now()};
    state.orders.push(o2);
    save();closeSheet();toast('ऑर्डर #'+o2.no+' save हो गया'+(advIn>totNew?' (advance टोटल से ज़्यादा था, '+rupee(totNew)+' ही जमा किया)':''));
  }
  ui.view='customer';ui.customerId=d.customerId;
  renderRoute();window.scrollTo(0,0);
}

function orderExtra(o){return round2(Math.max(0,orderPaid(o)-orderTotal(o)));}
function canAdjustExtra(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled;});
  return os.some(function(o){return orderExtra(o)>0;})&&os.some(function(o){return orderDue(o)>0;});
}
function adjustExtra(cid){
  var os=customerOrders(cid).filter(function(o){return !o.cancelled;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var moved=0,today=todayStr();
  os.forEach(function(src){
    var ex=orderExtra(src);
    os.forEach(function(dst){
      if(ex<=0.001||dst===src)return;
      var need=orderDue(dst);if(need<=0)return;
      var take=round2(Math.min(ex,need));
      src.payments.push({id:uid(),amount:-take,date:today,note:'#'+dst.no+' में adjust'});
      dst.payments.push({id:uid(),amount:take,date:today,note:'#'+src.no+' से adjust'});
      ex=round2(ex-take);moved=round2(moved+take);
    });
  });
  return moved;
}

  var c=findCustomer(cid);
  var el=customerOrders(cid).filter(function(o){return !o.cancelled&&orderDue(o)>0;});

function waLink(phone,text){
  var p=phoneNorm(phone);if(!p)return '';
  return 'https://api.whatsapp.com/send?phone='+p+'&text='+encodeURIComponent(text);
}
function appendTerms(L){
  var terms=(state.shop.terms||'').trim();
  if(!terms)return;
  L.push('-------------------');
  L.push('नियम व शर्तें:');
  terms.split('\n').forEach(function(line){
    line=line.trim();
    if(line)L.push('- '+line);
  });
}
function billLineItems(L, o){
  var baseDayKey=dayKey(o.date);
  o.items.forEach(function(it,idx){
    var amt=num(it.qty)*num(it.rate);
    L.push((idx+1)+'. '+displayName(it)+' '+(it.delivered?('✅'+(it.deliveredAt?' ('+fmtDshort(it.deliveredAt)+')':'')):'⏳'));
    L.push('    '+fmtQty(it.qty)+' '+it.unit+' x '+rupee(it.rate)+' = '+rupee(amt));
    if(!it.delivered&&it.date&&it.date!==baseDayKey){
      L.push('    Delivery: '+fmtDshort(it.date));
    }
    if(idx<o.items.length-1)L.push('');
  });
}
function billMessage(o){
  var c=findCustomer(o.customerId);
  var L=[];
  L.push('*'+state.shop.name+'*');
  L.push(state.shop.addr);
  L.push('Ph: '+state.shop.phone);
  L.push('===================');
  L.push('BILL');
  L.push('Bill No: '+o.no);
  L.push('Delivery: '+fmtDT(o.date));
  L.push('Customer: '+(c?c.name:'-'));
  L.push('-------------------');
  billLineItems(L, o);
  L.push('');
  L.push('✅ = दिया गया    ⏳ = बाकी');
  L.push('-------------------');
  L.push('Total Bill: '+rupee(orderTotal(o)));
  L.push('Jama (Advance/Paid): '+rupee(orderPaid(o)));
  o.payments.forEach(function(p){L.push('    '+fmtDshort(p.date)+': '+rupee(p.amount)+(p.note?' ('+p.note+')':''));});
  L.push('Baaki (Due): '+rupee(orderDue(o)));
  if(orderPaid(o)>orderTotal(o)+0.001)L.push('Extra Jama: '+rupee(orderPaid(o)-orderTotal(o)));
  appendTerms(L);
  L.push('===================');
  L.push('Dhanyawad');
  L.push(state.shop.owner);
  return L.join('\n');
}
function summaryMessage(c){
  var os=customerOrders(c.id).filter(function(o){return !o.cancelled;}).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var L=[];
  L.push('*'+state.shop.name+'*');
  L.push(state.shop.addr);

var BI={W:1080,P:56,QX:650,RX:830,maroon:'#5C1620',cream:'#FBEEDD',paper:'#FAF3E7',line:'#E6D9C6',ink:'#2B1712',muted:'#7A6556',gold:'#9C6B00',green:'#2F6F4E',red:'#A6332E',redbg:'#F6E1DD',greenbg:'#E3F1E8'};
var BI_BODY="Mukta,'Noto Sans Devanagari','Nirmala UI',sans-serif";

function biFont(ctx,w,px,head){ctx.font=w+' '+px+'px '+(head?BI_HEAD:BI_BODY);}
function biText(ctx,s,x,y,align,color){ctx.textAlign=align||'left';ctx.fillStyle=color||BI.ink;ctx.fillText(String(s),x,y);}

function biFontsReady(){

    ]).then(function(){},function(){});
  }catch(e){return Promise.resolve();}
}
function biWrap(ctx,text,maxW){
  var words=String(text==null?'':text).split(' '),lines=[],cur='';
  words.forEach(function(w){
    if(!w)return;
    var t=cur?cur+' '+w:w;
    if(!cur||ctx.measureText(t).width<=maxW)cur=t;else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}
function biRound(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}
function biHeader(ctx,logo){

  if(logo){var ls=156;ctx.drawImage(logo,P,Math.round((H-ls)/2),ls,ls);}

function biTitle(ctx,y,title,rTop,rBottom){

function biTableHead(ctx,y){

function biIconDone(ctx,x,y,s){
  biRound(ctx,x,y,s,s,Math.round(s*0.22),'#2FA84F',null);
  ctx.save();ctx.strokeStyle='#FFFFFF';ctx.lineWidth=Math.max(3,s*0.14);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x+s*0.24,y+s*0.53);ctx.lineTo(x+s*0.43,y+s*0.71);ctx.lineTo(x+s*0.77,y+s*0.31);ctx.stroke();
  ctx.restore();

function biIconPending(ctx,x,y,s){
  ctx.save();
  var frame='#7A5A1E',sand='#E0A21B';
  ctx.fillStyle=frame;
  biRound(ctx,x+s*0.10,y+s*0.02,s*0.80,s*0.13,s*0.05,frame,null);
  biRound(ctx,x+s*0.10,y+s*0.85,s*0.80,s*0.13,s*0.05,frame,null);
  ctx.beginPath();
  ctx.moveTo(x+s*0.20,y+s*0.15);ctx.lineTo(x+s*0.80,y+s*0.15);ctx.lineTo(x+s*0.56,y+s*0.50);
  ctx.lineTo(x+s*0.80,y+s*0.85);ctx.lineTo(x+s*0.20,y+s*0.85);ctx.lineTo(x+s*0.44,y+s*0.50);ctx.closePath();
  ctx.fillStyle='#FFF4DC';ctx.fill();
  ctx.strokeStyle=frame;ctx.lineWidth=Math.max(2,s*0.07);ctx.lineJoin='round';ctx.stroke();
  ctx.fillStyle=sand;
  ctx.beginPath();ctx.moveTo(x+s*0.32,y+s*0.25);ctx.lineTo(x+s*0.68,y+s*0.25);ctx.lineTo(x+s*0.50,y+s*0.45);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(x+s*0.50,y+s*0.60);ctx.lineTo(x+s*0.71,y+s*0.80);ctx.lineTo(x+s*0.29,y+s*0.80);ctx.closePath();ctx.fill();
  ctx.fillRect(x+s*0.485,y+s*0.45,s*0.03,s*0.17);
  ctx.restore();
}
function biItemRow(ctx,y,o,it,idx){
  var W=BI.W,P=BI.P,IS=34,NX=P+IS+14,nameW=BI.QX-176-NX;
  biFont(ctx,600,32);var nl=biWrap(ctx,(idx+1)+'. '+displayName(it),nameW);
  var subs=[];
  if(!it.delivered&&it.date&&it.date!==dayKey(o.date))subs.push({t:'डिलीवरी: '+fmtDshort(it.date),c:BI.gold});
  if(it.delivered&&it.deliveredAt)subs.push({t:'दिया गया: '+fmtDshort(it.deliveredAt),c:BI.green});
  var fy=y+50,yy=fy;
  if(it.delivered)biIconDone(ctx,P,fy-28,IS);else biIconPending(ctx,P,fy-29,IS);
  biFont(ctx,600,32);
  nl.forEach(function(l,i){if(i>0)yy+=42;biText(ctx,l,NX,yy,'left',BI.ink);});

function biOrderBar(ctx,y,o){

function biOrderSub(ctx,y,o){

function biTotals(ctx,y,tot,paid,payments){
  var W=BI.W,P=BI.P,bx=W-P-520;
  y+=28;
  biIconDone(ctx,P,y+6,30);biFont(ctx,600,25);biText(ctx,'दिया गया',P+42,y+30,'left',BI.muted);
  biIconPending(ctx,P,y+54,30);biText(ctx,'बाकी',P+42,y+78,'left',BI.muted);
  biFont(ctx,600,31);biText(ctx,'कुल बिल',bx,y+32,'left',BI.ink);biText(ctx,rupee(tot),W-P,y+32,'right',BI.ink);y+=50;
  biText(ctx,'जमा',bx,y+32,'left',BI.ink);biText(ctx,rupee(paid),W-P,y+32,'right',BI.green);y+=46;
  (payments||[]).forEach(function(p){
    biFont(ctx,400,25);
    biText(ctx,fmtDshort(p.date)+(p.note?' ('+p.note+')':''),bx+22,y+26,'left',BI.muted);
    biText(ctx,rupee(p.amount),W-P,y+26,'right',BI.muted);y+=36;
  });
  y+=16;
  var due=round2(Math.max(0,tot-paid)),extra=round2(Math.max(0,paid-tot)),bg,fg,label,val;
  if(due>0){bg=BI.redbg;fg=BI.red;label='बाकी';val=rupee(due);}
  else if(extra>0){bg=BI.greenbg;fg=BI.green;label='ज़्यादा जमा';val=rupee(extra);}
  else{bg=BI.greenbg;fg=BI.green;label='पूरा भुगतान हो गया';val='✓';}
  biRound(ctx,bx-22,y,W-P-bx+22,88,16,bg,null);
  biFont(ctx,700,36,true);biText(ctx,label,bx,y+58,'left',fg);
  biFont(ctx,700,42,true);biText(ctx,val,W-P-22,y+60,'right',fg);

function biTerms(ctx,y){
  var W=BI.W,P=BI.P,NL=String.fromCharCode(10);

function renderBillImage(kind,ref){
  return Promise.all([biFontsReady(),biLoadImg('logo-header.png')]).then(function(r){
    var logo=r[1];
    var o=kind==='order'?ref:null,c=kind==='order'?findCustomer(o.customerId):ref;
    var orders=kind==='order'?[o]:customerOrders(c.id).filter(function(x){return !x.cancelled;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var rowsN=0,payN=0;orders.forEach(function(x){rowsN+=x.items.length;payN+=x.payments.length;});
    var H=Math.min(15000,Math.ceil(1600+rowsN*170+orders.length*190+payN*40+String(state.shop.terms||'').length*2));
    var cv=document.createElement('canvas');cv.width=BI.W;cv.height=H;
    var ctx=cv.getContext('2d');ctx.textBaseline='alphabetic';
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,BI.W,H);
    var y=biHeader(ctx,logo)+34;
    if(kind==='order'){
      y=biTitle(ctx,y,'बिल','बिल नं. '+o.no,'तारीख: '+fmtDonly(new Date()));
      y=biCustomer(ctx,y,c,'डिलीवरी: '+fmtDT(o.date));
      y=biTableHead(ctx,y);
      o.items.forEach(function(it,i){y=biItemRow(ctx,y,o,it,i);});
      y=biTotals(ctx,y,orderTotal(o),orderPaid(o),o.payments);
    }else{
      y=biTitle(ctx,y,'पूरा हिसाब',orders.length+' ऑर्डर','तारीख: '+fmtDonly(new Date()));
      y=biCustomer(ctx,y,c,null);
      y=biTableHead(ctx,y);
      var gt=0,gp=0;
      orders.forEach(function(ox){
        y=biOrderBar(ctx,y,ox);
        ox.items.forEach(function(it,i){y=biItemRow(ctx,y,ox,it,i);});
        y=biOrderSub(ctx,y,ox);
        gt+=orderTotal(ox);gp+=orderPaid(ox);
      });
      y=biTotals(ctx,y,gt,gp,null);
    }
    y=biTerms(ctx,y);
    y=biFooter(ctx,y);
    var out=document.createElement('canvas');out.width=BI.W;out.height=Math.min(Math.ceil(y),H);
    out.getContext('2d').drawImage(cv,0,0);
    return new Promise(function(res,rej){out.toBlob(function(b){if(b)res(b);else rej(new Error('blob'));},'image/png');});
  });
}

/* ---------- Calendar reminders (.ics) — works offline, no server needed ---------- */
function icsDate(dt){
  return dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+'T'+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+pad(dt.getUTCSeconds())+'Z';
}
function icsEscape(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function orderIcs(o){
  var c=findCustomer(o.customerId);
  var start=new Date(o.date);
  if(isNaN(start))start=new Date();
  var end=new Date(start.getTime()+30*60000);
  var itemsTxt=o.items.map(function(it){return displayName(it)+' x'+fmtQty(it.qty)+' '+it.unit;}).join(', ');
  var summary='Order #'+o.no+' - '+(c?c.name:'Customer');
  var desc=itemsTxt+' | Baaki: '+rupee(orderDue(o));
  var uidv='mbmb-order-'+o.id+'@mbmb-billing';
  var L=[];
  L.push('BEGIN:VCALENDAR');
  L.push('VERSION:2.0');
  L.push('PRODID:-//MBMB Billing//HI');
  L.push('BEGIN:VEVENT');
  L.push('UID:'+uidv);
  L.push('DTSTAMP:'+icsDate(new Date()));
  L.push('DTSTART:'+icsDate(start));
  L.push('DTEND:'+icsDate(end));
  L.push('SUMMARY:'+icsEscape(summary));
  L.push('DESCRIPTION:'+icsEscape(desc));
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('DESCRIPTION:Reminder');
  L.push('TRIGGER:-P2D');
  L.push('END:VALARM');
  L.push('BEGIN:VALARM');
  L.push('ACTION:DISPLAY');
  L.push('DESCRIPTION:Reminder');
  L.push('TRIGGER:-P1D');
  L.push('END:VALARM');
  L.push('END:VEVENT');
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function downloadIcs(o){
  var ics=orderIcs(o);
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='order-'+o.no+'-reminder.ics';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}

/* ---------- Print bill ---------- */
function printOrderBill(o){
  var c=findCustomer(o.customerId);
  var rows=o.items.map(function(it,idx){
    var amt=num(it.qty)*num(it.rate);
    var sub=[];
    if(!it.delivered&&it.date&&it.date!==dayKey(o.date))sub.push('Delivery: '+fmtDshort(it.date));
    if(it.delivered)sub.push('दिया गया'+(it.deliveredAt?' '+fmtDshort(it.deliveredAt):''));
    return '<tr><td>'+(idx+1)+'</td><td>'+esc(displayName(it))+(sub.length?'<br><small>'+esc(sub.join(' · '))+'</small>':'')+'</td><td>'+fmtQty(it.qty)+' '+esc(it.unit)+'</td><td>'+rupee(it.rate)+'</td><td>'+rupee(amt)+'</td></tr>';
  }).join('');
  var termsLines=(state.shop.terms||'').split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
  var termsHtml=termsLines.length?('<div style="margin-top:16px;padding-top:10px;border-top:1px dashed #999;font-size:.9em"><b>नियम व शर्तें:</b><ul style="margin:6px 0 0;padding-left:18px">'+termsLines.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul></div>'):'';
  var html=
    '<div style="text-align:center;margin-bottom:14px">'+
      '<h2 style="margin:0">'+esc(state.shop.name)+'</h2>'+
      '<div>'+esc(state.shop.addr)+'</div>'+
      '<div>Ph: '+esc(state.shop.phone)+'</div>'+
    '</div>'+
    '<hr>'+
    '<div style="display:flex;justify-content:space-between;margin:10px 0">'+
      '<div>Bill No: '+o.no+'<br>Delivery: '+fmtDT(o.date)+'</div>'+
      '<div>Customer: '+esc(c?c.name:'-')+(c&&c.phone?('<br>Ph: '+esc(c.phone)):'')+'</div>'+
    '</div>'+
    '<table>'+
      '<thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table>'+
    '<div style="margin-top:14px;text-align:right">'+
      '<div>Total Bill: <b>'+rupee(orderTotal(o))+'</b></div>'+
      '<div>Jama: '+rupee(orderPaid(o))+'</div>'+
      o.payments.map(function(p){return '<div style="font-size:.85em">'+fmtDshort(p.date)+': '+rupee(p.amount)+(p.note?' ('+esc(p.note)+')':'')+'</div>';}).join('')+
      '<div>Baaki: <b>'+rupee(orderDue(o))+'</b></div>'+
    '</div>'+
    termsHtml+
    '<div style="margin-top:20px;text-align:center">Dhanyawad<br>'+esc(state.shop.owner)+'</div>';
  $('#printArea').innerHTML=html;
  setTimeout(function(){window.print();},80);
}

/* ---------- In-app reminder notification (best-effort, jab app khule tab hi) ---------- */
function checkDueReminders(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var todayK=todayStr();
    var lastKey='mbmb-lastremind';
    if(localStorage.getItem(lastKey)===todayK)return;
    var live=state.orders.filter(function(o){return !o.cancelled;});
    var tmrK=(function(){var d=new Date();d.setDate(d.getDate()+1);return dayKey(d);})();
    var dayAfterK=(function(){var d=new Date();d.setDate(d.getDate()+2);return dayKey(d);})();
    var tmrItems=dayItemSummary(live,tmrK);
    var dayAfterItems=dayItemSummary(live,dayAfterK);
    if(!tmrItems.length&&!dayAfterItems.length){localStorage.setItem(lastKey,todayK);return;}
    var parts=[];
    if(tmrItems.length)parts.push('Kal: '+tmrItems.slice(0,4).map(function(i){return i.name+' '+fmtQty(i.qty)+' '+i.unit;}).join(', '));
    if(dayAfterItems.length)parts.push('Parso: '+dayAfterItems.slice(0,4).map(function(i){return i.name+' '+fmtQty(i.qty)+' '+i.unit;}).join(', '));
    new Notification('MB Sweets \u2013 aane wala order',{body:parts.join(' | ')});
    localStorage.setItem(lastKey,todayK);
  }catch(e){}
}

    case 'open-customer':ui.cameFrom=(ui.view==='orders')?'orders':(ui.view==='dues'?'dues':'home');ui.view='customer';ui.customerId=id;renderRoute();window.scrollTo(0,0);break;

    case 'view-dues':ui.view='dues';renderRoute();window.scrollTo(0,0);break;
    case 'add-customer':openCustomerForm();break;
    case 'edit-customer':openCustomerForm(id);break;
    case 'save-customer':
      var savedC=saveCustomerFrom(id||null);
      if(savedC){closeSheet();renderRoute();toast('ग्राहक save हो गया');}
      break;
    case 'del-customer':openDeleteCustomerConfirm(id);break;
    case 'confirm-del-customer':
      state.orders=state.orders.filter(function(o){return o.customerId!==id;});
      state.customers=state.customers.filter(function(c){return c.id!==id;});
      save();closeSheet();ui.view='home';ui.customerId=null;renderRoute();toast('ग्राहक डिलीट हो गया');
      break;
    case 'close':closeSheet();break;

    case 'new-order-for':openOrderForm(id);break;

    case 'remind-order':
      var reo=findOrder(id);
      if(reo){downloadIcs(reo);toast('Reminder file download ho gayi \u2014 usse khol kar apne calendar me add kar lo');}
      break;
    case 'print-order':
      var po2=findOrder(id);
      if(po2)printOrderBill(po2);
      break;
    case 'cancel-order':openCancelOrderConfirm(id);break;
    case 'confirm-cancel-order':
      var co=findOrder(id);co.cancelled=true;save();closeSheet();renderRoute();toast('ऑर्डर कैंसल हो गया');
      break;
    case 'toggle-item':

      var lid=t.getAttribute('data-line');
      var li=too.items.find(function(x){return x.lid===lid;});
      if(li){
        li.delivered=!li.delivered;li.deliveredAt=li.delivered?todayStr():'';
        save();renderRoute();
        toast(li.delivered?('"'+displayName(li)+'" दिया गया ✓'):('"'+displayName(li)+'" फिर से बाकी में'));
      }
      break;
    case 'order-payment':openOrderPayment(id);break;
    case 'customer-payment':openPaymentForm(id);break;
    case 'pay-pick-order':openPaymentForm(t.getAttribute('data-cust'),id);break;
    case 'pay-change-order':openPaymentForm(id);break;
    case 'save-payment':
      var po=findOrder(id);
      var amt=num($('#p-amt').value);
      if(!(amt>0)){$('#p-err').textContent='सही amount लिखो।';break;}
      var poDue=orderDue(po);
      if(amt>poDue+0.001){$('#p-err').textContent='इस ऑर्डर पर सिर्फ '+rupee(poDue)+' बाकी है — इससे ज़्यादा नहीं ले सकते।';break;}

      save();closeSheet();renderRoute();toast('पेमेंट जुड़ गया');
      break;
    case 'del-payment':
      var dpo=findOrder(t.getAttribute('data-order'));var dpid=t.getAttribute('data-pay');
      var dp=dpo?dpo.payments.find(function(x){return x.id===dpid;}):null;
      if(dp){
        openSheet('<div class="sh-head"><h2>पेमेंट हटाएं?</h2></div>'+
          '<p class="hint">ऑर्डर #'+dpo.no+' का '+fmtDonly(dp.date)+' वाला '+rupee(dp.amount)+' का पेमेंट हट जाएगा। सिर्फ गलती से डाला हो तभी हटाओ।</p>'+
          '<div class="sh-actions"><button class="btn" data-act="close">नहीं</button><button class="btn warn" data-act="confirm-del-payment" data-order="'+dpo.id+'" data-pay="'+dp.id+'">हां, हटाओ</button></div>');
      }

      var cpo=findOrder(t.getAttribute('data-order'));var cpid=t.getAttribute('data-pay');

      closeSheet();renderRoute();toast('पेमेंट हट गया');
      break;
    case 'pay-lump':openLumpPayment(id);break;
    case 'adjust-extra':
      var mv=adjustExtra(id);save();renderRoute();
      toast(mv>0?(rupee(mv)+' बाकी वाले ऑर्डर में जोड़ दिया'):'कुछ adjust करने को नहीं है');
      break;
    case 'save-lump':
      var lamt=num($('#lp-amt').value);
      var lel=customerOrders(id).filter(function(o){return !o.cancelled&&orderDue(o)>0;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
      var ltot=round2(lel.reduce(function(s,o){return s+orderDue(o);},0));
      if(!(lamt>0)){$('#lp-err').textContent='सही amount लिखो।';break;}
      if(lamt>ltot+0.001){$('#lp-err').textContent='कुल बाकी सिर्फ '+rupee(ltot)+' है — इससे ज़्यादा नहीं ले सकते।';break;}

        if(take>0){o.payments.push({id:uid(),amount:take,date:ldate,note:lnote});lrem=round2(lrem-take);lcount++;}
      });
      save();closeSheet();renderRoute();toast(rupee(lamt)+' जमा हो गया ('+lcount+' ऑर्डर में बँटा)');
      break;
    case 'share-backup':
      var shTxt=JSON.stringify(state);
      var markShared=function(){
        localStorage.setItem('mbmb-lastbackup',String(Date.now()));renderBanner();
        var lb2=$('#last-backup-txt');if(lb2)lb2.textContent=backupStatusText();
        toast('Backup भेज दिया ✓');
      };

        var shFile=new File([shTxt],'mbmb-backup-'+todayStr()+'.txt',{type:'text/plain'});

          navigator.share({files:[shFile],title:'MB Sweets backup '+todayStr()}).then(markShared,shFail);

          navigator.share({title:'MB Sweets backup '+todayStr(),text:shTxt}).then(markShared,shFail);

      var sn=$('#s-name').value.trim();
      if(!sn){$('#s-err').textContent='दुकान का नाम लिखो।';break;}
      state.shop={name:sn,addr:$('#s-addr').value.trim(),phone:$('#s-phone').value.trim(),owner:$('#s-owner').value.trim(),terms:$('#s-terms').value.trim()};
      save();renderShell();toast('जानकारी save हो गई');
      break;
    case 'copy-backup':
      var ta=$('#b-text');ta.focus();ta.select();
      var done=function(){
        toast('Copy हो गया');
        localStorage.setItem('mbmb-lastbackup',String(Date.now()));
        renderBanner();
        var lb=$('#last-backup-txt');if(lb)lb.textContent=backupStatusText();
      };
      var fb=function(){var ok=false;try{ok=document.execCommand('copy');}catch(err){}if(ok)done();else toast('Text select हो गया, अब खुद copy करो');};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done,fb);else fb();
      break;
    case 'restore-backup':
      try{
        var rd=JSON.parse($('#b-text').value.trim());
        if(!rd||!Array.isArray(rd.orders)||!Array.isArray(rd.customers)||!Array.isArray(rd.items))throw new Error('bad');
        ui.pendingRestore=rd;
        openSheet('<div class="sh-head"><h2>Restore करें?</h2></div>'+
          '<p class="hint">इस backup में <b>'+rd.customers.length+' ग्राहक</b> और <b>'+rd.orders.length+' ऑर्डर</b> हैं।</p>'+
          '<p class="hint">अभी ऐप में '+state.customers.length+' ग्राहक और '+state.orders.length+' ऑर्डर हैं — ये सब backup वाले data से बदल जाएंगे।</p>'+
          '<div class="sh-actions"><button class="btn" data-act="close">नहीं</button><button class="btn warn" data-act="confirm-restore">हां, Restore करो</button></div>');
      }catch(err){$('#b-err').textContent='यह backup text सही नहीं लग रहा।';}
      break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(ui.orderDraft&&syncDraftField(t))return;
  if(t.id==='ordersSearch'){ui.ordersSearch=t.value;renderOrders();var f4=$('#ordersSearch');if(f4){f4.focus();f4.setSelectionRange(f4.value.length,f4.value.length);}return;}
  if(t.id==='search'){ui.search=t.value;renderHome();var f=$('#search');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);}return;}
  if(t.id==='itemSearch'){ui.itemsSearch=t.value;renderItems();var f2=$('#itemSearch');if(f2){f2.focus();f2.setSelectionRange(f2.value.length,f2.value.length);}return;}
  if(t.id==='of-custsearch'){ui.orderDraft.custSearch=t.value;renderOrderSheet();var f3=$('#of-custsearch');if(f3){f3.focus();f3.setSelectionRange(f3.value.length,f3.value.length);}return;}
  if(t.getAttribute&&t.getAttribute('data-act')==='of-qty'){
    var l1=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
    if(l1){l1.qty=t.value;updateOrderTotalDisplay();
      var row=t.closest('.lrow');if(row){var la=row.querySelector('.lamt');if(la)la.textContent=rupee(num(l1.qty)*num(l1.rate));}
    }
    return;
  }
  if(t.getAttribute&&t.getAttribute('data-act')==='of-rate'){
    var l2=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
    if(l2){l2.rate=t.value;updateOrderTotalDisplay();
      var row2=t.closest('.lrow');if(row2){var la2=row2.querySelector('.lamt');if(la2)la2.textContent=rupee(num(l2.qty)*num(l2.rate));}
    }
    return;
  }
  if(t.getAttribute&&t.getAttribute('data-act')==='of-linedate'){
    var l3=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
    if(l3){l3.date=t.value||'';}
    return;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(ui.orderDraft){
    if(syncDraftField(t))return;
    if(t.getAttribute&&t.getAttribute('data-act')==='of-linedate'){
      var lc=ui.orderDraft.lines.find(function(l){return l.lid===t.getAttribute('data-lid');});
      if(lc)lc.date=t.value||'';
      return;
    }
  }
  if(t.id==='b-file'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){var ta2=$('#b-text');if(ta2){ta2.value=String(fr.result||'');toast('फ़ाइल लोड हो गई — अब "Restore karo" दबाओ');}};
    fr.onerror=function(){toast('फ़ाइल नहीं पढ़ पाए');};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#ov'))softClose();
});

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  window.deferredInstallPrompt=e;
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

load();
renderShell();
renderRoute();
checkDueReminders();
requestPersist();
})();
</script>
</body>
</html>
