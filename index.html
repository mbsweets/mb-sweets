<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maa Bhagwati Misthan Bhandar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C1620">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MB Sweets">
<style>
@font-face{font-family:'Mukta';src:url('fonts/Mukta-400.woff') format('woff');font-weight:400 500;font-display:swap}
@font-face{font-family:'Mukta';src:url('fonts/Mukta-600.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:'Mukta';src:url('fonts/Mukta-700.woff') format('woff');font-weight:700 800;font-display:swap}
@font-face{font-family:'Baloo 2';src:url('fonts/Baloo2-700.woff') format('woff');font-weight:600 800;font-display:swap}
:root{
  --paper:#FAF3E7; --card:#FFFFFF; --ink:#2B1712; --muted:#8A7566; --line:#E6D9C6;
  --brandband:#5C1620; --on-brand:#FBEEDD; --brand-ink:#5C1620; --warn-bg:#A6332E;
  --gold:#9C6B00; --green:#2F6F4E; --amber:#A9720A; --red:#A6332E; --red-bg:#F6E1DD;
  --milk:#1F5F8F; --milk-bg:#EEF6FC; --milk-line:#CFE3F2;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1210; --card:#251813; --ink:#F3E9DD; --muted:#B39C89; --line:#3B2A22;
    --gold:#E0B23D; --green:#5CD39A; --amber:#F2B84B; --red:#FF8A8A; --red-bg:#3B1C1C;
    --milk:#8CC8F0; --milk-bg:#16222B; --milk-line:#2A4254;
    --brand-ink:#E9A9B0; --warn-bg:#B3261E;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1210; --card:#251813; --ink:#F3E9DD; --muted:#B39C89; --line:#3B2A22;
  --gold:#E0B23D; --green:#5CD39A; --amber:#F2B84B; --red:#FF8A8A; --red-bg:#3B1C1C;
    --milk:#8CC8F0; --milk-bg:#16222B; --milk-line:#2A4254;
  --brand-ink:#E9A9B0; --warn-bg:#B3261E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brandband);outline-offset:2px}
h1,h2,h3{font-family:'Baloo 2','Mukta',system-ui,sans-serif;margin:0}

.letterhead{background:var(--brandband);color:var(--on-brand);padding:16px 16px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.letterhead h1{font-size:1.4rem;line-height:1.2}
.letterhead p{margin:2px 0 0;font-size:.82rem;opacity:.88}
.lh-row{display:flex;align-items:center;gap:12px}
.lh-logo{width:54px;height:54px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.lh-text{min-width:0}

.app{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}

.band{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.band>div{padding:12px 6px;text-align:center;border-left:1px solid var(--line)}
.band>div:first-child{border-left:0}
.band b{display:block;font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.band>div{min-width:0}
.band span{display:block;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:2px}
.band .tom b{color:var(--gold)}
.band .due b{color:var(--red)}

.banner{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}
.banner.btn-banner{display:block;width:100%;text-align:left;border:0;font-family:inherit;font-weight:600}

.duecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.duemain{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:0;min-height:auto}
.duemain .nm{font-weight:700}
.duemain .sub{color:var(--red);font-size:.8rem;margin-top:2px}
.dueacts{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.dueacts .dueamt{font-weight:700;color:var(--red);font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.05rem}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff!important}
  #printArea{display:block!important;position:static;width:100%;padding:16px;color:#000;background:#fff}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:6px}
}

.sumcard{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sumhead{font-weight:700;color:var(--gold);margin-bottom:6px;font-size:.95rem}
.sumrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.sumrow:first-of-type{border-top:0}
.sumnm{font-weight:700;flex:1;min-width:110px;overflow-wrap:anywhere}
.sumqty{font-weight:700;color:var(--brand-ink);white-space:nowrap}
.sumdetail{width:100%;color:var(--muted);font-size:.78rem}
.hide{display:none!important}
.rmcard{border-width:2px;background:linear-gradient(180deg,rgba(226,177,74,.16),var(--card) 70px)}
.rmrow{font-size:.9rem;line-height:1.45;padding:3px 0;border-bottom:1px dashed var(--line)}
.rmrow:last-of-type{border-bottom:0}
.rmcard .btn{margin-top:8px}
.milkcard{border-color:var(--milk);background:linear-gradient(180deg,var(--milk-bg),var(--card) 60px)}
.milkcard .sumhead{color:var(--milk)}
.mkhead{font-weight:700;margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.mkl{background:var(--milk);color:var(--card);border-radius:999px;padding:1px 9px;font-size:.85rem;white-space:nowrap}
.mkrow{padding:3px 0 3px 10px;border-left:3px solid var(--milk-line);margin:1px 0;font-size:.92rem}
.mkrow.mksum{font-weight:700;color:var(--milk);border-left-color:var(--milk)}
.mknote{color:var(--muted);font-size:.8rem;margin-top:6px}
.mktag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;white-space:nowrap}
.mktotal{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:700;color:var(--milk);font-size:1.02rem}
.mktotal span{font-weight:400;color:var(--muted);font-size:.8rem}

.sechead{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.sechead h2{font-size:1.05rem}
.sechead .cnt{color:var(--muted);font-size:.85rem}
.ogh{font-weight:700;font-size:.9rem;color:var(--brand-ink);margin:14px 2px 6px;display:flex;align-items:center;gap:6px}
.ogh span{font-weight:600;font-size:.78rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 7px}

.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini.tomorrow{border-color:var(--gold);border-width:1.5px}
.mini .l{min-width:0}
.mini .nm,.mini .sub,.crow .nm,.crow .ph{display:block}
.crow .l{min-width:0}
#b-text{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.mini .nm{font-weight:700;overflow-wrap:anywhere}
.mini .sub{color:var(--muted);font-size:.82rem;margin-top:1px}
.mini .r{text-align:right;flex:0 0 auto}
.mini .r b{display:block;color:var(--red);font-size:.95rem}
.mini .r span{display:block;color:var(--muted);font-size:.75rem}

#search,#itemSearch,#ordersSearch,#k-search{width:100%;color:var(--ink);padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;margin-top:2px}
#ordersSearch{margin:2px 0 10px}

.addrow{display:flex;justify-content:flex-end;margin:10px 0 6px}
.lnk{background:none;border:0;color:var(--brand-ink);font-weight:700;min-height:40px;padding:0 4px;border-radius:8px}

.lnk.danger{color:var(--red)}
.lnk.muted{color:var(--muted);font-weight:500}

.crow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.crow .nm{font-weight:700}
.crow .ph{color:var(--muted);font-size:.82rem;margin-top:1px}
.crow .due{color:var(--red);font-weight:700;font-size:.92rem;white-space:nowrap}
.crow .clear{color:var(--green);font-size:.82rem;white-space:nowrap}

.empty{text-align:center;color:var(--muted);padding:32px 12px}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* customer profile */
.backbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0;min-height:40px}
.cphead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:4px}
.cphead h2{font-size:1.35rem}
.cphead .ph a{color:var(--brand-ink);text-decoration:none;font-weight:600}
.cphead .addr{color:var(--muted);font-size:.88rem;margin-top:2px}
.cpacts{display:flex;gap:8px;margin-top:6px}

.actbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;color:var(--ink)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.callbtn{border-color:var(--green);color:var(--green)}
.smsbtn{border-color:#1F6FB2;color:#1F6FB2}
.smsbadge{display:inline-block;font-size:.72rem;font-weight:700;color:#1F6FB2;border:1px solid #1F6FB2;border-radius:10px;padding:0 7px;margin-left:6px;vertical-align:1px}
.smschk{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:-2px 0 12px;color:var(--ink,#3A1510)}
.smschk input{width:20px;height:20px;flex:none;accent-color:#1F6FB2}
.btn.primary{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.btn.warn{background:var(--warn-bg);border-color:var(--warn-bg);color:#fff}
.btn.small{min-height:40px;padding:0 12px;font-size:.92rem}
.btn.block{display:flex;width:100%;align-items:center;justify-content:center}
.btn[disabled]{opacity:.6}
/* ⚙️ दुकान सेटिंग */
.ssentry{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;margin-top:4px;font:inherit;color:var(--ink)}
.ssentry b{font-size:1.02rem}
.ssentry span{color:var(--muted);font-size:.84rem}
.sscard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.sscard h3{font-size:1rem;margin-bottom:6px}
.ssbox ol.ssol{margin:0 0 12px 20px;padding:0}
.ssol li{margin:5px 0;font-size:.92rem}
.sstoggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sschips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.sschip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;font:inherit;font-size:.88rem;font-weight:600}
.sschip.off{background:var(--red-bg);border-color:var(--red);color:var(--red);text-decoration:line-through}
.ssgh{font-weight:700;font-size:.86rem;color:var(--muted);margin-top:8px}
.ssdet{border-top:1px dashed var(--line);padding:4px 0}
.ssdet summary{font-weight:700;padding:8px 0;min-height:40px;cursor:pointer}
.ssrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ssrow>span{flex:1;min-width:0;font-weight:600;font-size:.92rem}
.ssrow small{color:var(--muted);font-weight:400}
.ssrow label{display:flex;align-items:center;gap:3px;font-weight:700;color:var(--muted)}
.ssrow input{width:84px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px;text-align:right}
.ssrow.sub{border-top:0;padding-top:0;flex-wrap:wrap}
.ssrow.sub>span{flex-basis:100%;font-weight:400;font-size:.8rem;color:var(--muted)}
.ssrow.sub input{width:72px}
.sslist{margin:6px 0 8px 18px;padding:0}
.sslist li{margin:4px 0}
.sssave{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px;padding:8px 0;background:linear-gradient(180deg,transparent,var(--paper) 30%)}
.btn:disabled{opacity:.45}

.grouphead{margin:18px 0 8px;font-size:1rem;color:var(--muted);font-weight:700}

.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.order.cancelled{opacity:.58}
.otop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.otop .obadge{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-weight:700;font-size:.85rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 8px;flex:0 0 auto}
.odate{font-weight:700;margin-top:2px}
.stamp{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-weight:700;font-size:.9rem;padding:1px 10px;border:2px solid currentColor;border-radius:6px;transform:rotate(-3deg);white-space:nowrap;flex:0 0 auto}
.st-pending{color:var(--amber)} .st-partial{color:var(--gold)} .st-delivered{color:var(--green)} .st-cancelled{color:var(--muted);text-decoration:line-through}

.checklist{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line)}
.checklist li{display:flex;align-items:center;gap:10px;padding:5px 0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.citem{flex:1;overflow-wrap:anywhere}
.camt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.checklist li.ro{opacity:.7}
.checklist li.cpnli{opacity:1}
.checklist li.cpnli .chk{border:0;background:none;color:inherit;font-size:1.05rem}
.checklist li button{background:none;border:0;text-align:left;display:flex;align-items:center;gap:10px;width:100%;padding:0;min-height:32px}

.paylog{margin-top:8px;font-size:.85rem;color:var(--muted)}
.paylog div{padding:1px 0}

.money{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:baseline;flex-wrap:wrap}
.money div{display:flex;flex-direction:column}
.money span{font-size:.76rem;color:var(--muted)}
.money b{font-family:'Baloo 2','Mukta',system-ui,sans-serif;font-size:1.05rem}
.money .due b{color:var(--red)}
.money .paidall{margin-left:auto;color:var(--green);font-weight:700;font-size:.9rem}

.oacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:9px 4px 8px;color:var(--muted);font-size:.74rem;font-weight:600}
.navbtn .ic{font-size:1.25rem;line-height:1}
.navbtn.on{color:var(--brand-ink)}

.fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 14px);z-index:6;background:var(--brandband);color:var(--on-brand);border:0;border-radius:999px;padding:0 20px;min-height:50px;font-weight:700;font-size:.98rem;box-shadow:0 6px 16px rgba(60,10,15,.35)}

.overlay{position:fixed;inset:0;z-index:10;background:rgba(20,10,8,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:calc(100% - 20px);overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out;overscroll-behavior:contain}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.sh-head h2{font-size:1.2rem}
.sh-actions{display:flex;gap:10px;margin-top:14px}
.sh-actions .btn{flex:1}
.fl{display:block;margin-top:12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
.err{color:var(--red);font-size:.88rem;margin-top:10px;min-height:1px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0}

/* order-form specific */
.custchip{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.custchip b{overflow-wrap:anywhere}
.custchip span{color:var(--muted);font-size:.82rem;display:block}
.suglist{margin-top:6px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.sugrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;min-height:40px}
.sugrow:last-child{border-bottom:0}
.sugrow small{display:block;color:var(--muted)}
.sugrow.newc{color:var(--brand-ink);font-weight:700}

.cattabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.cattab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 13px;min-height:36px;font-weight:600;font-size:.88rem}
.cattab.on{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.onchips{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin:2px 0 8px}
.onchip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:6px 4px;min-height:48px;font:inherit;font-weight:600;font-size:.84rem;line-height:1.25;text-align:center}
.onchip b{display:block;font-size:1.05rem;color:var(--ink)}
.onchip.on{background:var(--brandband);border-color:var(--brandband);color:var(--on-brand)}
.onchip.on b{color:var(--on-brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 11px;font-size:.88rem;min-height:38px}
.chip small{display:block;color:var(--muted);font-size:.74rem}
.chip.empty{color:var(--muted);font-style:normal}

.lines{margin-top:10px}
.lrow{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.lrow .ltop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lrow .lname{font-weight:700;overflow-wrap:anywhere}
.lrow .lx{background:none;border:0;color:var(--red);font-size:1.25rem;line-height:1;min-height:32px;padding:0 4px}
.lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.lgrid label{display:block;font-size:.72rem;color:var(--muted)}
.lgrid input{width:100%;margin-top:2px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:16px}
.lamt{font-size:.78rem;color:var(--muted);margin-top:4px;text-align:right}

    }else{
      state.items=DEFAULT_ITEMS.map(function(i){return Object.assign({},i);});
      state.catalogApplied=CATALOG?CATALOG.version:0;
      save();
    }
  }catch(e){

function applyCatalog(){
  if(!CATALOG)return 0;
  var applied=num(state.catalogApplied)||1;
  if(CATALOG.version<=applied){state.catalogApplied=applied;return 0;}
  var n=0;
  CATALOG.items.forEach(function(r){
    if(num(r[5])<=applied)return;
    var it=findItem(r[0]);
    if(it){it.name=r[1];it.cat=r[2];it.unit=r[3];it.price=r[4];}
    else state.items.push({id:r[0],name:r[1],cat:r[2],unit:r[3],price:r[4]});
    n++;
  });
  state.catalogApplied=CATALOG.version;
  save();
  return n;

function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}

function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function rupee(n){n=num(n);return (n<0?'-':'')+'\u20B9'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayKey(v){var x=new Date(v);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fmtDT(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function fmtDonly(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDshort(v){var x=new Date(v);if(isNaN(x))return '-';return x.toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function fmtQty(n){return String(Math.round(num(n)*1000)/1000);}
function round2(n){return Math.round(num(n)*100)/100;}
function keyToDate(k){var a=String(k).split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function dayDiff(fromKey,toKey){return Math.round((keyToDate(toKey)-keyToDate(fromKey))/86400000);}

function phoneValid(ph){return /^91[6-9]\d{9}$/.test(phoneNorm(ph));}
function phoneProblem(ph,exceptId){

function shopPhones(){return [state.shop.phone,state.shop.phone2].map(function(x){return String(x||'').trim();}).filter(function(x){return x;}).join(', ');}

   ये सूची सिर्फ़ उसी पल के लिए है — save() या अगली घड़ी में अपने-आप फिर से बनती है। */
var ORD_IDX=null;
function customerOrders(cid){
  if(!ORD_IDX||ORD_IDX.ref!==state.orders||ORD_IDX.n!==state.orders.length){
    var m={};state.orders.forEach(function(o){(m[o.customerId]||(m[o.customerId]=[])).push(o);});
    ORD_IDX={ref:state.orders,n:state.orders.length,m:m};
    setTimeout(function(){ORD_IDX=null;},0);
  }

function lineAmt(i){return round2(num(i.qty)*num(i.rate));}
function orderGross(o){return round2(o.items.reduce(function(s,i){return s+lineAmt(i);},0));}
/* कुल = आइटम − स्क्रैच कूपन (अगर लगा हो) */
function orderTotal(o){return round2(Math.max(0,orderGross(o)-(o.cpn?num(o.cpn.amt):0)));}
function orderPaid(o){return o.payments.reduce(function(s,p){return s+num(p.amount);},0);}
function orderDue(o){return round2(Math.max(0,orderTotal(o)-orderPaid(o)));}
function orderStatus(o){
  if(o.cancelled)return 'cancelled';
  var total=o.items.length,done=o.items.filter(function(i){return i.delivered;}).length;
  if(total===0||done===0)return 'pending';
  if(done<total)return 'partial';
  return 'delivered';
}
function displayName(it){
  var n=String((it&&it.name)||''),u=String((it&&it.unit)||'').trim();
  var i=n.lastIndexOf('(');

    var inner=n.slice(i+1,-1).trim();
    if(inner===u)return n.slice(0,i).trim();

}

function namesList(items,max){

}
/* ऑनलाइन ऑर्डर का बिल (webCode) सिर्फ़ 🌐 ऑनलाइन टैब में चलता है; "बाकी" में तभी गिनें जब डिलीवर हो चुका हो (असली उधार) */
function isWebOrder(o){return !!(o&&o.webCode);}
function countsAsDue(o){return !o.cancelled&&(!isWebOrder(o)||orderStatus(o)==='delivered');}
function customerTotals(cid){
  var t=0,p=0,cnt=0;
  customerOrders(cid).forEach(function(o){if(!o.cancelled)cnt++;if(countsAsDue(o)){t+=orderTotal(o);p+=orderPaid(o);}});
  return {billed:t,paid:p,due:round2(Math.max(0,t-p)),extra:round2(Math.max(0,p-t)),count:cnt};
}
function allDue(){var t=0;state.customers.forEach(function(c){t+=customerTotals(c.id).due;});return t;}
function customerOldestDueDate(cid){

  if(!os.length)return null;

  os.forEach(function(o){if(new Date(o.date)<new Date(min))min=o.date;});
  return min;
}

function dueGroups(live,dateKey){

  live.forEach(function(o){
    var due=o.items.filter(function(it){return !it.delivered&&itemDateKey(o,it)===dateKey;});
    if(due.length)out.push({order:o,items:due});
  });

  return out;

function dayItemSummary(live,dateKey){
  var map={};
  live.forEach(function(o){
    o.items.forEach(function(it){
      if(it.delivered)return;
      if(itemDateKey(o,it)!==dateKey)return;
      var k=it.name+'|'+it.unit;
      if(!map[k])map[k]={name:displayName(it),unit:it.unit,qty:0,custs:{}};
      map[k].qty+=num(it.qty);
      var c=findCustomer(o.customerId);
      var cname=c?c.name:'?';
      map[k].custs[cname]=(map[k].custs[cname]||0)+num(it.qty);
    });
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  arr.sort(function(a,b){return b.qty-a.qty;});
  return arr;
}
function daySummaryBlock(live,dateKey,label){

/* ---------- 🥛 दूध-दही ऑर्डर का हिसाब ----------
   मिठाई: डिलीवरी से 2 दिन पहले 3 बजे तक दूध ऑर्डर (25 की मिठाई → 24 को बनेगी → 23 को ऑर्डर)
   दही / बिकने वाला दूध / पनीर: डिलीवरी से 1 दिन पहले 3 बजे तक
   1 यूनिट मिठाई में कितना दूध — catalog.js का milk, या आइटम खोलकर बदला हुआ (item.milk) */
var CAT_MILK=(CATALOG&&CATALOG.milk)||{};
var HI_MONTHS=['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
var HI_DAYS=['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
function hiDate(k){var d=keyToDate(k);return d.getDate()+' '+HI_MONTHS[d.getMonth()]+' ('+HI_DAYS[d.getDay()]+')';}
function addDaysKey(n){var d=new Date();d.setDate(d.getDate()+n);return dayKey(d);}
function r1(n){return Math.round(num(n)*10)/10;}
function hasOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
function itemByName(name){for(var i=0;i<state.items.length;i++)if(state.items[i].name===name)return state.items[i];return null;}
function catalogRowByName(name){if(!CATALOG)return null;for(var i=0;i<CATALOG.items.length;i++)if(CATALOG.items[i][1]===name)return CATALOG.items[i];return null;}
/* लीटर प्रति यूनिट; null = सिर्फ गिनती (दूध हिसाब में नहीं जुड़ता) */
function itemMilk(si){
  if(!si)return null;
  if(hasOwn(si,'milk'))return (si.milk===null||si.milk===undefined||si.milk==='')?null:num(si.milk);
  return hasOwn(CAT_MILK,si.id)?num(CAT_MILK[si.id]):null;
}
function lineMeta(g){
  var si=g.iid?findItem(g.iid):null;
  if(!si)si=itemByName(g.name);
  if(si)return {cat:si.cat,milk:itemMilk(si)};
  var r=null;
  if(g.iid&&CATALOG){for(var i=0;i<CATALOG.items.length;i++)if(CATALOG.items[i][0]===g.iid){r=CATALOG.items[i];break;}}
  if(!r)r=catalogRowByName(g.name);
  if(r)return {cat:r[2],milk:hasOwn(CAT_MILK,r[0])?num(CAT_MILK[r[0]]):null};
  /* नाम बदल गया (जैसे दही की कंपनी जुड़ी) — फिर भी दूध-दही के हिसाब से बाहर न जाए */
  if(/दही|dahi|curd|पनीर|paneer/i.test(g.name)||(/दूध|milk/i.test(g.name)&&isLitreUnit(g.unit)))return {cat:'dairy',milk:null};
  return {cat:'',milk:null};
}
function isKgUnit(u){return /^(किलो|kg)$/i.test(String(u||'').trim());}
function isLitreUnit(u){return /^(लीटर|litre|liter|ltr|l)$/i.test(String(u||'').trim());}
/* दही का एक पैक कितने किलो — नाम से पढ़ो: "दही (400 ग्राम)" → 0.4, "दही (2 किलो पैक)" → 2 */
function packKg(name,unit){
  if(isKgUnit(unit))return 1;
  var m=String(name||'').match(/(\d+(?:\.\d+)?)\s*(किलो|ग्राम|kg|gm|g)/i);
  if(!m)return null;
  var n=parseFloat(m[1]);
  return /^(किलो|kg)$/i.test(m[2])?n:n/1000;
}
/* उस दिन की बाकी (डिलीवर नहीं हुई) लाइनें, नाम+यूनिट से जोड़कर */
function dayLines(live,dateKey){
  var map={},keys=[];
  live.forEach(function(o){
    o.items.forEach(function(it){
      if(it.delivered||itemDateKey(o,it)!==dateKey)return;
      var k=it.name+'|'+it.unit;
      if(!map[k]){map[k]={name:it.name,unit:it.unit,qty:0,iid:it.iid||''};keys.push(k);}
      map[k].qty+=num(it.qty);
    });
  });
  return keys.map(function(k){return map[k];}).filter(function(g){return g.qty>0;});
}
/* पैकेट सामान, कोल्ड ड्रिंक, नमकीन वगैरह — मिठाई के दूध वाले हिसाब में नहीं गिनने */
var NOT_SWEET=/पैकेट सामान|MRP|cola|pepsi|sprite|thums|fanta|maaza|frooti|bisleri|kinley|पानी|water|chips|kurkure|biscuit|बिस्किट|नमकीन|namkeen|भुजिया|bhujia|cold ?drink|कोल्ड|चॉकलेट|chocolate|मोमबत्ती|candle|गुब्बारे|balloon/i;
/* मिठाई का दूध — {l: कुल लीटर, lines, none: बिना दूध वाली, unk: सिर्फ गिनती (जैसे रसमलाई — दूध नहीं जोड़ते)} */
function sweetsMilk(live,dateKey){
  var res={l:0,lines:[],none:[],unk:[]},rows=[];
  dayLines(live,dateKey).forEach(function(g){
    var m=lineMeta(g),nm=displayName(g),q=fmtQty(g.qty)+' '+g.unit;
    if(m.cat==='mithai'){
      if(m.milk===null)res.unk.push(nm+' '+q);
      else if(m.milk>0){var L=g.qty*m.milk;res.l+=L;rows.push({t:nm+' '+q+' → '+r1(L)+' L',L:L});}
      else res.none.push(nm+' '+q);
    }else if(!m.cat&&!/केक|cake/i.test(g.name)&&!NOT_SWEET.test(g.name)){
      res.unk.push(nm+' '+q);
    }
  });
  rows.sort(function(a,b){return b.L-a.L;});
  res.lines=rows.map(function(x){return x.t;});
  res.l=r1(res.l);
  return (res.lines.length||res.unk.length||res.none.length)?res:null;
}
/* दही / बिकने वाला दूध / पनीर — {l: दूध लीटर, kg: कुल दही, lines} */
function dairyDay(live,dateKey){
  var dahi=[],milk=[],other=[],kg=0,l=0,dahiUnknown=false;
  dayLines(live,dateKey).forEach(function(g){
    var m=lineMeta(g);
    if(m.cat!=='dairy')return;
    var nm=displayName(g);
    if(/दही|dahi|curd/i.test(g.name)){
      var pk=packKg(g.name,g.unit);
      if(isKgUnit(g.unit)){kg+=g.qty;dahi.push(nm+' '+fmtQty(g.qty)+' किलो');}
      else if(pk){kg+=pk*g.qty;dahi.push(nm+' ×'+fmtQty(g.qty)+' '+g.unit+' = '+fmtQty(pk*g.qty)+' किलो');}
      else{dahiUnknown=true;dahi.push(nm+' '+fmtQty(g.qty)+' '+g.unit);}
    }else if(/दूध|milk/i.test(g.name)&&isLitreUnit(g.unit)){
      l+=g.qty;milk.push(nm+' '+fmtQty(g.qty)+' लीटर');
    }else{
      other.push(nm+' '+fmtQty(g.qty)+' '+g.unit);
    }
  });
  var lines=dahi.slice();
  if(dahi.length>1||dahiUnknown)lines.push('कुल दही: '+fmtQty(kg)+' किलो'+(dahiUnknown?' + ऊपर वाले':''));
  lines=lines.concat(milk);
  if(milk.length>1)lines.push('कुल दूध (बिक्री): '+r1(l)+' लीटर');
  lines=lines.concat(other);
  if(!lines.length)return null;
  return {l:r1(l),kg:Math.round(kg*1000)/1000,lines:lines};
}
/* आने वाले 31 दिन — बिलिंग ऐप से रजिस्टर पर जाता है, वहीं से रोज़ दोपहर फ़ोन पर घंटी */
/* 📋 आने वाले ऑर्डर — रजिस्टर की दोपहर 2 बजे वाली घंटी के लिए (मालिक, 19 अक्टूबर 2026: "कोई भी ऑर्डर रहे तो
   2–3 बजे तक नोटिफिकेशन — किसका/कहाँ का, कौन सी चीज़")। हर ऑर्डर: t समय, n ग्राहक, p जगह (पते का छोटा हिस्सा),
   i सामान, k 🚚/🏪 (ऑनलाइन वाले)। फ़ोन नंबर नहीं भेजते। */
function hiClock(d){
  var h=d.getHours(),m=d.getMinutes();if(!h&&!m)return '';
  var part=h<12?'सुबह':(h<16?'दोपहर':(h<20?'शाम':'रात')),h12=h%12===0?12:h%12;
  return part+' '+h12+(m?':'+(m<10?'0':'')+m:'')+' बजे';
}
function cutTxt(v,n){v=String(v==null?'':v).replace(/\s+/g,' ').trim();return v.length>n?v.slice(0,n-1)+'…':v;}
function planOrders(live,dateKey,fromHour){
  var out=[];
  dueGroups(live,dateKey).forEach(function(g){
    var o=g.order,c=findCustomer(o.customerId),d=new Date(o.date),same=!isNaN(d)&&dayKey(d)===dateKey;
    if(fromHour!=null&&same&&(d.getHours()||d.getMinutes())&&d.getHours()<fromHour)return;   // आज: सिर्फ़ दोपहर 2 बजे के बाद वाले
    out.push({t:same?hiClock(d):'',n:cutTxt(c?c.name:'?',32),p:cutTxt(c&&c.address,30),
      i:cutTxt(g.items.map(function(it){return displayName(it)+' '+fmtQty(it.qty)+' '+it.unit;}).join(', '),110),
      k:isWebOrder(o)?(o.webMode==='p'?'🏪':'🚚'):''});
  });
  return out.slice(0,25);
}
/* 🔔 "देख लिया" — दोपहर 2 बजे की याद तब तक (घंटी फिर-फिर + होम पर कार्ड) जब तक मालिक देख न लें (19 अक्टूबर 2026) */

    '<div class="mknote">"देख लिया" दबाने तक यह कार्ड रहेगा और घंटी 7 बजे तक फिर-फिर बजेगी।</div></div>';
}
function buildPlanDays(){
  var live=state.orders.filter(function(o){return !o.cancelled;});
  var from=todayStr(),until=addDaysKey(31),keys={},near={};
  near[from]=14;near[addDaysKey(1)]=null;near[addDaysKey(2)]=null;
  live.forEach(function(o){o.items.forEach(function(it){
    if(it.delivered)return;var k=itemDateKey(o,it);if(k>=from&&k<=until)keys[k]=1;
  });});
  var days={};
  Object.keys(keys).sort().forEach(function(k){
    var s=sweetsMilk(live,k),d=dairyDay(live,k),o=hasOwn(near,k)?planOrders(live,k,near[k]):[];
    if(s||d||o.length){days[k]={};if(s)days[k].s=s;if(d)days[k].d=d;if(o.length)days[k].o=o;}
  });
  /* 🌙 रात 8:40 की घंटी (रजिस्टर कोड 7): आज का हिसाब भरा या नहीं + सप्लायर का बाकी (सिर्फ़ सप्लायर का नाम, ग्राहक का कुछ नहीं) */
  try{var t0=todayStr();days.hs={done:hsHas(hsGet(t0))?t0:'',due:supDues(t0).slice(0,6).map(function(x){return [String(x.n).slice(0,40),x.bal,x.since];}),d0:GL().d0};
    /* 📊 रविवार रात / 1 तारीख़ की रिपोर्ट (रजिस्टर कोड 8) — सिर्फ़ जोड़, किसी ग्राहक का नाम/नंबर नहीं */
    var mon0=hsKeyAdd(t0,-((new Date(t0+'T12:00:00').getDay()+6)%7)),cym=t0.slice(0,7),pym=moAdd(cym,-1);
    var rw=rpShort(mon0,hsKeyAdd(mon0,6),'हफ़्ते का हिसाब ('+hsDm(mon0)+' – '+hsDm(hsKeyAdd(mon0,6))+')'),rm=rpShort(pym+'-01',moEnd(pym),moName(pym)+' का हिसाब'),rc=rpShort(cym+'-01',moEnd(cym),moName(cym)+' का हिसाब');
    days.hs.rw={k:mon0,t:rw.t,b:rw.b};days.hs.rm={k:pym,t:rm.t,b:rm.b};days.hs.rc={k:cym,t:rc.t,b:rc.b};
  }catch(e){}
  return days;
}
function milkCard(live){
  var sK=addDaysKey(2),dK=addDaysKey(1);
  var s=sweetsMilk(live,sK),d=dairyDay(live,dK);
  if(!s&&!d)return '';
  function row(t){return '<div class="mkrow'+(/^कुल /.test(t)?' mksum':'')+'">'+esc(t)+'</div>';}
  var h='<div class="sumcard milkcard"><div class="sumhead">🥛 आज का दूध-दही ऑर्डर (3 बजे तक)</div>';
  if(s){
    h+='<div class="mkhead">🍬 मिठाई — परसों '+esc(hiDate(sK))+' की डिलीवरी'+(s.l?'<span class="mkl">'+s.l+' लीटर दूध</span>':'')+'</div>'+
      s.lines.map(row).join('')+
      s.unk.map(function(t){return '<div class="mkrow">'+esc(t)+' <span class="mktag">सिर्फ गिनती</span></div>';}).join('');
    if(s.none.length)h+='<div class="mknote">बिना दूध: '+esc(s.none.join(', '))+'</div>';
  }
  if(d){
    h+='<div class="mkhead">🥛 दही-दूध — कल '+esc(hiDate(dK))+' की डिलीवरी</div>'+d.lines.map(row).join('');
  }
  if(s&&s.l&&d&&d.l)h+='<div class="mktotal">कुल दूध: '+r1(s.l+d.l)+' लीटर <span>(मिठाई '+s.l+' + बिक्री '+d.l+')</span></div>';
  var ps=lsGet(PLAN_SENT,{})||{};
  if(onlineCfg()&&ps.t&&!ps.old&&num(ps.v)<6)h+='<div class="mknote" style="color:var(--red)">📋 दोपहर की घंटी में ऑर्डर की पूरी लिस्ट (किसका, क्या) के लिए रजिस्टर का नया कोड (संस्करण 6) एक बार चिपकाना है — बैकअप → ⚙️ सेटअप, चरण 7</div>';
  if(onlineCfg())h+='<div class="mknote">'+(ps.old?'📲 फ़ोन पर रोज़ का रिमाइंडर अभी चालू नहीं — कंप्यूटर पर रजिस्टर का कोड अपडेट करना है (बैकअप → ⚙️ सेटअप, चरण 7)':(pushOn()?'📲 रोज़ दोपहर 2–2:30 बजे यही हिसाब इस फ़ोन पर घंटी से आता है':'📲 रोज़ की घंटी के लिए: बैकअप → 🔔 इस फ़ोन पर घंटी चालू करो'))+'</div>';
  return h+'</div>';
}

/* हिसाब बदले तो रजिस्टर पर भेजो (सिर्फ बदलने पर, या 12 घंटे में एक बार ताकि "कब भेजा" ताज़ा रहे) */
var PLAN_SENT='mbmb-plan-sent',planTimer=null,planBusy=false;
function planSyncSoon(){clearTimeout(planTimer);planTimer=setTimeout(function(){planSync();},4000);}
function hashStr(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0)+'-'+s.length;}
function planSync(force){
  var cfg=onlineCfg();
  if(!cfg||planBusy)return Promise.resolve(null);
  var days=buildPlanDays(),h=hashStr(JSON.stringify(days)),last=lsGet(PLAN_SENT,{})||{},now=Date.now();
  if(!force){
    if(last.old&&now-last.old<6*3600000)return Promise.resolve(null);   // रजिस्टर का कोड पुराना — 6 घंटे बाद फिर देखो
    if(last.h===h&&now-(last.t||0)<12*3600000)return Promise.resolve(null);
  }
  planBusy=true;
  return fetch(cfg.u,{method:'POST',body:JSON.stringify({action:'plan',key:cfg.k,plan:{v:1,at:now,days:days}}),redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(r){
      planBusy=false;
      if(r&&r.ok)lsSet(PLAN_SENT,{h:h,t:now,v:num(r.v)});
      else if(r&&r.error==='action')lsSet(PLAN_SENT,{old:now});
      return r;
    },function(){planBusy=false;return null;});
}

      toast(r.error==='action'?'रजिस्टर का कोड पुराना है — कंप्यूटर पर चरण 7 करें':'नहीं भेज पाए ('+(r.error||'?')+')');

  var list=all.filter(function(o){
    if(oq){
      var oc=findCustomer(o.customerId);
      var hit=byNo?String(o.no)===oq:(String(o.no)===oq||(oc&&(oc.name.toLowerCase().indexOf(oq)>-1||String(oc.phone||'').replace(/\s/g,'').indexOf(oq.replace(/\s/g,''))>-1)));
      if(!hit)return false;
    }

    if(filter==='delivered')return s==='delivered';
    if(filter==='cancelled')return s==='cancelled';

  });

    rows='<div class="empty"><b>यहाँ कोई ऑर्डर नहीं</b>दूसरा फ़िल्टर चुन कर देखो।</div>';
  }else if(filter==='all'){

    var G=[['p','⏳ पेंडिंग'],['d','✅ पूरा हुआ'],['c','✕ कैंसल']];
    rows=G.map(function(g){
      var part=list.filter(function(o){return orderGroup(o)===g[0];});
      return part.length?('<div class="ogh">'+g[1]+' <span>'+part.length+'</span></div>'+part.map(orderOverviewRow).join('')):'';
    }).join('');
  }else{
    rows=list.map(orderOverviewRow).join('');
  }

  paint($('#main'),'<div class="sechead"><h2>सारे ऑर्डर</h2></div>'+(online.cfg?'<p class="hint" style="margin-top:-4px">ऑनलाइन ऑर्डर अलग <button class="lnk" data-act="nav" data-v="online">🌐 ऑनलाइन</button> टैब में हैं।</p>':'')+band+
    '<input id="ordersSearch" type="search" placeholder="नाम, फोन या ऑर्डर नंबर से खोजो" autocomplete="off" value="'+esc(ui.ordersSearch||'')+'">'+tabsHtml+'<div style="margin-top:12px">'+rows+'</div>');

/* ऑर्डर लिस्ट का क्रम: पेंडिंग/आंशिक सबसे ऊपर (जिसकी डिलीवरी सबसे पहले की — पुराना रुका हुआ सबसे ऊपर),
   फिर पूरा हुआ (नया ऊपर), सबसे नीचे कैंसल (नया ऊपर) */
function orderGroup(o){var s=orderStatus(o);return s==='cancelled'?'c':(s==='delivered'?'d':'p');}
function orderNextDue(o){
  var d=dayKey(o.date),best='';
  o.items.forEach(function(it){if(!it.delivered){var k=it.date||d;if(!best||k<best)best=k;}});
  return best||d;
}
function orderListCmp(a,b){
  var ga=orderGroup(a),gb=orderGroup(b),R={p:0,d:1,c:2};
  if(ga!==gb)return R[ga]-R[gb];
  if(ga==='p'){var ka=orderNextDue(a),kb=orderNextDue(b);if(ka!==kb)return ka<kb?-1:1;return new Date(a.date)-new Date(b.date);}
  return new Date(b.date)-new Date(a.date);
}
function orderOverviewRow(o){
  var c=findCustomer(o.customerId);
  var st=orderStatus(o);
  var due=orderDue(o);
  return '<button class="mini" data-act="open-customer" data-id="'+o.customerId+'" style="width:100%;border:1px solid var(--line);text-align:left">'+
    '<span class="l"><span class="nm">'+esc(c?c.name:'?')+'</span><span class="sub">#'+o.no+' \u00b7 '+fmtDT(o.date)+' \u00b7 '+o.items.length+' item</span></span>'+
    '<span style="display:flex;align-items:center;gap:8px;flex:0 0 auto">'+
    (due>0?'<span class="r"><b>'+rupee(due)+'</b><span>बाकी</span></span>':'')+
    '<span class="stamp st-'+st+'">'+STAMP[st]+'</span>'+
    '</span></button>';
}

function orderCardFull(o){
  var st=orderStatus(o);
  var tot=orderTotal(o),paid=orderPaid(o),due=orderDue(o);
  var cancelled=o.cancelled;
  var baseDayKey=dayKey(o.date);
  var items=o.items.map(function(it){
    var amt=num(it.qty)*num(it.rate);
    var dtag=(!it.delivered&&it.date&&it.date!==baseDayKey)?(' <span class="dtag">'+fmtDshort(it.date)+'</span>'):'';
    if(cancelled){
      return '<li class="ro"><span class="chk">\u00b7</span><span class="citem">'+esc(displayName(it))+' \u00d7'+it.qty+dtag+'</span><span class="camt">'+rupee(amt)+'</span></li>';
    }
    return '<li><button data-act="toggle-item" data-order="'+o.id+'" data-line="'+it.lid+'"><span class="chk'+(it.delivered?' on':'')+'">\u2713</span><span class="citem">'+esc(displayName(it))+' ×'+fmtQty(it.qty)+' '+esc(it.unit)+dtag+(it.delivered&&it.deliveredAt?' <span class="dtag dgiven">दिया '+fmtDshort(it.deliveredAt)+'</span>':'')+'</span><span class="camt">'+rupee(amt)+'</span></button></li>';
  }).join('');
  var pays='';
  if(o.payments.length){
    pays='<div class="paylog"><div style="font-weight:600">जमा का हिसाब:</div>'+o.payments.map(function(p){
      return '<div class="payrow"><span>'+fmtDonly(p.date)+': '+rupee(p.amount)+(p.note?' ('+esc(p.note)+')':'')+'</span>'+
        (cancelled?'':'<button class="lnk danger" data-act="del-payment" data-order="'+o.id+'" data-pay="'+p.id+'">हटाओ</button>')+'</div>';
    }).join('')+'</div>';
  }
  var acts='';
  if(!cancelled){
    acts='<div class="oacts">'+
      (due>0?'<button class="btn small" data-act="order-payment" data-id="'+o.id+'">पेमेंट लो</button>':'')+
      webConfirmButton(o)+
      billButton(o)+
      '<button class="lnk" data-act="remind-order" data-id="'+o.id+'">\uD83D\uDD14 रिमाइंडर</button>'+
      '<button class="lnk" data-act="print-order" data-id="'+o.id+'">\uD83D\uDDA8\uFE0F प्रिंट</button>'+
      '<button class="lnk" data-act="edit-order" data-id="'+o.id+'">एडिट</button>'+
      '<button class="lnk danger" data-act="cancel-order" data-id="'+o.id+'">कैंसल</button>'+
      '</div>';
  }
  return '<article class="order'+(cancelled?' cancelled':'')+'">'+
    '<div class="otop"><div><div class="odate">'+fmtDT(o.date)+'</div></div>'+
    '<span class="obadge">#'+o.no+'</span>'+(isWebOrder(o)?'<span class="webtag">🌐 ऑनलाइन</span>':'')+
    '<span class="stamp st-'+st+'">'+STAMP[st]+'</span></div>'+
    (isWebOrder(o)&&!o.cancelled&&st!=='delivered'?'<div class="hint" style="margin-top:0">ऑनलाइन ऑर्डर — पेमेंट और डिलीवरी 🌐 ऑनलाइन टैब से; डिलीवर होने तक "कुल बाकी" में नहीं गिना जाता।</div>':'')+
    (o.notes?'<div class="hint">'+esc(o.notes)+'</div>':'')+
    '<ul class="checklist">'+items+(o.cpn?'<li class="ro cpnli"><span class="chk">🎁</span><span class="citem">स्क्रैच कूपन ('+esc(o.cpn.code)+')</span><span class="camt" style="color:var(--green)">−'+rupee(o.cpn.amt)+'</span></li>':'')+'</ul>'+
    pays+
    '<div class="money"><div><span>टोटल</span><b>'+rupee(tot)+'</b></div><div><span>जमा</span><b>'+rupee(paid)+'</b></div>'+

    acts+'</article>';

/* ---------- ⚙️ दुकान सेटिंग — catalog.js सीधे GitHub पर बदलना (Claude या किसी डेवलपर के बिना) ----------
   मालिक एक बार GitHub "चाबी" (fine-grained token: सिर्फ़ mbsweets/mb-sweets, Contents: Read and write) डालते हैं।
   फिर दाम / आज ख़त्म / ऑनलाइन बंद-चालू / सूचना यहाँ से बदलते हैं → catalog.js में बदलाव → वेबसाइट, ऑर्डर पेज
   और यह ऐप तीनों उसी फ़ाइल से पढ़ते हैं। फ़ाइल का बाकी हिस्सा (टिप्पणियाँ, मेन्यू) जैसा का तैसा रहता है;
   हर सेव से पहले नई फ़ाइल चलाकर जाँची जाती है — ग़लत फ़ाइल कभी सेव नहीं होती। */
var GH={repo:'mbsweets/mb-sweets',path:'catalog.js',branch:'main',KEY:'mbmb-gh',UNDO:'mbmb-gh-undo',
  NEWKEY:'https://github.com/settings/personal-access-tokens/new?name='+encodeURIComponent('MB Sweets दुकान सेटिंग')+
    '&description='+encodeURIComponent('बिलिंग ऐप की दुकान सेटिंग: सिर्फ़ mb-sweets की catalog.js बदलने के लिए')+'&target_name=mbsweets&expires_in=none&contents=write'};
var SS={state:'idle',err:'',text:'',sha:'',cat:null,d:null,saving:false,keyErr:'',at:0};
function ghTok(){var t=lsGet(GH.KEY,'');return typeof t==='string'?t:'';}
function ghApi(path,method,body){
  var ctrl=window.AbortController?new AbortController():null,tm=ctrl?setTimeout(function(){ctrl.abort();},30000):null;
  var opt={method:method||'GET',cache:'no-store',headers:{'Authorization':'Bearer '+ghTok(),'Accept':'application/vnd.github+json'}};   // सिर्फ़ वही हेडर जो GitHub का CORS मानता है
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  if(ctrl)opt.signal=ctrl.signal;
  return fetch('https://api.github.com/repos/'+GH.repo+path,opt).then(function(r){
    clearTimeout(tm);
    return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,ok:r.ok,j:j};});
  },function(){clearTimeout(tm);return {status:0,ok:false,j:{}};});
}
function ghErrText(r){
  if(!r||r.status===0)return 'इंटरनेट नहीं मिला — नेट चालू करके दोबारा कोशिश करो।';
  if(r.status===401)return 'GitHub चाबी ग़लत है या उसकी तारीख़ ख़त्म हो गई — नीचे "चाबी हटाओ" दबाकर नई चाबी डालो (हैंडबुक में तरीका है)।';
  if(r.status===403||r.status===404)return 'चाबी को इजाज़त नहीं मिली — चाबी बनाते समय "Only select repositories" में mb-sweets चुनना और Contents को "Read and write" करना ज़रूरी है।';
  if(r.status===409||r.status===422)return 'इसी बीच फ़ाइल कहीं और से बदली गई — दोबारा "सेव करो" दबाओ।';
  return 'GitHub से जवाब नहीं मिला ('+r.status+') — थोड़ी देर बाद दोबारा कोशिश करो।';
}
function b64ToUtf8(b){var s=atob(String(b||'').replace(/\s/g,''));var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a);}
function utf8ToB64(t){var a=new TextEncoder().encode(t),s='';for(var i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
function catParse(text){var w={};(new Function('window',text))(w);var c=w.MB_CATALOG;if(!c||!Array.isArray(c.items)||!c.shop)throw new Error('catalog');return c;}
function jsStr(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')+"'";}
function reEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
/* ch = {prices:{id:₹}, online:{id:[₹,चार्ज]}, off:[ids]|undefined, pause:bool|undefined, notice:str|undefined} */
function catEdit(text,ch){
  var c0=catParse(text),ver=(parseInt(c0.version,10)||0)+1,t=text,miss=[];
  function rep(re,fn,what){if(!re.test(t)){miss.push(what);return;}t=t.replace(re,fn);}
  rep(/(\n[ \t]*version:[ \t]*)(\d+)/,function(m,a){return a+ver;},'version');
  rep(/(\n[ \t]*updated:[ \t]*)'[^'\n]*'/,function(m,a){return a+"'"+todayStr()+"'";},'updated');
  Object.keys(ch.prices||{}).forEach(function(id){
    rep(new RegExp("(\\['"+reEsc(id)+"',\\s*'[^'\\n]*',\\s*'[^'\\n]*',\\s*'[^'\\n]*',\\s*)([\\d.]+)(,\\s*)(\\d+)(\\])"),
      function(m,a,p,b,v,e){return a+ch.prices[id]+b+ver+e;},id);
  });
  Object.keys(ch.online||{}).forEach(function(id){
    rep(new RegExp("(\\b"+reEsc(id)+":\\s*\\[)([\\d.]+)(,\\s*)([\\d.]+)(\\])"),
      function(m,a,p,b,f,e){return a+ch.online[id][0]+b+ch.online[id][1]+e;},'online '+id);
  });
  if(ch.off)rep(/(\n[ \t]*off:[ \t]*)\[[^\]]*\]/,function(m,a){return a+'['+ch.off.map(function(x){return "'"+x+"'";}).join(', ')+']';},'off');
  if(ch.pause!=null)rep(/(\n[ \t]*pause:[ \t]*)(true|false)/,function(m,a){return a+(ch.pause?'true':'false');},'pause');
  if(ch.notice!=null)rep(/(\n[ \t]*noticeHi:[ \t]*)'(?:[^'\\\n]|\\.)*'/,function(m,a){return a+jsStr(ch.notice);},'noticeHi');
  if(ch.notice!=null&&/\n[ \t]*noticeEn:/.test(t))t=t.replace(/(\n[ \t]*noticeEn:[ \t]*)'(?:[^'\\\n]|\\.)*'/,function(m,a){return a+"''";});   // अंग्रेज़ी पेज पर भी यही (हिंदी) सूचना दिखे
  if(miss.length)throw new Error('फ़ाइल में ये जगह नहीं मिली: '+miss.join(', '));
  var c1=catParse(t);                          // नई फ़ाइल चलाकर जाँचो — हर बदलाव सच में हुआ?
  var bad=[];
  if(c1.version!==ver)bad.push('version');
  Object.keys(ch.prices||{}).forEach(function(id){var r=c1.items.filter(function(x){return x[0]===id;})[0];if(!r||r[4]!==ch.prices[id]||r[5]!==ver)bad.push(id);});
  Object.keys(ch.online||{}).forEach(function(id){var o=(c1.online||{})[id];if(!o||o[0]!==ch.online[id][0]||o[1]!==ch.online[id][1])bad.push('online '+id);});
  if(ch.off&&JSON.stringify(c1.off)!==JSON.stringify(ch.off))bad.push('off');
  if(ch.pause!=null&&c1.pause!==ch.pause)bad.push('pause');
  if(ch.notice!=null&&c1.noticeHi!==String(ch.notice).replace(/\r?\n/g,' '))bad.push('notice');
  if(c1.items.length!==c0.items.length||JSON.stringify(c1.menu)!==JSON.stringify(c0.menu))bad.push('बाकी फ़ाइल');
  if(bad.length)throw new Error('जाँच में गड़बड़: '+bad.join(', '));
  return {text:t,cat:c1};
}
function ssDraftFrom(c){
  var d={prices:{},online:{},off:{},pause:!!c.pause,notice:String(c.noticeHi||'')};
  c.items.forEach(function(r){d.prices[r[0]]=String(r[4]);});
  Object.keys(c.online||{}).forEach(function(id){d.online[id]=[String(c.online[id][0]),String(c.online[id][1])];});
  (c.off||[]).forEach(function(id){d.off[id]=1;});
  return d;
}
function ssItemName(id){var r=SS.cat&&SS.cat.items.filter(function(x){return x[0]===id;})[0];return r?r[1]:id;}
function ssValidNum(v){var s=String(v).trim();return /^\d+(\.\d{1,2})?$/.test(s)&&parseFloat(s)>0&&parseFloat(s)<100000;}
/* बदलाव: {ch (catEdit वाला), lines (हिंदी में), undo (उल्टा ch), err} */
function ssChanges(){
  var c=SS.cat,d=SS.d,ch={prices:{},online:{}},undo={prices:{},online:{}},L=[],err='';
  c.items.forEach(function(r){
    var v=String(d.prices[r[0]]).trim();
    if(!ssValidNum(v)){err=err||('"'+r[1]+'" का दाम सही नहीं है — सिर्फ़ अंक लिखो, जैसे 300');return;}
    var n=parseFloat(v);
    if(n!==r[4]){ch.prices[r[0]]=n;undo.prices[r[0]]=r[4];L.push('💰 '+r[1]+': ₹'+r[4]+' → ₹'+n);}
  });
  Object.keys(c.online||{}).forEach(function(id){
    var p=String(d.online[id][0]).trim(),f=String(d.online[id][1]).trim(),o=c.online[id];
    if(!ssValidNum(p)){err=err||('"'+ssItemName(id)+'" का ऑनलाइन दाम सही नहीं है');return;}
    if(!/^\d+(\.\d{1,2})?$/.test(f)||parseFloat(f)>1000){err=err||('"'+ssItemName(id)+'" का डिलीवरी चार्ज सही नहीं है (0 भी चलेगा)');return;}
    var np=parseFloat(p),nf=parseFloat(f);
    if(np!==o[0]||nf!==o[1]){ch.online[id]=[np,nf];undo.online[id]=[o[0],o[1]];L.push('🌐 '+ssItemName(id)+' (ऑनलाइन): ₹'+o[0]+' + ₹'+o[1]+' चार्ज → ₹'+np+' + ₹'+nf+' चार्ज');}
  });
  var offNow=c.items.map(function(r){return r[0];}).filter(function(id){return d.off[id];});
  var offOld=(c.off||[]).slice();
  if(offNow.slice().sort().join()!==offOld.slice().sort().join()){
    ch.off=offNow;undo.off=offOld;
    offNow.filter(function(id){return offOld.indexOf(id)<0;}).forEach(function(id){L.push('🚫 आज ख़त्म: '+ssItemName(id));});
    offOld.filter(function(id){return offNow.indexOf(id)<0;}).forEach(function(id){L.push('✅ फिर से मिलेगा: '+ssItemName(id));});
  }
  if(d.pause!==!!c.pause){ch.pause=d.pause;undo.pause=!!c.pause;L.push(d.pause?'⛔ ऑनलाइन ऑर्डर बंद':'✅ ऑनलाइन ऑर्डर चालू');}
  var nt=String(d.notice).replace(/\r?\n/g,' ').trim();
  if(nt.length>200)err=err||'सूचना बहुत लंबी है — 200 अक्षर तक लिखो';
  if(nt!==String(c.noticeHi||'')){ch.notice=nt;undo.notice=String(c.noticeHi||'');L.push(nt?'📢 सूचना: "'+nt+'"':'📢 सूचना हटाई');}
  return {ch:ch,undo:undo,lines:L,err:err};
}
function ssLoad(){
  SS.state='loading';SS.err='';renderShopSet();
  ghApi('/contents/'+GH.path+'?ref='+GH.branch).then(function(r){
    if(!r.ok){SS.state='error';SS.err=ghErrText(r);renderShopSet();return;}
    try{SS.text=b64ToUtf8(r.j.content);SS.sha=r.j.sha;SS.cat=catParse(SS.text);}
    catch(e){SS.state='error';SS.err='catalog.js पढ़ी नहीं जा सकी — हैंडबुक का "कुछ गड़बड़ हो तो" भाग देखो।';renderShopSet();return;}
    SS.d=ssDraftFrom(SS.cat);SS.state='ready';SS.at=Date.now();renderShopSet();
  });
}
/* GitHub पर सेव: ताज़ी फ़ाइल लेकर उसी पर बदलाव (बीच में कहीं और से बदली हो तो भी कुछ न टूटे) */
function ssCommit(ch,msg,undo,lines){
  SS.saving=true;renderShopSet();
  var tries=0;
  function go(){
    tries++;
    ghApi('/contents/'+GH.path+'?ref='+GH.branch).then(function(r){
      if(!r.ok)return fail(r);
      var text,res;
      try{text=b64ToUtf8(r.j.content);res=catEdit(text,ch);}
      catch(e){SS.saving=false;toast(String(e.message||e));renderShopSet();return;}
      ghApi('/contents/'+GH.path,'PUT',{message:msg,content:utf8ToB64(res.text),sha:r.j.sha,branch:GH.branch}).then(function(p){
        if(!p.ok){if((p.status===409||p.status===422)&&tries<3)return go();return fail(p);}
        SS.text=res.text;SS.sha=(p.j.content&&p.j.content.sha)||'';SS.cat=res.cat;SS.d=ssDraftFrom(res.cat);SS.saving=false;
        if(undo)lsSet(GH.UNDO,{at:Date.now(),ch:undo,lines:lines});else localStorage.removeItem(GH.UNDO);
        // इस फ़ोन का ऐप तुरंत नए दाम ले ले
        var n=0;try{window.MB_CATALOG=res.cat;CATALOG=res.cat;n=applyCatalog();}catch(e){}
        closeSheet();
        openSheet('<div class="sh-head"><h2>✅ सेव हो गया</h2><button class="lnk muted" data-act="close">बंद करो</button></div>'+
          (n?'<p>इस फ़ोन के बिल में <b>'+n+' आइटम का दाम अभी</b> बदल गया।</p>':'')+
          '<p>बदलाव GitHub पर सेव हो गया। <b>5–10 मिनट में</b> वेबसाइट, ऑनलाइन ऑर्डर पेज और बाकी फ़ोन में दिखने लगेगा।</p>'+
          '<p class="hint">ग़लती हो गई हो तो सेटिंग में नीचे "↩️ वापस करो" दबाओ।</p><div class="sh-actions"><button class="btn primary" data-act="close">ठीक है</button></div>');
        renderShopSet();renderBanner();
      });
    });
  }
  function fail(r){SS.saving=false;toast(ghErrText(r));renderShopSet();}
  go();
}
function ssConfirm(){
  var c=ssChanges();
  if(c.err){toast(c.err);return;}
  if(!c.lines.length){toast('कुछ बदला नहीं है');return;}
  openSheet('<div class="sh-head"><h2>ये बदलाव सेव करें?</h2><button class="lnk muted" data-act="close">बंद करो</button></div>'+
    '<ul class="sslist">'+c.lines.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>'+
    '<p class="hint">ये वेबसाइट, ऑनलाइन ऑर्डर पेज और बिलिंग ऐप — तीनों में बदलेगा।</p>'+
    '<div class="sh-actions"><button class="btn" data-act="close">रुको</button><button class="btn primary" data-act="ss-save-ok">✅ हाँ, सेव करो</button></div>');
}
function ssDoSave(){
  var c=ssChanges();if(c.err||!c.lines.length){closeSheet();return;}
  ssCommit(c.ch,'दुकान सेटिंग: '+c.lines.join(' · ').slice(0,200),c.undo,c.lines);
}
function ssUndo(){
  var u=lsGet(GH.UNDO,null);if(!u||!u.ch)return;
  openSheet('<div class="sh-head"><h2>↩️ पिछला बदलाव वापस करें?</h2><button class="lnk muted" data-act="close">बंद करो</button></div>'+
    '<p>ये बदलाव हटाकर पहले जैसा कर देंगे:</p><ul class="sslist">'+(u.lines||[]).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>'+

/* ---------- 📱 फ़ोन का Back बटन ----------
   ऐप एक ही पेज है, इसलिए Android का Back सीधे ऐप बंद कर देता था।
   अब: Back = खुली शीट बंद → पिछली स्क्रीन → होम → "एक बार और दबाओ" → ऐप बंद।
   हर स्क्रीन-गहराई के लिए ब्राउज़र history में एक एंट्री ({mbTrap:1,d:गहराई}) रहती है — होम = 1, होम से खुली स्क्रीन = 2 …
   Chrome सिर्फ़ वही एंट्री Back पर मानता है जो असली टैप के बाद बनी हो (Back दबाने के बाद बनी एंट्री वो छोड़ देता है
   और पूरा ऐप एक Back में बंद हो जाता है) — इसलिए एंट्री सिर्फ़ टैप के बाद बनती हैं, Back के बीच में कभी नहीं। */
var NAV={stack:[],cur:null,restoring:false,hd:0,act:false,ignore:0,hashType:'',exitArm:0,exitTimer:null,y:0};
try{if(history.state&&history.state.mbTrap)NAV.hd=history.state.d||1;}catch(e){}
var NAV_TABS=['hisaab','online','orders','khata','loyal','items','backup'];
function navKey(x){return x.v+'|'+(x.c||'')+'|'+(x.p||'')+'|'+(x.m||'');}
var VIEW_KEY='mbmb-view';
function saveView(){   // रिफ़्रेश के बाद इसी टैब/पेज पर लौटने के लिए
  try{sessionStorage.setItem(VIEW_KEY,JSON.stringify({v:ui.view,c:ui.customerId||null,p:ui.partyId||null,m:ui.memberId||null,cf:ui.cameFrom||'home',of:ui.onFilter||'',d:NAV.hd}));}catch(e){}
}
function navTrack(){
  var now={v:ui.view,c:ui.customerId||null,p:ui.partyId||null,m:ui.memberId||null,cf:ui.cameFrom,y:0};
  if(!NAV.cur){
    NAV.cur=now;
    if(now.v!=='home')NAV.stack=[{v:'home',y:0}];
    if(now.v==='shopset')NAV.stack.push({v:'backup',y:0});         // सीधे किसी टैब पर खुला (रिफ़्रेश / #online) — Back = होम
    navSync();return;
  }
  if(navKey(now)===navKey(NAV.cur)){NAV.cur.cf=now.cf;navSync();return;}
  if(!NAV.restoring){
    NAV.cur.y=NAV.y;
    if(now.v==='home'){
      NAV.stack=[];                                       // होम = सबसे नीचे; यहाँ से Back = बाहर निकलना
    }else if(NAV_TABS.indexOf(now.v)>-1){
      var home=(NAV.cur.v==='home')?NAV.cur:(NAV.stack[0]&&NAV.stack[0].v==='home'?NAV.stack[0]:{v:'home'});
      NAV.stack=[home];                                   // नीचे वाले टैब से Back = होम
    }else{
      var top=NAV.stack[NAV.stack.length-1];
      if(top&&navKey(top)===navKey(now))NAV.stack.pop();  // ऐप का "← वापस" बटन = पीछे जाना
      else{NAV.stack.push(NAV.cur);if(NAV.stack.length>40)NAV.stack.shift();}
    }
  }
  NAV.cur=now;
  navSync();
}
/* history की गहराई ≥ स्क्रीनों की गहराई (+1 अगर शीट खुली)। कम हो तो (सिर्फ़ टैप के बाद) एंट्री जोड़ो।
   ज़्यादा हो तो कोई बात नहीं — हर Back एक कदम पीछे ही जाता है; होम पर "एक बार और" के समय बची एंट्री हटा देते हैं। */
function navSync(){
  var t=NAV.stack.length+1+($('#ov')?1:0);
  if(!NAV.ignore&&NAV.act&&!NAV.exitArm){
    while(NAV.hd<t){
      try{history.pushState({mbTrap:1,d:NAV.hd+1},'');NAV.hd++;}catch(e){break;}
    }
  }
  saveView();
}
function navGo(x){
  NAV.restoring=true;
  ui.view=x.v;ui.customerId=x.c||null;ui.partyId=x.p||null;ui.memberId=x.m||null;if(x.cf)ui.cameFrom=x.cf;
  try{renderRoute();}finally{NAV.restoring=false;}
  window.scrollTo(0,x.y||0);
}
function navBack(){
  if(calcIsOpen()){calcClose();return true;}
  if($('#ov')){softClose();return true;}
  var prev=NAV.stack.pop();
  if(prev){navGo(prev);return true;}
  if(ui.view!=='home'){navGo({v:'home'});return true;}
  return false;
}
window.addEventListener('scroll',function(){NAV.y=window.scrollY||0;},{passive:true});
// शीट (नीचे से खुलने वाला डिब्बा) खुली/बंद — Back से पहले शीट बंद हो, इसलिए उसकी भी एक एंट्री
try{new MutationObserver(function(){navSync();}).observe($('#sheetRoot'),{childList:true});}catch(e){}
// असली टैप/बटन (click/pointerup/touchend/keydown) = Chrome की "user activation" — तभी नई एंट्री बनाना सुरक्षित है
['click','pointerup','touchend','keydown'].forEach(function(ev){
  window.addEventListener(ev,function(){
    var ua=navigator.userActivation;
    if(ua&&!ua.isActive)return;                    // स्क्रॉल वगैरह — टैप नहीं
    NAV.act=true;
    if(NAV.exitArm){NAV.exitArm=0;clearTimeout(NAV.exitTimer);}
    navSync();
  },{capture:true,passive:true});
});
// #online वाला लिंक नई एंट्री बनाता है (push) या मौजूदा बदलता है (replace) — Navigation API से पता चलता है
try{if(window.navigation&&navigation.addEventListener)navigation.addEventListener('navigate',function(e){if(e.hashChange)NAV.hashType=e.navigationType;});}catch(e){}
window.addEventListener('popstate',function(e){
  if(location.hash)return;                       // #online / #o= लिंक — उन्हें hashchange संभालता है
  var old=NAV.hd,d=(e.state&&e.state.mbTrap)?(e.state.d||1):0;
  NAV.hd=d;
  NAV.act=false;                                 // Back/Forward के बाद Chrome पुराना टैप नहीं मानता — अगले टैप तक नई एंट्री नहीं
  if(NAV.ignore){NAV.ignore--;saveView();return;} // हमारा अपना पीछे खिसकाना — Back नहीं
  if(d>old){saveView();return;}                  // आगे (forward) आए — कुछ नहीं करना
  clearTimeout(NAV.exitTimer);
  NAV.exitArm=0;
  if(navBack()){navSync();return;}
  // होम पर, पीछे कुछ नहीं — एक बार पूछो; 2.5 सेकंड में दोबारा Back = ऐप बंद
  NAV.exitArm=Date.now();
  if(d>0){NAV.ignore++;try{history.go(-d);}catch(err){NAV.ignore=0;}}   // पीछे फ़ालतू एंट्री बची हो तो सबसे नीचे — अगला Back सीधे बाहर
  saveView();
  toast('ऐप बंद करना है तो एक बार और Back दबाओ');
  NAV.exitTimer=setTimeout(function(){
    NAV.exitArm=0;
    // Chrome के अलावा दूसरे ब्राउज़रों के लिए फिर से "एक बार और" वाली एंट्री (Chrome इसे अगले टैप तक नहीं मानता)
    if(NAV.hd===0&&ui.view==='home'&&!NAV.stack.length){try{history.pushState({mbTrap:1,d:1,na:1},'');NAV.hd=1;}catch(err){}saveView();}
  },2500);
});

/* ---------- SHEETS: generic ---------- */
function openSheet(html){
  $('#sheetRoot').innerHTML='<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  document.body.classList.add('noscroll');
}
function setSheet(html){
  var s=$('#ov .sheet');
  if(s)paint(s,html);else openSheet(html);
}
/* लिखते समय टाइप वाले बॉक्स को नहीं बदलते — फ़ोन का कीबोर्ड (Gboard/हिंदी) अधूरा शब्द दोबारा न लिख दे।
   बाकी सब नया बनता है, सिर्फ़ वो बॉक्स (और उसके डिब्बे) अपनी जगह रहते हैं। */
function paint(el,html){
  if(!el)return;
  var a=document.activeElement;
  if(!a||!a.id||!/^(INPUT|TEXTAREA)$/.test(a.tagName)||!el.contains(a)||!window.CSS||!CSS.escape){el.innerHTML=html;return;}
  var tmp=document.createElement(el.tagName);tmp.innerHTML=html;
  if(!tmp.querySelector('#'+CSS.escape(a.id))){el.innerHTML=html;return;}
  morphKeep(el,tmp,a);
}
function morphKeep(live,fresh,keep){
  var sel='#'+CSS.escape(keep.id),lk=null,fk=null,n;
  for(n=live.firstChild;n;n=n.nextSibling)if(n===keep||(n.nodeType===1&&n.contains(keep))){lk=n;break;}
  for(n=fresh.firstChild;n;n=n.nextSibling)if(n.nodeType===1&&(n.id===keep.id||n.querySelector(sel))){fk=n;break;}
  if(!lk||!fk||lk.tagName!==fk.tagName){live.innerHTML=fresh.innerHTML;return;}
  while(live.firstChild!==lk)live.removeChild(live.firstChild);
  while(lk.nextSibling)live.removeChild(lk.nextSibling);
  while(fresh.firstChild!==fk)live.insertBefore(fresh.firstChild,lk);
  while(fk.nextSibling)live.appendChild(fk.nextSibling);
  if(lk===keep){
    for(var i=0;i<fk.attributes.length;i++){var an=fk.attributes[i].name;if(an!=='value')keep.setAttribute(an,fk.attributes[i].value);}
    return;
  }
  for(var j=lk.attributes.length-1;j>=0;j--){if(!fk.hasAttribute(lk.attributes[j].name))lk.removeAttribute(lk.attributes[j].name);}
  for(var k=0;k<fk.attributes.length;k++)lk.setAttribute(fk.attributes[k].name,fk.attributes[k].value);
  morphKeep(lk,fk,keep);
}

/* ---------- वेबसाइट (मेन्यू) से आया ऑर्डर ---------- */
function b64urlDecode(s){
  s=String(s).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  var bin=atob(s);
  if(window.TextDecoder){
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  return decodeURIComponent(escape(bin));
}
function clip(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n):s;}
function parseWebOrder(raw){
  try{
    var p=JSON.parse(b64urlDecode(raw));
    if(!p||typeof p!=='object'||!Array.isArray(p.i))return null;
    return {
      c:clip(p.c,20),n:clip(p.n,60),p:clip(p.p,15),m:p.m==='p'?'p':'d',
      g:clip(p.g,80),a:clip(p.a,200),k:clip(p.k,120),
      l:(Array.isArray(p.l)&&p.l.length===2&&isFinite(p.l[0])&&isFinite(p.l[1]))?[+p.l[0],+p.l[1]]:null,
      dk:isFinite(p.dk)?+p.dk:null,
      w:(p.w==='asap'||/^\d{4}-\d{2}-\d{2}$/.test(String(p.w)))?String(p.w):'asap',
      s:(isFinite(p.s)&&p.s>=0&&p.s<WEB_SLOTS.length)?+p.s:-1,
      i:p.i.filter(function(r){return Array.isArray(r)&&r.length>=2&&num(r[1])>0;}).slice(0,60).map(function(r){return [clip(r[0],12),num(r[1])];}),
      x:Array.isArray(p.x)?p.x.filter(function(r){return Array.isArray(r)&&r.length>=2;}).slice(0,20).map(function(r){return [r[0]==='cake'?'cake':'pack',clip(r[1],300)];}):[],
      cm:clip(p.cm,120),t:clip(p.t,300),ts:num(p.ts)
    };
  }catch(e){return null;}
}
function webItemInfo(id){
  var it=findItem(id);
  if(it)return {name:it.name,unit:it.unit,price:num(it.price)};
  if(CATALOG){for(var i=0;i<CATALOG.items.length;i++){var r=CATALOG.items[i];if(r[0]===id)return {name:r[1],unit:r[3],price:num(r[4])};}}
  return null;
}
/* ऑनलाइन दाम (catalog.js online) — ऑनलाइन ऑर्डर का बिल उसी दाम पर बने जो ग्राहक ने मेन्यू में देखा;
   काउंटर पर items वाला दाम ही। fee = घर पर डिलीवरी में हर पैक/लीटर पर चार्ज (पिकअप पर नहीं) */
function webOnline(id){var o=CATALOG&&CATALOG.online&&CATALOG.online[id];return (Array.isArray(o)&&num(o[0])>0)?{price:num(o[0]),fee:Math.max(0,num(o[1]))}:null;}
function webFee(items,mode){
  if(mode==='p')return 0;
  var f=0;(items||[]).forEach(function(r){var o=webOnline(r[0]);if(o)f+=o.fee*num(r[1]);});
  return round2(f);
}
var WEB_FEE_NAME='🚚 होम डिलीवरी चार्ज';
function webWhenText(p){
  if(p.w==='asap')return p.m==='p'?'जल्दी (30 मिनट में तैयार)':'जल्दी (30–60 मिनट)';
  return fmtDshort(keyToDate(p.w))+(p.s>=0?', '+webSlotLabel(p.s,p.m):'');
}
function webDateValue(p){
  if(p.w==='asap'){
    var d=new Date(Date.now()+60*60000);
    var m=d.getMinutes();d.setMinutes(Math.ceil(m/15)*15,0,0);
    return dayKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  var h=p.s>=0?webSlotHour(p.s,p.m):10;
  return p.w+'T'+pad(h)+':00';
}
function webMapsLink(p){return p.l?('https://maps.google.com/?q='+p.l[0].toFixed(5)+','+p.l[1].toFixed(5)):'';}
function webNotes(p){
  var N=['🌐 ऑनलाइन ऑर्डर '+p.c+' · '+(p.m==='p'?'🏪 दुकान से लेंगे':'🚚 घर पर डिलीवरी')+' · ⏰ '+webWhenText(p)];
  if(p.m==='d'){
    if(p.g)N.push('गाँव/मोहल्ला: '+p.g);
    if(p.a)N.push('पता: '+p.a);
    if(p.k)N.push('पहचान: '+p.k);
    if(p.l)N.push('📍 '+webMapsLink(p)+(p.dk!=null?' (~'+p.dk+' km)':''));
    else N.push('📍 लोकेशन नहीं दी — दूरी जांचनी है');
  }
  if(p.cm)N.push('केक पर लिखना: "'+p.cm+'"');
  if(p.t)N.push('ग्राहक का नोट: '+p.t);
  return N.join('\n');
}
function webLines(p){
  var L=[];
  p.i.forEach(function(r){

var ONLINE_CFG='mbmb-online',ONLINE_CACHE='mbmb-online-cache',ONLINE_QUEUE='mbmb-online-queue',ONLINE_SEEN='mbmb-online-seen';
var online={cfg:null,orders:[],lastSync:0,syncing:false,error:'',showDone:false};
var ON_LABEL={'new':'नया','accepted':'स्वीकार','out':'रास्ते में','delivered':'डिलीवर','rejected':'मना'};
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function onlineCfg(){var c=lsGet(ONLINE_CFG,null);return (c&&c.u&&c.k)?c:null;}
function loadOnlineCache(){var c=lsGet(ONLINE_CACHE,null);if(c&&Array.isArray(c.orders)){online.orders=c.orders;online.lastSync=c.t||0;}}
function saveOnlineCache(){lsSet(ONLINE_CACHE,{orders:online.orders,t:online.lastSync});}
function onlineNewCount(){return online.orders.filter(function(o){return o.status==='new';}).length;}
function findOnline(code){for(var i=0;i<online.orders.length;i++)if(online.orders[i].code===code)return online.orders[i];return null;}
/* नेट अटक जाए तो 25 सेकंड बाद छोड़ दो — "ताज़ा करो" हमेशा चलता रहे */
function fetchT(url,opt){
  opt=opt||{};var ctrl=window.AbortController?new AbortController():null,tm=null;
  if(ctrl){opt.signal=ctrl.signal;tm=setTimeout(function(){ctrl.abort();},25000);}
  return fetch(url,opt).then(function(r){clearTimeout(tm);return r.json();},function(e){clearTimeout(tm);throw e;});
}
function onlineGet(params){
  var c=online.cfg;
  var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  return fetchT(c.u+'?'+q,{redirect:'follow'});
}
function onlinePost(body){return fetchT(online.cfg.u,{method:'POST',body:JSON.stringify(body),redirect:'follow'});}
var flushing=null,flushAgain=false;
/* send queued status changes one at a time, oldest first; never two senders at once */
function flushQueue(){
  if(!online.cfg)return Promise.resolve();
  if(flushing){flushAgain=true;return flushing;}
  flushing=(function next(){
    var q=lsGet(ONLINE_QUEUE,[]);
    if(!q.length)return Promise.resolve();
    var u=q[0];
    return onlinePost({action:'update',key:online.cfg.k,code:u.code,status:u.status,note:u.note,total:u.total}).then(function(r){
      if(r&&(r.ok||r.error==='notfound'||r.error==='status')){
        lsSet(ONLINE_QUEUE,lsGet(ONLINE_QUEUE,[]).filter(function(x){return x.qid!==u.qid;}));
        return next();
      }
    },function(){});
  })().then(function(){
    flushing=null;
    if(flushAgain){flushAgain=false;return flushQueue();}
  },function(){flushing=null;});
  return flushing;
}
function queueStatus(code,status,extra){
  extra=extra||{};
  var o=findOnline(code);
  if(o){o.status=status;if(extra.note!==undefined)o.statusNote=extra.note;if(extra.total!==undefined)o.confirmedTotal=extra.total;o.updated=new Date().toISOString();}
  var q=lsGet(ONLINE_QUEUE,[]);
  q.push({qid:uid(),code:code,status:status,note:extra.note,total:extra.total});
  lsSet(ONLINE_QUEUE,q);
  saveOnlineCache();
  refreshOnlineViews();
  if(online.cfg)flushQueue();
}
function onlineSync(manual){
  online.cfg=onlineCfg();
  if(!online.cfg){if(manual)toast('ऑनलाइन ऑर्डर अभी जुड़ा नहीं है');return Promise.resolve();}
  if(online.syncing)return Promise.resolve();
  online.syncing=true;
  if(manual)refreshOnlineViews();
  else if(ui.view==='online'){var sb=$('#main [data-act=on-sync]');if(sb)sb.textContent='देख रहे हैं…';}
  return flushQueue().then(function(){return onlineGet({action:'list',key:online.cfg.k,days:10});}).then(function(r){
    online.syncing=false;
    if(!r||!r.ok){online.error=(r&&r.error==='key')?'चाबी गलत है — सेटअप दोबारा करें':'रजिस्टर से जवाब नहीं आया';refreshOnlineViews();return;}
    var q=lsGet(ONLINE_QUEUE,[]),pend={};
    q.forEach(function(u){var a=pend[u.code]||(pend[u.code]={});a.status=u.status;if(u.note!==undefined)a.note=u.note;if(u.total!==undefined)a.total=u.total;});
    online.orders=(r.orders||[]).map(function(o){
      var p=pend[o.code];
      if(p){o.status=p.status;if(p.note!==undefined)o.statusNote=p.note;if(p.total!==undefined)o.confirmedTotal=p.total;}
      return o;
    });
    online.lastSync=Date.now();online.error='';
    saveOnlineCache();
    planSync();
    alertNewOrders();
    refreshOnlineViews();
    if(manual)toast('ऑनलाइन ऑर्डर अपडेट ✓');
  }).catch(function(){
    online.syncing=false;
    online.error='इंटरनेट नहीं मिला — पिछली लिस्ट दिख रही है';
    refreshOnlineViews();
  });
}

function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    var ac=new AC();
    [0,0.25].forEach(function(t0){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=880;g.gain.value=0.25;
      o.connect(g);g.connect(ac.destination);
      o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+0.18);
    });
    setTimeout(function(){try{ac.close();}catch(e){}},1000);
  }catch(e){}
}

  var e=hsGet(d);

  if(glDay(d))e.gm=1;

function moMsg(ym){

  if(r.kU)L.push('📒 उधार पर गई: '+rupee(r.kU));
  L.push('🧾 खर्च: '+rupee(r.ex.tot)+' (माल '+rupee(r.ex.m)+' · दुकान चलाने का '+rupee(r.ex.r)+')');
  Object.keys(r.ex.cat).map(function(k){return r.ex.cat[k];}).filter(function(c){return c.v>0;}).sort(function(a,b){return b.v-a.v;}).forEach(function(c){L.push('  • '+c.name+': '+rupee(round2(c.v)));});
  if(r.profit!=null)L.push('📈 बिक्री − खर्च'+(r.pFrom>r.from?' ('+(+r.pFrom.slice(8,10))+' तारीख़ से)':'')+': '+rupee(r.profit));
  if(r.home)L.push('🏠 घर के लिए: '+rupee(r.home));
  if(r.sup.length){L.push('');L.push('🤝 सप्लायर:');r.sup.forEach(function(z){L.push('  • '+z.n+': माल '+rupee(z.m)+', दिया '+rupee(z.pd)+(z.bal>0.001?', बाकी '+rupee(z.bal):(z.bal<-0.001?', एडवांस '+rupee(-z.bal):', साफ़ ✓')));});}
  if(r.g){var g=r.g;L.push('');L.push('💵 गल्ला: शुरुआत '+rupee(g.open)+' → होना चाहिए '+rupee(g.exp)+' · गिना '+rupee(g.close)+(Math.abs(g.diff)<0.5?' ✅ मिल गया':' ⚠️ फ़र्क '+rupee(g.diff)));
    var gl2=[];if(g.out)gl2.push('निकाला '+rupee(g.out));if(g.hm)gl2.push('घर के लिए '+rupee(g.hm));if(gl2.length)L.push('   '+gl2.join(' · '));}
  if(r.kBal)L.push('📒 उधारी में लेना बाकी: '+rupee(r.kBal));
  if(r.miss.length)L.push('⚠️ नहीं भरा: '+moDays(r.miss)+' तारीख़');
  return L.join('\n');
}

function hxFind(e,kind,id){
  if(!e)return null;
  if(kind==='sm'||kind==='sp'||kind==='hm'||kind==='xe'){var a=e[kind]||[];for(var i=0;i<a.length;i++)if(a[i]&&a[i].id===id)return {row:a[i],i:i};return null;}
  return null;
}

  if(kind==='close'){openHxClose(d);return;}
  if(kind==='bana'){openHxBana(d);return;}

    var k=opt.edit.k,id=opt.edit.id,f=hxFind(e,k,id);

    else if(k==='hm'&&f){S.kind='ghar';S.id=id;S.n=f.row.n||'';S.a=f.row.a||String(f.row.v);S.nt=f.row.nt||'';}
    else if((k==='ex'||k==='exo')&&e){
      S.kind='kharch';S.legacy={k:k,id:id};
      if(k==='ex'){var x=(e.ex||{})[id]||{};S.b=id;S.a=String(x.a||x.v||'');S.pm=x.g===false?'u':'g';S.nt=x.n||'';}

  ui.hxs=S;hxSheetRender(true);
  if(!opt.edit)setTimeout(function(){var f=S.kind==='maal'||S.kind==='pay'?(S.s?$('#hx-a'):null):(S.kind==='cash'||S.kind==='ghar'?$('#hx-a'):null);if(f)f.focus();},80);
}

  if(S.s&&!L.some(function(x){return x.id===S.s;})){var cur=supFind(S.s);if(cur)L.unshift(cur);}
  var show=S.more?L:L.slice(0,6);if(S.s&&!show.some(function(x){return x.id===S.s;})){var c2=supFind(S.s);if(c2)show=show.concat([c2]);}

function hxSave(){
  hxCap();var S=ui.hxs,err=$('#hx-err');if(!S)return;
  var v=hsSum(S.a);
  if(v===''||!(v>0)||v>=10000000){err.textContent='रकम लिखो (जैसे 1200 या 1200+800)।';return;}
  var e=hxEnsure(S.d),nt=String(S.nt||'').trim().slice(0,40),row,arr,g;
  if(S.kind==='maal'||S.kind==='pay'){
    var sp=supFind(S.s);if(!sp){err.textContent='किसका — सप्लायर चुनो।';return;}
    if(S.kind==='maal'){arr='sm';g='maal';row={s:sp.id,n:sp.n,b:sp.b||'other',a:String(S.a).replace(/\s/g,''),v:v,pm:['g','u','h',''].indexOf(S.pm)>-1?S.pm:'',nt:nt};}
    else{arr='sp';g='pay';row={s:sp.id,n:sp.n,a:String(S.a).replace(/\s/g,''),v:v,pm:['g','u','h'].indexOf(S.pm)>-1?S.pm:'g',nt:nt};}
  }else if(S.kind==='kharch'){
    if(!S.b){err.textContent='किस चीज़ का खर्च — ऊपर से चुनो।';return;}
    var isO=S.b.indexOf('o:')===0,nm=isO?String(S.b==='o:'?S.n:S.b.slice(2)).trim().slice(0,30):'';
    if(isO&&!nm){err.textContent='किस चीज़ का खर्च — नाम लिखो।';return;}
    arr='xe';g='kharch';row={b:isO?'other':S.b,n:nm,a:String(S.a).replace(/\s/g,''),v:v,pm:['g','u','h'].indexOf(S.pm)>-1?S.pm:'g',nt:nt};
  }else if(S.kind==='ghar'){
    arr='hm';g='ghar';row={n:String(S.n||'').trim().slice(0,30)||'घर के लिए',a:String(S.a).replace(/\s/g,''),v:v,nt:nt};
  }else if(S.kind==='cash'){
    g='cash';
    if(S.id&&S.id!==S.mode){trashPut('बदला',S.d,{k:S.id,v:num(e[S.id])});e[S.id]='';}
    e[S.mode]=round2((S.id?0:num(e[S.mode]))+v);
    save();hxDone(g,S.mode==='out'?'💼 निकाला '+rupee(e.out):'➕ गल्ले में डाला '+rupee(e.gin));return;
  }
  if(S.legacy){   // पुराने तरीके से लिखा खर्च बदला — नई लाइन बनाओ, पुराना हटाओ (trash में)
    if(S.legacy.k==='ex'){trashPut('बदला',S.d,{ex:S.legacy.id,row:e.ex&&e.ex[S.legacy.id]});if(e.ex)delete e.ex[S.legacy.id];}
    else{var oi=+S.legacy.id;if(Array.isArray(e.exo)&&e.exo[oi]){trashPut('बदला',S.d,{exo:e.exo[oi]});e.exo.splice(oi,1);}}
  }
  if(S.id){var f=hxFind(e,arr,S.id);if(f){trashPut('बदला',S.d,{k:arr,row:JSON.parse(JSON.stringify(f.row))});row=hxMeta(f.row,row);e[arr][f.i]=row;}}
  else e[arr].push(hxMeta({},row));
  save();
  var msg={maal:'🚚 '+row.n+' — '+rupee(v)+' ('+hxPm(row.pm)+')',pay:'💸 '+row.n+' को '+rupee(v)+' दिया',kharch:'🧾 खर्च '+rupee(v),ghar:'🏠 घर के लिए '+rupee(v)}[g];
  if(g==='pay'||g==='maal'){var nb=supBal(row.s,todayStr()).bal;msg+=' · '+(nb>0.001?'अब बाकी '+rupee(nb):'हिसाब साफ़ ✓');}
  hxDone(g,msg);
}
function hxDone(g,msg){
  ui.hxs=null;closeSheet();HX().open[g]=true;
  if(ui.view==='hisaab')renderHisaab();else renderRoute();
  toast('✓ '+msg);
}
function hxDelete(){
  var S=ui.hxs;if(!S)return;var e=hsGet(S.d);if(!e){closeSheet();return;}
  if(S.legacy){
    if(S.legacy.k==='ex'){trashPut('हटाया',S.d,{ex:S.legacy.id,row:e.ex&&e.ex[S.legacy.id]});if(e.ex)delete e.ex[S.legacy.id];}
    else{var oi=+S.legacy.id;if(Array.isArray(e.exo)&&e.exo[oi]){trashPut('हटाया',S.d,{exo:e.exo[oi]});e.exo.splice(oi,1);}}
  }else if(S.kind==='cash'){trashPut('हटाया',S.d,{k:S.id,v:num(e[S.id])});e[S.id]='';}
  else{var arr={maal:'sm',pay:'sp',kharch:'xe',ghar:'hm'}[S.kind],f=hxFind(e,arr,S.id);if(f){trashPut('हटाया',S.d,{k:arr,row:f.row});e[arr].splice(f.i,1);}}
  save();var g={maal:'maal',pay:'pay',kharch:'kharch',ghar:'ghar',cash:'cash'}[S.kind];ui.hxs=null;closeSheet();HX().open[g]=true;renderRoute();toast('हटा दिया (गलती हो तो सहायक से फिर जोड़ें)');
}

function openHxBana(d){
  var e=hsGet(d)||{},mk=[];
  if(num(e.rg))mk.push({k:'rasgulla',n:'रसगुल्ला',q:String(e.rg),u:'लीटर'});
  if(num(e.bs))mk.push({k:'balushahi',n:'बालूशाही',q:String(e.bs),u:'किलो'});
  (Array.isArray(e.mk)?e.mk:[]).forEach(function(m){if(m)mk.push({k:m.k,n:m.n,q:String(m.q),u:m.u||'लीटर'});});
  ui.hxb={d:d,mk:mk,waste:e.waste||'',more:false};hxBanaRender(true);
}

   डेटा वही: कैश बिक्री = रात गिना − सुबह + गल्ले से गया − डाला − उधारी का नकद जमा · UPI = Paytm जोड़ − उधारी का UPI जमा */
var HS_WDS=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
function slFirstMon(){var f=todayStr();DLY().forEach(function(e){if(e.d&&e.d<f)f=e.d;});return f.slice(0,7);}
function slSM(){var h=HX(),cur=todayStr().slice(0,7),f=slFirstMon();if(!h.sm||h.sm>cur)h.sm=cur;if(h.sm<f)h.sm=f;return h.sm;}
function slMonth(ym){
  var t=todayStr(),dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),last=ym+'-'+pad(dim),end=last<t?last:t,out=[];
  for(var k=end;k>=ym+'-01';k=hsKeyAdd(k,-1)){var e=hsGet(k),h=hsHas(e);
    out.push({d:k,e:e,has:h,c:h?hsCashSale(e):0,u:h?hsUpiSale(e):0,tot:h?hsTot(e):0,gm:glDay(k),ku:khataOn(k,'u')});}
  return out;
}
function slMonBar(){
  var ym=slSM(),cur=todayStr().slice(0,7);

      '<input id="sl-mpick" type="month" min="'+slFirstMon()+'" max="'+cur+'" value="'+ym+'" aria-label="महीना चुनें"></label>'+
    '<button data-act="hx-slmon" data-n="1" aria-label="अगला महीना"'+(ym>=cur?' disabled':'')+'>›</button></div>';
}
function hxSaleHtml(){
  var h=HX(),t=todayStr(),ym=slSM(),cur=t.slice(0,7),rows=slMonth(ym),S={c:0,u:0,t:0,n:0,ku:0,best:null,max:0,miss:[]};
  rows.forEach(function(r){S.ku+=r.ku;
    if(r.has){S.c+=r.c;S.u+=r.u;S.t+=r.tot;S.n++;if(r.tot>S.max)S.max=r.tot;if(!S.best||r.tot>S.best.tot)S.best=r;}
    else if(r.gm&&r.d<t)S.miss.push(r.d);});
  ['c','u','t','ku'].forEach(function(k){S[k]=round2(S[k]);});
  /* पिछले महीने से तुलना — चालू महीने में "इसी तारीख़ तक" */
  var pm=moAdd(ym,-1),pdim=new Date(+pm.slice(0,4),+pm.slice(5,7),0).getDate(),upto=ym===cur?Math.min(+t.slice(8,10),pdim):pdim;
  /* कुल नहीं, रोज़ का औसत मिलाओ — किसी महीने कुछ दिन न भरे हों तो भी तुलना सही रहे */
  var P=hsRange(pm+'-01',pm+'-'+pad(upto)),cmp='';
  if(P.days>=3&&S.n>=1){var pa=P.sum/P.days,ca=S.t/S.n,pc=Math.round((ca-pa)/pa*100);

  var html='<div class="slsum"><small>'+moName(ym)+' की कुल बिक्री'+(ym===cur?' (आज तक)':'')+'</small><b>'+rupee(S.t)+'</b>'+
    '<div class="sp"><span>💵 कैश<b>'+rupee(S.c)+'</b></span><span>📱 UPI<b>'+rupee(S.u)+'</b></span></div>'+
    (S.n?'<p><b>'+S.n+'</b> दिन भरे · रोज़ औसत <b>'+rupee(Math.round(S.t/S.n))+'</b>'+(S.best&&S.n>1?' · सबसे ज़्यादा <b>'+hsDm(S.best.d)+' '+rupee(S.best.tot)+'</b>':'')+'</p>':'<p>इस महीने अभी कोई दिन बंद नहीं हुआ।</p>')+
    cmp+(S.ku?'<p>📒 उधार पर दिया <b>'+rupee(S.ku)+'</b> — पैसा आना बाकी, ऊपर नहीं जुड़ा</p>':'')+'</div>';
  if(S.miss.length)html+='<div class="aiwarn">⚠️ '+S.miss.length+' दिन बंद नहीं हुआ: '+S.miss.slice().reverse().map(function(k){return +k.slice(8,10);}).join(', ')+' '+HS_MON[+ym.slice(5,7)-1]+' — नीचे उस दिन को दबाकर भरिए</div>';
  var vis=rows.filter(function(r){return r.has||r.d===t||(r.gm&&r.d<=t);});
  html+='<div class="hxsec">हर दिन की बिक्री <small>दबाओ तो पूरा ब्योरा</small></div>';
  if(!vis.length)return html+'<div class="hxnote">इस महीने का कोई दिन ऐप में नहीं है।</div>';

    var sub=r.has?'कैश '+rupee(r.c)+' · UPI '+rupee(r.u):(isT?'रात को दिन बंद करने पर आएगी':'<span class="glwarn">⚠️ दिन बंद नहीं हुआ</span>');

    if(!o)return row;
    var e=r.e||{},det='';
    if(r.has&&r.gm){
